        test -s build/linux/game.x86_64

        zip -r godot-linux.zip build/linux

        test -s godot-linux.zip'
    - name: Upload godot-linux.zip
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: godot-linux.zip
        path: godot-linux.zip
        if-no-files-found: error
    container:
      image: barichello/godot-ci:4.2
    if: needs.prepare.result == 'success' && (contains(format(',{0},', needs.prepare.outputs.targets), ',linux,'))
  provenance:
    needs:
    - prepare
    - web
    - windows
    - linux
    runs-on: ubuntu-latest
    if: always()
    env:
      FLOE_TARGET_ARTIFACTS: '{"linux":["godot-linux.zip"],"web":["godot-web.zip"],"windows":["godot-windows.zip"]}'
      FLOE_EFFECTIVE_TARGETS: ${{ needs.prepare.outputs.targets }}
      FLOE_ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
      FLOE_PREPARE_RESULT: ${{ needs.prepare.result }}
    steps:
    - name: Require successful target preparation
      if: needs.prepare.result != 'success'
      run: 'echo ''The prepare job did not succeed; no requested target was built.'' >&2

        exit 1'
    - name: Download source provenance
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: floe-source-provenance
        path: .
    - name: Download all built artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: godot-*
        path: artifacts
        merge-multiple: true
    - name: Write build provenance after verifying the requested target artifacts
      run: "python3 - <<'PY'\nimport hashlib, json, os, pathlib, sys\n\ndef fail(message):\n    print(\"Floe build provenance rejected: \" + message, file=sys.stderr)\n    sys.exit(1)\n\nif os.environ.get(\"FLOE_PREPARE_RESULT\", \"\") != \"success\":\n    fail(\"the prepare job did not succeed; requested targets were not built\")\ntargets = [value for value in os.environ.get(\"FLOE_EFFECTIVE_TARGETS\", \"\").split(\",\") if value]\nif not targets:\n    fail(\"no effective target was selected\")\ntry:\n    by_target = json.loads(os.environ[\"FLOE_TARGET_ARTIFACTS\"])\nexcept Exception:\n    fail(\"the template artifact contract is not valid JSON\")\nprefix = os.environ.get(\"FLOE_ARTIFACT_PREFIX\", \"\")\n\ndef resolve(name):\n    return name.replace(\"{{FLOE_ARTIFACT_PREFIX}}\", prefix)\n\nexpected = {}\nfor target in targets:\n    if target not in by_target:\n        fail(\"effective target has no artifact contract: \" + target)\n    for name in by_target[target]:\n        resolved = resolve(name)\n        if not resolved or \"..\" in resolved or \"/\" in resolved or \"\\\\\" in resolved:\n            fail(\"unsafe artifact name in the template contract: \" + name)\n        if resolved in expected and expected[resolved] != target:\n            fail(\"artifact \" + resolved + \" is claimed by multiple targets\")\n        expected[resolved] = target\nif not expected:\n    fail(\"no expected artifacts for the selected targets\")\n\nsource_path = pathlib.Path(\"floe-source-provenance.json\")\nif not source_path.is_file():\n    source_path = pathlib.Path(\".floe-source-provenance.json\")\nsource = json.loads(source_path.read_text())\nartifacts = {}\nfor path in sorted(pathlib.Path(\"artifacts\").rglob(\"*\")):\n    if path.is_file():\n        relative = str(path.relative_to(\"artifacts\")).replace(os.sep, \"/\")\n        data = path.read_bytes()\n        if not data:\n            fail(\"empty artifact: \" + relative)\n        artifacts[relative] = {\"sha256\": hashlib.sha256(data).hexdigest(), \"bytes\": len(data)}\nmissing = sorted(set(expected) - set(artifacts))\nunexpected = sorted(set(artifacts) - set(expected))\nif missing:\n    fail(\"requested target artifacts are missing: \" + \", \".join(missing))\nif unexpected:\n    fail(\"unrequested artifacts were produced: \" + \", \".join(unexpected))\nrecord = {\n    \"schemaVersion\": 2,\n    \"jobID\": os.environ.get(\"GITHUB_RUN_ID\", \"\"),\n    \"sourceSHA256\": source[\"sourceSHA256\"],\n    \"sourceRevision\": source[\"sourceRevision\"],\n    \"engine\": source.get(\"engine\", \"\"),\n    \"template\": os.environ[\"FLOE_TEMPLATE_ID\"],\n    \"sourceTransport\": source[\"transport\"],\n    \"selectionSchemaVersion\": source.get(\"selectionSchemaVersion\", 0),\n    \"gameRoot\": source.get(\"gameRoot\", \"\"),\n    \"selectedSourceSHA256\": source.get(\"selectedSourceSHA256\", \"\"),\n    \"targets\": targets,\n    \"artifactPrefix\": prefix,\n    \"artifacts\": artifacts,\n}\npathlib.Path(\"floe-build-provenance.json\").write_text(json.dumps(record, indent=2, sort_keys=True) + \"\\n\")\nprint(json.dumps(record, sort_keys=True))\nPY"
    - name: Upload build provenance
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: floe-build-provenance
        path: floe-build-provenance.json
        if-no-files-found: error
        retention-days: 7
