# Floe game CI template — Godot 4 (Web, Windows, Linux)
# Exported from FloeGameBuildKit (deterministic; safe to diff).
# NOT auto-dispatched. The host binds an explicit source transport, a source
# digest/revision, the requested target set and the run branch/ref, then
# dispatches through its existing GitHub jobs service. Engine code runs only
# on the user's CI runner; an unsupported or unconfigured target fails in
# prepare with an actionable message.
name: floe-game-build-godot
on:
  workflow_dispatch:
    inputs:
      source_transport:
        description: repository commit or an explicit prior artifact
        required: true
        type: choice
        options:
        - repository
        - artifact
      source_sha256:
        description: canonical source digest (64 lowercase hex)
        required: true
        type: string
      source_revision:
        description: saved project revision echoed into provenance
        required: true
        type: string
      game_root:
        description: selected project-relative game root (empty selects the whole project)
        required: false
        type: string
      selected_source_sha256:
        description: canonical digest of the selected game root (empty for the whole project)
        required: false
        type: string
      source_commit:
        description: published repository commit SHA (repository transport only)
        required: false
        type: string
      source_run_id:
        description: prior Actions run id (artifact transport only)
        required: false
        type: string
      source_artifact_name:
        description: prior artifact name (artifact transport only)
        required: false
        type: string
      source_repository:
        description: owner/repo for a cross-repository source artifact
        required: false
        type: string
        default: ${{ github.repository }}
      engine:
        description: engine id
        required: true
        type: string
        default: godot
      engine_version:
        description: engine version from inspection metadata
        required: false
        type: string
      artifact_prefix:
        description: artifact name prefix
        required: true
        type: string
        default: godot
      targets:
        description: comma-separated target ids; empty selects the template default (web,windows,linux)
        required: false
        type: string
        default: ''
permissions:
  contents: read
  actions: read
env:
  FLOE_SOURCE_TRANSPORT: ${{ inputs.source_transport }}
  FLOE_SOURCE_SHA256: ${{ inputs.source_sha256 }}
  FLOE_SOURCE_REVISION: ${{ inputs.source_revision }}
  FLOE_GAME_ROOT: ${{ inputs.game_root }}
  FLOE_SELECTED_SOURCE_SHA256: ${{ inputs.selected_source_sha256 }}
  FLOE_SOURCE_COMMIT: ${{ inputs.source_commit }}
  FLOE_ENGINE: ${{ inputs.engine }}
  FLOE_ENGINE_VERSION: ${{ inputs.engine_version }}
  FLOE_ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
  FLOE_TEMPLATE_ID: floe-game-build-godot
jobs:
  prepare:
    outputs:
      targets: ${{ steps.resolve_targets.outputs.targets }}
      game_root: ${{ steps.resolve_selected_root.outputs.game_root }}
      selected_source_sha256: ${{ steps.resolve_selected_root.outputs.selected_source_sha256 }}
    runs-on: ubuntu-latest
    steps:
    - name: Resolve and validate requested targets
      id: resolve_targets
      env:
        FLOE_TARGET_ALLOWED: web,windows,linux
        FLOE_TARGET_DEFAULTS: web,windows,linux
        FLOE_TARGETS_INPUT: ${{ inputs.targets }}
      run: "python3 - <<'PY'\nimport os, sys\n\ndef fail(message):\n    print(\"Floe target selection rejected: \" + message, file=sys.stderr)\n    sys.exit(1)\n\nallowed = [value for value in os.environ.get(\"FLOE_TARGET_ALLOWED\", \"\").split(\",\") if value]\ndefaults = [value for value in os.environ.get(\"FLOE_TARGET_DEFAULTS\", \"\").split(\",\") if value]\nraw = os.environ.get(\"FLOE_TARGETS_INPUT\", \"\").strip()\ncompat_target = os.environ.get(\"FLOE_COMPAT_TARGET\", \"\").strip()\ncompat_value = os.environ.get(\"FLOE_COMPAT_VALUE\", \"\").strip().lower()\nif not allowed or not defaults:\n    fail(\"the template target contract is empty\")\nif not set(defaults) <= set(allowed):\n    fail(\"default targets are not a subset of allowed targets\")\nif raw:\n    requested = [value.strip() for value in raw.split(\",\") if value.strip()]\n    if not requested:\n        fail(\"the targets input is present but contains no target id\")\n    if len(requested) != len(set(requested)):\n        fail(\"duplicate target id in the targets input\")\n    for target in requested:\n        if target not in allowed:\n            fail(\"unsupported target '\" + target + \"'; allowed: \" + \", \".join(allowed))\n    chosen = [target for target in allowed if target in requested]\nelse:\n    chosen = [target for target in allowed if target in defaults]\n    # Deprecated compatibility input (Cocos build_android): only affects the\n    # implicit default set; an explicit targets value always wins.\n    if compat_target and compat_value == \"false\" and compat_target in chosen:\n        chosen = [target for target in chosen if target != compat_target]\nif not chosen:\n    fail(\"no target was selected\")\nwith open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"utf-8\") as output:\n    output.write(\"targets=\" + \",\".join(chosen) + \"\\n\")\nprint(\"Floe requested targets: \" + \",\".join(chosen))\nPY"
    - name: Checkout exact repository source
      if: inputs.source_transport == 'repository'
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ inputs.source_commit }}
        path: src
        fetch-depth: 0
        persist-credentials: false
    - name: Download explicit source artifact
      if: inputs.source_transport == 'artifact'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ${{ inputs.source_artifact_name }}
        path: .floe-source-artifact
        run-id: ${{ inputs.source_run_id }}
        repository: ${{ inputs.source_repository }}
        github-token: ${{ secrets.FLOE_SOURCE_TOKEN }}
    - name: Verify source digest and identity before engine code
      run: "python3 - <<'PY'\nimport hashlib, json, os, pathlib, shutil, subprocess, sys, zipfile\n\ndef fail(message):\n    print(\"Floe source transport rejected: \" + message, file=sys.stderr)\n    sys.exit(1)\n\ndef digest_tree(root):\n    root = pathlib.Path(root)\n    if not root.is_dir():\n        fail(\"source tree is missing\")\n    rows = []\n    for current, dirs, files in os.walk(root):\n        dirs[:] = sorted(d for d in dirs if d not in {\".git\", \".floe\", \"out\"})\n        for name in sorted(files):\n            path = pathlib.Path(current) / name\n            if path.is_symlink():\n                fail(\"symbolic link in source: \" + str(path))\n            data = path.read_bytes()\n            relative = str(path.relative_to(root)).replace(os.sep, \"/\")\n            executable = \"1\" if os.access(str(path), os.X_OK) else \"0\"\n            rows.append(relative + \":\" + hashlib.sha256(data).hexdigest() + \":\" + str(len(data)) + \":\" + executable)\n    return hashlib.sha256(\"\\n\".join(sorted(rows)).encode(\"utf-8\")).hexdigest(), rows\n\ndef safe_extract(archive, destination):\n    destination = pathlib.Path(destination)\n    destination.mkdir(parents=True, exist_ok=True)\n    with zipfile.ZipFile(archive) as bundle:\n        for item in bundle.infolist():\n            name = item.filename.replace(\"\\\\\", \"/\")\n            target = (destination / name).resolve()\n            base = destination.resolve()\n            if target != base and not str(target).startswith(str(base) + os.sep):\n                fail(\"zip-slip entry: \" + name)\n            mode = (item.external_attr >> 16) & 0o170000\n            if mode == 0o120000:\n                fail(\"symbolic link entry: \" + name)\n            if item.is_dir():\n                target.mkdir(parents=True, exist_ok=True)\n            else:\n                target.parent.mkdir(parents=True, exist_ok=True)\n                with bundle.open(item) as source, open(target, \"wb\") as output:\n                    shutil.copyfileobj(source, output)\n\ntransport = os.environ[\"FLOE_SOURCE_TRANSPORT\"].strip()\nexpected = os.environ[\"FLOE_SOURCE_SHA256\"].strip().lower()\nrevision = os.environ[\"FLOE_SOURCE_REVISION\"].strip()\ncommit = os.environ.get(\"FLOE_SOURCE_COMMIT\", \"\").strip()\nif len(expected) != 64 or any(c not in \"0123456789abcdef\" for c in expected):\n    fail(\"source_sha256 must be 64 lowercase hex characters\")\nif transport == \"repository\":\n    if len(commit) < 40 or any(c not in \"0123456789abcdef\" for c in commit.lower()):\n        fail(\"repository transport requires a full source_commit SHA\")\n    if not pathlib.Path(\"src\").is_dir():\n        fail(\"repository checkout is missing\")\n    try:\n        head = subprocess.check_output([\"git\", \"-C\", \"src\", \"rev-parse\", \"HEAD\"], text=True).strip().lower()\n    except Exception:\n        fail(\"repository checkout has no readable git HEAD\")\n    if head != commit.lower():\n        fail(\"checked-out commit does not match source_commit\")\nelif transport == \"artifact\":\n    candidates = sorted(pathlib.Path(\".floe-source-artifact\").rglob(\"*.zip\"))\n    if len(candidates) != 1:\n        fail(\"artifact transport requires exactly one source zip, found \" + str(len(candidates)))\n    digest = hashlib.sha256(candidates[0].read_bytes()).hexdigest()\n    if digest != expected:\n        fail(\"downloaded source zip digest does not match source_sha256\")\n    if pathlib.Path(\"src\").exists():\n        fail(\"src already exists\")\n    safe_extract(candidates[0], \"src\")\nelse:\n    fail(\"unknown source transport: \" + transport)\n\ndigest, rows = digest_tree(\"src\")\nif digest != expected:\n    fail(\"source tree canonical digest does not match source_sha256\")\nmanifest = {\n    \"schemaVersion\": 1,\n    \"sourceSHA256\": digest,\n    \"sourceRevision\": revision,\n    \"transport\": transport,\n    \"fileCount\": len(rows),\n    \"engine\": os.environ.get(\"FLOE_ENGINE\", \"\"),\n}\npathlib.Path(\".floe-source-provenance.json\").write_text(json.dumps(manifest, indent=2,\
        \ sort_keys=True) + \"\\n\")\nprint(\"Floe source verified: \" + digest + \" (\" + str(len(rows)) + \" files)\")\nPY"
    - name: Resolve selected game root and verify its digest
      id: resolve_selected_root
      run: |
        python3 - <<'PY'
        import hashlib, json, os, pathlib, sys

        def fail(message):
            print("Floe selected game root rejected: " + message, file=sys.stderr)
            sys.exit(1)

        def digest_tree(root):
            root = pathlib.Path(root)
            if not root.is_dir():
                fail("selected game root is missing")
            rows = []
            for current, dirs, files in os.walk(root):
                dirs[:] = sorted(d for d in dirs if d not in {".git", ".floe", "out"})
                for name in sorted(dirs + files):
                    path = pathlib.Path(current) / name
                    if path.is_symlink():
                        fail("symbolic link in source: " + str(path))
                for name in sorted(files):
                    path = pathlib.Path(current) / name
                    data = path.read_bytes()
                    relative = str(path.relative_to(root)).replace(os.sep, "/")
                    executable = "1" if os.access(str(path), os.X_OK) else "0"
                    rows.append(relative + ":" + hashlib.sha256(data).hexdigest() + ":" + str(len(data)) + ":" + executable)
            return hashlib.sha256("\n".join(sorted(rows)).encode("utf-8")).hexdigest()

        raw = os.environ.get("FLOE_GAME_ROOT", "").strip()
        expected = os.environ.get("FLOE_SELECTED_SOURCE_SHA256", "").strip().lower()
        if raw != raw.strip("/"):
            fail("game_root must not start or end with '/'")
        if any(ord(character) < 32 for character in raw):
            fail("game_root must not contain control characters")
        selected_digest = ""
        if raw:
            components = raw.split("/")
            if any(component in {"", ".", ".."} or "\\" in component or ":" in component
                   for component in components):
                fail("unsafe game_root")
            source = pathlib.Path("src").joinpath(*components)
            if source.is_symlink() or not source.is_dir():
                fail("game_root is missing, not a directory or a symlink")
            selected_digest = digest_tree(source)
            if len(expected) != 64 or any(character not in "0123456789abcdef" for character in expected):
                fail("selected_source_sha256 must be 64 lowercase hex characters for a nested game root")
            if selected_digest != expected:
                fail("selected source digest does not match selected_source_sha256")
        elif expected:
            fail("selected_source_sha256 must be empty for the project root")
        path = pathlib.Path(".floe-source-provenance.json")
        manifest = json.loads(path.read_text(encoding="utf-8"))
        manifest["selectionSchemaVersion"] = 1
        manifest["gameRoot"] = raw
        manifest["selectedSourceSHA256"] = selected_digest
        path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write("game_root=" + raw + "\n")
            output.write("selected_source_sha256=" + selected_digest + "\n")
        print("Floe selected game root verified: " + (raw or ".") + " (" + (selected_digest or "project root") + ")")
        PY
    - name: Remove VCS metadata before upload
      run: rm -rf src/.git
    - name: Upload verified source tree
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: floe-source
        path: src
        if-no-files-found: error
        retention-days: 1
    - name: Upload source provenance
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: floe-source-provenance
        path: .floe-source-provenance.json
        if-no-files-found: error
        retention-days: 1
  web:
    needs: prepare
    env:
      FLOE_GAME_ROOT: ${{ needs.prepare.outputs.game_root }}
      FLOE_SELECTED_SOURCE_SHA256: ${{ needs.prepare.outputs.selected_source_sha256 }}
    runs-on: ubuntu-latest
    steps:
    - name: Download verified source
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: floe-source
        path: src
    - name: Materialize selected game source
      run: |
        python3 - <<'PY'
        import hashlib, os, pathlib, shutil, sys

        def fail(message):
            print("Floe selected game source rejected: " + message, file=sys.stderr)
            sys.exit(1)

        def digest_tree(root):
            root = pathlib.Path(root)
            rows = []
            for current, dirs, files in os.walk(root):
                dirs[:] = sorted(d for d in dirs if d not in {".git", ".floe", "out"})
                for name in sorted(dirs + files):
                    path = pathlib.Path(current) / name
                    if path.is_symlink():
                        fail("symbolic link in source: " + str(path))
                for name in sorted(files):
                    path = pathlib.Path(current) / name
                    data = path.read_bytes()
                    relative = str(path.relative_to(root)).replace(os.sep, "/")
                    executable = "1" if os.access(str(path), os.X_OK) else "0"
                    rows.append(relative + ":" + hashlib.sha256(data).hexdigest() + ":" + str(len(data)) + ":" + executable)
            return hashlib.sha256("\n".join(sorted(rows)).encode("utf-8")).hexdigest()

        raw = os.environ.get("FLOE_GAME_ROOT", "").strip().strip("/")
        if any(ord(character) < 32 for character in raw):
            fail("game_root must not contain control characters")
        expected = os.environ.get("FLOE_SELECTED_SOURCE_SHA256", "").strip().lower()
        selected = pathlib.Path("selected-src")
        if selected.exists():
            shutil.rmtree(selected)
        if raw:
            source = pathlib.Path("src").joinpath(*raw.split("/"))
            if source.is_symlink() or not source.is_dir():
                fail("game_root is missing, not a directory or a symlink")
            shutil.copytree(source, selected)
        else:
            shutil.copytree("src", selected)
        actual = digest_tree(selected)
        if raw and actual != expected:
            fail("selected source digest does not match selected_source_sha256")
        if not raw and expected:
            fail("selected_source_sha256 must be empty for the project root")
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write("selected_digest=" + actual + "\n")
        print("Floe selected game source verified: " + (raw or ".") + " (" + actual + ")")
        PY
    - name: Export Web
      run: 'mkdir -p build/web

        test -f selected-src/export_presets.cfg

        godot --headless --path selected-src --export-release "Web" build/web/index.html

        test -s build/web/index.html

        zip -r godot-web.zip build/web

        test -s godot-web.zip'
    - name: Validate godot-web.zip
      run: "test -s \"godot-web.zip\"\npython3 - \"godot-web.zip\" <<'PY'\nimport sys, zipfile, pathlib\npath = pathlib.Path(sys.argv[1])\nkind = \"web\"\nif kind == \"web\":\n    if path.is_dir():\n        sys.exit(0 if (path / \"index.html\").is_file() else 1)\n    if path.suffix.lower() == \".zip\":\n        with zipfile.ZipFile(path) as z:\n            sys.exit(0 if any(n.endswith(\"index.html\") for n in z.namelist()) else 1)\n    sys.exit(1)\nif kind == \"zip\":\n    if not zipfile.is_zipfile(path): sys.exit(1)\n    with zipfile.ZipFile(path) as z:\n        if not z.namelist(): sys.exit(1)\n    sys.exit(0)\nif kind == \"nativeProject\":\n    if not zipfile.is_zipfile(path): sys.exit(1)\n    with zipfile.ZipFile(path) as z:\n        names = set(z.namelist())\n    sys.exit(0 if any(n.endswith(\"proj/build.gradle\") or n.endswith(\"proj/settings.gradle\") for n in names) else 1)\nif kind == \"apk\":\n    if not zipfile.is_zipfile(path): sys.exit(1)\n    with zipfile.ZipFile(path) as z:\n        names = set(z.namelist())\n    sys.exit(0 if \"AndroidManifest.xml\" in names and any(n.startswith(\"classes\") and n.endswith(\".dex\") for n in names) else 1)\nif kind == \"pe\":\n    sys.exit(0 if path.read_bytes()[:2] == b\"MZ\" else 1)\nif kind == \"xcodeproj\":\n    if not zipfile.is_zipfile(path): sys.exit(1)\n    with zipfile.ZipFile(path) as z:\n        sys.exit(0 if any(n.endswith(\"project.pbxproj\") for n in z.namelist()) else 1)\nsys.exit(1)\nPY\n"
    - name: Upload godot-web.zip
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: godot-web.zip
        path: godot-web.zip
        if-no-files-found: error
    container:
      image: barichello/godot-ci:4.2
    if: needs.prepare.result == 'success' && (contains(format(',{0},', needs.prepare.outputs.targets), ',web,'))
  windows:
