        PY
    - name: Export Windows Desktop
      run: 'mkdir -p build/windows

        test -f selected-src/export_presets.cfg

        godot --headless --path selected-src --export-release "Windows Desktop" build/windows/game.exe

        test -s build/windows/game.exe

        zip -r godot-windows.zip build/windows

        test -s godot-windows.zip'
    - name: Upload godot-windows.zip
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: godot-windows.zip
        path: godot-windows.zip
        if-no-files-found: error
    container:
      image: barichello/godot-ci:4.2
    if: needs.prepare.result == 'success' && (contains(format(',{0},', needs.prepare.outputs.targets), ',windows,'))
