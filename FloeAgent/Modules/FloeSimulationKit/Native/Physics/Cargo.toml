[package]
name = "floe-rapier-native"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
rapier3d-f64 = { version = "=0.36.1", features = ["enhanced-determinism", "fem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
codegen-units = 1
panic = "unwind"
strip = "none"
