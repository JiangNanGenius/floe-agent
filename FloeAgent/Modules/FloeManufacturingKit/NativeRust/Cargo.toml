[package]
name = "floe-machining-native"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Floe native machining core: OpenMill A/C kinematics, voxel stock removal (MillSimSharp geometry port), pinned marching-tetrahedra mesher, Parry3d fixture collision. Frozen C ABI per Local manufacturing prototype contract 2026-11-04."

[lib]
name = "FloeMachiningNative"
crate-type = ["staticlib", "rlib"]

[dependencies]
nalgebra = { version = "=0.33.2", features = ["serde-serialize"] }
parry3d = "=0.17.6"
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=1.0.69"

[dev-dependencies]
approx = "=0.5.1"

[profile.release]
opt-level = 2
debug = false
incremental = false
panic = "unwind"

[[example]]
name = "fm_probe"
path = "examples/fm_probe.rs"
