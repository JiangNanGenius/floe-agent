<h2 id="section-1">设置路径</h2>
<blockquote>设置 &gt; 通用 &gt; 实体键盘 &gt; 回车键</blockquote>
<p>设置 &gt; 通用 &gt; 实体键盘 &gt; 回车键。</p>
<h2 id="section-2">修改方法</h2>
<p>打开设置，进入通用，再进入实体键盘，选择回车键，然后选择换行或发送。</p>
<h2 id="section-3">说明</h2>
<p>此设置只作用于连接到本设备的实体键盘；屏幕键盘仍使用自带的发送按钮。</p>
