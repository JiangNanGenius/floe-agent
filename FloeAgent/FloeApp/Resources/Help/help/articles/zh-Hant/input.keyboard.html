<h2 id="section-1">設定路徑</h2>
<blockquote>設定 &gt; 通用 &gt; 實體鍵盤 &gt; 回車鍵</blockquote>
<p>設定 &gt; 通用 &gt; 實體鍵盤 &gt; 回車鍵。</p>
<h2 id="section-2">修改方法</h2>
<p>開啟設定，進入通用，再進入實體鍵盤，選擇回車鍵，然後選擇換行或傳送。</p>
<h2 id="section-3">說明</h2>
<p>此設定只作用於連線到本裝置的實體鍵盤；螢幕鍵盤仍使用自帶的傳送按鈕。</p>
