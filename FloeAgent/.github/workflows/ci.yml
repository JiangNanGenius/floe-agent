# Floe Agent CI.
# Two jobs:
#   build-test (macos-15, full Xcode): SPM build/test + xcodegen +
#     xcodebuild for the iOS app, secret scan, SBOM, license inventory.
#   spm-only (ubuntu-latest, Swift 6.4): cross-platform targets only —
#     SSE parser, catastrophic gate, canonical JSON, audit chain, GRDB
#     schema form the Linux regression net.
name: CI

on: [push, pull_request]

jobs:
  build-test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          scripts/gen_project.sh

      - name: Resolve and pin-check dependencies
        run: |
          swift package resolve
          scripts/pin_check.sh

      - name: SPM build (cross-platform targets)
        run: swift build

      - name: SPM test (cross-platform targets)
        run: swift test

      - name: xcodebuild iPhone Simulator
        run: |
          xcodebuild \
            -scheme FloeAgent \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -resultBundlePath FloeAgent-iPhone.xcresult \
            build

      - name: xcodebuild iPad Simulator
        run: |
          xcodebuild \
            -scheme FloeAgent \
            -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M4)' \
            -resultBundlePath FloeAgent-iPad.xcresult \
            build

      - name: Secret scan
        run: |
          brew install gitleaks
          scripts/secret_scan.sh

      - name: SBOM
        run: |
          brew install syft
          scripts/sbom.sh

      - name: License inventory
        run: scripts/license_inventory.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            sbom.spdx.json
            LICENSES-THIRD-PARTY.md
            .gitleaks-report.json
            FloeAgent-iPhone.xcresult
            FloeAgent-iPad.xcresult
          if-no-files-found: ignore

  spm-only:
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build cross-platform targets
        run: swift build

      - name: Test cross-platform targets
        run: swift test
