name: FloeMediaUISmoke
options:
  deploymentTarget:
    iOS: '26.0'
packages:
  ZLImageEditor:
    path: ../../ThirdParty/ZLImageEditor
  VideoEditorKit:
    path: ../../ThirdParty/VideoEditorKit
  FloeAgent:
    path: ../..
targets:
  FloeMediaUISmoke:
    type: application
    platform: iOS
    sources:
      - App
      - path: ../../FloeApp/Media/FloeImageEditorView.swift
      - path: ../../FloeApp/Media/MediaEditorView.swift
      - path: ../../FloeApp/Media/MediaPlayerView.swift
    dependencies:
      - package: ZLImageEditor
      - package: VideoEditorKit
      - package: FloeAgent
        product: FloeMedia
      - package: FloeAgent
        product: FloeTools
      - package: FloeAgent
        product: FloeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.floe.media-ui-smoke
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: '6.0'

  FloeImageEditorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ImageUITests]
    dependencies:
      - target: FloeMediaUISmoke
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.floe.image-editor-uitests
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: '6.0'
  FloeImageEditorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ImageTests]
    dependencies:
      - package: ZLImageEditor
      - target: FloeMediaUISmoke
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.floe.image-editor-tests
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: '6.0'
  FloeVideoEditorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../../ThirdParty/VideoEditorKit/Tests/VideoEditorKitTests/Support
      - path: ../../ThirdParty/VideoEditorKit/Tests/VideoEditorKitTests/Models/VideoEditorTests.swift
      - path: ../../ThirdParty/VideoEditorKit/Tests/VideoEditorKitTests/TranscriptTimeMapperTests.swift
      - path: ../../ThirdParty/VideoEditorKit/Tests/VideoEditorKitTests/TranscriptDocumentTests.swift
      - path: ../../ThirdParty/VideoEditorKit/Tests/VideoEditorKitTests/VideoEditingConfigurationTests.swift
    dependencies:
      - package: VideoEditorKit
      - target: FloeMediaUISmoke
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.floe.video-editor-tests
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: '6.0'
schemes:
  FloeMediaUISmoke:
    build:
      targets:
        FloeMediaUISmoke: all
        FloeVideoEditorTests: [test]
        FloeImageEditorTests: [test]
        FloeImageEditorUITests: [test]
    test:
      targets:
        - FloeVideoEditorTests
        - FloeImageEditorTests
        - FloeImageEditorUITests
