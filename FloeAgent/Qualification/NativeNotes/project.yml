name: FloeNotesNativeQualification
settings:
  base:
    ARCHS: arm64
options:
  deploymentTarget:
    iOS: '26.0'
packages:
  FloeAgent:
    path: ../..
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    revision: 1e2a163736dfa5a198e637ae44c114e1c6d5cc2d
targets:
  FloeNotesNativeQualification:
    type: application
    platform: iOS
    info:
      path: App/Info.plist
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    sources:
      - App
      - ../../FloeApp/Notes/NotePageRenderer.swift
      - ../../FloeApp/Notes/NotePencilView.swift
      - ../../FloeApp/Notes/NotesExport.swift
      - ../../FloeApp/Notes/NoteFileImporter.swift
      - ../../FloeApp/Notes/NoteElementInspector.swift
      - ../../FloeApp/Notes/NotesTextLayout.swift
      - ../../FloeApp/Notes/NotesAnswerSaveSheet.swift
      - ../../FloeApp/Notes/NotesKnowledgePicker.swift
      - ../../FloeApp/Notes/NotesRepository.swift
      - ../../FloeApp/Notes/NotesSession.swift
      - ../../FloeApp/Notes/NoteMindMapView.swift
      - ../../FloeApp/Notes/MindMapTopicInspector.swift
      - ../../FloeApp/Notes/NotesLinkedMindMaps.swift
      - ../../FloeApp/Notes/NotesAgentTools.swift
      - ../../FloeApp/Notes/NotesDocumentThumbnail.swift
      - ../../FloeApp/Notes/NotesEngineeringCoverRenderer.swift
      - ../../FloeApp/Notes/NotesEngineeringView.swift
      - ../../FloeApp/Workspace/EngineeringFilePreview.swift
      - ../../FloeApp/Workspace/OfficeExplicitSaveBridge.swift
      - ../../FloeApp/Workspace/OfficeInkPreferences.swift
      - ../../FloeApp/Browser/LocalStaticFileServer.swift
      - ../../FloeApp/Browser/BrowserURLPolicy.swift
      - ../../FloeApp/Files/QuickLookView.swift
      - ../../FloeApp/Files/PDFKitAccess.swift
      - ../../FloeApp/Files/FloePDFExceptionGuard.mm
      - ../../FloeApp/Files/FloePDFExceptionGuard.h
      - ../../FloeApp/Voice
      - ../../FloeApp/Media/AudioTranscribeTool.swift
      - path: ../../FloeApp/Resources/Whisper
        type: folder
        buildPhase: resources
      - path: ../../FloeApp/Resources/MindElixir
        type: folder
        buildPhase: resources
      - path: ../../FloeApp/Resources/EngineeringViewers
        type: folder
        buildPhase: resources
    dependencies:
      - package: FloeAgent
        product: FloeCore
      - package: FloeAgent
        product: FloeNotes
      - package: FloeAgent
        product: FloeDocuments
      - package: FloeAgent
        product: FloeAgentRuntime
      - package: FloeAgent
        product: FloePersistence
      - package: FloeAgent
        product: FloeSecurity
      - package: FloeAgent
        product: FloeModels
      - package: FloeAgent
        product: FloeTools
      - package: FloeAgent
        product: FloeWorkspace
      - package: WhisperKit
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.floeagent.notes.qualification
        SWIFT_VERSION: '6.0'
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_OBJC_BRIDGING_HEADER: App/Bridge.h
        CODE_SIGNING_ALLOWED: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Test local voice transcription.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Test Apple speech fallback.
  NativeNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: FloeNotesNativeQualification
      - package: FloeAgent
        product: FloeNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.floeagent.notes.tests
        SWIFT_VERSION: '6.0'
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  NativeNotesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: FloeNotesNativeQualification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.floeagent.notes.uitests
        SWIFT_VERSION: '6.0'
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  WhisperInferenceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WhisperTests
      - path: GeneratedWhisperFixtures
        buildPhase: resources
        optional: true
    dependencies:
      - target: FloeNotesNativeQualification
      - package: WhisperKit
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.floeagent.whisper.tests
        SWIFT_VERSION: '6.0'
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

schemes:
  FloeNotesNativeQualification:
    build:
      targets:
        FloeNotesNativeQualification: all
        NativeNotesTests: [test]
        NativeNotesUITests: [test]
    test:
      targets: [NativeNotesTests, NativeNotesUITests]

  FloeWhisperInferenceQualification:
    build:
      targets:
        FloeNotesNativeQualification: all
        WhisperInferenceTests: [test]
    test:
      targets: [WhisperInferenceTests]
