# gitleaks configuration for Floe Agent.
# Vendored offline bundles are hash-pinned upstream artifacts; embedded
# grammar commit SHAs and gitHead strings are public source references,
# not credentials. Keep real credential rules active everywhere else.
title = "Floe Agent gitleaks configuration"

[allowlist]
description = "Hash-pinned vendored bundles embedding upstream git SHAs, in the repo and inside the built app"
paths = [
  '''codeblitz\.global-with-react\.min\.js''',
  '''(^|/)mesh\.js''',
]
