        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_BRIDGING_HEADER: FloeApp/Execution/FloeApp-Bridging-Header.h
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "1.6.3"
        CURRENT_PROJECT_VERSION: "138"
        FLOE_GITHUB_OAUTH_CLIENT_ID: "Ov23litEyLPjXVLEDzWW"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: FloeApp/Entitlements/Floe.entitlements
        # This target has one script: verified Office framework/resource copy.
        # Xcode only grants literal output paths; listing ~5,000 files exceeds
        # the process argument limit. Other targets keep their script sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]":
