# XcodeGen project for Floe Agent.
# See blazing-aurora-darwin.md §12: single target, single binary; iPhone/
# iPad differentiation happens at runtime via PlatformBackgroundPolicy and
# adaptive SwiftUI, NOT in project.yml branches.
#
# Regenerate with: scripts/gen_project.sh (xcodegen must be installed).
# The generated .xcodeproj is git-ignored.

name: FloeAgent
options:
  bundleIdPrefix: org.floeagent
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  FloeAgentPackages:
    path: .  # Local Swift package (root Package.swift)

targets:
  FloeAgent:
    type: application
    productName: Floe Agent
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: FloeApp
        excludes:
          - Resources/python
      - path: FloeApp/Resources/python
        type: folder
        buildPhase: resources
    info:
      path: FloeApp/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Floe uses the microphone only while you dictate a message.
        NSSpeechRecognitionUsageDescription: Floe converts your speech into text for the message composer.
        BGTaskSchedulerPermittedIdentifiers:
          - org.floeagent.ios.refresh
          - org.floeagent.ios.processing
          - org.floeagent.ios.continued.*
        UIBackgroundModes:
          - fetch
          - processing
        UIRequiredDeviceCapabilities:
          - arm64
          - metal
          - iphone-performance-gaming-tier
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: FloeApp/Entitlements/Floe.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.org.floeagent.ios
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.user-fonts:
          - app-usage
    dependencies:
      - framework: Vendor/Python.xcframework
        embed: true
      - package: FloeAgentPackages
        product: FloeCore
      - package: FloeAgentPackages
        product: FloeModels
      - package: FloeAgentPackages
        product: FloeProviders
      - package: FloeAgentPackages
        product: FloeAgentRuntime
      - package: FloeAgentPackages
        product: FloeTools
      - package: FloeAgentPackages
        product: FloeSkills
      - package: FloeAgentPackages
        product: FloePersistence
      - package: FloeAgentPackages
        product: FloeSecurity
      - package: FloeAgentPackages
        product: FloeSync
      - package: FloeAgentPackages
        product: FloeSyncCore
      - package: FloeAgentPackages
        product: FloeDocuments
      - package: FloeAgentPackages
        product: FloeImages
      - package: FloeAgentPackages
        product: FloeSSH
      - package: FloeAgentPackages
        product: FloeVNC
      - package: FloeAgentPackages
        product: FloeMarkdown
      - package: FloeAgentPackages
        product: FloeWorkspace
      - package: FloeAgentPackages
        product: FloeExecution
    settings:
      base:
        DEVELOPMENT_TEAM: QYL72C43K6
        PRODUCT_BUNDLE_IDENTIFIER: org.floeagent.ios
        PRODUCT_NAME: Floe Agent
        PRODUCT_MODULE_NAME: FloeApp
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_BRIDGING_HEADER: FloeApp/Execution/FloeApp-Bridging-Header.h
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "1.2.9"
        CURRENT_PROJECT_VERSION: "20"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: FloeApp/Entitlements/Floe.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_COMPILATION_MODE: wholemodule

  FloeAgentUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/FloeAgentUITests
        excludes:
          - HomeChatSeparationTests.swift
          - BrowserProtocolTests.swift
          - ThreadTimelineTests.swift
          - VoiceInputControllerTests.swift
          - CrashAndFeedbackRegressionTests.swift
          - LocalPythonRuntimeTests.swift
    dependencies:
      - target: FloeAgent
    settings:
      base:
        DEVELOPMENT_TEAM: QYL72C43K6
        PRODUCT_BUNDLE_IDENTIFIER: org.floeagent.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: FloeAgent

  FloeAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/FloeAgentUITests/HomeChatSeparationTests.swift
      - path: Tests/FloeAgentUITests/ThreadTimelineTests.swift
      - path: Tests/FloeAgentUITests/VoiceInputControllerTests.swift
      - path: Tests/FloeAgentUITests/BrowserProtocolTests.swift
      - path: Tests/FloeAgentUITests/CrashAndFeedbackRegressionTests.swift
      - path: Tests/FloeAgentUITests/LocalPythonRuntimeTests.swift
    dependencies:
      - target: FloeAgent
    settings:
      base:
        DEVELOPMENT_TEAM: QYL72C43K6
        PRODUCT_BUNDLE_IDENTIFIER: org.floeagent.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Floe Agent.app/Floe Agent"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  FloeAgent:
    build:
      targets:
        FloeAgent: all
        FloeAppTests: [test]
        FloeAgentUITests: [test]
    test:
      targets:
        - FloeAppTests
        - FloeAgentUITests
    run:
      config: Debug
    archive:
      config: Release
  FloeAppTests:
    build:
      targets:
        FloeAgent: all
        FloeAppTests: [test]
    test:
      targets:
        - FloeAppTests
