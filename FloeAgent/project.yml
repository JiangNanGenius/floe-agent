# XcodeGen project for Floe Agent.
# See blazing-aurora-darwin.md §12: single target, single binary; iPhone/
# iPad differentiation happens at runtime via PlatformBackgroundPolicy and
# adaptive SwiftUI, NOT in project.yml branches.
#
# Regenerate with: scripts/gen_project.sh (xcodegen must be installed).
# The generated .xcodeproj is git-ignored.

name: FloeAgent
settings:
  base:
    # All shipped native runtime slices target arm64 devices and Apple Silicon
    # Simulator. Do not request a nonexistent x86_64 PDF/pandas/libarchive slice
    # when Release uses a generic Simulator destination.
    ARCHS: arm64
options:
  bundleIdPrefix: org.floeagent
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  FloeAgentPackages:
    path: .  # Local Swift package (root Package.swift)

targets:
  FloeAgent:
    type: application
    configFiles:
      Debug: Vendor/Office/native-host.xcconfig
      Release: Vendor/Office/native-host.xcconfig
    productName: Floe Agent
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: FloeApp
        excludes:
          - Resources/python
          - Resources/PDFiumLicenses
          - Resources/LibArchiveLicenses
          - Resources/DocumentConversion
          - Resources/Fonts/Bundled
      - path: FloeApp/Resources/python
        type: folder
        buildPhase: resources
      - path: FloeApp/Resources/PDFiumLicenses
        type: folder
        buildPhase: resources
      - path: FloeApp/Resources/LibArchiveLicenses
        type: folder
        buildPhase: resources
      - path: FloeApp/Resources/DocumentConversion
        type: folder
        buildPhase: resources
      - path: FloeApp/Resources/Fonts/Bundled
        type: folder
        buildPhase: resources
        optional: true
      - path: ThirdParty/RoyalVNCKit/LICENSE
        buildPhase: resources
    info:
      path: FloeApp/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: org.floeagent.canvas
            UTTypeDescription: Floe Canvas
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - floecanvas
              public.mime-type: application/vnd.floe.canvas
        FLOEGitHubOAuthClientID: $(FLOE_GITHUB_OAUTH_CLIENT_ID)
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: Floe uses the microphone only while you dictate a message.
        NSSpeechRecognitionUsageDescription: Floe converts your speech into text for the message composer.
        NSCalendarsFullAccessUsageDescription: Floe accesses calendars only when you ask the agent to read or edit events.
        NSRemindersFullAccessUsageDescription: Floe accesses reminders only when you ask the agent to read or edit them.
        NSLocationWhenInUseUsageDescription: Floe uses your location only for a map or location task you request.
        NSCameraUsageDescription: Floe opens the camera only when you choose to capture an image for a task.
        NSFaceIDUsageDescription: Floe uses Face ID only to confirm when you enable unrestricted task access or unlock protected settings.
        NSPhotoLibraryUsageDescription: Floe opens your photo library only when you choose an image for a task.
        NSPhotoLibraryAddUsageDescription: Floe saves generated or edited images only when you ask it to save them to Photos.
        NSHomeKitUsageDescription: Floe accesses your Home only when you enable Home tools and request an automation action.
        NSLocalNetworkUsageDescription: Floe scans your local network only when you ask the agent to discover nearby services and devices.
        NSBluetoothAlwaysUsageDescription: Floe uses Bluetooth only when you ask it to connect to a nearby BLE serial device.
        NSBonjourServices:
          - _home-assistant._tcp
          - _http._tcp
          - _printer._tcp
          - _ipp._tcp
          - _airplay._tcp
          - _raop._tcp
        BGTaskSchedulerPermittedIdentifiers:
          - org.floeagent.ios.refresh
          - org.floeagent.ios.processing
          - org.floeagent.ios.media-refresh
          - org.floeagent.ios.media-processing
          - org.floeagent.ios.continued.*
        UIBackgroundModes:
          - fetch
          - processing
          - audio
        UIRequiredDeviceCapabilities:
          - arm64
          - metal
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: FloeApp/Entitlements/Floe.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.org.floeagent.ios
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.homekit: true
        com.apple.security.application-groups:
          - group.org.floeagent.ios
    dependencies:
      - framework: Vendor/PDFium/PDFium.xcframework
        embed: true
      - framework: Vendor/LibArchive/LibArchive.xcframework
        embed: false
      - sdk: libz.tbd
      - sdk: libc++.tbd
