          - $(SRCROOT)/scripts/bootstrap_office_host.py
          - $(SRCROOT)/ThirdParty/Collabora/engine.lock.json
          - $(SRCROOT)/ThirdParty/Collabora/FloeOfficeNative/FloeOfficeNative.h
          - $(SRCROOT)/ThirdParty/Collabora/FloeOfficeNative/FloeOfficeNative.mm
          - $(SRCROOT)/ThirdParty/Collabora/FloeOfficeNative/FloeOfficeAttachment.cpp
          - $(SRCROOT)/ThirdParty/Collabora/FloeOfficeNative/FloeOfficeAttachment.hxx
          - $(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Info.plist
        inputFileLists:
          - $(SRCROOT)/Vendor/Office/native-host-inputs.xcfilelist
        outputFileLists:
          - $(SRCROOT)/scripts/office_host_outputs.xcfilelist
