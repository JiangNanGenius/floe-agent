# XcodeGen project for Floe Agent.
# See blazing-aurora-darwin.md §12: single target, single binary; iPhone/
# iPad differentiation happens at runtime via PlatformBackgroundPolicy and
# adaptive SwiftUI, NOT in project.yml branches.
#
# Regenerate with: scripts/gen_project.sh (xcodegen must be installed).
# Commit the matching generated project.pbxproj after regeneration.

name: FloeAgent
settings:
  base:
    # All shipped native runtime slices target arm64 devices and Apple Silicon
    # Simulator. Do not request a nonexistent x86_64 PDF/pandas/libarchive slice
    # when Release uses a generic Simulator destination.
    ARCHS: arm64
options:
  bundleIdPrefix: org.floeagent
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    revision: 1e2a163736dfa5a198e637ae44c114e1c6d5cc2d
  FloeAgentPackages:
    path: .  # Local Swift package (root Package.swift)
  ZLImageEditor:
    path: ThirdParty/ZLImageEditor
  VideoEditorKit:
    path: ThirdParty/VideoEditorKit
  FloeShellEngine:
    path: ThirdParty/FloeShellEngine
  FloeCADKit:
    # Native CAD kernel package: OCCT 7.8.1 B-rep bridge, parametric feature
    # graph, sketch solver, Metal viewport and the workbench editor, vendored
    # from OpenShape3D (MIT) with Floe's document/session adaptations.
    path: ThirdParty/FloeCADKit
  ZIPFoundation:
    # Already resolved through FloeAgentPackages at exactly this revision
    # (Package.resolved: 0.9.20 / 22787ffb59de99e5dc1fbfe80b19c97a904ad48d).
    # Declared here only so the FloeAppTests bundle can import the module for
    # the two Office automatic-execution suites; no dependency, version or
    # lock change. The revision form is the immutable declaration
    # resolved_pins.application_pins requires; XcodeGen cannot express the
    # display version next to a revision, so Package.resolved stays its
    # authority.
    url: https://github.com/weichsel/ZIPFoundation.git
    revision: 22787ffb59de99e5dc1fbfe80b19c97a904ad48d

targets:
  FloeAgent:
    type: application
    configFiles:
      Debug: Vendor/Office/native-host.xcconfig
      Release: Vendor/Office/native-host.xcconfig
    productName: Floe Agent
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: FloeApp
        excludes:
          - Resources/Capabilities
          - Resources/Audio
          - Resources/PDFiumLicenses
          - Resources/LibArchiveLicenses
          - Resources/DocumentConversion
          - Resources/Fonts/Bundled
          - Resources/IDE
          - Resources/EngineeringViewers
          - Resources/Licenses
          - Resources/MindElixir
          - Resources/Whisper
          # Per-extension privacy manifests: each extension copies its own
          # PrivacyInfo.xcprivacy from here; they must never also land in the
          # app bundle (one manifest per bundle root).
          - Resources/PrivacyManifests
      - path: FloeWidgets/FloeSystemAlarmControlIntents.swift
      - path: FloeApp/Resources/Capabilities
        type: folder
        buildPhase: resources
      # Seamlessly looped PiP ambient tracks (CC0; attribution in
      # Resources/Licenses/PiPAmbientMeditation-CC0.txt and
      # Resources/Licenses/PiPAmbientExpansion-CC0.txt). Declared explicitly
      # so project generation cannot silently omit an audio asset.
      - path: FloeApp/Resources/Audio/PiPAmbientMeditation.wav
        buildPhase: resources
      - path: FloeApp/Resources/Audio/PiPAmbientFirstLight.wav
        buildPhase: resources
      - path: FloeApp/Resources/Audio/PiPAmbientDeepBlue.wav
        buildPhase: resources
      - path: FloeApp/Resources/Audio/PiPAmbientStarfield.wav
        buildPhase: resources
      - path: FloeApp/Resources/Licenses
        type: folder
        buildPhase: resources
      - path: FloeApp/Resources/PDFiumLicenses
        type: folder
        buildPhase: resources
      - path: FloeApp/Resources/LibArchiveLicenses
        type: folder
        buildPhase: resources
      - path: FloeApp/Resources/DocumentConversion
        type: folder
        buildPhase: resources
      - path: FloeApp/Resources/Fonts/Bundled
        type: folder
        buildPhase: resources
        optional: true
      - path: FloeApp/Resources/Whisper
        type: folder
        buildPhase: resources
      - path: FloeApp/Resources/EngineeringViewers
        type: folder
        buildPhase: resources
      # Generated from the pinned guest-image manifest by stage-boot-pair.sh.
      # Verified firmware/kernel bytes are distribution resources, never Git blobs.
      - path: ThirdParty/TinyEMU/guest-image/bundled-boot-pair
        type: folder
        buildPhase: resources
      # Resources/IDE is intentionally NOT packaged: the CodeBlitz/Monaco web
      # workbench was retired when IDE text editing became native-only. The
      # NOTICE and vendor license files stay in the tree as attribution only
      # and must not ship as installed-package licenses.
      - path: ThirdParty/RoyalVNCKit/LICENSE
        buildPhase: resources
    info:
      path: FloeApp/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: org.floeagent.ios.routes
            CFBundleURLSchemes:
              - floe
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: org.floeagent.note
            UTTypeDescription: Floe Note
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - floenote
              public.mime-type: application/vnd.floe.note
          - UTTypeIdentifier: org.floeagent.canvas
            UTTypeDescription: Floe Canvas
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - floecanvas
              public.mime-type: application/vnd.floe.canvas
        CFBundleDocumentTypes:
          - CFBundleTypeName: Floe Note
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - org.floeagent.note
          - CFBundleTypeName: Floe Canvas
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - org.floeagent.canvas
          - CFBundleTypeName: PDF and Office documents
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
              - org.openxmlformats.wordprocessingml.document
              - org.openxmlformats.spreadsheetml.sheet
              - org.openxmlformats.presentationml.presentation
              - com.microsoft.word.doc
              - com.microsoft.excel.xls
              - com.microsoft.powerpoint.ppt
              - org.oasis-open.opendocument.text
              - org.oasis-open.opendocument.spreadsheet
              - org.oasis-open.opendocument.presentation
              - public.rtf
        LSSupportsOpeningDocumentsInPlace: true
        FLOEGitHubOAuthClientID: $(FLOE_GITHUB_OAUTH_CLIENT_ID)
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: Floe uses the microphone only while you dictate a message.
        NSSpeechRecognitionUsageDescription: Floe converts your speech into text for the message composer.
        NSCalendarsFullAccessUsageDescription: Floe accesses calendars only when you ask the agent to read or edit events.
        NSRemindersFullAccessUsageDescription: Floe accesses reminders only when you ask the agent to read or edit them.
        NSLocationWhenInUseUsageDescription: Floe uses your location only for a map or location task you request.
        NSCameraUsageDescription: Floe opens the camera only when you choose to capture an image for a task.
        NSFaceIDUsageDescription: Floe uses Face ID only to confirm when you enable unrestricted task access or unlock protected settings.
        NSPhotoLibraryUsageDescription: Floe opens your photo library only when you choose an image for a task.
        NSPhotoLibraryAddUsageDescription: Floe saves generated or edited images only when you ask it to save them to Photos.
        NSHomeKitUsageDescription: Floe accesses your Home only when you enable Home tools and request an automation action.
        NSHealthShareUsageDescription: Floe reads the Health data you request after you authorize access.
        NFCReaderUsageDescription: Floe reads a nearby NFC tag when you request a scan.
        NSLocalNetworkUsageDescription: Floe scans your local network only when you ask the agent to discover nearby services and devices.
        NSBluetoothAlwaysUsageDescription: Floe uses Bluetooth only when you ask it to connect to a nearby BLE serial device.
        NSContactsUsageDescription: Floe reads the contacts you ask it to find.
        NSAlarmKitUsageDescription: Floe schedules the alarms and timers you create in the app.
        NSSupportsLiveActivities: true
        NSAppleMusicUsageDescription: Floe finds and plays items from your media library when you request them.
        NSBonjourServices:
          - _home-assistant._tcp
          - _http._tcp
          - _printer._tcp
          - _ipp._tcp
          - _airplay._tcp
          - _raop._tcp
        BGTaskSchedulerPermittedIdentifiers:
          - org.floeagent.ios.refresh
          - org.floeagent.ios.processing
          - org.floeagent.ios.media-refresh
          - org.floeagent.ios.media-processing
          - org.floeagent.ios.continued.*
        UIBackgroundModes:
          - fetch
          - processing
          - audio
        UIRequiredDeviceCapabilities:
          - arm64
          - metal
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: FloeApp/Entitlements/Floe.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.org.floeagent.ios
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.homekit: true
        com.apple.developer.healthkit: true
        com.apple.developer.nfc.readersession.formats:
          - NDEF
        com.apple.security.application-groups:
          - group.org.floeagent.ios
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - framework: Vendor/PDFium/PDFium.xcframework
        embed: true
      - framework: Vendor/LibArchive/LibArchive.xcframework
        embed: false
      - sdk: libz.tbd
      - sdk: libc++.tbd
        embed: false
      - package: FloeAgentPackages
        product: FloeCore
      - package: FloeAgentPackages
        product: FloeModels
      - package: FloeAgentPackages
        product: FloeProviders
      - package: FloeAgentPackages
        product: FloeAgentRuntime
      - package: FloeAgentPackages
        product: FloeTools
      - package: FloeAgentPackages
        product: FloeSkills
      - package: FloeAgentPackages
        product: FloePersistence
      - package: FloeAgentPackages
        product: FloeSecurity
      - package: FloeAgentPackages
        product: FloeSync
      - package: FloeAgentPackages
        product: FloeSyncCore
      - package: FloeAgentPackages
        product: FloeDocuments
      - package: FloeAgentPackages
        product: FloeImages
      - package: FloeAgentPackages
        product: FloeSSH
      - package: FloeAgentPackages
        product: FloeVNC
      - package: FloeAgentPackages
        product: FloeMarkdown
      - package: FloeAgentPackages
        product: FloeWorkspace
      - package: FloeAgentPackages
        product: FloeExecution
      - package: FloeAgentPackages
        product: FloeEnvironments
      - package: FloeAgentPackages
        product: FloePackages
      - package: VideoEditorKit
      - package: ZLImageEditor
      - package: FloeAgentPackages
        product: FloeMedia
      - package: FloeAgentPackages
        product: FloeWorkbench
      - package: FloeCADKit
        product: FloeCAD
      - package: FloeAgentPackages
        product: FloeNotes
      - package: FloeAgentPackages
        product: FloeGit
      - package: FloeAgentPackages
        product: FloeLocalModels
      - framework: Frameworks/dash.xcframework
        embed: true
        link: false
      - framework: Frameworks/dashA.xcframework
        embed: true
        link: false
      - framework: Frameworks/dashB.xcframework
        embed: true
        link: false
      - framework: Frameworks/dashC.xcframework
        embed: true
        link: false
      - framework: Frameworks/dashD.xcframework
        embed: true
        link: false
      - framework: Frameworks/dashE.xcframework
        embed: true
        link: false
      - package: FloeShellEngine
        product: FloeShellEngine
      - target: FloeScreenShare
        embed: true
      - target: FloeShare
        embed: true
      - target: FloeWidgets
        embed: true
      - target: FloeFileProvider
        embed: true
    preBuildScripts:
      - name: Verify bundled Linux boot pair
        script: bash "$SRCROOT/ThirdParty/TinyEMU/guest-image/stage-boot-pair.sh" --check
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Embed verified native Office host
        script: /usr/bin/python3 -B "${SRCROOT}/scripts/embed_office_host.py"
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/scripts/embed_office_host.py
          - $(SRCROOT)/scripts/bootstrap_office_host.py
          - $(SRCROOT)/ThirdParty/Collabora/engine.lock.json
          - $(SRCROOT)/ThirdParty/Collabora/FloeOfficeNative/FloeOfficeNative.h
          - $(SRCROOT)/ThirdParty/Collabora/FloeOfficeNative/FloeOfficeNative.mm
          - $(SRCROOT)/ThirdParty/Collabora/FloeOfficeNative/FloeOfficeAttachment.cpp
          - $(SRCROOT)/ThirdParty/Collabora/FloeOfficeNative/FloeOfficeAttachment.hxx
          - $(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Info.plist
        inputFileLists:
          - $(SRCROOT)/Vendor/Office/native-host-inputs.xcfilelist
        outputFileLists:
          - $(SRCROOT)/scripts/office_host_outputs.xcfilelist
    settings:
      base:
        DEVELOPMENT_TEAM: QYL72C43K6
        PRODUCT_BUNDLE_IDENTIFIER: org.floeagent.ios
        PRODUCT_NAME: Floe Agent
        PRODUCT_MODULE_NAME: FloeApp
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_BRIDGING_HEADER: FloeApp/Execution/FloeApp-Bridging-Header.h
        # ios_system resolves callbacks from the main executable via dlsym.
        # Xcode's debug dylib moves those callbacks out of that image.
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "1.7.43"
        CURRENT_PROJECT_VERSION: "284"
        FLOE_GITHUB_OAUTH_CLIENT_ID: "Ov23litEyLPjXVLEDzWW"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: FloeApp/Entitlements/Floe.entitlements
        # This target has one script: verified Office framework/resource copy.
        # Xcode only grants literal output paths; listing ~5,000 files exceeds
        # the process argument limit. Other targets keep their script sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]":
          - $(inherited)
          - $(FLOE_OFFICE_HOST_DIR)
        "OTHER_LDFLAGS[sdk=iphoneos*]":
          # Office exports its own older FPDF API. Resolve every public PDFium
          # symbol against CPDFium first, so opaque objects never cross engines.
          - -framework
          - CPDFium
          - $(inherited)
          - -framework
          - FloeOfficeNative
        # Real Office on the simulator is opt-in per build: only when a verified
        # iphonesimulator host was explicitly installed (the generated
        # Vendor/Office/native-host.xcconfig sets these variables) does the
        # simulator link FloeOfficeNative. Normal simulator builds leave both
        # variables undefined/empty, canImport(FloeOfficeNative) stays false and
        # every Office surface keeps its honest no-engine state.
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]":
          - $(inherited)
          - $(FLOE_OFFICE_SIM_HOST_DIR)
        "OTHER_LDFLAGS[sdk=iphonesimulator*]":
          - -framework
          - CPDFium
          - $(FLOE_OFFICE_SIM_LDFLAG)
          - $(inherited)
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Floe TestFlight AppGroup 2026

  FloeScreenShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: FloeScreenShare
      # Required-reason API declaration for this extension executable (it
      # links FloeCore, whose code calls UserDefaults / file metadata /
      # volume-capacity APIs). Lives here so the app target's FloeApp tree
      # stays the single source location; excluded from the app bundle above.
      - path: FloeApp/Resources/PrivacyManifests/FloeScreenShare/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: FloeScreenShare/Info.plist
      properties:
        CFBundleDisplayName: Floe Screen Share
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: FloeScreenShare/FloeScreenShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.floeagent.ios
    dependencies:
      - package: FloeAgentPackages
        product: FloeCore
    settings:
      base:
        DEVELOPMENT_TEAM: QYL72C43K6
        PRODUCT_BUNDLE_IDENTIFIER: org.floeagent.ios.screenshare
        PRODUCT_NAME: Floe Screen Share
        PRODUCT_MODULE_NAME: FloeScreenShare
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.7.43"
        CURRENT_PROJECT_VERSION: "284"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Floe Screen Share TestFlight AppGroup 2026

  FloeShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: FloeShare
      # Required-reason API declaration for this extension executable (it
      # links FloeCore, whose code calls UserDefaults / file metadata).
      - path: FloeApp/Resources/PrivacyManifests/FloeShare/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: FloeShare/Info.plist
      properties:
        CFBundleDisplayName: Floe Share
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 5
              NSExtensionActivationSupportsImageWithMaxCount: 5
              NSExtensionActivationSupportsFileWithMaxCount: 5
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: FloeShare/FloeShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.floeagent.ios
    dependencies:
      - package: FloeAgentPackages
        product: FloeCore
    settings:
      base:
        DEVELOPMENT_TEAM: QYL72C43K6
        PRODUCT_BUNDLE_IDENTIFIER: org.floeagent.ios.share
        PRODUCT_NAME: Floe Share
        PRODUCT_MODULE_NAME: FloeShare
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.7.43"
        CURRENT_PROJECT_VERSION: "284"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Floe Share TestFlight AppGroup 2026

  FloeWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: FloeWidgets
      # Required-reason API declaration for this extension executable (it
      # links FloeCore, whose code calls UserDefaults / file metadata).
      - path: FloeApp/Resources/PrivacyManifests/FloeWidgets/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: FloeWidgets/Info.plist
      properties:
        CFBundleDisplayName: Floe Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: FloeWidgets/FloeWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.floeagent.ios
    dependencies:
      - package: FloeAgentPackages
        product: FloeCore
    settings:
      base:
        DEVELOPMENT_TEAM: QYL72C43K6
        PRODUCT_BUNDLE_IDENTIFIER: org.floeagent.ios.widgets
        PRODUCT_NAME: Floe Widgets
        PRODUCT_MODULE_NAME: FloeWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.7.43"
        CURRENT_PROJECT_VERSION: "284"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Floe Widgets TestFlight AppGroup 2026

  FloeFileProvider:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: FloeFileProvider
      # Required-reason API declaration for this extension executable (it
      # links FloePersistence/FloeCore, whose code reads file metadata).
      - path: FloeApp/Resources/PrivacyManifests/FloeFileProvider/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: FloeFileProvider/Info.plist
      properties:
        CFBundleDisplayName: Floe Shared Documents
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionFileProviderDocumentGroup: group.org.floeagent.ios
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FloeFileProviderExtension
          NSExtensionFileProviderSupportsEnumeration: true
          # Commits are transactional and invisible until completion.
          NSExtensionFileProviderAppliesChangesAtomically: true
          NSExtensionFileProviderDownloadPipelineDepth: 4
          NSExtensionFileProviderUploadPipelineDepth: 4
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: FloeFileProvider/FloeFileProvider.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.floeagent.ios
    dependencies:
      - package: FloeAgentPackages
        product: FloeCore
      - package: FloeAgentPackages
        product: FloePersistence
    settings:
      base:
        DEVELOPMENT_TEAM: QYL72C43K6
        PRODUCT_BUNDLE_IDENTIFIER: org.floeagent.ios.fileprovider
        PRODUCT_NAME: FloeFileProvider
        PRODUCT_MODULE_NAME: FloeFileProvider
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.7.43"
        CURRENT_PROJECT_VERSION: "284"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Floe FileProvider TestFlight AppGroup 2026


  FloeAgentUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/FloeAgentUITests
        excludes:
          - TerminalPollCadenceTests.swift
          - IDERunSourceStagingTests.swift
          - IDELanguageRunPolicyTests.swift
          - HomeChatSeparationTests.swift
          - BrowserProtocolTests.swift
          - ThreadTimelineTests.swift
          - VoiceInputControllerTests.swift
          - CrashAndFeedbackRegressionTests.swift
          - LuaShellInstallTests.swift
          - IDEGitHubActionsTests.swift
          - LocalShellRuntimeTests.swift
          - LinuxComponentUpdatePolicyTests.swift
          - EnvironmentLanguagePackageTests.swift
          - RemoteImageInspectToolTests.swift
          - ImportantFileShortcutTests.swift
          - CreativeAssetIngestionTests.swift
          - CanvasTouchInteractionTests.swift
          - CanvasAgentToolContractTests.swift
          - MailConnectorTests.swift
          - SkillLifecycleTests.swift
          - OfficeBridgeStateTests.swift
          - ShellCoreUtilityTests.swift
          - RARFixtures.generated.swift
    dependencies:
      - target: FloeAgent
    settings:
      base:
        DEVELOPMENT_TEAM: QYL72C43K6
        PRODUCT_BUNDLE_IDENTIFIER: org.floeagent.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: FloeAgent
        TARGETED_DEVICE_FAMILY: "1,2"

  FloeAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Vendor/Office/native-host.xcconfig
      Release: Vendor/Office/native-host.xcconfig
    sources:
      - path: Tests/FloeAppTests/BackgroundRunCoordinatorTests.swift
