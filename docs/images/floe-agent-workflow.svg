<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Floe Agent continuous task workflow</title>
  <desc id="desc">A task keeps one conversation and workspace while multiple runs append model text, tools, evidence, plans and goals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef6ff"/><stop offset="1" stop-color="#f7f2ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".12"/></filter>
    <style>.h{font:700 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}.t{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f2937}.s{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#5b6472}.card{fill:#fff;stroke:#d8e1ef;stroke-width:1.5}.line{stroke:#6d7df3;stroke-width:4;fill:none;stroke-linecap:round}.dot{fill:#6d7df3}</style>
  </defs>
  <rect width="1200" height="520" rx="30" fill="url(#bg)"/>
  <text x="54" y="66" class="h">One task, a continuous timeline</text>
  <text x="54" y="96" class="s">每次发送创建新的 Run，但上下文、工作区、权限与证据始终属于同一任务</text>
  <path class="line" d="M120 250 H1080"/>
  <circle class="dot" cx="155" cy="250" r="9"/><circle class="dot" cx="390" cy="250" r="9"/><circle class="dot" cx="625" cy="250" r="9"/><circle class="dot" cx="860" cy="250" r="9"/><circle class="dot" cx="1060" cy="250" r="9"/>
  <g filter="url(#shadow)"><rect class="card" x="55" y="135" width="200" height="92" rx="18"/><text x="78" y="172" class="t">New task</text><text x="78" y="200" class="s">Model · workspace · policy</text></g>
  <g filter="url(#shadow)"><rect class="card" x="290" y="276" width="200" height="104" rx="18"/><text x="313" y="315" class="t">Run 1</text><text x="313" y="343" class="s">Reasoning → tool → reply</text><text x="313" y="366" class="s">思考 → 工具 → 回复</text></g>
  <g filter="url(#shadow)"><rect class="card" x="525" y="135" width="200" height="92" rx="18"/><text x="548" y="172" class="t">Run 2</text><text x="548" y="200" class="s">History + evidence restored</text></g>
  <g filter="url(#shadow)"><rect class="card" x="760" y="276" width="200" height="104" rx="18"/><text x="783" y="315" class="t">Plan / Goal</text><text x="783" y="343" class="s">Criteria · budget · proof</text><text x="783" y="366" class="s">验收标准 · 预算 · 证据</text></g>
  <g filter="url(#shadow)"><rect class="card" x="980" y="135" width="165" height="92" rx="18"/><text x="1003" y="172" class="t">Complete</text><text x="1003" y="200" class="s">Evidence-gated</text></g>
  <rect x="55" y="425" width="1090" height="52" rx="16" fill="#17203a"/><text x="82" y="458" style="font:600 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff">Shared task context: messages · tool evidence · workspace · permissions · memory · checkpoints</text>
</svg>
