<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Floe Agent credential and tool security boundary</title>
  <desc id="desc">Models receive opaque credential handles and filtered tool schemas while secret bytes remain in Keychain and executor checks enforce scope.</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4fbf8"/><stop offset="1" stop-color="#eef3ff"/></linearGradient><style>.h{font:700 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}.t{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.s{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#5f6875}.box{fill:#fff;stroke:#cfdae8;stroke-width:1.5}.arrow{stroke:#168b72;stroke-width:4;fill:none;marker-end:url(#head)}</style><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#168b72"/></marker></defs>
  <rect width="1200" height="500" rx="30" fill="url(#bg2)"/><text x="54" y="66" class="h">Secrets stay outside the model context</text><text x="54" y="96" class="s">密钥正文保留在 Keychain；模型、消息、日志、CloudKit 与诊断只看到不透明句柄或脱敏元数据</text>
  <g><rect class="box" x="55" y="150" width="220" height="115" rx="18"/><text x="80" y="190" class="t">Model</text><text x="80" y="220" class="s">Filtered tool schemas</text><text x="80" y="245" class="s">Opaque credential handles</text></g>
  <path class="arrow" d="M275 208 H385"/>
  <g><rect class="box" x="385" y="130" width="265" height="155" rx="18"/><text x="410" y="170" class="t">Task authority</text><text x="410" y="201" class="s">Scope + policy + approval</text><text x="410" y="226" class="s">Catastrophic-action gate</text><text x="410" y="251" class="s">Executor-side validation</text></g>
  <path class="arrow" d="M650 208 H760"/>
  <g><rect class="box" x="760" y="150" width="200" height="115" rx="18"/><text x="785" y="190" class="t">Tool runner</text><text x="785" y="220" class="s">One approved use</text><text x="785" y="245" class="s">Audited result</text></g>
  <path class="arrow" d="M960 208 H1065 V335 H930"/>
  <g><rect x="695" y="330" width="235" height="110" rx="18" fill="#17203a"/><text x="720" y="370" style="font:600 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff">Apple Keychain</text><text x="720" y="400" style="font:400 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#dbe7ff">Local or opt-in iCloud</text><text x="720" y="424" style="font:400 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#dbe7ff">Secret bytes only</text></g>
  <rect x="55" y="330" width="520" height="110" rx="18" fill="#fff" stroke="#cfdae8" stroke-width="1.5"/><text x="80" y="370" class="t">CloudKit configuration sync</text><text x="80" y="400" class="s">Provider/host profiles + vault descriptors only</text><text x="80" y="424" class="s">Never tasks, messages, workspace files, or secret bytes</text>
</svg>
