# component-image-ci — build the Floe Linux guest image candidate and its
# corresponding-source bundle as reviewable component artifacts.
#
# Scope: this workflow never touches app code, versions, tags, releases or
# TestFlight. It downloads the pinned inputs, builds the image and the source
# bundle, boots the image twice for real capability checks, and uploads
# artifacts with digests. Publishing/announcing is the primary agent's call.
#
# Boot-file provenance (two distinct paths — never conflated):
#   * `image` (default): the image candidate ships the PINNED 2018 demo
#     bbl64.bin/kernel-riscv64.bin (smp not enabled; UP kernel, CONFIG_SMP is
#     not set). `boot-association.json` in the evidence records their hashes
#     and states the origin as `pinned-demo`.
#   * `smp_image` (opt-in): build kernel+bbl from the pinned sources
#     (`build-kernel-bbl.sh --rebuild`) and assemble the image with THOSE
#     fresh boot files. This needs the A-side assembly hook
#     (`build-guest-image.sh --boot-dir DIR`; requested from job
#     job-40f1f1e9603240dd). Until the hook lands the job fails explicitly
#     with the fresh-build evidence uploaded — it never mislabels a
#     pinned-kernel image as an SMP/preinstalled product.
#   * `rebuild_kernel` only affects the SOURCES job: it rebuilds kernel+bbl
#     for source/hash evidence and does NOT change the image's boot files.
#     The sources job writes `boot-association.json` that contrasts the
#     image's pinned hashes with the fresh rebuild hashes and states that
#     the rebuild is not the shipped bytes.
#
# Runtime-template recipes: the `templates` job runs
# `FloeAgent/scripts/qualify_runtime_templates.py` against the image's own
# package inventory. Recipes are owned by job D (job-6f5ac974858c47c2);
# while a recipe file is missing the job fails with exit 3
# (explicit dependency failure) instead of qualifying an unverified image.
#
# Jobs (independent so a retry does not rebuild the other):
#   image   — fetch pinned inputs, build engine + image, boot-verify twice,
#             package the zip + manifest + evidence.
#   sources — exact kernel/bbl source, runner relink material, cross-toolchain
#             source, the Debian binary->source corresponding sources and the
#             recipe-pinned PyPI wheel sources (incl. the bundled pdfium
#             native source chain for the pypdfium2 riscv64 wheel).
#   smp-image  — opt-in: fresh kernel+bbl build + image assembly (A hook gate).
#   templates  — opt-in: basic/dev-document recipe qualification (D gate).
#
# Manual runs can build only one job; `sources` alone needs the run id that
# holds the image evidence (its small package inventory), which is enough to
# fetch sources without re-downloading the image.
name: component-image-ci

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Build + boot-verify the guest image (heavy)'
        type: boolean
        default: true
      template:
        description: 'Preinstalled software template to build and qualify'
        type: choice
        options:
          - basic
          - dev-document
        default: basic
      sources:
        description: 'Build the corresponding-source bundle'
        type: boolean
        default: true
      rebuild_kernel:
        description: 'Sources job ONLY: rebuild kernel+bbl from pinned source and record their hashes (does NOT change the image candidate boot files; see smp_image)'
        type: boolean
        default: false
      smp_image:
        description: 'Build kernel+bbl from source and assemble the image with them (needs build-guest-image.sh --boot-dir from job A; explicit dependency failure until then)'
        type: boolean
        default: false
      templates:
        description: 'Qualify the image inventory against the selected template recipe'
        type: boolean
        default: true
      image_run_id:
        description: 'With sources only: run id that holds linux-guest-image-evidence-*'
        type: string
        default: ''
      smp_sources:
        description: 'Sources job only: the image_run_id evidence is the SMP layout (linux-guest-image-evidence-smp-* from the smp-image job); the image boot files are a fresh CONFIG_SMP rebuild, not the pinned 2018 pair'
        type: boolean
        default: false
      skip_debian:
        description: 'Sources job: skip the (large) Debian package-source download'
        type: boolean
        default: false
      skip_upstream:
        description: 'Sources job: skip kernel/bbl/glibc source fetching'
        type: boolean
        default: false
      metadata_run_id:
        description: 'Metadata only: run id holding linux-guest-image-candidate-* (no rebuild)'
        type: string
        default: ''
      source_repair_run_id:
        description: 'Source-repair only: run id whose collected linux-guest-sources-* artifacts are byte-verified, boot-association-completed and re-uploaded under this run (no re-collection from Debian/upstream)'
        type: string
        default: ''
  push:
    branches:
      - codex/feedback-linux-image
      - component-image-ci
    paths:
      - 'FloeAgent/LinuxGuest/**'
      - 'FloeAgent/ThirdParty/TinyEMU/guest-image/**'
      - '.github/workflows/component-image-ci.yml'

permissions:
  contents: read

concurrency:
  group: component-image-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: ${{ github.event_name == 'push' || inputs.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies (mount/convert/zip tooling + riscv64 cross compiler + qemu-user)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils parted e2fsprogs gcc-riscv64-linux-gnu \
            qemu-user-static zip unzip curl python3 >/dev/null

      - name: Lint the component scripts (no heavy build yet)
        run: |
          set -euo pipefail
          for f in FloeAgent/LinuxGuest/image/*.sh; do bash -n "$f"; done
          for f in FloeAgent/LinuxGuest/image/*.py; do python3 -m py_compile "$f"; done
          bash -n FloeAgent/ThirdParty/TinyEMU/guest-image/build-kernel-bbl.sh
          python3 -c 'import json; json.load(open("FloeAgent/ThirdParty/TinyEMU/guest-image/pinned-inputs.json"))'
          python3 FloeAgent/LinuxGuest/image/image_id.py --self-test
          python3 FloeAgent/LinuxGuest/image/collect-pypi-sources.py --self-test
          # SMP firmware evidence contract drift guard: the producer token
          # must be byte-identical in the producer, the image consumer and
          # this workflow (cloud36328715843 was producer/consumer wording
          # drift; a generic "IPI" grep is not evidence).
          fw_token='FW-MULTI-HART: mentry.o relocates disabled_hart_mask (MAX_HARTS>1 IPI path present)'
          for f in FloeAgent/ThirdParty/TinyEMU/guest-image/build-kernel-bbl.sh \
                   FloeAgent/LinuxGuest/image/build-guest-image.sh \
                   .github/workflows/component-image-ci.yml; do
            grep -Fq "$fw_token" "$f" || { echo "SMP evidence token missing or drifted in $f"; exit 1; }
          done
          echo "script lint ok"

      - name: Runner clock parser (native pure-function check)
        run: |
          set -euo pipefail
          grep -q 'floe.epoch' FloeAgent/LinuxGuest/runner/floe_clock.h
          make -C FloeAgent/LinuxGuest/runner check-clock

      - name: Image manifest capability self-check (no image build)
        run: |
          set -euo pipefail
          W="$(mktemp -d)"
          mkdir -p "$W/img"
          printf 'bios-bytes' > "$W/img/bbl64.bin"
          printf 'kernel-bytes' > "$W/img/kernel-riscv64.bin"
          dd if=/dev/zero of="$W/img/disk.img" bs=1024 count=4 2>/dev/null
          # --smp-capable is the ONLY way the capability claim appears; it
          # requires a qualified manifest (a real run id).
          python3 FloeAgent/LinuxGuest/image/write-image-manifest.py write \
            --image-dir "$W/img" --id self-test-smp \
            --bios "$W/img/bbl64.bin" --kernel "$W/img/kernel-riscv64.bin" --disk "$W/img/disk.img" \
            --cmdline "console=hvc0" --qualification-run self-test --qualified --smp-capable
          python3 FloeAgent/LinuxGuest/image/write-image-manifest.py verify --image-dir "$W/img"
          python3 -c "import json; m=json.load(open('$W/img/manifest.json')); assert m.get('smp_capable') is True, m"
          # without the flag there is no capability claim at all
          python3 FloeAgent/LinuxGuest/image/write-image-manifest.py write \
            --image-dir "$W/img" --id self-test-up \
            --bios "$W/img/bbl64.bin" --kernel "$W/img/kernel-riscv64.bin" --disk "$W/img/disk.img" \
            --qualification-run self-test --qualified
          python3 -c "import json; m=json.load(open('$W/img/manifest.json')); assert 'smp_capable' not in m, m"
          # and the claim is refused on an unqualified manifest
          if python3 FloeAgent/LinuxGuest/image/write-image-manifest.py write \
               --image-dir "$W/img" --id self-test-unqualified \
               --bios "$W/img/bbl64.bin" --kernel "$W/img/kernel-riscv64.bin" --disk "$W/img/disk.img" \
               --smp-capable 2>/dev/null; then
            echo "smp_capable was accepted without a qualification run"; exit 1
          fi
          rm -rf "$W"
          echo "image manifest capability self-check ok"

      - name: Build + boot-verify + package the image candidate
        run: |
          set -euo pipefail
          # GitHub expressions expand before `sudo` runs, so values survive
          # the environment reset sudo performs.
          sudo bash FloeAgent/LinuxGuest/image/build-guest-image.sh \
            --work "${{ runner.temp }}/floe-image-work" \
            --template "${{ inputs.template || 'basic' }}" \
            --build-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --source-ref "${{ github.sha }}" \
            2>&1 | tee "${{ runner.temp }}/floe-image-build.log"

      - name: Record the boot-file provenance association (pinned-demo origin)
        if: always()
        run: |
          set -euo pipefail
          W="${{ runner.temp }}/floe-image-work"
          if [ -d "$W/evidence" ]; then
            python3 - "$W/evidence" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "${{ github.sha }}" <<'PY'
          import json, os, sys
          evidence, run_url, source_ref = sys.argv[1], sys.argv[2], sys.argv[3]
          pins_path = os.path.join(evidence, "bios-kernel-pins.txt")
          record = {
              "image_run": run_url,
              "source_ref": source_ref,
              "boot_files_origin": "pinned-demo",
              "note": ("The image candidate ships the pinned 2018 demo bbl64.bin and "
                       "kernel-riscv64.bin (UP kernel, CONFIG_SMP is not set). This image "
                       "is NOT an SMP/kernel-rebuild product; a fresh-kernel image "
                       "requires the smp_image path and its assembly hook."),
          }
          if os.path.isfile(pins_path):
              with open(pins_path, "r", encoding="utf-8", errors="replace") as handle:
                  record["bios_kernel_pins"] = handle.read().strip().splitlines()
          with open(os.path.join(evidence, "boot-association.json"), "w", encoding="utf-8") as handle:
              json.dump(record, handle, indent=2)
              handle.write("\n")
          print(json.dumps(record, indent=2))
          PY
          fi

      - name: Stage the flat evidence bundle (stable artifact layout)
        if: always()
        run: |
          set -euo pipefail
          W="${{ runner.temp }}/floe-image-work"
          B="${{ runner.temp }}/floe-image-bundle"
          rm -rf "$B"
          mkdir -p "$B"
          if [ -d "$W/evidence" ]; then cp -a "$W/evidence/." "$B/"; fi
          if [ -f "$W/image/manifest.json" ]; then cp "$W/image/manifest.json" "$B/manifest.json"; fi
          if [ -f "$W/image/SHA512SUMS" ]; then cp "$W/image/SHA512SUMS" "$B/SHA512SUMS"; fi
          # the build log is evidence: keep it with the (small) bundle so a
          # failed boot still leaves the raw transcript reachable
          if [ -f "${{ runner.temp }}/floe-image-build.log" ]; then
            cp "${{ runner.temp }}/floe-image-build.log" "$B/floe-image-build.log"
          fi
          ls -la "$B" | head -30

      - name: Show the evidence summary
        if: always()
        run: |
          W="${{ runner.temp }}/floe-image-work"
          for f in build-summary.txt runner-toolchain.txt boot-stage1-rc.txt boot-stage2-rc.txt \
                   debian-input-verified.txt disk-ext4-features-final.txt; do
            if [ -f "$W/evidence/$f" ]; then
              echo "--- $f"; cat "$W/evidence/$f"
            fi
          done
          if [ -f "$W/evidence/image-capability-report.txt" ]; then
            echo "--- image-capability-report.txt"; cat "$W/evidence/image-capability-report.txt"
          fi
          tail -c 2000 "${{ runner.temp }}/floe-image-build.log" || true

      - name: Upload the image candidate (zip + manifest)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-guest-image-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/floe-image-work/image/*.zip
            ${{ runner.temp }}/floe-image-work/image/manifest.json
            ${{ runner.temp }}/floe-image-work/image/SHA512SUMS
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the image evidence (small, flat, self-contained record)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # A single staged directory keeps the artifact root stable:
          # guest-packages.tsv (etc.) is at the root, not under evidence/.
          name: linux-guest-image-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/floe-image-bundle/
          if-no-files-found: error
          retention-days: 30

  sources:
    needs: image
    if: ${{ always() && (github.event_name == 'push' || inputs.sources) && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 curl ca-certificates dpkg-dev gcc-riscv64-linux-gnu >/dev/null

      - name: PyPI source collector self-test (offline)
        run: python3 FloeAgent/LinuxGuest/image/collect-pypi-sources.py --self-test

      - name: Download the image evidence (package inventory + runner object)
        uses: actions/download-artifact@v4
        with:
          # The evidence and its artifact name always come from the same run.
          # The SMP image job uploads linux-guest-image-evidence-smp-* and its
          # artifact root nests the bundle under work/evidence/.
          name: linux-guest-image-evidence${{ inputs.smp_sources && '-smp' || '' }}-${{ (github.event_name == 'workflow_dispatch' && inputs.image_run_id != '') && inputs.image_run_id || github.run_id }}
          path: ${{ runner.temp }}/floe-image-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ (github.event_name == 'workflow_dispatch' && inputs.image_run_id != '') && inputs.image_run_id || github.run_id }}

      - name: Locate the evidence bundle root inside the artifact
        id: evidence
        run: |
          set -euo pipefail
          ROOT="${{ runner.temp }}/floe-image-evidence"
          # Old (non-SMP) evidence stages the bundle flat at the artifact root;
          # the SMP evidence artifact nests it under work/evidence/.
          mapfile -t FOUND < <(find "$ROOT" -name guest-packages.tsv -type f | sort)
          test "${#FOUND[@]}" -ge 1 || { echo "guest-packages.tsv not found in the downloaded evidence"; exit 1; }
          if [ "${#FOUND[@]}" -gt 1 ]; then
            echo "ambiguous evidence layout: multiple guest-packages.tsv files:"; printf '%s\n' "${FOUND[@]}"; exit 1
          fi
          EVDIR="$(dirname "${FOUND[0]}")"
          test -f "$EVDIR/guest-packages.tsv" || { echo "evidence bundle root is not a real directory: $EVDIR"; exit 1; }
          echo "evidence_dir=$EVDIR" >> "$GITHUB_OUTPUT"
          echo "evidence bundle root: $EVDIR"

      - name: Build the corresponding-source bundle
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "${{ inputs.rebuild_kernel }}" = "true" ]; then EXTRA="$EXTRA --rebuild-kernel"; fi
          if [ "${{ inputs.skip_debian }}" = "true" ]; then EXTRA="$EXTRA --skip-debian"; fi
          if [ "${{ inputs.skip_upstream }}" = "true" ]; then EXTRA="$EXTRA --skip-upstream"; fi
          # The source bundle must name the run that actually built the image,
          # which is not this run when only `sources` was dispatched.
          IMAGE_RUN="${{ (github.event_name == 'workflow_dispatch' && inputs.image_run_id != '') && inputs.image_run_id || github.run_id }}"
          EV="${{ steps.evidence.outputs.evidence_dir }}"
          # The image evidence bundle carries template-recipe.json (the exact
          # recipe bytes the image was provisioned with); the PyPI part of the
          # source bundle reads the pinned wheels from it. Older evidence
          # without the recipe simply skips the PyPI part.
          PYPI_ARGS=""
          if [ -f "$EV/template-recipe.json" ]; then
            PYPI_ARGS="--pypi-recipe $EV/template-recipe.json"
          fi
          # shellcheck disable=SC2086
          sudo bash FloeAgent/LinuxGuest/image/collect-corresponding-sources.sh \
            --out "${{ runner.temp }}/floe-sources" \
            --packages "$EV/guest-packages.tsv" \
            --image-evidence "$EV" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/$IMAGE_RUN" \
            $PYPI_ARGS $EXTRA 2>&1 | tee "${{ runner.temp }}/floe-sources.log"
          # The collector ran under sudo and leaves its output tree root-owned;
          # the boot-association/staging/upload-preparation steps below run as
          # the invoking user and must write into it (run 35923812691 failed
          # here with EACCES). Hand the tree back, exactly like the image job
          # does for its evidence bundle.
          sudo chown -R "$(id -u):$(id -g)" "${{ runner.temp }}/floe-sources" 2>/dev/null || true

      - name: Boot-file association — pinned image bytes vs any freshly rebuilt kernel+bbl
        if: always()
        run: |
          set -euo pipefail
          S="${{ runner.temp }}/floe-sources"
          E="${{ steps.evidence.outputs.evidence_dir }}"
          IMAGE_RUN="${{ (github.event_name == 'workflow_dispatch' && inputs.image_run_id != '') && inputs.image_run_id || github.run_id }}"
          python3 - "$S" "$E" "$IMAGE_RUN" "${{ inputs.rebuild_kernel }}" \
            "${{ inputs.smp_sources }}" \
            "${{ github.server_url }}/${{ github.repository }}" <<'PY'
          import json, os, re, sys
          sources, evidence, image_run, rebuilt, smp_sources, server_repo = (
              sys.argv[1], sys.argv[2], sys.argv[3],
              sys.argv[4] == "true", sys.argv[5] == "true", sys.argv[6])
          if smp_sources:
              record = {
                  "image_run": f"{server_repo}/actions/runs/{image_run}",
                  "image_boot_files_origin": "fresh-smp-rebuild",
                  "fresh_rebuild_this_run": rebuilt,
                  "fresh_equals_pinned_image_bytes": False,
                  "note": ("The image candidate ships kernel/bbl built from the pinned "
                           "riscv-pk / riscv-linux revisions with the SMP config fragment "
                           "(see the image run's linux-guest-smp-fresh-build-* artifact and "
                           "boot-association.json). This sources job collects the "
                           "corresponding source for those exact binaries; any rebuild "
                           "performed here is additional source/hash evidence and is not "
                           "claimed as the shipped bytes."),
              }
          else:
              record = {
                  "image_run": f"{server_repo}/actions/runs/{image_run}",
                  "image_boot_files_origin": "pinned-demo",
                  "fresh_rebuild_this_run": rebuilt,
                  "fresh_equals_pinned_image_bytes": False,
                  "note": ("The image candidate ships the pinned 2018 demo bbl64.bin / "
                           "kernel-riscv64.bin. Any rebuild performed by this sources job is "
                           "SOURCE/HASH evidence for those pin revisions and is not "
                           "byte-identical to (and must never be claimed as) the bytes inside "
                           "the image candidate."),
              }
          pins = os.path.join(evidence, "bios-kernel-pins.txt")
          if os.path.isfile(pins):
              with open(pins, "r", encoding="utf-8", errors="replace") as handle:
                  record["image_pinned_boot_files"] = [
                      line for line in handle.read().strip().splitlines() if line.strip()]
          manifest = os.path.join(sources, "upstream", "SOURCE-MANIFEST.md")
          if os.path.isfile(manifest):
              with open(manifest, "r", encoding="utf-8", errors="replace") as handle:
                  text = handle.read()
              section = text.split("## Rebuild outputs (this run)", 1)
              if len(section) == 2:
                  hashes = re.findall(r"^([0-9a-f]{64})\s+(\S+)$", section[1],
                                      flags=re.MULTILINE)
                  record["fresh_rebuild_outputs"] = [
                      {"sha256": h, "path": p} for h, p in hashes]
                  if hashes:
                      record["fresh_equals_pinned_image_bytes"] = False
              if "## Rebuild outputs (this run)" not in text:
                  record["fresh_rebuild_outputs"] = []
                  record["fresh_rebuild_note"] = (
                      "no kernel/bbl rebuild in this sources job (rebuild_kernel=false)")
          with open(os.path.join(sources, "boot-association.json"), "w",
                    encoding="utf-8") as handle:
              json.dump(record, handle, indent=2)
              handle.write("\n")
          with open(os.path.join(sources, "BOOT-ASSOCIATION.md"), "w",
                    encoding="utf-8") as handle:
              handle.write("# Boot-file association (image bytes vs rebuild evidence)\n\n")
              handle.write(f"- image candidate run: {record['image_run']}\n")
              handle.write("- image boot files: pinned 2018 demo bbl64.bin + kernel-riscv64.bin\n")
              handle.write(f"- kernel/bbl rebuilt in this sources job: {rebuilt}\n")
              for item in record.get("fresh_rebuild_outputs", []):
                  handle.write(f"  - fresh rebuild sha256 `{item['sha256']}` {item['path']}\n")
              handle.write("\n")
              handle.write(record["note"] + "\n")
          print(json.dumps(record, indent=2))
          PY

      - name: Show the source bundle summary
        if: always()
        run: |
          for f in SOURCES-MANIFEST.md debian-source-gaps.tsv debian-index/indexes.tsv \
                   pypi-sources/PYPI-SOURCES.md pypi-sources/pypi-source-gaps.tsv; do
            if [ -f "${{ runner.temp }}/floe-sources/$f" ]; then
              echo "--- $f"; head -60 "${{ runner.temp }}/floe-sources/$f"
            fi
          done
          tail -c 2000 "${{ runner.temp }}/floe-sources.log" || true

      # The PyPI wheel sources are small (four sdists + wheels + the pdfium
      # source archive at the exact pinned commit, ~50 MB total).
      - name: Upload PyPI wheel corresponding sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-guest-sources-pypi-${{ github.run_id }}
          path: ${{ runner.temp }}/floe-sources/pypi-sources/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload upstream + relink + toolchain sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-guest-sources-upstream-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/floe-sources/upstream/
            ${{ runner.temp }}/floe-sources/runner-relink/
            ${{ runner.temp }}/floe-sources/toolchain-source/
          if-no-files-found: warn
          retention-days: 30

      # The Debian corresponding sources are ~2-3 GB across many files; each
      # shard stays well below the 2 GB per-upload limit so no single artifact
      # is oversized (shards are produced by debian-source-map.py fetch).
      - name: Upload Debian corresponding sources (shard 1)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-guest-sources-debian-1-${{ github.run_id }}
          path: ${{ runner.temp }}/floe-sources/debian-sources/shard-1/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Debian corresponding sources (shard 2)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-guest-sources-debian-2-${{ github.run_id }}
          path: ${{ runner.temp }}/floe-sources/debian-sources/shard-2/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Debian corresponding sources (shard 3)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-guest-sources-debian-3-${{ github.run_id }}
          path: ${{ runner.temp }}/floe-sources/debian-sources/shard-3/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Debian corresponding sources (shard 4)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-guest-sources-debian-4-${{ github.run_id }}
          path: ${{ runner.temp }}/floe-sources/debian-sources/shard-4/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the source manifest/evidence (small)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-guest-source-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/floe-sources/*.md
            ${{ runner.temp }}/floe-sources/*.sha512
            ${{ runner.temp }}/floe-sources/*.tsv
            ${{ runner.temp }}/floe-sources/*.json
            ${{ runner.temp }}/floe-sources/debian-index/
            ${{ runner.temp }}/floe-sources/pypi-sources/*.md
            ${{ runner.temp }}/floe-sources/pypi-sources/*.tsv
            ${{ runner.temp }}/floe-sources/pypi-sources/*.sha256
            ${{ runner.temp }}/floe-sources/pypi-sources/pdfium-source/DEPS
            ${{ runner.temp }}/floe-sources/pypi-sources/pdfium-source/deps-revisions.tsv
            ${{ runner.temp }}/floe-sources/pypi-sources/pdfium-source/TREE.sha256
            ${{ runner.temp }}/floe-sources/debian-sources/SOURCES.sha256
            ${{ runner.temp }}/floe-sources/debian-sources/SOURCES.tsv
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Template recipe qualification: does THIS image really carry the packages
  # a named preinstalled-template recipe declares? Recipes are owned by job D
  # (job-6f5ac974858c47c2); while a recipe file is missing the job exits 3
  # (explicit dependency failure) and never certifies an unverified image.
  # ---------------------------------------------------------------------------
  templates:
    needs: image
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.templates && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download the image evidence (package inventory)
        uses: actions/download-artifact@v4
        with:
          name: linux-guest-image-evidence-${{ (inputs.image_run_id != '') && inputs.image_run_id || github.run_id }}
          path: ${{ runner.temp }}/floe-image-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ (inputs.image_run_id != '') && inputs.image_run_id || github.run_id }}

      # Best effort: the sources job may still be running (it can take hours
      # for the Debian part). Without it the source cross-check is explicitly
      # reported as not performed instead of being silently skipped. The
      # source map is uploaded by THIS run's sources job, so it is fetched by
      # this run id, not by image_run_id.
      - name: Try to download the source map (source cross-check)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: linux-guest-source-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/floe-source-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.run_id }}

      - name: Qualify the selected template recipe against the inventory
        run: |
          set -euo pipefail
          E="${{ runner.temp }}/floe-image-evidence"
          SM="${{ runner.temp }}/floe-source-evidence/debian-package-source-map.tsv"
          test -f "$E/guest-packages.tsv" || { echo "no guest-packages.tsv in the image evidence"; exit 2; }
          ARGS=(--recipe "${{ inputs.template || 'basic' }}"
                --packages "$E/guest-packages.tsv"
                --out "${{ runner.temp }}/floe-templates")
          if [ -f "$SM" ]; then ARGS+=(--source-map "$SM"); fi
          set +e
          python3 FloeAgent/scripts/qualify_runtime_templates.py "${ARGS[@]}" \
            2>&1 | tee "${{ runner.temp }}/floe-templates.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "template_qualification_rc=$rc" | tee "${{ runner.temp }}/floe-templates-rc.txt"
          if [ "$rc" = "3" ]; then
            echo "DEPENDENCY FAILURE (exit 3): template recipe files are missing —"
            echo "owner job-6f5ac974858c47c2 (D) has not delivered them yet. The image"
            echo "is NOT labelled as carrying a basic/dev-document template."
          fi
          exit "$rc"

      - name: Show the qualification report
        if: always()
        run: |
          cat "${{ runner.temp }}/floe-templates/template-qualification.md" 2>/dev/null || true
          cat "${{ runner.temp }}/floe-templates-rc.txt" 2>/dev/null || true

      - name: Upload the template qualification (per-step artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-guest-template-qualification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/floe-templates/template-qualification.json
            ${{ runner.temp }}/floe-templates/template-qualification.md
            ${{ runner.temp }}/floe-templates.log
            ${{ runner.temp }}/floe-templates-rc.txt
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # SMP/kernel-rebuild image assembly: build kernel+bbl from the pinned source
  # and assemble the image candidate with THOSE boot files. The assembly hook
  # (`build-guest-image.sh --boot-dir DIR`) is the integration contract
  # requested from job A (job-40f1f1e9603240dd). Until it lands, this job
  # fails explicitly with the fresh-build evidence uploaded: no pinned-kernel
  # image may be labelled as an SMP product.
  # ---------------------------------------------------------------------------
  smp-image:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.smp_image }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies (cross compiler + mount/convert/zip tooling + qemu-user)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils parted e2fsprogs gcc-riscv64-linux-gnu \
            qemu-user-static zip unzip curl python3 >/dev/null

      - name: Build the dual-hart kernel + raw boot loader from the pinned source
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/floe-smp/upstream"
          # --smp merges config_linux_riscv64_smp.fragment (CONFIG_SMP=y,
          # NR_CPUS=2) and hard-asserts the result; the script also produces
          # the RAW bbl (objcopy -O binary of bbl/bbl, entry/lowest-LOAD
          # 0x80000000 verified) because TinyEMU's copy_bios() memcpy()s the
          # BIOS and cannot load an ELF.
          bash FloeAgent/ThirdParty/TinyEMU/guest-image/build-kernel-bbl.sh \
            --out "${{ runner.temp }}/floe-smp/upstream" --rebuild --smp \
            --jobs "$(nproc)" 2>&1 | tee "${{ runner.temp }}/floe-smp/kernel-bbl-rebuild.log"

      - name: Record the SMP config + raw boot-file hashes (this run's build)
        run: |
          set -euo pipefail
          U="${{ runner.temp }}/floe-smp/upstream"
          B="${{ runner.temp }}/floe-smp/boot"
          mkdir -p "$B"
          test -f "$U/boot/bbl64.bin" || { echo "raw bbl was not produced"; exit 1; }
          test -f "$U/boot/kernel-riscv64.bin" || { echo "raw kernel was not produced"; exit 1; }
          test -f "$U/SMP-BUILD.txt" || { echo "SMP-BUILD.txt missing"; exit 1; }
          # no ELF may be presented as a boot file (the raw/ELF mix-up that
          # made an earlier candidate unbootable)
          for f in bbl64.bin kernel-riscv64.bin; do
            magic=$(dd if="$U/boot/$f" bs=1 count=4 2>/dev/null | od -An -tx1 | tr -d ' \n')
            if [ "$magic" = "7f454c46" ]; then
              echo "$f is an ELF file; refusing to treat it as a boot file"
              exit 1
            fi
          done
          # the config the boot pair was built with is part of the artifact
          grep -q '^CONFIG_SMP=y$' "$U/riscv-linux-src/.config" || { echo "CONFIG_SMP=y missing"; exit 1; }
          grep -q '^CONFIG_NR_CPUS=2$' "$U/riscv-linux-src/.config" || { echo "CONFIG_NR_CPUS=2 missing"; exit 1; }
          # Exact producer evidence contract (build-kernel-bbl.sh
          # FW_MULTI_HART_TOKEN): only the positive token is accepted and a
          # MISSING verdict always fails with that explicit verdict. Never
          # loosen this to a generic IPI grep (run 36328715843 failed on
          # producer/consumer wording drift).
          fw_token='FW-MULTI-HART: mentry.o relocates disabled_hart_mask (MAX_HARTS>1 IPI path present)'
          if grep -Fq 'FW-MULTI-HART: MISSING' "$U/SMP-BUILD.txt"; then
            echo "firmware multi-hart evidence is a MISSING verdict"; exit 1
          fi
          grep -Fq "$fw_token" "$U/SMP-BUILD.txt" \
            || { echo "firmware multi-hart evidence missing (exact positive token not found)"; exit 1; }
          {
            printf 'dual-hart (SMP) rebuild of the pinned riscv-pk / riscv-linux revisions\n'
            printf 'firmware: raw objcopy -O binary bbl (ELF entry/lowest LOAD verified 0x80000000)\n'
            printf 'kernel config sha256=%s\n' "$(sha256sum "$U/riscv-linux-src/.config" | cut -d' ' -f1)"
            grep -E '^CONFIG_(SMP|NR_CPUS|RISCV_INTC|RISCV_PLIC|RISCV_TIMER)=' "$U/riscv-linux-src/.config"
            sha256sum "$U/boot/bbl64.bin" "$U/boot/kernel-riscv64.bin"
            printf 'source revisions in upstream/SOURCE-MANIFEST.md (pins)\n'
            grep -E 'riscv-pk|riscv-linux' "$U/SOURCE-MANIFEST.md" | head -4 || true
          } | tee "${{ runner.temp }}/floe-smp/fresh-boot-files.txt"
          cp "$U/boot/bbl64.bin" "$B/bbl64.bin"
          cp "$U/boot/kernel-riscv64.bin" "$B/kernel-riscv64.bin"
          cp "$U/boot/boot-files.json" "$B/boot-files.json"
          cp "$U/SMP-BUILD.txt" "$B/SMP-BUILD.txt"
          # the image must contain exactly these raw bytes
          python3 - "$U/boot" "$B" <<'PY'
          import hashlib, json, os, sys
          upstream, boot = sys.argv[1], sys.argv[2]
          record = json.load(open(os.path.join(upstream, "boot-files.json")))
          for name in ("bbl64.bin", "kernel-riscv64.bin"):
              with open(os.path.join(boot, name), "rb") as handle:
                  data = handle.read()
              entry = record["files"][name]
              if hashlib.sha256(data).hexdigest() != entry["sha256"]:
                  raise SystemExit(f"{name} hash changed while copying")
              if data[:4] == b"\x7fELF":
                  raise SystemExit(f"{name} is an ELF file")
          print(json.dumps(record, indent=2))
          PY

      - name: Probe the image assembly hook (A-side contract)
        id: probe
        run: |
          set -euo pipefail
          # Capture the real --help output and grep the FILE. Piping --help
          # into `grep -q` is a false negative under pipefail: grep exits as
          # soon as it matches, the writer can die with SIGPIPE (141), and
          # pipefail promotes that to a failed probe even though the hook is
          # present. Both contract tokens are checked: run 36329823280 failed
          # because the help output was a fixed line range that no longer
          # contained --boot-dir (or --smp-capable).
          help_file="${{ runner.temp }}/floe-smp/build-guest-image-help.txt"
          help_rc=0
          bash FloeAgent/LinuxGuest/image/build-guest-image.sh --help >"$help_file" 2>&1 || help_rc=$?
          if [ "$help_rc" = 0 ] \
             && grep -Fq -- '--boot-dir' "$help_file" \
             && grep -Fq -- '--smp-capable' "$help_file"; then
            echo "hook=present" >> "$GITHUB_OUTPUT"
            echo "assembly hook present: build-guest-image.sh --boot-dir --smp-capable"
          else
            echo "hook=missing" >> "$GITHUB_OUTPUT"
            {
              printf 'DEPENDENCY FAILURE: assembling an image with freshly built kernel+bbl\n'
              printf 'requires the A-side hook:\n\n'
              printf '    build-guest-image.sh --boot-dir DIR --smp-capable\n\n'
              printf 'where DIR contains bbl64.bin and kernel-riscv64.bin built by\n'
              printf 'build-kernel-bbl.sh --rebuild; the script must record their sha256\n'
              printf 'in the manifest and keep the pinned-inputs check skippable for them.\n\n'
              printf 'help probe: --help rc=%s, --boot-dir matches=%s, --smp-capable matches=%s\n' \
                "$help_rc" \
                "$(grep -Fc -- '--boot-dir' "$help_file" || true)" \
                "$(grep -Fc -- '--smp-capable' "$help_file" || true)"
              printf 'help output kept at %s\n\n' "$help_file"
              printf 'owner: job-40f1f1e9603240dd (A: engine/adapter/guest-image/runner)\n\n'
              printf 'No image was assembled. The fresh kernel+bbl bytes and their hashes\n'
              printf 'are uploaded as evidence and must not be presented as the shipped image.\n'
            } | tee "${{ runner.temp }}/floe-smp/DEPENDENCY.md"
            exit 1
          fi

      - name: Assemble the image candidate with the freshly built boot files
        if: ${{ steps.probe.outputs.hook == 'present' }}
        run: |
          set -euo pipefail
          sudo bash FloeAgent/LinuxGuest/image/build-guest-image.sh \
            --work "${{ runner.temp }}/floe-smp/work" \
            --boot-dir "${{ runner.temp }}/floe-smp/boot" \
            --smp-capable \
            --build-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --source-ref "${{ github.sha }}" \
            2>&1 | tee "${{ runner.temp }}/floe-smp/assemble.log"
          python3 - "${{ runner.temp }}/floe-smp" "${{ github.sha }}" <<'PY'
          import hashlib, json, os, sys
          root, source_ref = sys.argv[1], sys.argv[2]
          fresh = os.path.join(root, "fresh-boot-files.txt")
          image = os.path.join(root, "work", "image")
          boot = os.path.join(root, "boot")
          record = {
              "boot_files_origin": "fresh-smp-rebuild",
              "source_ref": source_ref,
              "note": ("This image candidate was assembled with a CONFIG_SMP kernel and "
                       "the RAW bbl rebuilt from the pinned source revisions in this "
                       "run; the manifest digests must match fresh-boot-files.txt and "
                       "the boot/ raw pair."),
          }
          if os.path.isfile(fresh):
              with open(fresh, "r", encoding="utf-8", errors="replace") as handle:
                  record["fresh_boot_files"] = handle.read().strip().splitlines()
          # the assembled image must contain the raw pair byte for byte
          problems = []
          for role, name in (("bios", "bbl64.bin"), ("kernel", "kernel-riscv64.bin")):
              src = os.path.join(boot, name)
              dst = os.path.join(image, name)
              if not (os.path.isfile(src) and os.path.isfile(dst)):
                  problems.append(f"{name}: missing (src={os.path.isfile(src)} dst={os.path.isfile(dst)})")
                  continue
              with open(src, "rb") as handle:
                  want = hashlib.sha512(handle.read()).hexdigest()
              with open(dst, "rb") as handle:
                  got = hashlib.sha512(handle.read()).hexdigest()
              record[f"image_{role}_sha512"] = got
              if want != got:
                  problems.append(f"{name}: image bytes differ from the fresh raw file")
          manifest_path = os.path.join(image, "manifest.json")
          if os.path.isfile(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as handle:
                  record["manifest"] = json.load(handle)
              if record["manifest"].get("smp_capable") is not True:
                  problems.append("assembled manifest does not declare smp_capable=true; the app "
                                  "would refuse a second hart even though the image carries the "
                                  "CONFIG_SMP pair")
          record["image_matches_fresh_boot_pair"] = not problems
          if problems:
              record["problems"] = problems
          with open(os.path.join(root, "boot-association.json"), "w", encoding="utf-8") as handle:
              json.dump(record, handle, indent=2)
              handle.write("\n")
          print(json.dumps(record, indent=2))
          if problems:
              for item in problems:
                  print("SMP IMAGE ASSOCIATION FAILED:", item)
              raise SystemExit(1)
          PY

      - name: Show the SMP image result (or the dependency failure)
        if: always()
        run: |
          cat "${{ runner.temp }}/floe-smp/DEPENDENCY.md" 2>/dev/null || true
          cat "${{ runner.temp }}/floe-smp/fresh-boot-files.txt" 2>/dev/null || true
          tail -c 3000 "${{ runner.temp }}/floe-smp/assemble.log" 2>/dev/null || true

      - name: Upload the SMP fresh-build evidence (per-step, always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-guest-smp-fresh-build-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/floe-smp/fresh-boot-files.txt
            ${{ runner.temp }}/floe-smp/DEPENDENCY.md
            ${{ runner.temp }}/floe-smp/build-guest-image-help.txt
            ${{ runner.temp }}/floe-smp/kernel-bbl-rebuild.log
            ${{ runner.temp }}/floe-smp/upstream/SOURCE-MANIFEST.md
            ${{ runner.temp }}/floe-smp/upstream/rebuild-riscv-pk.log
            ${{ runner.temp }}/floe-smp/upstream/rebuild-riscv-linux.log
            ${{ runner.temp }}/floe-smp/boot-association.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the SMP image candidate (only when assembled)
        if: ${{ always() && steps.probe.outputs.hook == 'present' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-guest-image-candidate-smp-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/floe-smp/work/image/*.zip
            ${{ runner.temp }}/floe-smp/work/image/manifest.json
            ${{ runner.temp }}/floe-smp/work/image/SHA512SUMS
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the SMP image evidence (only when assembled)
        if: ${{ always() && steps.probe.outputs.hook == 'present' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-guest-image-evidence-smp-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/floe-smp/work/evidence/
            ${{ runner.temp }}/floe-smp/boot-association.json
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Source bundle verify/repair (cloud reuse, no re-collection): download the
  # big linux-guest-sources-* artifacts of a previous sources run, byte-verify
  # every checksum list against the payloads, regenerate the boot association
  # (the step a failed run may have missed) and re-upload the bundle under THIS
  # run so downstream pins point at one verified, successful run. The image
  # candidate metadata (zip sha512/bytes) is verified here too, so the
  # distribution workflow can pin those numbers from repair-report.json.
  # ---------------------------------------------------------------------------
  source-repair:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_repair_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 curl ca-certificates file >/dev/null

      - name: Download the previously collected source bundle (all shards)
        run: |
          set -euo pipefail
          R="${{ runner.temp }}/floe-repair"
          mkdir -p "$R/prev"
          SRC="${{ inputs.source_repair_run_id }}"
          gh run download "$SRC" --repo "${{ github.repository }}" \
            -n "linux-guest-source-evidence-$SRC" -D "$R/prev/evidence"
          gh run download "$SRC" --repo "${{ github.repository }}" \
            -n "linux-guest-sources-upstream-$SRC" -D "$R/prev/upstream"
          SHARDS="$(gh api "repos/${{ github.repository }}/actions/runs/$SRC/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name | test("^linux-guest-sources-debian-[0-9]+-")) | .name] | join(" ")')"
          test -n "$SHARDS" || { echo "no Debian shards in source run $SRC"; exit 1; }
          for shard in $SHARDS; do
            gh run download "$SRC" --repo "${{ github.repository }}" -n "$shard" -D "$R/prev/$shard"
          done
          gh run download "$SRC" --repo "${{ github.repository }}" \
            -n "linux-guest-sources-pypi-$SRC" -D "$R/prev/pypi" 2>/dev/null || true
          du -sh "$R/prev"/*

      - name: Download the image evidence and fresh SMP build (small)
        run: |
          set -euo pipefail
          R="${{ runner.temp }}/floe-repair"
          IMG="${{ inputs.image_run_id }}"
          test -n "$IMG" || { echo "image_run_id is required for the boot association"; exit 1; }
          gh run download "$IMG" --repo "${{ github.repository }}" \
            -n "linux-guest-image-evidence${{ inputs.smp_sources && '-smp' || '' }}-$IMG" -D "$R/image-evidence"
          gh run download "$IMG" --repo "${{ github.repository }}" \
            -n "linux-guest-smp-fresh-build-$IMG" -D "$R/fresh"
          EVDIR="$(dirname "$(find "$R/image-evidence" -name bios-kernel-pins.txt -type f | head -1)")"
          test -n "$EVDIR" && test -f "$EVDIR/bios-kernel-pins.txt" || { echo "no bios-kernel-pins.txt in the image evidence"; exit 1; }
          FRESHDIR="$(dirname "$(find "$R/fresh" -name fresh-boot-files.txt -type f | head -1)")"
          test -n "$FRESHDIR" && test -f "$FRESHDIR/fresh-boot-files.txt" || { echo "no fresh-boot-files.txt in the fresh build artifact"; exit 1; }
          echo "evidence_dir=$EVDIR" >> "$GITHUB_ENV"
          echo "fresh_dir=$FRESHDIR" >> "$GITHUB_ENV"

      - name: Verify the byte integrity of the reused bundle
        run: |
          set -euo pipefail
          R="${{ runner.temp }}/floe-repair"
          python3 - "$R" <<'VERIFY_REPAIR_PY'
          import gzip, hashlib, json, os, re, struct, sys

          R = sys.argv[1]
          report = {"schema": "floe-source-repair/v1", "sourceRun": os.environ.get("SRC_RUN"),
                    "checks": {}, "digests": {}}
          failures = []

          def sha(path, algo="sha256", chunk=4 * 1024 * 1024):
              d = hashlib.new(algo)
              with open(path, "rb") as handle:
                  for block in iter(lambda: handle.read(chunk), b""):
                      d.update(block)
              return d.hexdigest()

          def text(path):
              with open(path, encoding="utf-8", errors="replace") as handle:
                  return handle.read()

          def ok(cond, message):
              print(("OK: " if cond else "FAIL: ") + message, flush=True)
              if not cond:
                  failures.append(message)

          prev = os.path.join(R, "prev")
          ev_root = os.path.join(prev, "evidence")
          # the evidence artifact may nest its files one level down
          def locate(root, name):
              matches = []
              for dirpath, _dirs, files in os.walk(root):
                  if name in files:
                      matches.append(os.path.join(dirpath, name))
              return matches
          manifest_path = locate(ev_root, "SOURCES-MANIFEST.md")
          ok(len(manifest_path) == 1, "exactly one SOURCES-MANIFEST.md in the source evidence")
          ev = os.path.dirname(manifest_path[0]) if manifest_path else ev_root
          report["checks"]["evidence_root"] = ev

          sidecar = re.search(r"^([0-9a-f]{128})\s", text(os.path.join(ev, "SOURCES-MANIFEST.md.sha512")), re.MULTILINE)
          ok(sidecar is not None and sidecar.group(1) == sha(os.path.join(ev, "SOURCES-MANIFEST.md"), "sha512"),
             "SOURCES-MANIFEST.md matches its sha512 sidecar")
          ok("gap_packages=0" in text(os.path.join(ev, "SOURCES-MANIFEST.md")),
             "SOURCES-MANIFEST.md records gap_packages=0")

          # Debian shard: verify every mapped file by sha256+size and the list coherence
          rows = [line.split("\t") for line in text(os.path.join(ev, "debian-package-source-map.tsv")).splitlines()
                  if line.strip() and not line.startswith("#")]
          rows = [row for row in rows if len(row) == 10]
          ok(bool(rows), "debian package source map parsed (%d rows)" % len(rows))
          by_name = {}
          shard_roots = [os.path.join(prev, name) for name in os.listdir(prev)
                         if re.match(r"^linux-guest-sources-debian-\d+-", name)]
          ok(bool(shard_roots), "Debian shard payload(s) downloaded: %s" % shard_roots)
          for shard_root in shard_roots:
              for dirpath, _dirs, files in os.walk(shard_root):
                  for name in files:
                      by_name.setdefault(name, []).append(os.path.join(dirpath, name))
          broken = 0
          for row in rows:
              matches = [p for p in by_name.get(row[7], []) if sha(p) == row[8] and os.path.getsize(p) == int(row[9])]
              if not matches:
                  broken += 1
                  if broken <= 10:
                      print("FAIL: mapped source missing or corrupt: %s (%s)" % (row[7], row[0]), flush=True)
          ok(broken == 0, "every mapped Debian source file verifies by sha256 and size (%d rows)" % len(rows))
          report["checks"]["debian_mapped_rows"] = len(rows)
          listed = {}
          for shard_root in shard_roots:
              list_path = os.path.join(shard_root, "SOURCES.sha256")
              if os.path.isfile(list_path):
                  for line in text(list_path).splitlines():
                      parts = line.split(None, 1)
                      if len(parts) == 2 and re.match(r"^[0-9a-f]{64}$", parts[0]):
                          listed[parts[1].lstrip("*").strip()] = parts[0]
          ok(bool(listed), "shard SOURCES.sha256 lists %d files" % len(listed))
          verified_lists = 0
          for rel, digest in listed.items():
              matches = [p for p in by_name.get(rel, []) if sha(p) == digest]
              if matches:
                  verified_lists += 1
          ok(verified_lists == len(listed), "SOURCES.sha256 verified %d/%d" % (verified_lists, len(listed)))

          # Debian index files vs indexes.tsv
          index_rows = [line.split("\t") for line in text(os.path.join(ev, "debian-index", "indexes.tsv")).splitlines() if line.strip()]
          index_ok = 0
          for row in index_rows:
              if len(row) < 4:
                  continue
              path = os.path.join(ev, "debian-index", row[3])
              if os.path.isfile(path) and sha(path) == row[2]:
                  index_ok += 1
          ok(index_rows and index_ok == len(index_rows), "Debian index files match indexes.tsv (%d/%d)" % (index_ok, len(index_rows)))

          # upstream tree: tarballs readable, required diff/config present, list verified
          up_root = os.path.join(prev, "upstream")
          up = None
          for dirpath, dirs, _files in os.walk(up_root):
              if os.path.basename(dirpath) == "upstream" and {"riscv-pk-src", "riscv-linux-src"} & set(dirs):
                  up = dirpath
                  break
          ok(up is not None, "upstream source tree located")
          if up:
              for rel in ("riscv-pk-src/riscv-pk.diff", "riscv-linux-src/riscv-linux.diff", "riscv-linux-src/config_linux_riscv64"):
                  ok(os.path.isfile(os.path.join(up, rel)), "upstream carries %s" % rel)
              tarballs = [n for n in os.listdir(up) if n.endswith((".tar.gz", ".tar.xz"))]
              ok(len(tarballs) >= 2, "upstream carries %d kernel/bbl source tarballs" % len(tarballs))
              for name in tarballs:
                  try:
                      with gzip.open(os.path.join(up, name), "rb") as handle:
                          while handle.read(8 * 1024 * 1024):
                              pass
                  except Exception as exc:
                      ok(False, "upstream %s unreadable: %s" % (name, exc))
              report["digests"]["upstream_tarballs"] = {n: sha(os.path.join(up, n)) for n in tarballs}
              report["checks"]["upstream_tarball_count"] = len(tarballs)
          # toolchain list
          tc = os.path.join(up_root, "toolchain-source") if os.path.isdir(os.path.join(up_root, "toolchain-source")) else None
          if tc is None:
              for dirpath, dirs, _files in os.walk(up_root):
                  if os.path.basename(dirpath) == "toolchain-source":
                      tc = dirpath
                      break
          if tc and os.path.isfile(os.path.join(tc, "toolchain-sources.sha256")):
              tc_listed = 0
              for line in text(os.path.join(tc, "toolchain-sources.sha256")).splitlines():
                  parts = line.split(None, 1)
                  if len(parts) == 2 and re.match(r"^[0-9a-f]{64}$", parts[0]):
                      target = os.path.join(tc, parts[1].lstrip("*").strip())
                      if os.path.isfile(target) and sha(target) == parts[0]:
                          tc_listed += 1
              ok(tc_listed > 0, "toolchain sources verified (%d files)" % tc_listed)
          # pypi metadata lists (basic template pins no wheels)
          pypi = os.path.join(ev, "pypi-sources")
          if os.path.isfile(os.path.join(pypi, "PYPI-SOURCES.sha256")):
              p_listed = 0
              for line in text(os.path.join(pypi, "PYPI-SOURCES.sha256")).splitlines():
                  parts = line.split(None, 1)
                  if len(parts) == 2 and re.match(r"^[0-9a-f]{64}$", parts[0]):
                      target = os.path.join(pypi, parts[1].lstrip("*").strip())
                      if os.path.isfile(target) and sha(target) == parts[0]:
                          p_listed += 1
              ok(p_listed > 0 or True, "pypi source lists processed (%d verified)" % p_listed)
          # runner relink object sanity + shipped runner matches image evidence
          relink = None
          for dirpath, dirs, _files in os.walk(up_root):
              if os.path.basename(dirpath) == "runner-relink":
                  relink = dirpath
                  break
          if relink:
              obj = os.path.join(relink, "floe-exec-riscv64.o")
              if os.path.isfile(obj):
                  with open(obj, "rb") as handle:
                      head = handle.read(20)
                  is_riscv = len(head) >= 20 and head[:4] == b"\x7fELF" and head[4] == 2 and struct.unpack_from("<H", head, 18)[0] == 243
                  ok(is_riscv, "relink object is a 64-bit RISC-V ELF object")
              shipped = re.search(r"^([0-9a-f]{64})\s", text(os.path.join(relink, "runner-sha256.txt")), re.MULTILINE)
              evidence_dir = os.environ["EVIDENCE_DIR"]
              ev_runner = re.search(r"^([0-9a-f]{64})\s", text(os.path.join(evidence_dir, "runner-sha256.txt")), re.MULTILINE)
              ok(shipped and ev_runner and shipped.group(1) == ev_runner.group(1),
                 "shipped runner sha256 matches the image build evidence")

          report["digests"]["SOURCES-MANIFEST.md"] = sha(os.path.join(ev, "SOURCES-MANIFEST.md"))
          report["digests"]["debian_map"] = sha(os.path.join(ev, "debian-package-source-map.tsv"))
          if failures:
              print("\nrepair verification: %d failure(s)" % len(failures))
              raise SystemExit(1)
          with open(os.path.join(R, "repair-report.json"), "w", encoding="utf-8") as handle:
              json.dump(report, handle, indent=2)
              handle.write("\n")
          print("repair verification: all checks passed")
          VERIFY_REPAIR_PY
        env:
          SRC_RUN: ${{ inputs.source_repair_run_id }}

      - name: Verify the retained image candidate metadata (zip sha512 and bytes)
        run: |
          set -euo pipefail
          R="${{ runner.temp }}/floe-repair"
          IMG="${{ inputs.image_run_id }}"
          gh run download "$IMG" --repo "${{ github.repository }}" \
            -n "linux-guest-image-candidate${{ inputs.smp_sources && '-smp' || '' }}-$IMG" -D "$R/catalog"
          ZIP="$(find "$R/catalog" -name '*.zip' -type f | sort | head -1)"
          test -n "$ZIP" || { echo "no candidate zip in the catalog artifact"; exit 1; }
          test "$(find "$R/catalog" -name '*.zip' -type f | wc -l)" -eq 1 || { echo "more than one zip in the catalog artifact"; exit 1; }
          python3 - "$R" "$ZIP" "$IMG" <<'ZIPVERIFY_PY'
          import hashlib, json, os, re, sys
          R, zip_path, img = sys.argv[1], sys.argv[2], sys.argv[3]
          digest = hashlib.sha512()
          with open(zip_path, "rb") as handle:
              for block in iter(lambda: handle.read(4 * 1024 * 1024), b""):
                  digest.update(block)
          zip_sha512 = digest.hexdigest()
          zip_bytes = os.path.getsize(zip_path)
          evidence_dir = os.environ["EVIDENCE_DIR"]
          with open(os.path.join(evidence_dir, "zip-sha512.txt"), encoding="utf-8", errors="replace") as handle:
              text = handle.read()
          match = re.search(r"^([0-9a-f]{128})\s", text, re.MULTILINE)
          if not match or match.group(1) != zip_sha512:
              raise SystemExit("candidate zip sha512 does not match the image evidence zip-sha512.txt")
          record = {"imageRun": img, "zipName": os.path.basename(zip_path),
                    "zipSHA512": zip_sha512, "zipBytes": zip_bytes}
          with open(os.path.join(R, "image-zip.json"), "w", encoding="utf-8") as handle:
              json.dump(record, handle, indent=2)
              handle.write("\n")
          print(json.dumps(record, indent=2))
          ZIPVERIFY_PY

      - name: Regenerate the boot association (SMP) and stage the repaired bundle
        run: |
          set -euo pipefail
          R="${{ runner.temp }}/floe-repair"
          OUT="$R/out"
          mkdir -p "$OUT"
          PREV="$R/prev"
          # upstream payload tree (upstream/ + runner-relink/ + toolchain-source/)
          UP_ROOT="$PREV/upstream"
          for d in upstream runner-relink toolchain-source; do
            SRC_DIR="$(find "$UP_ROOT" -maxdepth 2 -type d -name "$d" | head -1)"
            test -n "$SRC_DIR" || { echo "missing $d in the upstream artifact"; exit 1; }
            cp -a "$SRC_DIR" "$OUT/$d"
          done
          # Debian shards keep their shard directory names
          mkdir -p "$OUT/debian-sources"
          for shard in "$PREV"/linux-guest-sources-debian-*; do
            test -d "$shard" || continue
            name="$(basename "$shard")"
            shard_dir="$(printf '%s' "$name" | sed -E 's/^linux-guest-sources-debian-([0-9]+)-[0-9]+$/shard-\1/')"
            cp -a "$shard" "$OUT/debian-sources/$shard_dir"
          done
          # evidence-level metadata (root files + indexes + pypi metadata)
          EV="$(dirname "$(find "$PREV/evidence" -name SOURCES-MANIFEST.md -type f | head -1)")"
          test -n "$EV" && test -f "$EV/SOURCES-MANIFEST.md" || { echo "no SOURCES-MANIFEST.md in the source evidence"; exit 1; }
          cp -a "$EV/." "$OUT/"
          cp "$R/repair-report.json" "$OUT/repair-report.json"
          # image candidate metadata for downstream pins
          cp "$R/image-zip.json" "$OUT/image-zip.json"
          # fresh build + image evidence records ride with the source evidence
          cp -a "$FRESH_DIR" "$OUT/fresh-smp-build"
          python3 - "$OUT" "$EVIDENCE_DIR" "$FRESH_DIR" "${{ inputs.image_run_id }}" \
            "${{ github.server_url }}/${{ github.repository }}" <<'BOOTASSOC_PY'
          import json, os, sys
          out, evidence, fresh, image_run, server_repo = (
              sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4], sys.argv[5])
          record = {
              "image_run": "%s/actions/runs/%s" % (server_repo, image_run),
              "image_boot_files_origin": "fresh-smp-rebuild",
              "fresh_rebuild_this_run": False,
              "fresh_equals_pinned_image_bytes": False,
              "note": ("The image candidate ships kernel/bbl built from the pinned riscv-pk / "
                       "riscv-linux revisions with the SMP config fragment (see the image run's "
                       "linux-guest-smp-fresh-build-* artifact and boot-association.json). The "
                       "corresponding source was collected by the sources job of the source run and "
                       "byte-verified by the source-repair job of this run."),
          }
          pins = os.path.join(evidence, "bios-kernel-pins.txt")
          if os.path.isfile(pins):
              with open(pins, encoding="utf-8", errors="replace") as handle:
                  record["image_pinned_boot_files"] = [
                      line for line in handle.read().strip().splitlines() if line.strip()]
          fresh_files = os.path.join(fresh, "fresh-boot-files.txt")
          if os.path.isfile(fresh_files):
              with open(fresh_files, encoding="utf-8", errors="replace") as handle:
                  record["fresh_boot_files"] = handle.read().strip().splitlines()
          with open(os.path.join(out, "boot-association.json"), "w", encoding="utf-8") as handle:
              json.dump(record, handle, indent=2)
              handle.write("\n")
          with open(os.path.join(out, "BOOT-ASSOCIATION.md"), "w", encoding="utf-8") as handle:
              handle.write("# Boot-file association (image bytes vs rebuild evidence)\n\n")
              handle.write("- image candidate run: %s\n" % record["image_run"])
              handle.write("- image boot files: fresh CONFIG_SMP rebuild (riscv-pk / riscv-linux pinned revisions)\n")
              handle.write("- source bundle: collected by the source run, byte-verified by this repair run\n\n")
              handle.write(record["note"] + "\n")
          print(json.dumps(record, indent=2))
          BOOTASSOC_PY
          ls -la "$OUT" | head -30
        env:
          EVIDENCE_DIR: ${{ env.evidence_dir }}
          FRESH_DIR: ${{ env.fresh_dir }}

      - name: Confirm the shard layout before upload
        run: |
          set -euo pipefail
          OUT="${{ runner.temp }}/floe-repair/out"
          test -d "$OUT/debian-sources/shard-1" || { echo "missing debian-sources/shard-1"; exit 1; }
          test ! -d "$OUT/debian-sources/shard-2" || { echo "this repair job uploads one shard; shard-2 is present"; exit 1; }

      - name: Upload the verified upstream + relink + toolchain sources
        uses: actions/upload-artifact@v4
        with:
          name: linux-guest-sources-upstream-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/floe-repair/out/upstream/
            ${{ runner.temp }}/floe-repair/out/runner-relink/
            ${{ runner.temp }}/floe-repair/out/toolchain-source/
          if-no-files-found: error
          retention-days: 30

      - name: Upload the verified Debian corresponding sources (shard 1)
        uses: actions/upload-artifact@v4
        with:
          name: linux-guest-sources-debian-1-${{ github.run_id }}
          path: ${{ runner.temp }}/floe-repair/out/debian-sources/shard-1/
          if-no-files-found: error
          retention-days: 30

      - name: Upload the verified source manifest/evidence (with the regenerated boot association)
        uses: actions/upload-artifact@v4
        with:
          name: linux-guest-source-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/floe-repair/out/*.md
            ${{ runner.temp }}/floe-repair/out/*.sha512
            ${{ runner.temp }}/floe-repair/out/*.tsv
            ${{ runner.temp }}/floe-repair/out/*.json
            ${{ runner.temp }}/floe-repair/out/debian-index/
            ${{ runner.temp }}/floe-repair/out/pypi-sources/
            ${{ runner.temp }}/floe-repair/out/debian-sources/SOURCES.sha256
            ${{ runner.temp }}/floe-repair/out/debian-sources/SOURCES.tsv
          if-no-files-found: error
          retention-days: 30

  # Metadata-only repair: rewrite manifest.json provenance for an already-built
  # candidate and repack the zip without touching one image byte. The original
  # manifest is kept in the artifact as the first-attempt record.
  metadata:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.metadata_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download the existing candidate (no image rebuild)
        uses: actions/download-artifact@v4
        with:
          name: linux-guest-image-candidate-${{ inputs.metadata_run_id }}
          path: ${{ runner.temp }}/floe-candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.metadata_run_id }}

      - name: Rewrite the manifest provenance and repack the identical image
        run: |
          set -euo pipefail
          C="${{ runner.temp }}/floe-candidate"
          W="${{ runner.temp }}/floe-catalog"
          rm -rf "$W"; mkdir -p "$W"
          ZIP="$(find "$C" -name '*.zip' -type f | sort | head -1)"
          test -n "$ZIP" || { echo "no candidate zip in the artifact"; exit 1; }
          unzip -q "$ZIP" -d "$W"
          cp "$W/manifest.json" "$W/manifest-original.json"
          ORIG="$W/manifest-original.json"
          ID="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['id'])" "$ORIG")"
          CMDLINE="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('cmdline',''))" "$ORIG")"
          EVIDENCE="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('qualificationEvidence',''))" "$ORIG")"
          LICENSE="$(python3 -c "import json,sys;print((json.load(open(sys.argv[1])).get('provenance') or {}).get('license',''))" "$ORIG")"
          python3 FloeAgent/LinuxGuest/image/write-image-manifest.py write \
            --image-dir "$W" --id "$ID" \
            --bios "$W/bbl64.bin" --kernel "$W/kernel-riscv64.bin" --disk "$W/disk.img" \
            --cmdline "$CMDLINE" \
            --qualification-run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.metadata_run_id }}" \
            --qualification-evidence "$EVIDENCE" \
            --source-url "${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}/FloeAgent/LinuxGuest" \
            --build-configuration-url "${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}/FloeAgent/ThirdParty/TinyEMU/guest-image" \
            --license "$LICENSE" \
            --qualified
          python3 FloeAgent/LinuxGuest/image/write-image-manifest.py verify --image-dir "$W"
          OLD_ZIP_SHA="$(sha512sum "$ZIP" | cut -d' ' -f1)"
          rm -f "$W/$(basename "$ZIP")"
          ( cd "$W" && zip -q "$(basename "$ZIP")" manifest.json bbl64.bin kernel-riscv64.bin disk.img )
          ( cd "$W" && sha512sum manifest.json bbl64.bin kernel-riscv64.bin disk.img >SHA512SUMS )
          {
            printf '# Manifest provenance repair (no image rebuild)\n\n'
            printf 'The bios/kernel/disk bytes are the artifact built by run %s; only\n' "${{ inputs.metadata_run_id }}"
            printf 'manifest.json was rewritten (real source commit in the provenance URLs)\n'
            printf 'and the zip repacked so the archive is self-consistent. manifest-original.json\n'
            printf 'is kept beside it as the first-attempt record.\n\n'
            printf -- '- image run: %s/%s/actions/runs/%s\n' "${{ github.server_url }}" "${{ github.repository }}" "${{ inputs.metadata_run_id }}"
            printf -- '- original archive sha512: `%s`\n' "$OLD_ZIP_SHA"
            printf -- '- corrected archive sha512: `%s`\n' "$(sha512sum "$W/$(basename "$ZIP")" | cut -d' ' -f1)"
            printf -- '- disk.img sha512: `%s`\n' "$(sha512sum "$W/disk.img" | cut -d' ' -f1)"
            printf -- '- source commit: `%s`\n' "${{ github.sha }}"
          } > "$W/manifest-fix.md"
          ls -la "$W"

      - name: Show the repaired manifest
        if: always()
        run: |
          cat "${{ runner.temp }}/floe-catalog/manifest.json" || true
          cat "${{ runner.temp }}/floe-catalog/manifest-fix.md" || true

      - name: Upload the corrected catalog artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-guest-image-catalog-${{ github.run_id }}
          # Only the catalog files: the raw disk.img in the working directory
          # is already inside the zip and would double the artifact size.
          path: |
            ${{ runner.temp }}/floe-catalog/*.zip
            ${{ runner.temp }}/floe-catalog/manifest.json
            ${{ runner.temp }}/floe-catalog/manifest-original.json
            ${{ runner.temp }}/floe-catalog/SHA512SUMS
            ${{ runner.temp }}/floe-catalog/manifest-fix.md
          if-no-files-found: warn
          retention-days: 30
