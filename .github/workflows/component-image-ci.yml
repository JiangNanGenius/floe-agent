name: ARM64 component source contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - FloeAgent/ThirdParty/ARM64EMU/**
      - FloeAgent/LinuxGuest/runner/**
      - FloeAgent/LinuxGuest/image/arm64/**
      - FloeAgent/Package.swift

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable source, CRC tables and selected runtime
        run: python3 FloeAgent/ThirdParty/ARM64EMU/Tools/verify_provenance.py
      - name: Validate boot metadata and recipe syntax
        run: |
          python3 -m json.tool FloeAgent/LinuxGuest/image/arm64/boot-inputs.json >/dev/null
          python3 -m py_compile FloeAgent/LinuxGuest/image/arm64/build-initrd.py FloeAgent/LinuxGuest/image/arm64/package-image.py
      # Native compilation, actual guest execution, App UI, packaging and
      # publication remain separately recorded local qualification stages.
