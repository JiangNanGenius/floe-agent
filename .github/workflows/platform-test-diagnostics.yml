name: Diagnose platform test execution
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  result-schema:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37354223398
          artifact-ids: 11366782405
          path: evidence
      - name: Read retained result with original toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p schema
          for app in /Applications/Xcode_26.6.app /Applications/Xcode_26.5.app; do
            if [ -d "$app/Contents/Developer" ]; then
              export DEVELOPER_DIR="$app/Contents/Developer"
              break
            fi
          done
          xcodebuild -version | tee schema/toolchain.txt
          for family in iPad iPhone; do
            bundle=$(find evidence -type d -name "notes-diagnostic-$family.xcresult" -print -quit)
            test -n "$bundle"
            xcrun xcresulttool get test-results summary --path "$bundle" > "schema/$family-summary.json"
            xcrun xcresulttool get test-results tests --path "$bundle" > "schema/$family-tests.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build260-original-result-schema
          path: schema
          if-no-files-found: error
