name: Diagnose platform test execution
on:
  workflow_dispatch:
  push:
    branches: ['codex/floe-1-7-integration-20260912']
    paths: ['.github/workflows/platform-test-diagnostics.yml']
permissions:
  contents: read
jobs:
  platform:
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      # Authenticate the signed catalog and stage the pinned lua.wasm fixture.
      # The repository-tracked artifact is the only source: no download
      # fallback, no network.  cryptography is pinned in a throwaway venv
      # because clean runners ship no third-party packages.
      - name: Install pinned catalog verification dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/floe-lua-venv"
          "$RUNNER_TEMP/floe-lua-venv/bin/pip" install cryptography==46.0.6
      # Assign the path before writing GITHUB_ENV so a preparation failure
      # aborts the step instead of exporting an empty FLOE_LUA_WASI.
      - name: Prepare the pinned Lua WASI fixture
        run: |
          floe_lua_wasi="$("$RUNNER_TEMP/floe-lua-venv/bin/python" FloeAgent/scripts/prepare_lua_qualification.py)" || exit 1
          echo "FLOE_LUA_WASI=$floe_lua_wasi" >> "$GITHUB_ENV"
      - name: Run real platform tests with owned-process diagnostics
        run: |
          python3 FloeAgent/scripts/run_test_with_diagnostics.py \
            --output-dir "$RUNNER_TEMP/platform-diagnostics" --timeout 1200 --stall-timeout 180 \
            -- swift test --package-path FloeAgent/Qualification --scratch-path FloeAgent/.build --force-resolved-versions --jobs 4
      - name: Keep logs and samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/platform-diagnostics
