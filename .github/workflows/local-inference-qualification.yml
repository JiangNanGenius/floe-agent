name: Local inference diagnostic
on:
  workflow_dispatch:
    inputs:
      dependency_profile:
        description: Dependency pin profile (accepted current profile with the in-repo mlx-swift-lm, or the frozen historical remote baseline)
        type: choice
        options:
          - current
          - historical-baseline
        default: current
  workflow_call:
    inputs:
      dependency_profile:
        description: Dependency pin profile (accepted current profile with the in-repo mlx-swift-lm, or the frozen historical remote baseline)
        type: string
        default: current
permissions:
  contents: read
concurrency:
  group: floe-local-inference-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qwen-host:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      DEPENDENCY_PROFILE: ${{ inputs.dependency_profile || 'current' }}
    defaults:
      run:
        working-directory: FloeAgent
    steps:
      - uses: actions/checkout@v5
      - name: Capture source and pristine dependency evidence
        run: |
          set -o pipefail
          EVIDENCE="$RUNNER_TEMP/LocalInferenceEvidence"
          mkdir -p "$EVIDENCE"
          git rev-parse HEAD > "$EVIDENCE/SOURCE-SHA.txt"
          printf '%s\n' "$DEPENDENCY_PROFILE" > "$EVIDENCE/dependency-profile.txt"
          # Capture the immutable inputs before the baseline step may patch the
          # working copy, so failure recovery keeps the original lock and manifest.
          cp Package.swift "$EVIDENCE/FloeAgent-Package.swift.original"
          cp project.yml "$EVIDENCE/FloeAgent-project.yml.original"
          cp Qualification/LocalInference/Package.resolved \
            "$EVIDENCE/LocalInference-Package.resolved.original.json"
      - name: Verify the committed current MLX declarations
        run: |
          set -o pipefail
          EVIDENCE="$RUNNER_TEMP/LocalInferenceEvidence"
          # Read-only. The committed manifest must be the accepted current
          # profile (remote mlx-swift revision + the reviewed in-repo
          # mlx-swift-lm package) before the historical step may rewrite a
          # working copy. The vendored manifest name, recorded upstream
          # revision and patch file are audited here too.
          python3 scripts/qualify_mlx_candidate.py check --profile current \
            --package-swift Package.swift | tee "$EVIDENCE/current-declarations.json"
          # The guard's own tests: declaration audit, historical patch scope and
          # lock comparison (read-only against the checkout).
          python3 -m unittest discover -s scripts/tests -p test_qualify_mlx_candidate.py
      - name: Prepare Metal compiler
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Apply frozen historical-baseline pins
        if: env.DEPENDENCY_PROFILE == 'historical-baseline'
        run: |
          set -o pipefail
          EVIDENCE="$RUNNER_TEMP/LocalInferenceEvidence"
          # The only write to the root manifest, and only in this reproducibility
          # step. The guard rejects any declaration that does not match the
          # accepted current profile (remote mlx-swift revision, reviewed local
          # mlx-swift-lm path) and refuses to change anything but those two
          # declaration regions.
          python3 scripts/qualify_mlx_candidate.py apply-patch \
            --package-swift Package.swift \
            --profile "$DEPENDENCY_PROFILE" \
            --diff "$EVIDENCE/baseline-manifest.diff" \
            --manifest "$EVIDENCE/baseline-apply.json"
          cp Package.swift "$EVIDENCE/FloeAgent-Package.swift.baseline"
          # Independent read-only confirmation of the patched working copy.
          python3 scripts/qualify_mlx_candidate.py check \
            --profile "$DEPENDENCY_PROFILE" \
            --package-swift Package.swift | tee "$EVIDENCE/historical-declarations.json"
      - name: Resolve dependencies with the real SwiftPM
        timeout-minutes: 15
        run: |
          set -o pipefail
          EVIDENCE="$RUNNER_TEMP/LocalInferenceEvidence"
          set +e
          swift package --package-path Qualification/LocalInference --scratch-path .build resolve \
            2>&1 | tee "$EVIDENCE/resolve.log"
          resolve_status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$resolve_status" > "$EVIDENCE/resolve-exit-code.txt"
          if [ -f Qualification/LocalInference/Package.resolved ]; then
            cp Qualification/LocalInference/Package.resolved \
              "$EVIDENCE/LocalInference-Package.resolved.resolved.json"
          fi
          # Verify the frozen lock even when resolve failed: the accepted
          # mlx-swift revision must be untouched and a historical-baseline run
          # must show exactly the two frozen revisions. A current run may omit
          # the local mlx-swift-lm pin (SwiftPM does not lock a path package);
          # any other added, removed or drifted pin fails here.
          set +e
          python3 scripts/qualify_mlx_candidate.py verify-lock --check \
            --profile "$DEPENDENCY_PROFILE" \
            --app-project project.yml \
            --baseline "$EVIDENCE/LocalInference-Package.resolved.original.json" \
            --resolved "$EVIDENCE/LocalInference-Package.resolved.resolved.json" \
            > "$EVIDENCE/lock-evaluation.json" 2>&1
          verify_status=$?
          set -e
          printf '%s\n' "$verify_status" > "$EVIDENCE/lock-verify-exit-code.txt"
          cat "$EVIDENCE/lock-evaluation.json"
          test "$resolve_status" -eq 0
          test "$verify_status" -eq 0
      - name: Build the actual Floe inference engine in a diagnostic host
        timeout-minutes: 25
        run: |
          set -o pipefail
          EVIDENCE="$RUNNER_TEMP/LocalInferenceEvidence"
          swift build --package-path Qualification/LocalInference --scratch-path .build --force-resolved-versions --jobs 4 \
            2>&1 | tee "$EVIDENCE/build.log"
      - name: Exercise the App's constrained batch48 and balanced batch96 profiles
        timeout-minutes: 25
        run: |
          set -o pipefail
          EVIDENCE="$RUNNER_TEMP/LocalInferenceEvidence"
          xcodebuild -version > "$EVIDENCE/toolchain.txt"
          bin_path=$(swift build --package-path Qualification/LocalInference --scratch-path .build --show-bin-path)
          # The transitive llama binary target needs its standard macOS rpath,
          # even though this diagnostic uses MLX and never loads a GGUF model.
          llama=$(find .build/artifacts -path '*/macos-arm64_x86_64/llama.framework' ! -path '*/__MACOSX/*' -print -quit)
          test -n "$llama"
          DYLD_FRAMEWORK_PATH="$(dirname "$llama")"
          export DYLD_FRAMEWORK_PATH
          # The production engine applies `MLXCompilePolicy` itself. Deliberately
          # clear the legacy environment switch so this run proves the guard is
          # environmentless instead of inheriting MLX_DISABLE_COMPILE.
          unset MLX_DISABLE_COMPILE
          test -z "${MLX_DISABLE_COMPILE:-}"
          # One LocalModelStore root, one snapshot download, reused by both
          # profiles inside a single host process. Weights are never uploaded as
          # an artifact and the existing single-download behavior is preserved.
          /usr/bin/time -l "$bin_path/FloeLocalInferenceQualification" "$RUNNER_TEMP/QwenSnapshot" \
            2>&1 | tee "$EVIDENCE/run.log"
          grep -q '"event":"download-complete"' "$EVIDENCE/run.log"
          grep -q '"event":"profile-complete".*"profile":"constrained-batch48"' "$EVIDENCE/run.log"
          grep -q '"event":"profile-complete".*"profile":"balanced-batch96"' "$EVIDENCE/run.log"
          test "$(grep -c '"event":"multi-chunk-verified"' "$EVIDENCE/run.log")" -eq 2
          grep -q '"event":"shutdown-complete"' "$EVIDENCE/run.log"
          grep -q '"event":"qualification-complete"' "$EVIDENCE/run.log"
          # Truthful compile-policy metadata: the process starts unapplied, the
          # engine applies the policy, and the environment switch stays absent.
          grep -q '"mlxCompilePolicy":"not-applied"' "$EVIDENCE/run.log"
          grep -q '"mlxCompilePolicy":"disabled-by-process-policy"' "$EVIDENCE/run.log"
          grep -q '"mlxCompilePolicyAppliedBeforeLoad":true' "$EVIDENCE/run.log"
          grep -q '"mlxDisableCompileEnvSet":false' "$EVIDENCE/run.log"
          test "$(grep -c '"mlxDisableCompileEnvSet":true' "$EVIDENCE/run.log" || true)" -eq 0
      - name: Preserve diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-inference-diagnostic-${{ inputs.dependency_profile || 'current' }}-${{ github.sha }}
          path: ${{ runner.temp }}/LocalInferenceEvidence/
          if-no-files-found: ignore
