name: Prepare existing App production push profile for Build 322

'on':
  workflow_dispatch:
    inputs:
      confirm:
        description: Exact confirmation prepare-existing-app-production-profile-322
        required: true
        type: string
      info_sha256:
        description: SHA256 of the real build322-host-info.plist private draft asset
        required: true
        type: string
      host_info_base64:
        description: Base64 of the real build322 host Info.plist; checked against info_sha256
        required: true
        type: string
      recipient_certificate_base64:
        description: Base64 of the public X509 certificate in canonical DER form; never a private key
        required: true
        type: string
      recipient_sha256:
        description: SHA256 of the decoded canonical DER recipient certificate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: floe-existing-app-production-profile-322
  cancel-in-progress: false

jobs:
  prepare-profile:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out this immutable operations commit on main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate confirmation, recipient, frozen entitlement and private host Info
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, plistlib, re, subprocess
          work = pathlib.Path(os.environ['RUNNER_TEMP']) / 'floe-apns322-work'
          work.mkdir(mode=0o700)
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          assert inputs['confirm'] == 'prepare-existing-app-production-profile-322', 'Exact confirmation required'
          for key in ('info_sha256', 'recipient_sha256'):
              assert re.fullmatch('[0-9a-f]{64}', inputs[key]), 'Invalid digest input'
          # Read the public certificate from the event file, not interpolated shell
          # or a printed step environment. Reject keys/trailing/concatenated data.
          certificate = base64.b64decode(''.join(inputs['recipient_certificate_base64'].split()), validate=True)
          assert 100 <= len(certificate) <= 65536, 'Unexpected public certificate size'
          assert hashlib.sha256(certificate).hexdigest() == inputs['recipient_sha256'], 'Recipient certificate SHA mismatch'
          der = work / 'recipient.der'; der.write_bytes(certificate)
          canonical = subprocess.run(['openssl', 'x509', '-inform', 'DER', '-in', str(der), '-outform', 'DER'],
                                     stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, check=True).stdout
          assert canonical == certificate, 'Input must be exactly one canonical public X509 DER certificate'
          subprocess.run(['openssl', 'x509', '-inform', 'DER', '-in', str(der), '-out', str(work / 'recipient.pem')],
                         stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True)
          source = '520afe01fce806fd5a3bdbe17f4d86f57f5384b3'
          tag_object = 'fc04ceb80e76a0dee2117e2cf5c2ddeadf63006f'
          def git(*args):
              return subprocess.check_output(['git', *args])
          assert git('rev-parse', 'refs/tags/v1.8.2').decode().strip() == tag_object, 'Frozen annotated tag drift'
          assert git('rev-parse', 'refs/tags/v1.8.2^{commit}').decode().strip() == source, 'Frozen App source drift'
          entitlement_path = 'FloeAgent/FloeApp/Entitlements/Floe.entitlements'
          frozen = git('show', source + ':' + entitlement_path)
          assert pathlib.Path(entitlement_path).read_bytes() == frozen, 'Operations source entitlement differs from frozen App'
          # The read-only token cannot read a private release draft. The caller
          # supplies the actual saved App metadata through the event, with its
          # independently verified package digest; no repository permission expands.
          host_info = base64.b64decode(inputs['host_info_base64'], validate=True)
          assert 0 < len(host_info) <= 1024 * 1024, 'Host Info size mismatch'
          assert hashlib.sha256(host_info).hexdigest() == inputs['info_sha256'], 'Host Info SHA mismatch'
          app = work / 'Floe.app'; app.mkdir()
          info_path = app / 'Info.plist'; info_path.write_bytes(host_info)
          info = plistlib.loads(info_path.read_bytes())
          assert (info['CFBundleIdentifier'], info['CFBundleShortVersionString'], info['CFBundleVersion'], info['FloeAPNsEnvironment']) == (
              'org.floeagent.ios', '1.8.2', '322', 'production'), 'Expected actual Build 322 production host Info'
          (work / 'preflight.json').write_text(json.dumps({
              'infoSHA256': inputs['info_sha256'], 'recipientSHA256': inputs['recipient_sha256'],
              'sourceEntitlementsSHA256': hashlib.sha256(frozen).hexdigest(), 'frozenAppSource': source,
              'frozenAppTag': 'v1.8.2', 'frozenAppTagObject': tag_object, 'state': 'inputs-verified'}))
          print('Private host Info, recipient and frozen entitlement verified.')
          PY

      - name: Prepare the same-certificate production profile using the existing helper
        id: prepare
        env:
          HOST_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ runner.temp }}/floe-apns322-work/AuthKey.p8
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, sys
          work = pathlib.Path(os.environ['RUNNER_TEMP']) / 'floe-apns322-work'
          assert (work / 'preflight.json').is_file(), 'Validated preflight required'
          original = base64.b64decode(''.join(os.environ['HOST_PROVISIONING_PROFILE'].split()), validate=True)
          expected = '1624041d1a27587f3b4adddd8762f388f7f633a7cb9b8f6806326ea61b5b6555'
          assert hashlib.sha256(original).hexdigest() == expected, 'Existing host profile SHA mismatch; inspect before retry'
          profile = work / 'Floe.mobileprovision'; profile.write_bytes(original)
          key = pathlib.Path(os.environ['ASC_PRIVATE_KEY_PATH'])
          key.write_bytes(base64.b64decode(''.join(os.environ['ASC_API_PRIVATE_KEY_BASE64'].split()), validate=True))
          profile.chmod(0o600); key.chmod(0o600)
          # AppleAPI inside this existing helper calls generate_asc_jwt.py.
          # Existing entitlement, expiry, team and exact same-certificate guards remain.
          result = subprocess.run([sys.executable, '-B', 'FloeAgent/scripts/ensure_apns_profile.py',
              '--profile', str(profile), '--app', str(work / 'Floe.app'), '--source-root', 'FloeAgent',
              '--report', str(work / 'helper-report.json')], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          if result.returncode:
              raise SystemExit('Existing profile helper failed; sanitized state is retained in the report.')
          report = json.loads((work / 'helper-report.json').read_text())
          assert report['state'] in ('production-profile-verified', 'existing-profile-verified'), 'Production profile not verified'
          assert hashlib.sha256(profile.read_bytes()).hexdigest() == report['profileSHA256'], 'Verified profile digest mismatch'
          export = pathlib.Path(os.environ['RUNNER_TEMP']) / 'floe-apns322-export'
          export.mkdir(mode=0o700, exist_ok=True)
          encrypted = work / 'Floe-production-profile.cms'
          subprocess.run(['openssl', 'cms', '-encrypt', '-binary', '-aes256', '-outform', 'DER',
                          '-in', str(profile), '-out', str(encrypted), str(work / 'recipient.pem')],
                         stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True)
          assert encrypted.stat().st_size > 0, 'Encrypted CMS missing'
          encrypted.replace(export / 'Floe-production-profile.cms')
          print('Verified production profile encrypted; no App build, signing, upload or submission.')
          PY

      - name: Retain a strictly allowlisted report on success or failure
        if: always()
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          work = pathlib.Path(os.environ['RUNNER_TEMP']) / 'floe-apns322-work'
          export = pathlib.Path(os.environ['RUNNER_TEMP']) / 'floe-apns322-export'
          export.mkdir(mode=0o700, exist_ok=True)
          report = {'opsSource': os.environ['GITHUB_SHA'], 'runID': os.environ['GITHUB_RUN_ID'],
                    'prepareOutcome': os.environ['PREPARE_OUTCOME'], 'noAppBuildSignUpload': True,
                    'noSecretUpdated': True, 'formal315Unchanged': True}
          for filename, keys in (
              ('preflight.json', ('state', 'infoSHA256', 'recipientSHA256', 'sourceEntitlementsSHA256', 'frozenAppSource', 'frozenAppTag', 'frozenAppTagObject')),
              ('helper-report.json', ('state', 'originalSHA256', 'profileSHA256', 'bundleID', 'created', 'profileReplaced', 'profileCreationAttempted',
                                      'enabledPushCapability', 'expiration', 'noCertificateCreated', 'noAppStoreSubmissionChanged'))):
              path = work / filename
              if path.is_file():
                  try:
                      raw = json.loads(path.read_text())
                  except (OSError, ValueError):
                      report[filename] = {'state': 'unreadable-private-report', 'inspectBeforeRetry': True}
                      continue
                  report[filename] = {key: raw[key] for key in keys if key in raw}
                  if raw.get('error'):
                      report['helperErrorPresent'] = True
                      safe_errors = {
                          'Expected one exact registered App identifier',
                          'Expected one existing distribution certificate; no certificate is created',
                          'Replacement profile changed the existing certificate binding',
                          'Profile does not grant a declared capability', 'Profile expired',
                          'Push capability read-back failed', 'Unexpected profile creation response',
                      }
                      if raw['error'] in safe_errors: report['helperError'] = raw['error']
                      status = re.search(r'Apple signing API returned HTTP ([0-9]{3})', str(raw['error']))
                      if status: report['appleHTTPStatus'] = status.group(1)
          cms = export / 'Floe-production-profile.cms'
          report['encryptedProfilePresent'] = cms.is_file()
          if cms.is_file():
              report['encryptedSHA256'] = hashlib.sha256(cms.read_bytes()).hexdigest()
              report['encryptedBytes'] = cms.stat().st_size
          (export / 'apns-profile-report.json').write_text(json.dumps(report, indent=2) + '\n')
          print('Redacted operations report saved.')
          PY

      - name: Upload encrypted CMS and redacted report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apns-production-profile-322-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/floe-apns322-export/Floe-production-profile.cms
            ${{ runner.temp }}/floe-apns322-export/apns-profile-report.json
          if-no-files-found: error
          retention-days: 1

      - name: Remove all plaintext temporary profile, credentials and public certificate files
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil
          shutil.rmtree(pathlib.Path(os.environ['RUNNER_TEMP']) / 'floe-apns322-work', ignore_errors=True)
          PY
