# TinyEMU Linux qualification (phase 2A) — engine-only CI.
#
# Scope: builds the pinned MIT TinyEMU RV64 embeddable core on Linux and
# boots real guests, recording transcripts + measurements as artifacts.
# This workflow NEVER touches release/TestFlight/production lanes and never
# modifies app code.
#
# Triggering:
#  - push to codex/feedback-linux touching engine/qualification files runs
#    the LEAN path: build + lifecycle regression + Stage A (2018 demo
#    parity). A few minutes; safe for every engine change.
#  - manual dispatch with run_debian=true additionally runs the Debian 13
#    riscv64 stages (B: modern kernel probe, C: userland on the 4.15
#    fallback kernel, D: APT/numpy/node, E: persistence). That downloads a
#    ~3 GB image and takes up to ~2 h, so it is opt-in.
#  - manual dispatch with run_smp=true additionally runs the FLOE-SMP
#    stages (S1..S3): host `--vcpu 1` vs `--vcpu 2` real boots with
#    per-hart FloeVMStats, the smp_host_test (capability/config probes,
#    actual per-hart execution threads, concurrent stats sampling, 9p IO,
#    stop+flush, single-hart control) and a repeated single vs dual
#    parallel performance baseline. This requires job A's dual-hart
#    engine; a failure here is a real, retained result (transcripts +
#    stats stay in the per-step artifacts), never a skipped check.
#    "Dual core works" is never inferred from nproc.
#
# Evidence rules (kept honest after a real false-positive incident):
#  - guest markers are only ever emitted by printf/echo *built at runtime*,
#    so the literal marker string never appears in the console input line
#    that the guest TTY echoes back. A marker hit therefore means the guest
#    executed something, not that it echoed the command. `floe_vm_host`
#    additionally refuses to run when the --until marker appears verbatim
#    in a scripted input line, so the rule is enforced, not just agreed.
#  - exit codes are captured from the real command (`cmd >log 2>&1; printf
#    'RC=%d\n' $?`); never from the tail of a pipeline.
#  - `--until` values use the same runtime-assembled markers, so the host
#    cannot exit on TTY echo.
#  - raw guest logs are exported to the host through the 9p share when the
#    stage mounts it, and all transcripts/timing/RC files are uploaded.
#  - on a timeout the host keeps the transcript and the final stats sample
#    (rc=2), so a failed boot leaves evidence instead of nothing.
name: tinyemu-linux-qualification

on:
  workflow_dispatch:
    inputs:
      run_debian:
        description: 'Also run the heavy Debian 13 riscv64 stages (B/C/D/E)'
        type: boolean
        default: false
      guest_runner:
        description: 'Cross-build FloeAgent/LinuxGuest, inject it into the rootfs image and boot it as PID1'
        type: boolean
        default: false
      apt_probe:
        description: 'Targeted path: prepare the rootfs, set the guest clock, then run one real sequential guest script (APT https update/install, numpy/node, Python HTTPS, fence hint probe). Skips A/B/C/E.'
        type: boolean
        default: false
      run_smp:
        description: 'Also run the FLOE-SMP stages (S1..S3): 1/2 hart real execution threads, per-hart stats, IO, stop+flush and a repeated single vs dual baseline'
        type: boolean
        default: false
  push:
    branches: [codex/feedback-linux]
    paths:
      - 'FloeAgent/ThirdParty/TinyEMU/**'
      - 'FloeAgent/Qualification/TinyEMULinux/**'
      - '.github/workflows/tinyemu-linux-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    # 150 min covered engine + demo stages; the opt-in SMP lane also builds a
    # full 4.15 riscv kernel from the pinned source (Stage S0), which is the
    # heavy part.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install the SMP build dependencies (riscv64 cross compiler)
        if: ${{ inputs.run_smp }}
        run: |
          sudo apt-get update -qq
          # gcc + binutils plus the cross libc headers: configure probes the
          # compiler by linking a trivial program, so a missing
          # libc6-dev-riscv64-cross would look like a broken compiler
          sudo apt-get install -y -qq gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross >/dev/null
          riscv64-linux-gnu-gcc --version | head -1
          riscv64-linux-gnu-objcopy --version | head -1

      - name: Fetch + verify pinned TinyEMU source and demo image
        run: |
          bash FloeAgent/ThirdParty/TinyEMU/fetch_source.sh work/src

      - name: Host GPL gate on engine build sources
        run: |
          bash FloeAgent/ThirdParty/TinyEMU/license_check.sh work/src/tinyemu-2019-12-21

      - name: Build embeddable core + qualification host (native Linux, no shims)
        run: |
          cd FloeAgent/Qualification/TinyEMULinux
          make -f ../../ThirdParty/TinyEMU/adapter/Makefile \
            TINYEMU_SRC=../../../work/src/tinyemu-2019-12-21 \
            PATCH_DIR=../../ThirdParty/TinyEMU/patches \
            BUILD=../../../work/build HOST_DIR=. -j"$(nproc)"
          ../../../work/build/floe_vm_host 2>&1 | head -2 || true

      - name: Lifecycle regression (repeatable create/destroy, failure cleanup, RAM-OOM, hostfwd)
        run: |
          IMG=work/src/diskimage-linux-riscv-2018-09-23
          mkdir -p work/share9p
          work/build/lifecycle_test "$IMG/bbl64.bin" "$IMG/kernel-riscv64.bin" \
            "$IMG/root-riscv64.bin" work/share9p | tee work/lifecycle.txt
          grep -a LIFECYCLE_OK work/lifecycle.txt

      - name: Stage A — boot pinned 2018 demo image (engine parity check)
        run: |
          IMG=work/src/diskimage-linux-riscv-2018-09-23
          mkdir -p work/share9p
          cat > work/stageA.txt <<'EOF'
          @15 uname -a
          @18 echo FLOE_STAGEA_OK_$((6*7))
          @21 mount -t 9p -o trans=virtio,version=9p2000.L /dev/root /mnt
          @24 echo ci-9p-proof > /mnt/floe_ci_9p.txt && printf 'FLOE_STAGEA_9P_%s\n' OK
          @27 ifconfig eth0 10.0.2.15 netmask 255.255.255.0 up
          @30 ping -c 1 -W 3 10.0.2.2 && printf 'FLOE_STAGEA_PING_%s\n' OK
          @34 printf 'FLOE_STAGEA_%s\n' DONE
          EOF
          sed -i 's/^ *//' work/stageA.txt
          set +e
          /usr/bin/time -v work/build/floe_vm_host \
            --bios $IMG/bbl64.bin --kernel $IMG/kernel-riscv64.bin \
            --disk $IMG/root-riscv64.bin --share /dev/root=work/share9p --net \
            --ram 128 --script work/stageA.txt \
            --transcript work/stageA-transcript.txt \
            --until FLOE_STAGEA_DONE --max-s 120 > work/stageA-stdout.txt 2> work/stageA-time.txt
          echo "stageA_rc=$?" | tee work/stageA-rc.txt
          set -e
          grep -a "Maximum resident" work/stageA-time.txt || true

      - name: Stage A assertions
        run: |
          grep -a FLOE_STAGEA_OK_42 work/stageA-transcript.txt
          grep -a FLOE_STAGEA_9P_OK work/stageA-transcript.txt
          test -f work/share9p/floe_ci_9p.txt
          grep -a FLOE_STAGEA_PING_OK work/stageA-transcript.txt

      - name: Fetch Debian 13 riscv64 nocloud image (record resolved SHA512)
        if: ${{ inputs.run_debian || inputs.apt_probe }}
        run: |
          cd work
          curl -fsSL --retry 3 -o SHA512SUMS https://cdimage.debian.org/cdimage/cloud/trixie/daily/latest/SHA512SUMS
          grep "nocloud-riscv64-daily.qcow2" SHA512SUMS | tee debian-sha512.txt
          curl -fL --retry 3 --max-time 1800 -o debian-13-nocloud-riscv64-daily.qcow2 \
            https://cdimage.debian.org/cdimage/cloud/trixie/daily/latest/debian-13-nocloud-riscv64-daily.qcow2
          sha512sum -c debian-sha512.txt
          ln -f debian-13-nocloud-riscv64-daily.qcow2 debian13-riscv64.qcow2
          sha256sum debian13-riscv64.qcow2 | tee debian-sha256.txt

      - name: Convert + extract Debian kernel/initrd/rootfs
        if: ${{ inputs.run_debian || inputs.apt_probe }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-utils parted >/dev/null
          qemu-img convert -O raw work/debian13-riscv64.qcow2 work/debian13-riscv64.raw
          LOOP=$(sudo losetup -fP --show work/debian13-riscv64.raw)
          sudo partprobe "$LOOP" || true
          sleep 2
          echo "LOOP=$LOOP" >> "$GITHUB_ENV"
          sudo parted -s "$LOOP" unit s print | tee work/partitions.txt
          # find the largest ext4 partition = rootfs
          ROOTP=$(sudo parted -s "$LOOP" print | awk '/ext4/{print $1}' | sort -n | tail -1)
          echo "ROOTP=$ROOTP" >> "$GITHUB_ENV"
          # drop ext4 features the 4.15 fallback kernel cannot mount (no-op if unset)
          sudo tune2fs -O ^orphan_file "${LOOP}p${ROOTP}" 2>&1 | tail -1 || true
          sudo tune2fs -O ^metadata_csum_seed "${LOOP}p${ROOTP}" 2>&1 | tail -1 || true
          sudo e2fsck -fy "${LOOP}p${ROOTP}" 2>&1 | tail -2 || true
          sudo tune2fs -l "${LOOP}p${ROOTP}" | grep -aE "Filesystem features|Block size|Filesystem state" \
            | tee work/debian-ext4-features.txt
          # The pinned 2018 bbl/demo kernel has NO EFI/GPT partition support (no
          # CONFIG_EFI_PARTITION strings in the image; a valid GPT disk is seen
          # only through the protective MBR, so root=/dev/vda1 panics with
          # "VFS: Unable to mount root fs on unknown-block(254,1)"). Verified
          # 2026-09-20 in run 35493987238 and locally with a GPT disk macOS
          # accepts (guest read-path md5 matched byte-for-byte). The fallback
          # route therefore boots the extracted ext4 partition as a whole-disk
          # image (root=/dev/vda), which this kernel mounts fine.
          # parted "unit s print" columns are Number Start End Size ...:
          # $2=start $3=end $4=size (sector units, "s" suffix).
          PART_INFO=$(sudo parted -s "$LOOP" unit s print | \
            awk -v p="$ROOTP" '$1==p {gsub(/s/,"",$2); gsub(/s/,"",$3); gsub(/s/,"",$4); print $2, $3, $4}')
          RSTART=$(echo "$PART_INFO" | cut -d' ' -f1)
          REND=$(echo "$PART_INFO" | cut -d' ' -f2)
          RSIZE=$(echo "$PART_INFO" | cut -d' ' -f3)
          echo "rootfs extent: start=$RSTART end=$REND size=$RSIZE sectors"
          { [ -n "$RSTART" ] && [ -n "$REND" ] && [ -n "$RSIZE" ]; } || {
            echo "cannot resolve rootfs extent from parted"; exit 1; }
          if [ "$((REND - RSTART + 1))" != "$RSIZE" ]; then
            echo "parted extent mismatch (end-start+1 != size); refusing to dd a truncated rootfs"
            exit 1
          fi
          dd if=work/debian13-riscv64.raw of=work/debian13-rootfs.img bs=512 \
             skip="$RSTART" count="$RSIZE" status=progress
          ls -la work/debian13-rootfs.img | tee work/debian-rootfs-size.txt
          # the extracted copy must be the same clean ext4 (not truncated)
          sudo e2fsck -fy work/debian13-rootfs.img 2>&1 | tail -2 | tee -a work/debian-rootfs-size.txt
          sudo tune2fs -l work/debian13-rootfs.img \
            | grep -aE "Filesystem features|Block size|Filesystem state" | tee work/debian-ext4-features.txt
          sudo chmod 644 work/debian13-rootfs.img
          mkdir -p work/mnt
          sudo mount -o ro "${LOOP}p${ROOTP}" work/mnt
          ls work/mnt/boot/ | tee work/boot-listing.txt
          # riscv64 Debian ships uncompressed vmlinux-* (no vmlinuz-*)
          sudo cp work/mnt/boot/vmlinux-* work/debian-vmlinuz 2>/dev/null || \
            sudo cp work/mnt/boot/vmlinuz-* work/debian-vmlinuz
          sudo cp work/mnt/boot/initrd.img-* work/debian-initrd
          sudo chmod 644 work/debian-vmlinuz work/debian-initrd
          grep -a -m1 "PRETTY_NAME" work/mnt/etc/os-release | tee work/debian-osrelease.txt
          sudo umount work/mnt

      - name: Guest runner (FLOE-EXEC) cross-build + inject into the rootfs image
        if: ${{ inputs.run_debian && inputs.guest_runner }}
        run: |
          if [ ! -f FloeAgent/LinuxGuest/runner/floe_exec.c ]; then
            echo "FloeAgent/LinuxGuest sources are not on this ref; skipping runner verification"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-riscv64-linux-gnu >/dev/null
          make -C FloeAgent/LinuxGuest/runner riscv64
          file FloeAgent/LinuxGuest/runner/floe-exec-riscv64 | tee work/floe-exec-file.txt
          grep -q "statically linked" work/floe-exec-file.txt
          sha256sum FloeAgent/LinuxGuest/runner/floe-exec-riscv64 | tee work/floe-exec-sha256.txt
          sudo bash FloeAgent/LinuxGuest/image/install-into-image.sh \
            --image work/debian13-rootfs.img \
            --runner FloeAgent/LinuxGuest/runner/floe-exec-riscv64 \
            --script FloeAgent/LinuxGuest/image/floe-guest-init 2>&1 | tee work/floe-exec-injected.txt
          echo "RUNNER_OK=true" >> "$GITHUB_ENV"

      - name: Stage B — Debian 13 modern kernel vs 2018 bbl (compatibility probe; failure is recorded, not hidden)
        if: ${{ inputs.run_debian }}
        run: |
          set +e
          timeout 90 work/build/floe_vm_host \
            --bios work/src/diskimage-linux-riscv-2018-09-23/bbl64.bin \
            --kernel work/debian-vmlinuz --initrd work/debian-initrd \
            --disk work/debian13-riscv64.raw \
            --ram 512 --cmdline "console=hvc0 root=/dev/vda${ROOTP} rw" \
            --transcript work/stageB-transcript.txt \
            --until FLOE_NEVER_MARKER --max-s 75 > work/stageB-stdout.txt 2>&1
          echo "stageB_rc=$?" | tee work/stageB-rc.txt
          wc -c work/stageB-transcript.txt | tee work/stageB-size.txt
          set -e

      - name: Stage C — Debian 13 userland on 4.15 fallback kernel (init=/bin/bash)
        if: ${{ inputs.run_debian }}
        run: |
          cat > work/stageC.txt <<'EOF'
          @20 mount -t proc proc /proc
          @23 mount -t sysfs sys /sys
          @26 mount -t devtmpfs dev /dev 2>/dev/null; mount -t devpts devpts /dev/pts 2>/dev/null
          @29 mkdir -p /floe; mount -t 9p -o trans=virtio,version=9p2000.L floe /floe
          @30 ip link set eth0 up 2>/dev/null; ip addr add 10.0.2.15/24 dev eth0 2>/dev/null; ip route add default via 10.0.2.2 2>/dev/null
          @34 echo nameserver 10.0.2.3 > /etc/resolv.conf
          @36 printf 'FLOE_STAGEC_ALIVE_%d\n' $((7*6))
          @39 cat /etc/os-release | head -2
          @42 python3 --version 2>&1 || printf 'FLOE_NO_PYTHON%s\n' 3
          @46 node --version 2>&1 || printf 'FLOE_NO_%s\n' NODE
          @50 sh -c 'sleep 2 & wait' && printf 'FLOE_FORK_WAIT_%s\n' OK
          @54 mkfifo /tmp/f && (cat /tmp/f & sleep 1; echo hi > /tmp/f; wait) && printf 'FLOE_PIPE_%s\n' OK
          @60 M1=FLOE_SIGNAL_; M2=OK; sh -c 'trap "echo $0$1" USR1; kill -USR1 $$' "$M1" "$M2"
          @64 python3 -c 'import pty; pty.spawn(["/bin/echo","FLOE_PTY_"+"OK"])' 2>&1 | tail -1
          @70 cat /etc/os-release > /floe/guest-os-release.txt 2>/dev/null; sync
          @72 printf 'FLOE_STAGEC_%s\n' DONE
          EOF
          sed -i 's/^ *//' work/stageC.txt
          set +e
          /usr/bin/time -v timeout 600 work/build/floe_vm_host \
            --bios work/src/diskimage-linux-riscv-2018-09-23/bbl64.bin \
            --kernel work/src/diskimage-linux-riscv-2018-09-23/kernel-riscv64.bin \
            --disk work/debian13-rootfs.img --rw \
            --ram 512 --cmdline "console=hvc0 root=/dev/vda rw init=/bin/bash" \
            --net --share floe=work/share9p \
            --script work/stageC.txt \
            --transcript work/stageC-transcript.txt \
            --until FLOE_STAGEC_DONE --max-s 560 > work/stageC-stdout.txt 2> work/stageC-time.txt
          echo "stageC_rc=$?" | tee work/stageC-rc.txt
          grep -a "Maximum resident" work/stageC-time.txt || true
          set -e

      - name: Stage C gate — only continue to D/E with real userland evidence
        if: ${{ always() && inputs.run_debian }}
        run: |
          C_RC=$(cat work/stageC-rc.txt 2>/dev/null | cut -d= -f2)
          if [ "$C_RC" = "0" ] && grep -qa FLOE_STAGEC_ALIVE_42 work/stageC-transcript.txt \
             && grep -qa FLOE_STAGEC_DONE work/stageC-transcript.txt; then
            echo "C_OK=true" >> "$GITHUB_ENV"
            echo "Stage C reached a real guest shell (rc=0, ALIVE+DONE markers)"
          else
            echo "C_OK=false" >> "$GITHUB_ENV"
            echo "Stage C did not reach the guest shell (rc=$C_RC); D/E are skipped and the"
            echo "panic/timeout transcript below is the recorded result, so no hour is wasted:"
            tail -c 1200 work/stageC-transcript.txt || true
          fi

      - name: Stage R — injected FLOE-EXEC runner as PID1, one real EXEC frame
        if: ${{ inputs.run_debian && inputs.guest_runner && env.C_OK == 'true' && env.RUNNER_OK == 'true' }}
        run: |
          python3 - <<'PY'
          import base64, struct
          def field(b):
              return struct.pack(">I", len(b)) + b
          fields = [b"/", b"", b"/bin/sh", b"-c", b"printf 'FLOE_RUNNER_%s\\n' OK"]
          payload = struct.pack(">I", len(fields)) + b"".join(field(f) for f in fields)
          frame = b"\x1eFLOE-EXEC runnerexec " + base64.b64encode(payload) + b"\n"
          with open("work/stageR.txt", "wb") as f:
              f.write(b"@30 " + frame)
          PY
          set +e
          work/build/floe_vm_host \
            --bios work/src/diskimage-linux-riscv-2018-09-23/bbl64.bin \
            --kernel work/src/diskimage-linux-riscv-2018-09-23/kernel-riscv64.bin \
            --disk work/debian13-rootfs.img --rw \
            --ram 512 --cmdline "console=hvc0 root=/dev/vda rw init=/usr/local/bin/floe-exec" \
            --net --share floe=work/share9p \
            --script work/stageR.txt --transcript work/stageR-transcript.txt \
            --until FLOE_RUNNER_OK --max-s 240 > work/stageR-stdout.txt 2>&1
          echo "stageR_rc=$?" | tee work/stageR-rc.txt
          set -e
          if grep -qa "Kernel panic" work/stageR-transcript.txt; then
            echo "Stage R: kernel panic while booting the injected runner"; exit 1
          fi
          grep -a FLOE_RUNNER_OK work/stageR-transcript.txt
          grep -a "FLOE-END runnerexec 0" work/stageR-transcript.txt

      - name: Targeted guest probe — real sequential APT/HTTPS/numpy/node + fence hint check
        if: ${{ inputs.run_debian || inputs.apt_probe }}
        run: |
          # The whole sequence runs as ONE guest shell script kept in the 9p
          # share, so the host sends exactly two console lines and real
          # commands follow each other instead of racing fixed @delays. Only
          # the script path is echoed by the console, so nothing in the
          # script's own output can be faked by an echo.
          date +%s > work/share9p/host-epoch.txt
          cat > work/share9p/qualify-insns.py <<'PY'
          import subprocess, sys
          WORDS = [("fence_tso", 0x8330000f), ("fence_tso_rs1_3", 0x8333000f),
                   ("fence_rw_rw", 0x0ff0000f), ("pause", 0x0100000f),
                   ("fence_plain", 0x0000000f), ("fence_i", 0x0000100f)]
          PROBE = """
          import ctypes, mmap, sys
          w = int(sys.argv[1], 16)
          insn = bytes([w & 0xff, (w >> 8) & 0xff, (w >> 16) & 0xff, (w >> 24) & 0xff])
          m = mmap.mmap(-1, 4096, prot=mmap.PROT_READ | mmap.PROT_WRITE | mmap.PROT_EXEC)
          m.write(insn + b"\\x67\\x80\\x00\\x00")
          fn = ctypes.CFUNCTYPE(None)(ctypes.addressof(ctypes.c_char.from_buffer(m)))
          fn()
          """
          for name, w in WORDS:
              r = subprocess.run([sys.executable, "-c", PROBE, hex(w)], capture_output=True)
              if r.returncode == 0:
                  status = "OK"
              elif r.returncode < 0:
                  status = "SIG%d" % (-r.returncode)
              else:
                  status = "FAIL_%d" % r.returncode
              print("FLOE_INSN_%s=%s" % (name, status))
          PY
          cat > work/share9p/qualify-apt.sh <<'SH'
          mount -t proc proc /proc 2>/dev/null
          mount -t sysfs sys /sys 2>/dev/null
          mount -t devtmpfs dev /dev 2>/dev/null
          ip link set eth0 up 2>/dev/null; ip addr add 10.0.2.15/24 dev eth0 2>/dev/null; ip route add default via 10.0.2.2 2>/dev/null
          rm -f /etc/resolv.conf; printf 'nameserver 10.0.2.3\n' > /etc/resolv.conf
          date -s "@$(cat /floe/host-epoch.txt)" >/dev/null 2>&1
          echo "FLOE_APTPROBE_TIME_$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ping -c1 -W3 10.0.2.2 >/dev/null 2>&1 && echo FLOE_APTPROBE_PING_OK
          python3 /floe/qualify-insns.py
          apt-get update > /floe/apt-update.log 2>&1; echo "FLOE_APT_UPDATE_RC_$?"
          tail -3 /floe/apt-update.log
          apt-get install -y --no-install-recommends python3-numpy nodejs > /floe/apt-install.log 2>&1; echo "FLOE_APT_INSTALL_RC_$?"
          tail -3 /floe/apt-install.log
          python3 -c 'import numpy; print("FLOE_NUMPY_OK", numpy.__version__)' 2>&1 | tail -1
          node -e 'console.log("FLOE_NODE_OK", process.version)' 2>&1 | tail -1
          python3 -c 'import urllib.request as u; print("FLOE_PY_HTTPS_" + str(u.urlopen("https://deb.debian.org/debian/dists/trixie/Release", timeout=30).status))' 2>&1 | tail -2
          dpkg -l > /floe/dpkg-listing.txt 2>/dev/null
          sync
          printf 'FLOE_APTPROBE_%s\n' DONE
          SH
          cat > work/aptprobe.txt <<'EOF'
          @20 mount -t proc proc /proc; mount -t sysfs sys /sys; mount -t devtmpfs dev /dev 2>/dev/null; mkdir -p /floe; mount -t 9p -o trans=virtio,version=9p2000.L floe /floe
          @24 sh /floe/qualify-apt.sh
          EOF
          sed -i 's/^ *//' work/aptprobe.txt
          set +e
          timeout 2700 work/build/floe_vm_host \
            --bios work/src/diskimage-linux-riscv-2018-09-23/bbl64.bin \
            --kernel work/src/diskimage-linux-riscv-2018-09-23/kernel-riscv64.bin \
            --disk work/debian13-rootfs.img --rw \
            --ram 768 --cmdline "console=hvc0 root=/dev/vda rw init=/bin/bash" \
            --net --share floe=work/share9p \
            --script work/aptprobe.txt --transcript work/stageD-transcript.txt \
            --until FLOE_APTPROBE_DONE --max-s 2600 > work/stageD-stdout.txt 2>&1
          echo "stageD_rc=$?" | tee work/stageD-rc.txt
          set -e
          echo "--- guest probe markers ---"
          for m in FLOE_APTPROBE_DONE FLOE_APT_UPDATE_RC_0 FLOE_APT_INSTALL_RC_0 FLOE_NUMPY_OK FLOE_NODE_OK FLOE_PY_HTTPS_200 FLOE_INSN_fence_tso=OK; do
            if grep -qa "$m" work/stageD-transcript.txt; then echo "seen: $m"; else echo "MISSING: $m"; fi
          done
          # A green workflow must not be readable as "Linux works": fail the
          # step unless the real capability markers landed.
          for m in FLOE_APTPROBE_DONE FLOE_APT_UPDATE_RC_0 FLOE_APT_INSTALL_RC_0 FLOE_NUMPY_OK FLOE_NODE_OK FLOE_INSN_fence_tso=OK; do
            grep -qa "$m" work/stageD-transcript.txt || { echo "targeted probe failed: $m missing"; exit 1; }
          done

      - name: Stage E — file persistence across reboot (write-through disk)
        if: ${{ inputs.run_debian && env.C_OK == 'true' }}
        run: |
          cat > work/stageE1.txt <<'EOF'
          @20 mount -t proc proc /proc
          @24 echo "persist-$(date +%s)" > /floe_persist.txt; sync; printf 'FLOE_E1_%s\n' WRITTEN
          @30 printf 'FLOE_STAGEE1_%s\n' DONE
          EOF
          sed -i 's/^ *//' work/stageE1.txt
          cat > work/stageE2.txt <<'EOF'
          @20 mount -t proc proc /proc
          @23 mkdir -p /floe; mount -t 9p -o trans=virtio,version=9p2000.L floe /floe
          @24 cat /floe_persist.txt > /floe/persist-readback.txt 2>&1 && printf 'FLOE_PERSIST_%s\n' OK || printf 'FLOE_PERSIST_%s\n' FAIL
          @28 printf 'FLOE_STAGEE2_%s\n' DONE
          EOF
          sed -i 's/^ *//' work/stageE2.txt
          set +e
          timeout 300 work/build/floe_vm_host \
            --bios work/src/diskimage-linux-riscv-2018-09-23/bbl64.bin \
            --kernel work/src/diskimage-linux-riscv-2018-09-23/kernel-riscv64.bin \
            --disk work/debian13-rootfs.img --rw \
            --ram 512 --cmdline "console=hvc0 root=/dev/vda rw init=/bin/bash" \
            --script work/stageE1.txt --transcript work/stageE1-transcript.txt \
            --until FLOE_STAGEE1_DONE --max-s 240 > /dev/null 2>&1
          echo "stageE1_rc=$?"
          timeout 300 work/build/floe_vm_host \
            --bios work/src/diskimage-linux-riscv-2018-09-23/bbl64.bin \
            --kernel work/src/diskimage-linux-riscv-2018-09-23/kernel-riscv64.bin \
            --disk work/debian13-rootfs.img --rw \
            --ram 512 --cmdline "console=hvc0 root=/dev/vda rw init=/bin/bash" \
            --net --share floe=work/share9p \
            --script work/stageE2.txt --transcript work/stageE2-transcript.txt \
            --until FLOE_STAGEE2_DONE --max-s 240 > /dev/null 2>&1
          echo "stageE2_rc=$?"
          set -e
          grep -a FLOE_PERSIST work/stageE2-transcript.txt || true

      # ------------------------------------------------------------------
      # Stage S0 (opt-in, run_smp): build the dual-hart guest boot pair from
      # the pinned riscv-pk / riscv-linux revisions in the cloud. This is
      # the only place a real CONFIG_SMP=y, NR_CPUS=2 kernel is produced;
      # the kernel source build never runs on the local Mac. The raw
      # bbl64.bin (objcopy -O binary, ELF entry/lowest LOAD verified
      # 0x80000000) and the raw kernel Image are uploaded immediately,
      # before any boot stage can fail.
      # ------------------------------------------------------------------
      - name: Stage S0 — build the dual-hart SMP kernel + raw boot loader (pinned source)
        if: ${{ inputs.run_smp }}
        run: |
          set -euo pipefail
          mkdir -p work/smp work/smp-upstream
          bash FloeAgent/ThirdParty/TinyEMU/guest-image/build-kernel-bbl.sh \
            --out work/smp-upstream --rebuild --smp --jobs "$(nproc)" \
            2>&1 | tee work/smp/smp-kernel-rebuild.log
          U=work/smp-upstream
          test -f "$U/boot/bbl64.bin" || { echo "raw bbl missing"; exit 1; }
          test -f "$U/boot/kernel-riscv64.bin" || { echo "raw kernel missing"; exit 1; }
          for f in bbl64.bin kernel-riscv64.bin; do
            magic=$(dd if="$U/boot/$f" bs=1 count=4 2>/dev/null | od -An -tx1 | tr -d ' \n')
            if [ "$magic" = "7f454c46" ]; then
              echo "$f is an ELF file; TinyEMU cannot load it as a boot file"
              exit 1
            fi
          done
          grep -q '^CONFIG_SMP=y$' "$U/riscv-linux-src/.config" || { echo "CONFIG_SMP=y missing"; exit 1; }
          grep -q '^CONFIG_NR_CPUS=2$' "$U/riscv-linux-src/.config" || { echo "CONFIG_NR_CPUS=2 missing"; exit 1; }
          grep -q 'mentry.o relocates disabled_hart_mask' "$U/SMP-BUILD.txt" || { echo "firmware multi-hart evidence missing"; exit 1; }
          mkdir -p work/smp/boot
          cp "$U/boot/bbl64.bin" "$U/boot/kernel-riscv64.bin" "$U/boot/boot-files.json" work/smp/boot/
          cp "$U/SMP-BUILD.txt" "$U/boot/BOOT-PAIR.txt" work/smp/boot/
          {
            printf 'STAGE_S0_SHA256\n'
            sha256sum work/smp/boot/bbl64.bin work/smp/boot/kernel-riscv64.bin
            printf 'kernel config sha256=%s\n' "$(sha256sum "$U/riscv-linux-src/.config" | cut -d' ' -f1)"
            grep -E '^CONFIG_(SMP|NR_CPUS)=' "$U/riscv-linux-src/.config"
            printf 'kernel version ident: %s\n' "$(strings -a work/smp/boot/kernel-riscv64.bin | grep -m1 '^Linux version' || true)"
          } | tee work/smp/smp-boot-pair.txt
          bash -c 'grep -q . work/smp/smp-boot-pair.txt'

      - name: Upload the Stage S0 SMP boot pair (immediate, before any boot test)
        if: ${{ always() && inputs.run_smp }}
        uses: actions/upload-artifact@v4
        with:
          name: smp-boot-pair-${{ github.run_id }}
          path: |
            work/smp/boot/
            work/smp/smp-boot-pair.txt
            work/smp/smp-kernel-rebuild.log
            work/smp-upstream/*.log
            work/smp-upstream/riscv-pk-src/config.log
            work/smp-upstream/riscv-linux-src/.config
          if-no-files-found: warn
          retention-days: 30

      # ------------------------------------------------------------------
      # Stage S (opt-in, run_smp): FLOE-SMP qualification.
      # A failure in any S stage is a real result and is kept in the
      # per-step artifacts (transcripts + stats); nothing here is skipped
      # silently and dual-hart success is never inferred from nproc.
      # Coverage boundary: these stages verify the host-visible SMP
      # contract (capability queries, real per-hart execution threads,
      # stats sampling, guest IO under two harts, stop+flush destroy).
      # Engine-internal LR/SC/AMO + shared-memory adversarial tests live in
      # job A's FloeTinyEMUTests (Swift target, not built in this
      # engine-only lane); do not read a green S run as covering them.
      # ------------------------------------------------------------------
      - name: Build the SMP host qualification test (links the freshly built engine)
        if: ${{ always() && inputs.run_smp }}
        run: |
          set -euo pipefail
          cd FloeAgent/Qualification/TinyEMULinux
          cc -O2 -Wall -D_FILE_OFFSET_BITS=64 -D_LARGEFILE_SOURCE -D_GNU_SOURCE \
             -DCONFIG_VERSION=\"2019-12-21\" -DCONFIG_SLIRP -DCONFIG_RISCV_MAX_XLEN=64 \
             -I../../../work/build -I../../../work/src/tinyemu-2019-12-21 \
             -I../../ThirdParty/TinyEMU/adapter \
             -c -o ../../../work/build/smp_host_test.o smp_host_test.c
          cc -o ../../../work/build/smp_host_test ../../../work/build/smp_host_test.o \
             ../../../work/build/libfloevm.a -lm -lpthread -lrt
          file ../../../work/build/smp_host_test

      - name: Stage S1 — host --vcpu 1 vs 2 real boots with per-hart stats
        if: ${{ always() && inputs.run_smp }}
        run: |
          set -euo pipefail
          IMG=work/src/diskimage-linux-riscv-2018-09-23
          mkdir -p work/smp
          cat > work/smp/host-script.txt <<'EOF'
          @8 uname -a
          @12 echo FLOE_SMP_HOST_A_$((6*7))
          @18 printf 'FLOE_SMP_HOST_%s\n' DONE
          EOF
          sed -i 's/^ *//' work/smp/host-script.txt
          for v in 1 2; do
            set +e
            work/build/floe_vm_host --bios "$IMG/bbl64.bin" --kernel "$IMG/kernel-riscv64.bin" \
              --disk "$IMG/root-riscv64.bin" --ram 128 --vcpu "$v" \
              --script work/smp/host-script.txt \
              --transcript "work/smp/host-vcpu$v-transcript.txt" \
              --stats-file "work/smp/host-vcpu$v-stats.jsonl" --stats-interval 2 \
              --until FLOE_SMP_HOST_DONE --max-s 150 > "work/smp/host-vcpu$v-stdout.txt" 2>&1
            echo "host_vcpu${v}_rc=$?" | tee -a "work/smp/host-vcpu$v-rc.txt"
            set -e
          done
          python3 - <<'PY'
          import json, sys
          problems = []
          for v in ("1", "2"):
              path = f"work/smp/host-vcpu{v}-stats.jsonl"
              samples = []
              try:
                  with open(path, "r", encoding="utf-8") as handle:
                      for line in handle:
                          line = line.strip()
                          if line:
                              samples.append(json.loads(line))
              except OSError as exc:
                  print(f"stats file missing/illegal: {path}: {exc}")
                  sys.exit(1)
              if not samples:
                  print(f"no stats samples in {path}")
                  sys.exit(1)
              final = [s for s in samples if s.get("event") in ("marker", "poweroff", "timeout")]
              last = final[-1] if final else samples[-1]
              host_threads = max(s.get("host_threads", 0) for s in samples)
              hart1 = max((s.get("hart_insns") or [0, 0])[1] for s in samples)
              print(f"vcpu={v}: host_threads={host_threads} hart1_max_insns={hart1} "
                    f"last_event={last.get('event')} t={last.get('t')}")
              if v == "1":
                  if host_threads != 0:
                      problems.append("vcpu=1 must keep inline interpretation (host_threads=0)")
              else:
                  if host_threads != 2:
                      problems.append("vcpu=2 must spawn one host thread per hart (host_threads=2)")
                  if hart1 <= 0:
                      problems.append("vcpu=2 hart 1 must retire instructions (actual execution thread)")
          if problems:
              for item in problems:
                  print("SMP STATS GATE FAILED:", item)
              sys.exit(1)
          print("SMP stats gate: host_threads 0 (vcpu=1) / 2 (vcpu=2); hart 1 really executes")
          PY
          # Actual execution threads are necessary but not sufficient: the
          # vcpu=2 guest must really boot and reach the runtime-assembled
          # marker. A missing marker is a retained failure, not a skip.
          if ! grep -qa FLOE_SMP_HOST_A_42 work/smp/host-vcpu2-transcript.txt \
             || ! grep -qa FLOE_SMP_HOST_DONE work/smp/host-vcpu2-transcript.txt; then
            echo "SMP BOOT GATE FAILED: the vcpu=2 guest produced no marker"
            echo "(transcript bytes: $(wc -c < work/smp/host-vcpu2-transcript.txt))"
            echo "The per-hart stats above show the threads; the guest-visible boot"
            echo "under two harts is the gap. Transcript and stats are uploaded."
            exit 1
          fi
          grep -qa FLOE_SMP_HOST_A_42 work/smp/host-vcpu1-transcript.txt \
            || { echo "single-hart control boot did not reach its marker"; exit 1; }
          echo "SMP boot gate: vcpu=1 control and vcpu=2 guest both reached their markers"

      - name: Upload Stage S1 evidence (per-step, immediate)
        if: ${{ always() && inputs.run_smp }}
        uses: actions/upload-artifact@v4
        with:
          name: smp-host-stage-s1-${{ github.run_id }}
          path: work/smp/host-vcpu*
          if-no-files-found: warn
          retention-days: 30

      - name: Stage S2 — smp_host_test (threads, stats locking, 9p IO, stop+flush, single control)
        if: ${{ always() && inputs.run_smp }}
        run: |
          set -euo pipefail
          IMG=work/src/diskimage-linux-riscv-2018-09-23
          mkdir -p work/smp/share
          set +e
          work/build/smp_host_test --bios "$IMG/bbl64.bin" --kernel "$IMG/kernel-riscv64.bin" \
            --disk "$IMG/root-riscv64.bin" --share floe=work/smp/share --ram 128 \
            --dual-max-s 150 \
            --summary work/smp/smp-test-summary.json \
            --transcript work/smp/smp-test-transcript.txt \
            > work/smp/smp-test-stdout.txt 2>&1
          rc=$?
          set -e
          echo "smp_host_test_rc=$rc" | tee work/smp/smp-test-rc.txt
          tail -c 3000 work/smp/smp-test-stdout.txt
          if [ "$rc" != 0 ]; then
            echo "SMP host test failed (rc=$rc); summary/transcript/9p state are kept"
            exit 1
          fi
          grep -a "SMP_HOST_OK" work/smp/smp-test-stdout.txt

      - name: Upload Stage S2 evidence (per-step, immediate)
        if: ${{ always() && inputs.run_smp }}
        uses: actions/upload-artifact@v4
        with:
          name: smp-host-stage-s2-${{ github.run_id }}
          path: |
            work/smp/smp-test-*.*
            work/smp/share/
          if-no-files-found: warn
          retention-days: 30

      - name: Stage S3 — single vs dual parallel performance repeated baseline
        if: ${{ always() && inputs.run_smp }}
        run: |
          set -euo pipefail
          IMG=work/src/diskimage-linux-riscv-2018-09-23
          cat > work/smp/perf-script.txt <<'EOF'
          @10 dd if=/dev/zero of=/dev/null bs=64k count=2048 2>&1 | tail -1
          @22 printf 'FLOE_SMP_PERF_%s\n' DONE
          EOF
          sed -i 's/^ *//' work/smp/perf-script.txt
          for v in 1 2; do
            for r in 1 2 3; do
              set +e
              work/build/floe_vm_host --bios "$IMG/bbl64.bin" --kernel "$IMG/kernel-riscv64.bin" \
                --disk "$IMG/root-riscv64.bin" --ram 128 --vcpu "$v" \
                --script work/smp/perf-script.txt \
                --transcript "work/smp/perf-vcpu$v-r$r-transcript.txt" \
                --stats-file "work/smp/perf-vcpu$v-r$r-stats.jsonl" --stats-interval 1 \
                --until FLOE_SMP_PERF_DONE --max-s 90 \
                > "work/smp/perf-vcpu$v-r$r-stdout.txt" 2>&1
              echo "perf_vcpu${v}_r${r}_rc=$?" >> "work/smp/perf-vcpu$v-r$r-rc.txt"
              set -e
            done
          done
          python3 - <<'PY' | tee work/smp/smp-perf-baseline.txt
          import json, statistics
          runs = []
          problems = []
          for v in (1, 2):
              for r in (1, 2, 3):
                  base = f"work/smp/perf-vcpu{v}-r{r}"
                  samples = []
                  with open(base + "-stats.jsonl", "r", encoding="utf-8") as handle:
                      for line in handle:
                          line = line.strip()
                          if line:
                              samples.append(json.loads(line))
                  host_threads = max(s.get("host_threads", 0) for s in samples)
                  hart1 = max((s.get("hart_insns") or [0, 0])[1] for s in samples)
                  hart0 = max((s.get("hart_insns") or [0, 0])[0] for s in samples)
                  final = [s for s in samples if s.get("event") in ("marker", "poweroff", "timeout")]
                  last = final[-1] if final else samples[-1]
                  try:
                      with open(base + "-transcript.txt", "r", errors="replace") as handle:
                          transcript = handle.read()
                  except OSError:
                      transcript = ""
                  booted = "FLOE_SMP_PERF_DONE" in transcript
                  runs.append({
                      "vcpu": v, "repeat": r,
                      "guest_booted": booted,
                      "wall_s_to_final_event": last.get("t"),
                      "final_event": last.get("event"),
                      "host_threads": host_threads,
                      "hart0_max_insns": hart0,
                      "hart1_max_insns": hart1,
                  })
                  if v == 2:
                      if host_threads != 2:
                          problems.append(f"run vcpu=2 r{r}: host_threads={host_threads}, expected 2")
                      if hart1 <= 0:
                          problems.append(f"run vcpu=2 r{r}: hart 1 retired no instructions")
          medians = {}
          for v in (1, 2):
              booted = [x for x in runs if x["vcpu"] == v and x["guest_booted"]]
              if booted:
                  medians[str(v)] = {
                      "booted_runs": len(booted),
                      "median_wall_s": statistics.median([x["wall_s_to_final_event"] for x in booted]),
                      "median_hart0_insns": statistics.median([x["hart0_max_insns"] for x in booted]),
                      "median_hart1_insns": statistics.median([x["hart1_max_insns"] for x in booted]),
                  }
              else:
                  medians[str(v)] = {
                      "booted_runs": 0,
                      "note": "no guest-booted run; the workload comparison is not measurable",
                  }
          payload = {
              "tool": "floe_vm_host --vcpu + FloeVMStats",
              "runs": runs,
              "medians": medians,
              "speedup_claim": None,
              "note": ("Repeated baseline only. The pinned 4.15 demo kernel is UP "
                       "(CONFIG_SMP is not set), so a vcpu=2 guest cannot use the "
                       "second hart for the workload; no parallel speedup is claimed "
                       "from these numbers. Reproduce after an SMP guest kernel lands. "
                       "Dual-hart execution is proven by host_threads/per-hart insns, "
                       "never by host nproc."),
          }
          with open("work/smp/smp-perf-baseline.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
              handle.write("\n")
          for row in runs:
              print(f"vcpu={row['vcpu']} r{row['repeat']}: booted={row['guest_booted']} "
                    f"wall={row['wall_s_to_final_event']}s host_threads={row['host_threads']} "
                    f"hart0={row['hart0_max_insns']} hart1={row['hart1_max_insns']}")
          print("medians:", json.dumps(medians))
          if problems:
              for item in problems:
                  print("SMP PERF GATE FAILED:", item)
              raise SystemExit(1)
          print("SMP perf gate: every vcpu=2 run had 2 host threads and hart 1 executing")
          PY
          python3 -m json.tool work/smp/smp-perf-baseline.json >/dev/null && echo "smp-perf-baseline.json valid"

      - name: Upload Stage S3 evidence (per-step, immediate)
        if: ${{ always() && inputs.run_smp }}
        uses: actions/upload-artifact@v4
        with:
          name: smp-host-stage-s3-${{ github.run_id }}
          path: work/smp/perf-vcpu*
          if-no-files-found: warn
          retention-days: 30

      # ------------------------------------------------------------------
      # Stage S4 (opt-in, run_smp): boot the freshly built SMP kernel/bbl
      # pair (Stage S0) with the pinned demo rootfs. The vcpu=2 run must
      # show guest-visible two-CPU evidence (/proc/cpuinfo count produced
      # by the guest itself), the exact kernel version ident of the boot
      # pair, real per-hart execution and parallel 9p I/O; vcpu=1 is the
      # control. A failure here is a retained result: transcripts, stats
      # and the boot-pair hashes are uploaded.
      # ------------------------------------------------------------------
      - name: Stage S4 — real dual-hart Linux boot on the fresh SMP pair (vcpu 1 vs 2)
        if: ${{ always() && inputs.run_smp }}
        run: |
          set -euo pipefail
          IMG=work/src/diskimage-linux-riscv-2018-09-23
          BOOT=work/smp/boot
          test -s "$BOOT/bbl64.bin" || { echo "Stage S0 produced no boot pair; S4 cannot run"; exit 1; }
          test -s "$BOOT/kernel-riscv64.bin" || { echo "Stage S0 produced no boot pair; S4 cannot run"; exit 1; }
          test -s "$BOOT/BOOT-PAIR.txt" || { echo "Stage S0 boot-pair provenance missing"; exit 1; }
          mkdir -p work/smp/share
          # init=/bin/sh bypasses the 2018 demo's init scripts: they are not
          # the subject of this stage and their service startup is what hangs
          # when a second hart exists (measured on the pinned UP kernel: a
          # userland spin at one fixed PC; S1 keeps that retained result).
          cat > work/smp/smpboot-script.txt <<'EOF'
          @8 printf 'FLOE_SMP_PROBE_%s\n' BUILTIN
          @10 : > /tmp/floe-probe.txt && printf 'FLOE_SMP_PROBE_%s\n' WRITE
          @12 /bin/true && printf 'FLOE_SMP_PROBE_%s\n' FORKEXEC
          @16 mount -t proc proc /proc
          @14 mkdir -p /mnt
          @16 mount -t 9p -o trans=virtio,version=9p2000.L /dev/root /mnt 2>/dev/null || true
          @20 grep -c '^hart' /proc/cpuinfo > /mnt/smp-cpu-count.txt
          @22 printf 'FLOE_SMP_CPUS_%s\n' "$(cat /mnt/smp-cpu-count.txt)"
          @26 uname -a > /mnt/smp-uname.txt; printf 'FLOE_SMP_%s\n' UNAME
          @32 sh -c 'dd if=/dev/zero of=/mnt/smp-io0.bin bs=64k count=192 2>/dev/null & dd if=/dev/zero of=/mnt/smp-io1.bin bs=64k count=192 2>/dev/null & wait' && printf 'FLOE_SMP_PARI%s\n' O_OK
          @42 sh -c 'sync; md5sum /mnt/smp-io0.bin /mnt/smp-io1.bin > /mnt/smp-io-md5.txt 2>&1'; printf 'FLOE_SMP_SY%s\n' NC_OK
          @52 printf 'FLOE_SMP_BOOT_%s\n' DONE
          EOF
          sed -i 's/^ *//' work/smp/smpboot-script.txt
          for v in 1 2; do
            set +e
            /usr/bin/time -v work/build/floe_vm_host \
              --bios "$BOOT/bbl64.bin" --kernel "$BOOT/kernel-riscv64.bin" \
              --disk "$IMG/root-riscv64.bin" --ram 128 --vcpu "$v" \
              --cmdline "console=hvc0 root=/dev/vda rw init=/bin/sh" \
              --share /dev/root=work/smp/share \
              --script work/smp/smpboot-script.txt \
              --transcript "work/smp/smpboot-vcpu$v-transcript.txt" \
              --stats-file "work/smp/smpboot-vcpu$v-stats.jsonl" --stats-interval 2 \
              --until FLOE_SMP_BOOT_DONE --max-s 240 \
              > "work/smp/smpboot-vcpu$v-stdout.txt" 2> "work/smp/smpboot-vcpu$v-time.txt"
            echo "smpboot_vcpu${v}_rc=$?" | tee -a "work/smp/smpboot-vcpu$v-rc.txt"
            set -e
            cp work/smp/share/smp-uname.txt "work/smp/smpboot-vcpu$v-uname.txt" 2>/dev/null || true
          done
          python3 - <<'PY'
          import json, os, re, sys

          problems = []
          pair = {}
          with open("work/smp/smpboot-vcpu2-transcript.txt", "r", errors="replace") as handle:
              smp_lines = [l.strip() for l in handle
                           if "smp" in l.lower() or "Brought up" in l or "CPU" in l]
          print("vcpu=2 kernel SMP lines:", "; ".join(smp_lines[:6]) or "(none)")
          with open("work/smp/boot/BOOT-PAIR.txt", "r", errors="replace") as handle:
              for line in handle:
                  if line.startswith("kernel version ident:"):
                      pair["kernel_ident"] = line.split(":", 1)[1].strip()
                  if line.startswith("bbl64.bin "):
                      pair["bbl_sha256"] = line.split("sha256=")[1].strip()
                  if line.startswith("kernel-riscv64.bin "):
                      pair["kernel_sha256"] = line.split("sha256=")[1].strip()
          print("boot pair:", json.dumps(pair))
          if not pair.get("kernel_ident"):
              problems.append("the boot pair records no kernel version ident")

          for v in ("1", "2"):
              base = f"work/smp/smpboot-vcpu{v}"
              samples = []
              with open(base + "-stats.jsonl", "r", errors="replace") as handle:
                  for line in handle:
                      line = line.strip()
                      if line:
                          samples.append(json.loads(line))
              with open(base + "-transcript.txt", "r", errors="replace") as handle:
                  transcript = handle.read()
              host_threads = max(s.get("host_threads", 0) for s in samples)
              hart0 = max((s.get("hart_insns") or [0, 0])[0] for s in samples)
              hart1 = max((s.get("hart_insns") or [0, 0])[1] for s in samples)
              final = [s for s in samples if s.get("event") in ("marker", "poweroff", "timeout")]
              last = final[-1] if final else samples[-1]
              print(f"vcpu={v}: host_threads={host_threads} hart0={hart0} hart1={hart1} "
                    f"last_event={last.get('event')} t={last.get('t')}")
              if "FLOE_SMP_BOOT_DONE" not in transcript:
                  problems.append(f"vcpu={v}: guest never reached its DONE marker")
              if "FLOE_SMP_PARIO_OK" not in transcript:
                  problems.append(f"vcpu={v}: parallel 9p I/O marker missing")
              ident_token = ""
              if pair.get("kernel_ident"):
                  parts = pair["kernel_ident"].split()
                  if len(parts) >= 3:
                      ident_token = parts[2]   # e.g. 4.15.0-ga3b1e7acc-dirty
              uname_path = f"work/smp/smpboot-vcpu{v}-uname.txt"
              guest_uname = ""
              if os.path.isfile(uname_path):
                  guest_uname = open(uname_path, "r", errors="replace").read().strip()
              print(f"vcpu={v}: guest uname: {guest_uname[:100] or '(missing)'}")
              if ident_token and ident_token not in guest_uname:
                  problems.append(f"vcpu={v}: the guest's own uname does not name the boot pair's "
                                  f"kernel ({ident_token})")
              if v == "2":
                  # the probe sequence localizes a dual-hart stall: a builtin
                  # and a redirection (write syscall) need no fork, while
                  # running any external command does
                  for probe in ("BUILTIN", "WRITE", "FORKEXEC"):
                      if f"FLOE_SMP_PROBE_{probe}" not in transcript:
                          problems.append(f"vcpu=2: guest probe {probe} missing")
                  if "FLOE_SMP_PROBE_FORKEXEC" in transcript and "FLOE_SMP_CPUS_2" not in transcript:
                      problems.append("vcpu=2: fork/exec worked but the guest reported fewer than 2 CPUs")
                  if "FLOE_SMP_PROBE_BUILTIN" in transcript and "FLOE_SMP_PROBE_FORKEXEC" not in transcript:
                      print("vcpu=2 diagnosis: shell builtins and write syscalls ran, "
                            "the first fork/exec did not -> dual-hart process creation stalls")
                  print("vcpu=2 transcript tail:",
                        [l for l in open(base + "-transcript.txt", errors="replace").read().splitlines()][-4:])
                  if "FLOE_SMP_CPUS_2" not in transcript:
                      problems.append("vcpu=2: the guest kernel did not report 2 CPUs")
                  if host_threads != 2:
                      problems.append(f"vcpu=2: host_threads={host_threads}, expected 2")
                  if hart0 < 100000 or hart1 < 100000:
                      problems.append(f"vcpu=2: hart instructions too low (hart0={hart0} hart1={hart1})")
              else:
                  if "FLOE_SMP_CPUS_1" not in transcript:
                      problems.append("vcpu=1 control: the guest did not report exactly 1 CPU")
                  if host_threads != 0:
                      problems.append(f"vcpu=1 control: host_threads={host_threads}, expected 0")
                  if hart1 != 0:
                      problems.append(f"vcpu=1 control: hart1 retired {hart1} instructions")
          # the guest wrote both files through the 9p share from two processes
          expected = 192 * 64 * 1024
          for name in ("smp-io0.bin", "smp-io1.bin"):
              path = os.path.join("work/smp/share", name)
              if not os.path.isfile(path):
                  problems.append(f"9p share file missing: {name}")
              elif os.path.getsize(path) != expected:
                  problems.append(f"{name}: {os.path.getsize(path)} bytes != {expected}")
          md5 = os.path.join("work/smp/share", "smp-io-md5.txt")
          print("guest md5sum report:", open(md5, errors="replace").read().strip() if os.path.isfile(md5) else "missing")
          if problems:
              for item in problems:
                  print("S4 SMP BOOT GATE FAILED:", item)
              raise SystemExit(1)
          print("S4 gate: vcpu=2 booted the fresh SMP pair with guest-visible 2 CPUs, "
                "two harts executing and parallel 9p I/O; vcpu=1 is the control")
          PY

      - name: Upload Stage S4 evidence (per-step, immediate)
        if: ${{ always() && inputs.run_smp }}
        uses: actions/upload-artifact@v4
        with:
          name: smp-real-boot-${{ github.run_id }}
          path: |
            work/smp/smpboot-*
            work/smp/share/
            work/smp/boot/
          if-no-files-found: warn
          retention-days: 30

      # ------------------------------------------------------------------
      # Stage S5 (opt-in, run_smp): repeated equal-work workload on the real
      # SMP kernel (1 vs 2 harts) plus a stopped run. Dual-hart use is
      # asserted from guest-visible CPU count, per-hart retired
      # instructions and the wall time of the same workload, never from
      # host nproc.
      # ------------------------------------------------------------------
      - name: Stage S5 — repeated equal-work SMP workload + stopped-run save check
        if: ${{ always() && inputs.run_smp }}
        run: |
          set -euo pipefail
          IMG=work/src/diskimage-linux-riscv-2018-09-23
          BOOT=work/smp/boot
          test -s "$BOOT/bbl64.bin" || { echo "Stage S0 produced no boot pair; S5 cannot run"; exit 1; }
          mkdir -p work/smp2
          cat > work/smp2/workload.txt <<'EOF'
          @12 mount -t proc proc /proc
          @20 sh -c 'dd if=/dev/zero of=/dev/null bs=64k count=6000 & dd if=/dev/zero of=/dev/null bs=64k count=6000 & wait'
          @50 printf 'FLOE_SMP2PERF_%s\n' DONE
          EOF
          sed -i 's/^ *//' work/smp2/workload.txt
          for v in 1 2; do
            for r in 1 2 3; do
              set +e
              work/build/floe_vm_host \
                --bios "$BOOT/bbl64.bin" --kernel "$BOOT/kernel-riscv64.bin" \
                --disk "$IMG/root-riscv64.bin" --ram 128 --vcpu "$v" \
                --cmdline "console=hvc0 root=/dev/vda rw init=/bin/sh" \
                --script work/smp2/workload.txt \
                --transcript "work/smp2/wl-vcpu$v-r$r-transcript.txt" \
                --stats-file "work/smp2/wl-vcpu$v-r$r-stats.jsonl" --stats-interval 1 \
                --until FLOE_SMP2PERF_DONE --max-s 180 \
                > "work/smp2/wl-vcpu$v-r$r-stdout.txt" 2>&1
              echo "wl_vcpu${v}_r${r}_rc=$?" >> "work/smp2/wl-vcpu$v-r$r-rc.txt"
              set -e
            done
          done
          # a stopped run must keep its evidence and the boot pair must be intact
          set +e
          work/build/floe_vm_host \
            --bios "$BOOT/bbl64.bin" --kernel "$BOOT/kernel-riscv64.bin" \
            --disk "$IMG/root-riscv64.bin" --ram 128 --vcpu 2 \
            --cmdline "console=hvc0 root=/dev/vda rw init=/bin/sh" \
            --script work/smp2/workload.txt \
            --transcript work/smp2/stop-transcript.txt \
            --stats-file work/smp2/stop-stats.jsonl --stats-interval 1 \
            --until FLOE_NEVER_REACHED --max-s 8 \
            > work/smp2/stop-stdout.txt 2>&1
          echo "stop_run_rc=$?" | tee work/smp2/stop-rc.txt
          set -e
          sha256sum "$BOOT/bbl64.bin" "$BOOT/kernel-riscv64.bin" > work/smp2/boot-pair-sha256.txt
          python3 - <<'PY'
          import hashlib, json, os, statistics, sys

          runs, problems = [], []
          for v in (1, 2):
              for r in (1, 2, 3):
                  base = f"work/smp2/wl-vcpu{v}-r{r}"
                  samples = []
                  with open(base + "-stats.jsonl", "r", errors="replace") as handle:
                      for line in handle:
                          line = line.strip()
                          if line:
                              samples.append(json.loads(line))
                  with open(base + "-transcript.txt", "r", errors="replace") as handle:
                      transcript = handle.read()
                  final = [s for s in samples if s.get("event") in ("marker", "poweroff", "timeout")]
                  last = final[-1] if final else samples[-1]
                  host_threads = max(s.get("host_threads", 0) for s in samples)
                  hart0 = max((s.get("hart_insns") or [0, 0])[0] for s in samples)
                  hart1 = max((s.get("hart_insns") or [0, 0])[1] for s in samples)
                  booted = "FLOE_SMP2PERF_DONE" in transcript
                  runs.append({"vcpu": v, "repeat": r, "booted": booted,
                               "wall_s": last.get("t"), "final_event": last.get("event"),
                               "host_threads": host_threads, "hart0": hart0, "hart1": hart1})
                  if not booted:
                      problems.append(f"vcpu={v} r{r}: workload marker missing")
                  if v == 2:
                      if host_threads != 2:
                          problems.append(f"vcpu=2 r{r}: host_threads={host_threads}")
                      if hart1 < 100000:
                          problems.append(f"vcpu=2 r{r}: hart1 retired {hart1} instructions")
          booted = {v: [r for r in runs if r["vcpu"] == v and r["booted"]] for v in (1, 2)}
          med = {v: statistics.median([r["wall_s"] for r in booted[v]]) for v in (1, 2) if booted[v]}
          work = {v: statistics.median([r["hart0"] + r["hart1"] for r in booted[v]]) for v in (1, 2) if booted[v]}
          ratio = (med[1] / med[2]) if 1 in med and 2 in med and med[2] else None
          best = max((med[1] / r["wall_s"]) for r in booted[2]) if 1 in med and booted[2] else None
          report = {
              "tool": "floe_vm_host --vcpu + FloeVMStats, fresh CONFIG_SMP kernel",
              "runs": runs,
              "median_wall_s": med,
              "median_total_hart_insns": work,
              "wall_ratio_1hart_over_2hart": ratio,
              "best_ratio": best,
              "note": ("Equal guest workload repeated 3x per hart count on the freshly "
                       "built CONFIG_SMP=y NR_CPUS=2 kernel. Dual-hart use is proven by "
                       "guest /proc/cpuinfo (== 2), per-hart retired instructions and "
                       "the wall time, never by host nproc."),
          }
          with open("work/smp2/smp-perf.json", "w", encoding="utf-8") as handle:
              json.dump(report, handle, indent=2)
              handle.write("\n")
          print(json.dumps(report, indent=2))
          if len(booted[1]) < 3 or len(booted[2]) < 3:
              problems.append("fewer than 3 booted runs per hart count")
          elif work[2] < 1.5 * work[1]:
              problems.append(f"2-hart run retired {work[2]} insns vs {work[1]} for 1 hart: "
                            "the second CPU did not carry work")
          elif not best or best < 1.05:
              problems.append(f"no parallel speedup: best ratio {best}")
          # a stopped run keeps evidence and cannot corrupt the boot pair
          stop_rc = open("work/smp2/stop-rc.txt").read().strip().split("=")[-1]
          stop_bytes = os.path.getsize("work/smp2/stop-transcript.txt")
          print(f"stopped run: rc={stop_rc} transcript_bytes={stop_bytes}")
          if stop_rc != "2" or stop_bytes == 0:
              problems.append(f"stopped run did not keep evidence (rc={stop_rc}, {stop_bytes} bytes)")
          if os.path.getsize("work/smp2/stop-stats.jsonl") == 0:
              problems.append("stopped run wrote no stats sample")
          for line in open("work/smp2/boot-pair-sha256.txt"):
              pass
          if problems:
              for item in problems:
                  print("S5 SMP WORKLOAD GATE FAILED:", item)
              raise SystemExit(1)
          print("S5 gate: every 2-hart run executed both CPUs, the same workload "
                "scale and a stopped run kept its evidence")
          PY
          python3 -m json.tool work/smp2/smp-perf.json >/dev/null && echo "smp-perf.json valid"

      - name: Upload Stage S5 evidence (per-step, immediate)
        if: ${{ always() && inputs.run_smp }}
        uses: actions/upload-artifact@v4
        with:
          name: smp-workload-${{ github.run_id }}
          path: |
            work/smp2/
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize results
        if: always()
        run: |
          python3 - <<'PY' | tee work/summary.json
          import json, os, sys

          def slurp(path):
              try:
                  with open(path, "r", errors="replace") as f:
                      return f.read().strip()
              except OSError:
                  return ""

          def rc(path):
              raw = slurp(path)
              return raw.split("=", 1)[1] if "=" in raw else ""

          transcripts = ["work/stageA-transcript.txt", "work/stageC-transcript.txt",
                         "work/stageD-transcript.txt", "work/stageE2-transcript.txt"]
          blob = "\n".join(slurp(p) for p in transcripts)
          markers = ["FLOE_STAGEA_OK_42", "FLOE_STAGEA_9P_OK", "FLOE_STAGEA_PING_OK",
                     "FLOE_STAGEC_ALIVE_42", "FLOE_FORK_WAIT_OK", "FLOE_PIPE_OK",
                     "FLOE_SIGNAL_OK", "FLOE_PTY_OK", "FLOE_NO_PYTHON3", "FLOE_NO_NODE",
                     "FLOE_STAGED_PING_OK", "FLOE_APT_HTTPS_RC=0", "FLOE_APT_UPDATE_RC_0",
                     "FLOE_APT_INSTALL_RC_0", "FLOE_PY_HTTPS_200", "FLOE_NUMPY_OK",
                     "FLOE_NODE_OK", "FLOE_PERSIST_OK", "FLOE_APTPROBE_DONE",
                     "FLOE_INSN_fence_tso=OK", "FLOE_INSN_fence_tso_rs1_3=OK",
                     "FLOE_INSN_fence_rw_rw=OK", "FLOE_INSN_pause=OK"]
          share = sorted(os.path.basename(p) for p in
                         (os.path.join("work/share9p", f) for f in os.listdir("work/share9p"))
                         if os.path.isfile(p)) if os.path.isdir("work/share9p") else []

          def maybe_json(path):
              raw = slurp(path)
              if not raw:
                  return None
              try:
                  return json.loads(raw)
              except json.JSONDecodeError:
                  return {"unparsable": raw[:400]}

          smp = {
              "run_smp": os.environ.get("INPUT_RUN_SMP", ""),
              "stage_s0_boot_pair": slurp("work/smp/smp-boot-pair.txt"),
              "stage_s1_vcpu1_rc": rc("work/smp/host-vcpu1-rc.txt"),
              "stage_s1_vcpu2_rc": rc("work/smp/host-vcpu2-rc.txt"),
              "stage_s2_host_test_rc": rc("work/smp/smp-test-rc.txt"),
              "stage_s2_host_test": maybe_json("work/smp/smp-test-summary.json"),
              "stage_s3_perf_baseline": maybe_json("work/smp/smp-perf-baseline.json"),
              "stage_s4_real_smp_boot_vcpu1_rc": rc("work/smp/smpboot-vcpu1-rc.txt"),
              "stage_s4_real_smp_boot_vcpu2_rc": rc("work/smp/smpboot-vcpu2-rc.txt"),
              "stage_s4_guest_cpu_count": slurp("work/smp/share/smp-cpu-count.txt"),
              "stage_s4_guest_uname": slurp("work/smp/share/smp-uname.txt"),
              "stage_s4_guest_io_md5": slurp("work/smp/share/smp-io-md5.txt"),
              "stage_s5_workload": maybe_json("work/smp2/smp-perf.json"),
              "stage_s5_stopped_run": slurp("work/smp2/stop-rc.txt"),
              "note": ("stage_s2/s3 summaries carry host_threads and per-hart retired "
                       "instructions; dual-hart success is asserted from those, never "
                       "from host nproc. stage_s0 builds the CONFIG_SMP kernel from the "
                       "pinned source in the cloud; stage_s4 boots it and asserts the "
                       "guest's own /proc/cpuinfo count, the boot pair's kernel ident "
                       "and both harts executing; stage_s5 repeats the equal-work "
                       "workload 3x per hart count and keeps a stopped run's evidence."),
          }
          summary = {
              "engine_sha256": "be8351f2121819b3172fcedce5cb1826fa12c87da1b7ed98f269d3e802a05555",
              "source_ref": os.environ.get("GITHUB_SHA", ""),
              "run_debian": os.environ.get("INPUT_RUN_DEBIAN", ""),
              "run_smp": os.environ.get("INPUT_RUN_SMP", ""),
              "deb_package_versions": [l.strip() for l in
                                       slurp("work/debian-osrelease.txt").splitlines() if l.strip()][:2],
              "debian_image_sha512": slurp("work/debian-sha512.txt").split(" ")[0],
              "debian_image_sha256": slurp("work/debian-sha256.txt").split(" ")[0],
              "rootfs_image_size": slurp("work/debian-rootfs-size.txt").splitlines()[0] if slurp("work/debian-rootfs-size.txt") else "",
              "stageA_rc": rc("work/stageA-rc.txt"),
              "stageB_rc": rc("work/stageB-rc.txt"),
              "stageB_transcript_bytes": os.path.getsize("work/stageB-transcript.txt") if os.path.exists("work/stageB-transcript.txt") else 0,
              "stageC_rc": rc("work/stageC-rc.txt"),
              "stageC_gate": os.environ.get("C_OK", "not-run"),
              "stageD_rc": rc("work/stageD-rc.txt"),
              "lifecycle_ok": "LIFECYCLE_OK" in slurp("work/lifecycle.txt"),
              "guest_runner_sha256": slurp("work/floe-exec-sha256.txt"),
              "guest_runner_inject": slurp("work/floe-exec-injected.txt")[-400:],
              "guest_runner_stageR_rc": rc("work/stageR-rc.txt"),
              "guest_log_files": share,
              "markers": {m: (m in blob) for m in markers},
              "marker_note": "true only means the literal string appeared in a console transcript; guest scripts assemble markers at runtime so TTY echo of the input line cannot produce them",
              "smp": smp,
          }
          print(json.dumps(summary, indent=2))
          PY
          python3 -m json.tool work/summary.json > /dev/null && echo "summary.json valid"

      - name: Upload qualification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinyemu-linux-qualification-${{ github.run_id }}
          path: |
            work/*-transcript.txt
            work/*-time.txt
            work/*-rc.txt
            work/lifecycle.txt
            work/summary.json
            work/debian-sha512.txt
            work/debian-sha256.txt
            work/debian-osrelease.txt
            work/debian-ext4-features.txt
            work/debian-rootfs-size.txt
            work/floe-exec-file.txt
            work/floe-exec-sha256.txt
            work/floe-exec-injected.txt
            work/stageR-transcript.txt
            work/stageR-rc.txt
            work/boot-listing.txt
            work/partitions.txt
            work/share9p/*
            work/smp/*.json
            work/smp/*.jsonl
            work/smp/*.txt
            work/smp/*-transcript.txt
            work/smp/*-rc.txt
            work/smp/boot/
            work/smp/share/
            work/smp2/*.json
            work/smp2/*.jsonl
            work/smp2/*.txt
            work/smp2/*-transcript.txt
            work/smp2/*-rc.txt
          retention-days: 30
