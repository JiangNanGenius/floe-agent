# TinyEMU Linux qualification (phase 2A) — engine-only CI.
#
# Scope: builds the pinned MIT TinyEMU RV64 embeddable core on Linux and
# boots real guests, recording transcripts + measurements as artifacts.
# This workflow NEVER touches release/TestFlight/production lanes and never
# modifies app code.
#
# Triggering:
#  - push to codex/feedback-linux touching engine/qualification files runs
#    the LEAN path: build + lifecycle regression + Stage A (2018 demo
#    parity). A few minutes; safe for every engine change.
#  - manual dispatch with run_debian=true additionally runs the Debian 13
#    riscv64 stages (B: modern kernel probe, C: userland on the 4.15
#    fallback kernel, D: APT/numpy/node, E: persistence). That downloads a
#    ~3 GB image and takes up to ~2 h, so it is opt-in.
#
# Evidence rules (kept honest after a real false-positive incident):
#  - guest markers are only ever emitted by printf/echo *built at runtime*,
#    so the literal marker string never appears in the console input line
#    that the guest TTY echoes back. A marker hit therefore means the guest
#    executed something, not that it echoed the command.
#  - exit codes are captured from the real command (`cmd >log 2>&1; printf
#    'RC=%d\n' $?`); never from the tail of a pipeline.
#  - `--until` values use the same runtime-assembled markers, so the host
#    cannot exit on TTY echo.
#  - raw guest logs are exported to the host through the 9p share when the
#    stage mounts it, and all transcripts/timing/RC files are uploaded.
name: tinyemu-linux-qualification

on:
  workflow_dispatch:
    inputs:
      run_debian:
        description: 'Also run the heavy Debian 13 riscv64 stages (B/C/D/E)'
        type: boolean
        default: false
      guest_runner:
        description: 'Cross-build FloeAgent/LinuxGuest, inject it into the rootfs image and boot it as PID1'
        type: boolean
        default: false
  push:
    branches: [codex/feedback-linux]
    paths:
      - 'FloeAgent/ThirdParty/TinyEMU/**'
      - 'FloeAgent/Qualification/TinyEMULinux/**'
      - '.github/workflows/tinyemu-linux-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Fetch + verify pinned TinyEMU source and demo image
        run: |
          bash FloeAgent/ThirdParty/TinyEMU/fetch_source.sh work/src

      - name: Host GPL gate on engine build sources
        run: |
          bash FloeAgent/ThirdParty/TinyEMU/license_check.sh work/src/tinyemu-2019-12-21

      - name: Build embeddable core + qualification host (native Linux, no shims)
        run: |
          cd FloeAgent/Qualification/TinyEMULinux
          make -f ../../ThirdParty/TinyEMU/adapter/Makefile \
            TINYEMU_SRC=../../../work/src/tinyemu-2019-12-21 \
            PATCH_DIR=../../ThirdParty/TinyEMU/patches \
            BUILD=../../../work/build HOST_DIR=. -j"$(nproc)"
          ../../../work/build/floe_vm_host 2>&1 | head -2 || true

      - name: Lifecycle regression (repeatable create/destroy, failure cleanup, RAM-OOM, hostfwd)
        run: |
          IMG=work/src/diskimage-linux-riscv-2018-09-23
          mkdir -p work/share9p
          work/build/lifecycle_test "$IMG/bbl64.bin" "$IMG/kernel-riscv64.bin" \
            "$IMG/root-riscv64.bin" work/share9p | tee work/lifecycle.txt
          grep -a LIFECYCLE_OK work/lifecycle.txt

      - name: Stage A — boot pinned 2018 demo image (engine parity check)
        run: |
          IMG=work/src/diskimage-linux-riscv-2018-09-23
          mkdir -p work/share9p
          cat > work/stageA.txt <<'EOF'
          @15 uname -a
          @18 echo FLOE_STAGEA_OK_$((6*7))
          @21 mount -t 9p -o trans=virtio,version=9p2000.L /dev/root /mnt
          @24 echo ci-9p-proof > /mnt/floe_ci_9p.txt && printf 'FLOE_STAGEA_9P_%s\n' OK
          @27 ifconfig eth0 10.0.2.15 netmask 255.255.255.0 up
          @30 ping -c 1 -W 3 10.0.2.2 && printf 'FLOE_STAGEA_PING_%s\n' OK
          @34 printf 'FLOE_STAGEA_%s\n' DONE
          EOF
          sed -i 's/^ *//' work/stageA.txt
          set +e
          /usr/bin/time -v work/build/floe_vm_host \
            --bios $IMG/bbl64.bin --kernel $IMG/kernel-riscv64.bin \
            --disk $IMG/root-riscv64.bin --share /dev/root=work/share9p --net \
            --ram 128 --script work/stageA.txt \
            --transcript work/stageA-transcript.txt \
            --until FLOE_STAGEA_DONE --max-s 120 > work/stageA-stdout.txt 2> work/stageA-time.txt
          echo "stageA_rc=$?" | tee work/stageA-rc.txt
          set -e
          grep -a "Maximum resident" work/stageA-time.txt || true

      - name: Stage A assertions
        run: |
          grep -a FLOE_STAGEA_OK_42 work/stageA-transcript.txt
          grep -a FLOE_STAGEA_9P_OK work/stageA-transcript.txt
          test -f work/share9p/floe_ci_9p.txt
          grep -a FLOE_STAGEA_PING_OK work/stageA-transcript.txt

      - name: Fetch Debian 13 riscv64 nocloud image (record resolved SHA512)
        if: ${{ inputs.run_debian }}
        run: |
          cd work
          curl -fsSL --retry 3 -o SHA512SUMS https://cdimage.debian.org/cdimage/cloud/trixie/daily/latest/SHA512SUMS
          grep "nocloud-riscv64-daily.qcow2" SHA512SUMS | tee debian-sha512.txt
          curl -fL --retry 3 --max-time 1800 -o debian-13-nocloud-riscv64-daily.qcow2 \
            https://cdimage.debian.org/cdimage/cloud/trixie/daily/latest/debian-13-nocloud-riscv64-daily.qcow2
          sha512sum -c debian-sha512.txt
          ln -f debian-13-nocloud-riscv64-daily.qcow2 debian13-riscv64.qcow2
          sha256sum debian13-riscv64.qcow2 | tee debian-sha256.txt

      - name: Convert + extract Debian kernel/initrd/rootfs
        if: ${{ inputs.run_debian }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-utils parted >/dev/null
          qemu-img convert -O raw work/debian13-riscv64.qcow2 work/debian13-riscv64.raw
          LOOP=$(sudo losetup -fP --show work/debian13-riscv64.raw)
          sudo partprobe "$LOOP" || true
          sleep 2
          echo "LOOP=$LOOP" >> "$GITHUB_ENV"
          sudo parted -s "$LOOP" unit s print | tee work/partitions.txt
          # find the largest ext4 partition = rootfs
          ROOTP=$(sudo parted -s "$LOOP" print | awk '/ext4/{print $1}' | sort -n | tail -1)
          echo "ROOTP=$ROOTP" >> "$GITHUB_ENV"
          # drop ext4 features the 4.15 fallback kernel cannot mount (no-op if unset)
          sudo tune2fs -O ^orphan_file "${LOOP}p${ROOTP}" 2>&1 | tail -1 || true
          sudo tune2fs -O ^metadata_csum_seed "${LOOP}p${ROOTP}" 2>&1 | tail -1 || true
          sudo e2fsck -fy "${LOOP}p${ROOTP}" 2>&1 | tail -2 || true
          sudo tune2fs -l "${LOOP}p${ROOTP}" | grep -aE "Filesystem features|Block size|Filesystem state" \
            | tee work/debian-ext4-features.txt
          # The pinned 2018 bbl/demo kernel has NO EFI/GPT partition support (no
          # CONFIG_EFI_PARTITION strings in the image; a valid GPT disk is seen
          # only through the protective MBR, so root=/dev/vda1 panics with
          # "VFS: Unable to mount root fs on unknown-block(254,1)"). Verified
          # 2026-09-20 in run 35493987238 and locally with a GPT disk macOS
          # accepts (guest read-path md5 matched byte-for-byte). The fallback
          # route therefore boots the extracted ext4 partition as a whole-disk
          # image (root=/dev/vda), which this kernel mounts fine.
          # parted "unit s print" columns are Number Start End Size ...:
          # $2=start $3=end $4=size (sector units, "s" suffix).
          PART_INFO=$(sudo parted -s "$LOOP" unit s print | \
            awk -v p="$ROOTP" '$1==p {gsub(/s/,"",$2); gsub(/s/,"",$3); gsub(/s/,"",$4); print $2, $3, $4}')
          RSTART=$(echo "$PART_INFO" | cut -d' ' -f1)
          REND=$(echo "$PART_INFO" | cut -d' ' -f2)
          RSIZE=$(echo "$PART_INFO" | cut -d' ' -f3)
          echo "rootfs extent: start=$RSTART end=$REND size=$RSIZE sectors"
          { [ -n "$RSTART" ] && [ -n "$REND" ] && [ -n "$RSIZE" ]; } || {
            echo "cannot resolve rootfs extent from parted"; exit 1; }
          if [ "$((REND - RSTART + 1))" != "$RSIZE" ]; then
            echo "parted extent mismatch (end-start+1 != size); refusing to dd a truncated rootfs"
            exit 1
          fi
          dd if=work/debian13-riscv64.raw of=work/debian13-rootfs.img bs=512 \
             skip="$RSTART" count="$RSIZE" status=progress
          ls -la work/debian13-rootfs.img | tee work/debian-rootfs-size.txt
          # the extracted copy must be the same clean ext4 (not truncated)
          sudo e2fsck -fy work/debian13-rootfs.img 2>&1 | tail -2 | tee -a work/debian-rootfs-size.txt
          sudo tune2fs -l work/debian13-rootfs.img \
            | grep -aE "Filesystem features|Block size|Filesystem state" | tee work/debian-ext4-features.txt
          sudo chmod 644 work/debian13-rootfs.img
          mkdir -p work/mnt
          sudo mount -o ro "${LOOP}p${ROOTP}" work/mnt
          ls work/mnt/boot/ | tee work/boot-listing.txt
          # riscv64 Debian ships uncompressed vmlinux-* (no vmlinuz-*)
          sudo cp work/mnt/boot/vmlinux-* work/debian-vmlinuz 2>/dev/null || \
            sudo cp work/mnt/boot/vmlinuz-* work/debian-vmlinuz
          sudo cp work/mnt/boot/initrd.img-* work/debian-initrd
          sudo chmod 644 work/debian-vmlinuz work/debian-initrd
          grep -a -m1 "PRETTY_NAME" work/mnt/etc/os-release | tee work/debian-osrelease.txt
          sudo umount work/mnt

      - name: Guest runner (FLOE-EXEC) cross-build + inject into the rootfs image
        if: ${{ inputs.run_debian && inputs.guest_runner }}
        run: |
          if [ ! -f FloeAgent/LinuxGuest/runner/floe_exec.c ]; then
            echo "FloeAgent/LinuxGuest sources are not on this ref; skipping runner verification"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-riscv64-linux-gnu >/dev/null
          make -C FloeAgent/LinuxGuest/runner riscv64
          file FloeAgent/LinuxGuest/runner/floe-exec-riscv64 | tee work/floe-exec-file.txt
          grep -q "statically linked" work/floe-exec-file.txt
          sha256sum FloeAgent/LinuxGuest/runner/floe-exec-riscv64 | tee work/floe-exec-sha256.txt
          sudo bash FloeAgent/LinuxGuest/image/install-into-image.sh \
            --image work/debian13-rootfs.img \
            --runner FloeAgent/LinuxGuest/runner/floe-exec-riscv64 \
            --script FloeAgent/LinuxGuest/image/floe-guest-init 2>&1 | tee work/floe-exec-injected.txt
          echo "RUNNER_OK=true" >> "$GITHUB_ENV"

      - name: Stage B — Debian 13 modern kernel vs 2018 bbl (compatibility probe; failure is recorded, not hidden)
        if: ${{ inputs.run_debian }}
        run: |
          set +e
          timeout 90 work/build/floe_vm_host \
            --bios work/src/diskimage-linux-riscv-2018-09-23/bbl64.bin \
            --kernel work/debian-vmlinuz --initrd work/debian-initrd \
            --disk work/debian13-riscv64.raw \
            --ram 512 --cmdline "console=hvc0 root=/dev/vda${ROOTP} rw" \
            --transcript work/stageB-transcript.txt \
            --until FLOE_NEVER_MARKER --max-s 75 > work/stageB-stdout.txt 2>&1
          echo "stageB_rc=$?" | tee work/stageB-rc.txt
          wc -c work/stageB-transcript.txt | tee work/stageB-size.txt
          set -e

      - name: Stage C — Debian 13 userland on 4.15 fallback kernel (init=/bin/bash)
        if: ${{ inputs.run_debian }}
        run: |
          cat > work/stageC.txt <<'EOF'
          @20 mount -t proc proc /proc
          @23 mount -t sysfs sys /sys
          @26 mount -t devtmpfs dev /dev 2>/dev/null; mount -t devpts devpts /dev/pts 2>/dev/null
          @29 mkdir -p /floe; mount -t 9p -o trans=virtio,version=9p2000.L floe /floe
          @30 ip link set eth0 up 2>/dev/null; ip addr add 10.0.2.15/24 dev eth0 2>/dev/null; ip route add default via 10.0.2.2 2>/dev/null
          @34 echo nameserver 10.0.2.3 > /etc/resolv.conf
          @36 printf 'FLOE_STAGEC_ALIVE_%d\n' $((7*6))
          @39 cat /etc/os-release | head -2
          @42 python3 --version 2>&1 || printf 'FLOE_NO_PYTHON%s\n' 3
          @46 node --version 2>&1 || printf 'FLOE_NO_%s\n' NODE
          @50 sh -c 'sleep 2 & wait' && printf 'FLOE_FORK_WAIT_%s\n' OK
          @54 mkfifo /tmp/f && (cat /tmp/f & sleep 1; echo hi > /tmp/f; wait) && printf 'FLOE_PIPE_%s\n' OK
          @60 M1=FLOE_SIGNAL_; M2=OK; sh -c 'trap "echo $0$1" USR1; kill -USR1 $$' "$M1" "$M2"
          @64 python3 -c 'import pty; pty.spawn(["/bin/echo","FLOE_PTY_"+"OK"])' 2>&1 | tail -1
          @70 cat /etc/os-release > /floe/guest-os-release.txt 2>/dev/null; sync
          @72 printf 'FLOE_STAGEC_%s\n' DONE
          EOF
          sed -i 's/^ *//' work/stageC.txt
          set +e
          /usr/bin/time -v timeout 600 work/build/floe_vm_host \
            --bios work/src/diskimage-linux-riscv-2018-09-23/bbl64.bin \
            --kernel work/src/diskimage-linux-riscv-2018-09-23/kernel-riscv64.bin \
            --disk work/debian13-rootfs.img --rw \
            --ram 512 --cmdline "console=hvc0 root=/dev/vda rw init=/bin/bash" \
            --net --share floe=work/share9p \
            --script work/stageC.txt \
            --transcript work/stageC-transcript.txt \
            --until FLOE_STAGEC_DONE --max-s 560 > work/stageC-stdout.txt 2> work/stageC-time.txt
          echo "stageC_rc=$?" | tee work/stageC-rc.txt
          grep -a "Maximum resident" work/stageC-time.txt || true
          set -e

      - name: Stage C gate — only continue to D/E with real userland evidence
        if: ${{ always() && inputs.run_debian }}
        run: |
          C_RC=$(cat work/stageC-rc.txt 2>/dev/null | cut -d= -f2)
          if [ "$C_RC" = "0" ] && grep -qa FLOE_STAGEC_ALIVE_42 work/stageC-transcript.txt \
             && grep -qa FLOE_STAGEC_DONE work/stageC-transcript.txt; then
            echo "C_OK=true" >> "$GITHUB_ENV"
            echo "Stage C reached a real guest shell (rc=0, ALIVE+DONE markers)"
          else
            echo "C_OK=false" >> "$GITHUB_ENV"
            echo "Stage C did not reach the guest shell (rc=$C_RC); D/E are skipped and the"
            echo "panic/timeout transcript below is the recorded result, so no hour is wasted:"
            tail -c 1200 work/stageC-transcript.txt || true
          fi

      - name: Stage R — injected FLOE-EXEC runner as PID1, one real EXEC frame
        if: ${{ inputs.run_debian && inputs.guest_runner && env.C_OK == 'true' && env.RUNNER_OK == 'true' }}
        run: |
          python3 - <<'PY'
          import base64, struct
          def field(b):
              return struct.pack(">I", len(b)) + b
          fields = [b"/", b"", b"/bin/sh", b"-c", b"printf 'FLOE_RUNNER_%s\\n' OK"]
          payload = struct.pack(">I", len(fields)) + b"".join(field(f) for f in fields)
          frame = b"\x1eFLOE-EXEC runnerexec " + base64.b64encode(payload) + b"\n"
          with open("work/stageR.txt", "wb") as f:
              f.write(b"@30 " + frame)
          PY
          set +e
          work/build/floe_vm_host \
            --bios work/src/diskimage-linux-riscv-2018-09-23/bbl64.bin \
            --kernel work/src/diskimage-linux-riscv-2018-09-23/kernel-riscv64.bin \
            --disk work/debian13-rootfs.img --rw \
            --ram 512 --cmdline "console=hvc0 root=/dev/vda rw init=/usr/local/bin/floe-exec" \
            --net --share floe=work/share9p \
            --script work/stageR.txt --transcript work/stageR-transcript.txt \
            --until FLOE_RUNNER_OK --max-s 240 > work/stageR-stdout.txt 2>&1
          echo "stageR_rc=$?" | tee work/stageR-rc.txt
          set -e
          if grep -qa "Kernel panic" work/stageR-transcript.txt; then
            echo "Stage R: kernel panic while booting the injected runner"; exit 1
          fi
          grep -a FLOE_RUNNER_OK work/stageR-transcript.txt
          grep -a "FLOE-END runnerexec 0" work/stageR-transcript.txt

      - name: Stage D — APT + python3-numpy + nodejs (network-permitting)
        if: ${{ inputs.run_debian && env.C_OK == 'true' }}
        run: |
          cat > work/stageD.txt <<'EOF'
          @20 mount -t proc proc /proc; mount -t sysfs sys /sys; mount -t devtmpfs dev /dev 2>/dev/null
          @23 mkdir -p /floe; mount -t 9p -o trans=virtio,version=9p2000.L floe /floe && A=/floe || A=/tmp
          @26 ip link set eth0 up; ip addr add 10.0.2.15/24 dev eth0; ip route add default via 10.0.2.2
          @28 rm -f /etc/resolv.conf; printf 'nameserver 10.0.2.3\n' > /etc/resolv.conf; cat /etc/resolv.conf
          @32 ping -c1 -W3 10.0.2.2 && printf 'FLOE_STAGED_PING_%s\n' OK
          @35 cat /proc/cpuinfo | head -6 > $A/cpuinfo.txt; dmesg | tail -5 > $A/dmesg-pre.txt
          @38 python3 -c 'import urllib.request as u; r=u.urlopen("https://deb.debian.org/debian/dists/trixie/Release", timeout=30); print("FLOE_PY_HTTPS_" + str(r.status))' 2>&1 | tail -2
          @44 printf 'deb https://deb.debian.org/debian trixie main\n' > /tmp/https.list; apt-get update -o Dir::Etc::sourcelist=/tmp/https.list -o Dir::Etc::sourceparts=/dev/null > $A/apt-https-probe.log 2>&1; printf 'FLOE_APT_HTTPS_RC=%d\n' $?; tail -4 $A/apt-https-probe.log
          @47 dmesg | tail -25 > $A/dmesg-post-https.txt; cp /usr/lib/apt/methods/https $A/apt-https-method 2>/dev/null; ldd /usr/lib/apt/methods/https > $A/apt-https-method-ldd.txt 2>&1; ls -la /usr/lib/apt/methods/ > $A/apt-methods-ls.txt 2>&1; cat $A/dmesg-post-https.txt
          @50 rm -f /etc/apt/sources.list.d/*.sources; printf 'deb http://deb.debian.org/debian trixie main\ndeb http://deb.debian.org/debian trixie-updates main\ndeb http://deb.debian.org/debian-security trixie-security main\n' > /etc/apt/sources.list; cat /etc/apt/sources.list > $A/apt-sources.txt
          @56 apt-get update > $A/apt-update.log 2>&1; printf 'FLOE_APT_UPDATE_RC=%d\n' $?; tail -3 $A/apt-update.log
          @270 apt-get install -y --no-install-recommends python3-numpy nodejs > $A/apt-install.log 2>&1; printf 'FLOE_APT_INSTALL_RC=%d\n' $?; tail -3 $A/apt-install.log; sync
          @640 python3 -c 'import numpy; print("FLOE_NUMPY_" + "OK", numpy.__version__)' 2>&1 | tail -1
          @690 node -e 'console.log("FLOE_NODE_" + "OK", process.version)' 2>&1 | tail -1
          @710 python3 -c 'import scipy' 2>&1 | tail -1; printf 'FLOE_SCIPY_PROBE_%s\n' DONE
          @720 dpkg -l > $A/dpkg-listing.txt 2>/dev/null; sync; printf 'FLOE_STAGED_%s\n' DONE
          EOF
          sed -i 's/^ *//' work/stageD.txt
          set +e
          timeout 3300 work/build/floe_vm_host \
            --bios work/src/diskimage-linux-riscv-2018-09-23/bbl64.bin \
            --kernel work/src/diskimage-linux-riscv-2018-09-23/kernel-riscv64.bin \
            --disk work/debian13-rootfs.img --rw \
            --ram 768 --cmdline "console=hvc0 root=/dev/vda rw init=/bin/bash" \
            --net --share floe=work/share9p \
            --script work/stageD.txt \
            --transcript work/stageD-transcript.txt \
            --until FLOE_STAGED_DONE --max-s 3200 > work/stageD-stdout.txt 2>&1
          echo "stageD_rc=$?" | tee work/stageD-rc.txt
          set -e

      - name: Stage E — file persistence across reboot (write-through disk)
        if: ${{ inputs.run_debian && env.C_OK == 'true' }}
        run: |
          cat > work/stageE1.txt <<'EOF'
          @20 mount -t proc proc /proc
          @24 echo "persist-$(date +%s)" > /floe_persist.txt; sync; printf 'FLOE_E1_%s\n' WRITTEN
          @30 printf 'FLOE_STAGEE1_%s\n' DONE
          EOF
          sed -i 's/^ *//' work/stageE1.txt
          cat > work/stageE2.txt <<'EOF'
          @20 mount -t proc proc /proc
          @23 mkdir -p /floe; mount -t 9p -o trans=virtio,version=9p2000.L floe /floe
          @24 cat /floe_persist.txt > /floe/persist-readback.txt 2>&1 && printf 'FLOE_PERSIST_%s\n' OK || printf 'FLOE_PERSIST_%s\n' FAIL
          @28 printf 'FLOE_STAGEE2_%s\n' DONE
          EOF
          sed -i 's/^ *//' work/stageE2.txt
          set +e
          timeout 300 work/build/floe_vm_host \
            --bios work/src/diskimage-linux-riscv-2018-09-23/bbl64.bin \
            --kernel work/src/diskimage-linux-riscv-2018-09-23/kernel-riscv64.bin \
            --disk work/debian13-rootfs.img --rw \
            --ram 512 --cmdline "console=hvc0 root=/dev/vda rw init=/bin/bash" \
            --script work/stageE1.txt --transcript work/stageE1-transcript.txt \
            --until FLOE_STAGEE1_DONE --max-s 240 > /dev/null 2>&1
          echo "stageE1_rc=$?"
          timeout 300 work/build/floe_vm_host \
            --bios work/src/diskimage-linux-riscv-2018-09-23/bbl64.bin \
            --kernel work/src/diskimage-linux-riscv-2018-09-23/kernel-riscv64.bin \
            --disk work/debian13-rootfs.img --rw \
            --ram 512 --cmdline "console=hvc0 root=/dev/vda rw init=/bin/bash" \
            --net --share floe=work/share9p \
            --script work/stageE2.txt --transcript work/stageE2-transcript.txt \
            --until FLOE_STAGEE2_DONE --max-s 240 > /dev/null 2>&1
          echo "stageE2_rc=$?"
          set -e
          grep -a FLOE_PERSIST work/stageE2-transcript.txt || true

      - name: Summarize results
        if: always()
        run: |
          python3 - <<'PY' | tee work/summary.json
          import json, os, sys

          def slurp(path):
              try:
                  with open(path, "r", errors="replace") as f:
                      return f.read().strip()
              except OSError:
                  return ""

          def rc(path):
              raw = slurp(path)
              return raw.split("=", 1)[1] if "=" in raw else ""

          transcripts = ["work/stageA-transcript.txt", "work/stageC-transcript.txt",
                         "work/stageD-transcript.txt", "work/stageE2-transcript.txt"]
          blob = "\n".join(slurp(p) for p in transcripts)
          markers = ["FLOE_STAGEA_OK_42", "FLOE_STAGEA_9P_OK", "FLOE_STAGEA_PING_OK",
                     "FLOE_STAGEC_ALIVE_42", "FLOE_FORK_WAIT_OK", "FLOE_PIPE_OK",
                     "FLOE_SIGNAL_OK", "FLOE_PTY_OK", "FLOE_NO_PYTHON3", "FLOE_NO_NODE",
                     "FLOE_STAGED_PING_OK", "FLOE_APT_HTTPS_RC=0", "FLOE_APT_UPDATE_RC=0",
                     "FLOE_APT_INSTALL_RC=0", "FLOE_PY_HTTPS_200", "FLOE_NUMPY_OK",
                     "FLOE_NODE_OK", "FLOE_PERSIST_OK"]
          share = sorted(os.path.basename(p) for p in
                         (os.path.join("work/share9p", f) for f in os.listdir("work/share9p"))
                         if os.path.isfile(p)) if os.path.isdir("work/share9p") else []
          summary = {
              "engine_sha256": "be8351f2121819b3172fcedce5cb1826fa12c87da1b7ed98f269d3e802a05555",
              "run_debian": os.environ.get("INPUT_RUN_DEBIAN", ""),
              "deb_package_versions": [l.strip() for l in
                                       slurp("work/debian-osrelease.txt").splitlines() if l.strip()][:2],
              "debian_image_sha512": slurp("work/debian-sha512.txt").split(" ")[0],
              "debian_image_sha256": slurp("work/debian-sha256.txt").split(" ")[0],
              "rootfs_image_size": slurp("work/debian-rootfs-size.txt").splitlines()[0] if slurp("work/debian-rootfs-size.txt") else "",
              "stageA_rc": rc("work/stageA-rc.txt"),
              "stageB_rc": rc("work/stageB-rc.txt"),
              "stageB_transcript_bytes": os.path.getsize("work/stageB-transcript.txt") if os.path.exists("work/stageB-transcript.txt") else 0,
              "stageC_rc": rc("work/stageC-rc.txt"),
              "stageC_gate": os.environ.get("C_OK", "not-run"),
              "stageD_rc": rc("work/stageD-rc.txt"),
              "lifecycle_ok": "LIFECYCLE_OK" in slurp("work/lifecycle.txt"),
              "guest_runner_sha256": slurp("work/floe-exec-sha256.txt"),
              "guest_runner_inject": slurp("work/floe-exec-injected.txt")[-400:],
              "guest_runner_stageR_rc": rc("work/stageR-rc.txt"),
              "guest_log_files": share,
              "markers": {m: (m in blob) for m in markers},
              "marker_note": "true only means the literal string appeared in a console transcript; guest scripts assemble markers at runtime so TTY echo of the input line cannot produce them",
          }
          print(json.dumps(summary, indent=2))
          PY
          python3 -m json.tool work/summary.json > /dev/null && echo "summary.json valid"

      - name: Upload qualification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinyemu-linux-qualification-${{ github.run_id }}
          path: |
            work/*-transcript.txt
            work/*-time.txt
            work/*-rc.txt
            work/lifecycle.txt
            work/summary.json
            work/debian-sha512.txt
            work/debian-sha256.txt
            work/debian-osrelease.txt
            work/debian-ext4-features.txt
            work/debian-rootfs-size.txt
            work/floe-exec-file.txt
            work/floe-exec-sha256.txt
            work/floe-exec-injected.txt
            work/stageR-transcript.txt
            work/stageR-rc.txt
            work/boot-listing.txt
            work/partitions.txt
            work/share9p/*
          retention-days: 30
