name: Official Skill Hub
on:
  push:
    paths: ['skill-hub/**', 'FloeAgent/Sources/FloeSkills/**', '.github/workflows/skill-hub.yml']
  pull_request:
    paths: ['skill-hub/**', 'FloeAgent/Sources/FloeSkills/**', '.github/workflows/skill-hub.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Sign and commit official skill packages
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    needs: publish
    if: ${{ always() && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.publish.outputs.commit || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install cryptography==46.0.6
      - run: python -m unittest discover -s skill-hub -p 'test_*.py'
      - run: python skill-hub/build.py --check
      - name: Reject changes to published ZIP versions
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${BASE:-$BEFORE}"
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only --diff-filter=MDR "$base" HEAD -- 'skill-hub/packages/*.zip' 'skill-hub/packages/**/*.zip')"
            if [ -n "$changed" ]; then
              echo 'Published ZIP versions may not be changed or removed. Bump the skill version.'
              exit 1
            fi
          fi
  publish:
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install cryptography==46.0.6
      - name: Build signed official packages
        env:
          FLOE_SKILL_HUB_SIGNING_KEY: ${{ secrets.FLOE_SKILL_HUB_SIGNING_KEY }}
        run: python skill-hub/build.py
      - name: Commit signed artifacts
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skill-hub/catalog.json skill-hub/catalog.sig skill-hub/packages \
            FloeAgent/Sources/FloeSkills/OfficialBundledSkills.generated.swift \
            FloeAgent/Sources/FloeSkills/OfficialSkillHubKeys.generated.swift
          if git diff --cached --quiet; then
            echo "No signed artifact changes"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Publish signed official skill packages"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
