name: Official Skill Hub
on:
  push:
    paths: ['skill-hub/**', 'FloeAgent/Sources/FloeSkills/**', '.github/workflows/skill-hub.yml']
  pull_request:
    paths: ['skill-hub/**', 'FloeAgent/Sources/FloeSkills/**', '.github/workflows/skill-hub.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install cryptography==46.0.6
      - run: python -m unittest discover -s skill-hub -p 'test_*.py'
      - run: python skill-hub/build.py --check
      - name: Reject changes to published ZIP versions
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${BASE:-$BEFORE}"
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only --diff-filter=MDR "$base" HEAD -- 'skill-hub/packages/*.zip' 'skill-hub/packages/**/*.zip')"
            if [ -n "$changed" ]; then
              echo 'Published ZIP versions may not be changed or removed. Bump the skill version.'
              exit 1
            fi
          fi
