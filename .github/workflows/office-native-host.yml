name: Qualify Floe Native Office Host
on:
  workflow_dispatch:
    inputs:
      publish_component:
        description: Publish the exact built host as an immutable Office component release
        required: false
        type: boolean
        default: false
  push:
    branches: ['codex/office-workflow-upgrade']
    paths: ['.github/workflows/office-native-host.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: office-native-host
  cancel-in-progress: false
jobs:
  native-host:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage and verify pinned fonts for real family checks
        run: |
          python3 FloeAgent/scripts/fonts/test_fetch_fonts.py
          python3 FloeAgent/scripts/fonts/fetch_fonts.py --check || {
            python3 FloeAgent/scripts/fonts/fetch_fonts.py
            python3 FloeAgent/scripts/fonts/fetch_fonts.py --check
          }
      - name: Validate native input and framework tooling
        run: |
          python3 FloeAgent/scripts/test_office_engine_bundle.py
          python3 FloeAgent/scripts/test_office_mobile_qualification.py
          python3 FloeAgent/scripts/test_office_native_host.py
          python3 FloeAgent/scripts/test_office_filter_overlay.py
          python3 FloeAgent/scripts/test_office_save_receipts.py
          python3 FloeAgent/scripts/test_office_readonly.py
          python3 FloeAgent/scripts/test_office_fullscreen_edit.py
          python3 FloeAgent/scripts/test_office_native_drain.py
          python3 FloeAgent/scripts/test_office_editor_language.py
          python3 FloeAgent/scripts/tests/test_office_font_config.py
          python3 FloeAgent/scripts/tests/test_office_language_resources.py
          python3 FloeAgent/scripts/test_office_stage_diagnostics.py
          python3 FloeAgent/scripts/tests/test_office_render_recovery.py
          python3 FloeAgent/scripts/test_office_host_bootstrap.py
          python3 FloeAgent/scripts/test_office_component_recovery.py
      - name: Reuse complete qualified engine inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34287476509 -n office-engine-complete-inputs -D "$RUNNER_TEMP/complete-office-inputs"
      - name: Verify and repair the locked archive
        run: |
          python3 FloeAgent/scripts/repair_office_embedding_bundle.py \
            "$RUNNER_TEMP/complete-office-inputs/office-engine-ios-arm64.tar.gz" \
            "$RUNNER_TEMP/office-native-bundle"
          python3 FloeAgent/scripts/test_office_native_drain.py \
            --upstream "$RUNNER_TEMP/office-native-bundle/source/browser/js/global.js" \
            > "$RUNNER_TEMP/office-native-bundle/native-drain-contract.json"
      - name: Check out the pinned engine repair source
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, 'FloeAgent/scripts')
          import office_engine_repair
          lock = json.loads(office_engine_repair.DEFAULT_LOCK.read_text())
          section = lock['platforms']['IOS']
          paths = list(section['compile']['sourceIncludes']) + [lock['repair']['sourceFile']]
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / 'office-repair-source'
          source.mkdir()
          def git(*args):
              subprocess.run(['git', '-C', str(source), *args], check=True)
          git('init', '-q')
          git('remote', 'add', 'origin', lock['engine']['repository'])
          git('sparse-checkout', 'set', '--no-cone', *paths)
          git('fetch', '--depth=1', '--filter=blob:none', 'origin', lock['engine']['commit'])
          git('checkout', '--detach', 'FETCH_HEAD')
          PY
      - name: Restore the repaired simulator engine for auxiliary include roots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          aux_run="$(python3 -c 'import json;print(json.load(open("FloeAgent/ThirdParty/Collabora/engine.patch.lock.json"))["platforms"]["IOS"]["auxiliaryInput"]["runID"])')"
          python3 FloeAgent/scripts/office_floe_simulator/restore_staged_engine.py \
            --run-id "$aux_run" \
            --staged "$RUNNER_TEMP/aux-staged" \
            --restored "$RUNNER_TEMP/aux-restored" \
            --output "$RUNNER_TEMP/aux-restore.json"
          python3 FloeAgent/scripts/office_engine_repair.py apply \
            --platform IOSSIMULATOR \
            --bundle "$RUNNER_TEMP/aux-restored" \
            --engine-source "$RUNNER_TEMP/office-repair-source"
      - name: Apply the pinned single-member engine repair (blank slideshow fix, IOS)
        run: |
          python3 FloeAgent/scripts/office_engine_repair.py apply \
            --platform IOS \
            --bundle "$RUNNER_TEMP/office-native-bundle" \
            --engine-source "$RUNNER_TEMP/office-repair-source" \
            --aux-bundle "$RUNNER_TEMP/aux-restored"
      - name: Verify pinned native scheme lifecycle regression
        run: |
          python3 FloeAgent/scripts/test_office_scheme_lifecycle.py \
            --source "$RUNNER_TEMP/office-native-bundle/source" \
            > "$RUNNER_TEMP/office-native-bundle/scheme-lifecycle-regression.json"
      - name: Verify pinned native forwarding lifecycle regression
        run: |
          python3 FloeAgent/scripts/test_office_forwarding_lifecycle.py \
            --source "$RUNNER_TEMP/office-native-bundle/source" \
            > "$RUNNER_TEMP/office-native-bundle/forwarding-lifecycle-regression.json"
      # Keep the source callback regression alongside the exact native build.
      - name: Verify pinned kit callback lifecycle regression
        run: |
          mkdir -p "$RUNNER_TEMP/office-native-bundle/kit-callback-lifecycle-raw"
          python3 FloeAgent/scripts/test_office_kit_lifecycle.py \
            --source "$RUNNER_TEMP/office-native-bundle/source" \
            --raw-dir "$RUNNER_TEMP/office-native-bundle/kit-callback-lifecycle-raw" \
            > "$RUNNER_TEMP/office-native-bundle/kit-callback-lifecycle-regression.json"
      - name: Prepare pinned Calc exporter sources
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, 'FloeAgent/scripts')
          from build_office_filter_overlay import SPARSE_PATHS, FILTER_LOCK
          lock = json.loads(FILTER_LOCK.read_text())
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / 'office-filter-source'
          source.mkdir()
          def git(*args):
              subprocess.run(['git', '-C', str(source), *args], check=True)
          git('init')
          git('remote', 'add', 'origin', 'https://github.com/CollaboraOnline/online.mirror.git')
          git('sparse-checkout', 'set', '--no-cone', *SPARSE_PATHS)
          git('fetch', '--depth=1', '--filter=blob:none', 'origin', lock['commit'])
          git('checkout', '--detach', 'FETCH_HEAD')
          PY
      - name: Compile and verify the live XLSX embedded object exporter
        run: |
          python3 FloeAgent/scripts/build_office_filter_overlay.py \
            "$RUNNER_TEMP/office-native-bundle" "$RUNNER_TEMP/office-filter-source" \
            "$RUNNER_TEMP/office-filter-overlay"
      - name: Compile and link the native save protocol and host APIs
        run: |
          python3 FloeAgent/scripts/build_office_native_host.py \
            "$RUNNER_TEMP/office-native-bundle" "$RUNNER_TEMP/office-native-host" \
            --filter-overlay "$RUNNER_TEMP/office-filter-overlay"
      - name: Verify packaged Floe font substitution and language payload
        run: |
           python3 - <<'PY'
           import json, os, pathlib, sys
           sys.path.insert(0, 'FloeAgent/scripts')
           import office_font_config
           output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'office-native-host'
           manifest = json.loads((output / 'native-host.json').read_text())
           font = manifest.get('fontSubstitutionConfig')
           assert font and font.get('aliases', 0) > 0, 'font substitution config missing from host package'
           resources = output / 'OfficeRuntimeResources'
           main_xcd = resources / 'share/registry/main.xcd'
           assert main_xcd.is_file(), 'packaged pin has no share/registry/main.xcd to check the font paths against'
           coolkit_text = (resources / 'coolkitconfig.xcu').read_text()
           assert 'FLOE_OFFICE_FONT_SUBSTITUTIONS_BEGIN' in coolkit_text, 'merged font config marker missing'
           assert 'FLOE_OFFICE_FONT_SUBSTITUTIONS_END' in coolkit_text
           # The real pinned table is the authority for the locale/alias hierarchy.
           report = office_font_config.validate_overlay(
               require_targets=False, vendor_config=main_xcd)
           assert not report['failures'], report['failures']
           assert report['locales'] == [office_font_config.ENGINE_SUBSTITUTION_FALLBACK_LOCALE], report['locales']
           assert report['aliasOverrides'] and report['aliasAdditions'], report
           merged = office_font_config.validate_merged_config(
               resources / 'coolkitconfig.xcu', require_targets=False, vendor_config=main_xcd)
           assert not merged['failures'], merged['failures']
           languages = manifest.get('languageResources')
           assert languages and 'en-US' in languages['availableLanguages'], 'language audit missing'
           print(json.dumps({'fontSubstitutionAliases': font['aliases'],
                             'fontSubstitutionLocales': report['locales'],
                             'aliasOverrides': len(report['aliasOverrides']),
                             'aliasAdditions': len(report['aliasAdditions']),
                             'languageResources': languages}, indent=2))
           PY
      - name: Preserve host qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-native-host-evidence
          path: |
            ${{ runner.temp }}/office-native-bundle/bundle-repair.json
            ${{ runner.temp }}/office-native-bundle/engine-repair.json
            ${{ runner.temp }}/aux-restore.json
            ${{ runner.temp }}/aux-restored/engine-repair.json
            ${{ runner.temp }}/office-native-bundle/native-drain-contract.json
            ${{ runner.temp }}/office-native-bundle/scheme-lifecycle-regression.json
            ${{ runner.temp }}/office-native-bundle/kit-callback-lifecycle-regression.json
            ${{ runner.temp }}/office-native-bundle/kit-callback-lifecycle-raw/*.txt
            ${{ runner.temp }}/office-filter-overlay/filter-overlay.json
            ${{ runner.temp }}/office-filter-overlay/compile.log
            ${{ runner.temp }}/office-filter-overlay/*.compile.log
            ${{ runner.temp }}/office-native-host/qualification.json
            ${{ runner.temp }}/office-native-host/native-host.json
            ${{ runner.temp }}/office-native-host/native-host-build.log
            ${{ runner.temp }}/office-native-host/swift-import.log
            ${{ runner.temp }}/office-native-host/NativeHost.xcresult
          if-no-files-found: warn
      - name: Package unsigned framework and main-bundle resources
        if: success()
        run: |
          mkdir "$RUNNER_TEMP/OfficeNativeHost"
          cp -R "$RUNNER_TEMP/office-native-host/products/Release-iphoneos/FloeOfficeNative.framework" "$RUNNER_TEMP/OfficeNativeHost/"
          cp -R "$RUNNER_TEMP/office-native-host/OfficeRuntimeResources" "$RUNNER_TEMP/OfficeNativeHost/"
          cp "$RUNNER_TEMP/office-native-host/native-host.json" "$RUNNER_TEMP/OfficeNativeHost/"
          ditto -c -k --keepParent "$RUNNER_TEMP/OfficeNativeHost" "$RUNNER_TEMP/OfficeNativeHost.zip"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: office-native-host-unsigned
          path: ${{ runner.temp }}/OfficeNativeHost.zip
          compression-level: 0
      - name: Recover the qualified dSYM for the exact built host
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_component == true
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/office-native-host/products/Release-iphoneos/FloeOfficeNative.framework/FloeOfficeNative"
          dsym="$RUNNER_TEMP/office-native-host/products/Release-iphoneos/FloeOfficeNative.framework.dSYM"
          if [ ! -d "$dsym" ]; then
            # Same bounded recovery used for the current device component: no
            # recompile, no binary replacement, only DWARF for the exact bytes.
            xcrun dsymutil -j 6 "$binary" -o "$dsym"
          fi
          xcrun dwarfdump --uuid "$binary"
          xcrun dwarfdump --uuid "$dsym"
      - name: Prepare immutable component release metadata
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_component == true
        run: |
          set -euo pipefail
          # The public directory carries only the host archive sidecar,
          # descriptor and licensing. The qualified dSYM is written to a
          # separate private directory and is never a public release asset.
          python3 FloeAgent/scripts/pin_office_host_artifact.py \
            --artifact-zip "$RUNNER_TEMP/OfficeNativeHost.zip" \
            --component-release-dir "$RUNNER_TEMP/office-component-release" \
            --private-symbols-dir "$RUNNER_TEMP/office-component-private-symbols" \
            --symbols-dir "$RUNNER_TEMP/office-native-host/products/Release-iphoneos/FloeOfficeNative.framework.dSYM" \
            --licenses-dir "FloeAgent/FloeApp/Resources/Licenses/OfficeEngine" \
            --component-artifact-name office-native-host-unsigned
          test ! -e "$RUNNER_TEMP/office-component-release/FloeOfficeNative.framework.dSYM.zip"
          test -f "$RUNNER_TEMP/office-component-private-symbols/FloeOfficeNative.framework.dSYM.zip"
          {
            echo '### Office component private dSYM'
            echo 'The qualified dSYM is a PRIVATE artifact, not a release asset.'
            echo 'Export and retain it immediately; it expires with Actions artifact retention.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_component == true
        with:
          name: office-native-component-release
          path: ${{ runner.temp }}/office-component-release
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_component == true
        with:
          name: office-native-component-private-symbols
          path: ${{ runner.temp }}/office-component-private-symbols
          compression-level: 0
          # Private only: root must export/retain immediately. This is never a
          # release asset and expires on the same short retention as a normal
          # Actions artifact.
          retention-days: 7
  publish-component:
    needs: native-host
    if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_component == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: office-native-host-unsigned
          path: ${{ runner.temp }}/native-host
      - uses: actions/download-artifact@v4
        with:
          name: office-native-component-release
          path: ${{ runner.temp }}/component
      - uses: actions/download-artifact@v4
        with:
          name: office-native-component-private-symbols
          path: ${{ runner.temp }}/private-symbols
      - name: Assemble and verify the immutable public component asset set
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          component = root / 'component'
          target = root / 'release'
          target.mkdir()
          shutil.copyfile(root / 'native-host' / 'OfficeNativeHost.zip',
                          target / 'OfficeNativeHost.zip')
          # Only the public allowlist is assembled. The dSYM/pin-block stay out:
          # the dSYM is private and the pin block is a primary pin edit.
          for name in ('office-component.json', 'OfficeNativeHost.zip.sha256',
                       'office-component-licenses.zip'):
              shutil.copyfile(component / name, target / name)
          shutil.copyfile(component / 'OFFICE_COMPONENT_RELEASE.md',
                          root / 'release-notes.md')
          descriptor = json.loads((target / 'office-component.json').read_text())
          assert descriptor['tag'].startswith('office-native-host-'), descriptor['tag']
          producer = descriptor['transport']['workflowCommit']
          assert len(producer) == 40 and all(c in '0123456789abcdef' for c in producer), producer
          print(descriptor['tag'])
          print(producer)
          PY
          tag="$(python3 -c 'import json,os,pathlib;print(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"release/office-component.json").read_text())["tag"])')"
          producer="$(python3 -c 'import json,os,pathlib;print(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"release/office-component.json").read_text())["transport"]["workflowCommit"])')"
          # This route publishes the component it just built: the descriptor
          # transport must be this workflow's immutable source. Publishing a
          # locally retained older component uses the manual exact-component
          # route with its own actual producer commit; never retarget that tag.
          if [ "$producer" != "$GITHUB_SHA" ]; then
            echo "The exact component bytes were produced by $producer, not $GITHUB_SHA." >&2
            echo "Publish this run's own build here; use the manual route, with the exact" >&2
            echo "producer commit as tag target, for a previously retained component." >&2
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/release/FloeOfficeNative.framework.dSYM.zip"
          test -f "$RUNNER_TEMP/private-symbols/FloeOfficeNative.framework.dSYM.zip"
          python3 FloeAgent/scripts/office_component_recovery.py \
            verify-release-directory "$RUNNER_TEMP/release" \
            --private-symbols "$RUNNER_TEMP/private-symbols/FloeOfficeNative.framework.dSYM.zip" \
            --lock FloeAgent/ThirdParty/Collabora/engine.lock.json
          echo "COMPONENT_TAG=$tag" >> "$GITHUB_ENV"
          echo "PRODUCER_SOURCE_COMMIT=$producer" >> "$GITHUB_ENV"
      - name: Publish the immutable component release (never latest, never clobber)
        run: |
          set -euo pipefail
          # An existing release or tag is an unknown/partial state for the
          # primary to inspect. Never move, clobber or blind-retry it.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$COMPONENT_TAG" >/dev/null 2>&1; then
            echo "component release $COMPONENT_TAG already exists; immutable releases are never moved" >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$COMPONENT_TAG" >/dev/null 2>&1; then
            echo "tag $COMPONENT_TAG already exists without a verified release; inspect it, never move it" >&2
            exit 1
          fi
          gh release create "$COMPONENT_TAG" \
            "$RUNNER_TEMP/release/OfficeNativeHost.zip" \
            "$RUNNER_TEMP/release/OfficeNativeHost.zip.sha256" \
            "$RUNNER_TEMP/release/office-component.json" \
            "$RUNNER_TEMP/release/office-component-licenses.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$PRODUCER_SOURCE_COMMIT" \
            --title "Floe Office native host component ${COMPONENT_TAG}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft \
            --latest=false
          # Verify the uploaded draft before exposing it. A partial upload
          # leaves a draft for primary inspection; no blind re-upload/retry.
          python3 - "$GITHUB_REPOSITORY" "$COMPONENT_TAG" <<'PY'
          import json, subprocess, sys
          repo, tag = sys.argv[1], sys.argv[2]
          output = subprocess.run(
              ['gh', 'api', f'repos/{repo}/releases/tags/{tag}'],
              check=True, capture_output=True, text=True).stdout
          release = json.loads(output)
          if release.get('draft') is not True:
              raise SystemExit('the uploaded component release is not a draft; refusing to continue')
          names = sorted(asset.get('name') for asset in release.get('assets', []))
          expected = ['OfficeNativeHost.zip', 'OfficeNativeHost.zip.sha256',
                      'office-component-licenses.zip', 'office-component.json']
          if names != expected:
              raise SystemExit(f'uploaded draft asset set is {names}, expected {expected}')
          PY
          gh release edit "$COMPONENT_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --latest=false
      - name: Read back the published component from the canonical GitHub API
        run: |
          set -euo pipefail
          READBACK="$RUNNER_TEMP/readback"
          mkdir -p "$READBACK"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$COMPONENT_TAG" > "$READBACK/release.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$COMPONENT_TAG" > "$READBACK/tag-ref.json"
          ref_type="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["object"]["type"])' "$READBACK/tag-ref.json")"
          ref_sha="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["object"]["sha"])' "$READBACK/tag-ref.json")"
          TAG_OBJECT_ARGS=()
          if [ "$ref_type" = tag ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$ref_sha" > "$READBACK/tag-object.json"
            TAG_OBJECT_ARGS=(--tag-object "$READBACK/tag-object.json")
          elif [ "$ref_type" != commit ]; then
            echo "unexpected tag ref object type: $ref_type" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$READBACK/latest.json"
          # The App feed is public; fetch the live file so a component can
          # never be reported successful while appearing as an App feed entry.
          gh api "repos/$GITHUB_REPOSITORY/contents/feather.json" \
            -H "Accept: application/vnd.github.raw" > "$READBACK/feed.json"
          python3 FloeAgent/scripts/office_component_recovery.py \
            verify-publication "$READBACK/release.json" \
            --tag "$COMPONENT_TAG" \
            --source-commit "$PRODUCER_SOURCE_COMMIT" \
            --tag-ref "$READBACK/tag-ref.json" \
            "${TAG_OBJECT_ARGS[@]+"${TAG_OBJECT_ARGS[@]}"}" \
            --latest "$READBACK/latest.json" \
            --feed "$READBACK/feed.json" \
            --release-dir "$RUNNER_TEMP/release" \
            --lock FloeAgent/ThirdParty/Collabora/engine.lock.json \
            --private-symbols "$RUNNER_TEMP/private-symbols/FloeOfficeNative.framework.dSYM.zip"
          {
            echo "### Office component published: $COMPONENT_TAG"
            echo "Public assets: OfficeNativeHost.zip, its .sha256, office-component.json, office-component-licenses.zip."
            echo "The private dSYM was verified but is not a release asset."
          } >> "$GITHUB_STEP_SUMMARY"
