# Floe Agent CI.
# Three jobs:
#   build-test (macOS 26 arm64, Xcode 27): SPM build/test + xcodegen +
#     xcodebuild for the iOS app, secret scan, SBOM, license inventory.
#   appstore-sdk-compatibility (macOS 26, Xcode 26.6): keeps the explicit
#     unsupported-Foundation-Models fallback and non-iOS-27 code buildable.
#   spm-linux-build (ubuntu-latest, Swift 6.3): cross-platform compile only —
#     SSE parser, catastrophic gate, canonical JSON, audit chain, GRDB
#     schema remain portable. Tests run on the Apple job because Debian's
#     system SQLite omits GRDB's SQLITE_ENABLE_SNAPSHOT linker symbols.
name: CI

# Superseded branch checks may stop; release uploads have a separate,
# non-cancelling concurrency group.
concurrency:
  group: floe-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

on:
  workflow_dispatch:
    inputs:
      publish_skill_hub:
        description: 'Sign and commit official Skill Hub artifacts on the selected trusted branch'
        type: boolean
        default: false
      build_native_pandas:
        description: 'Build native CPython 3.13 pandas iOS wheel candidates'
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

jobs:
  build-native-pandas:
    if: github.event_name == 'workflow_dispatch' && inputs.build_native_pandas
    # CPython's upstream testbed still uses UIApplicationDelegate rather than
    # UIScene. Build/test this dependency with the compatible stable SDK;
    # the shipping Floe app and its native pandas smoke test still use Xcode 27.
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install cibuildwheel==4.2.1
      - run: brew install ninja cmake
      - run: bash FloeAgent/scripts/build_pandas_ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-pandas-ios-candidates
          path: pandas-wheelhouse/*.whl
          if-no-files-found: error
  publish-skill-hub:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_skill_hub
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install cryptography==46.0.6
      - run: python -m unittest discover -s skill-hub -p 'test_*.py'
      - name: Build and sign official ZIP catalog
        env:
          FLOE_SKILL_HUB_SIGNING_KEY: ${{ secrets.FLOE_SKILL_HUB_SIGNING_KEY }}
        run: python skill-hub/build.py
      - run: python skill-hub/build.py --check
      - name: Commit generated artifacts to the selected branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skill-hub/catalog.json skill-hub/catalog.sig skill-hub/packages FloeAgent/Sources/FloeSkills/OfficialBundledSkills.generated.swift FloeAgent/Sources/FloeSkills/OfficialSkillHubKeys.generated.swift
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish signed official skills / 发布官方签名技能包'
            git push origin HEAD
          fi
  build-test:
    permissions:
      contents: read
      actions: read
    if: ${{ !inputs.publish_skill_hub && !inputs.build_native_pandas }}
    # Foundation Models is guarded by Swift 6.4. Building on the generic
    # macOS 26 image (Xcode 26.6) silently selects the unsupported stub.
    runs-on: xcode-27
    defaults:
      run:
        working-directory: FloeAgent
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Xcode Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Generate Xcode project
        run: |
          brew install xcodegen cmake
          scripts/bootstrap_python_runtime.sh
          scripts/gen_project.sh

      - name: Resolve and pin-check dependencies
        run: |
          swift package resolve
          scripts/pin_check.sh

      - name: Guardian real subprocess cancellation regressions
        run: python3 scripts/test_remote_task_cancel.py

      - name: Guardian real PTY lifecycle regressions
        run: python3 scripts/test_remote_shell.py

      - name: Office explicit save bridge contracts
        run: python3 scripts/test_office_explicit_save.py

      # `test` builds the universal iPhone/iPad app and its test host once.
      # Two preceding build-only destinations compiled the identical target.
      - name: Canvas, PiP, and timeline app regression tests
        run: |
          xcodebuild \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -scheme FloeAgent \
            -destination 'platform=iOS Simulator,name=iPad mini (A17 Pro)' \
            -resultBundlePath FloeAgent-AppRegressionTests.xcresult \
            -only-testing:FloeAppTests/CanvasTouchInteractionTests \
            -only-testing:FloeAppTests/CanvasSavedImageBatchAtomicityTests \
            -only-testing:FloeAppTests/CanvasAgentToolContractTests \
            -only-testing:FloeAppTests/CrashAndFeedbackRegressionTests \
            -only-testing:FloeAppTests/ThreadTimelineTests \
            -only-testing:FloeAppTests/BrowserProtocolTests \
            -only-testing:FloeAppTests/MailConnectorTests \
            -only-testing:FloeAppTests/SkillLifecycleTests \
            -only-testing:FloeAppTests/LocalPythonRuntimeTests \
            CODE_SIGNING_ALLOWED=NO \
            test
          python3 scripts/verify_app_regression_xcresult.py \
            --result-bundle FloeAgent-AppRegressionTests.xcresult

      - name: SPM test (cross-platform targets)
        run: |
          # SwiftPM links the universal llama binary into the local-model test
          # bundle but does not copy the macOS framework beside xctest. Put it
          # in the standard PackageFrameworks rpath before the test helper
          # loads bundles; no model inference is performed by these tests.
          # The upstream artifact also contains a __MACOSX metadata tree whose
          # fake framework only contains AppleDouble files. Never select it.
          LLAMA_FRAMEWORK="$(find .build/artifacts -path '*/macos-arm64_x86_64/llama.framework' ! -path '*/__MACOSX/*' -print -quit)"
          test -n "$LLAMA_FRAMEWORK"
          test -x "$LLAMA_FRAMEWORK/Versions/Current/llama"
          # SwiftPM may write test bundles under
          # .build/out/Products/Debug while --show-bin-path still reports the
          # target-triple directory. Make the binary artifact discoverable to
          # dyld and mirror it beside every products directory SwiftPM created.
          export DYLD_FRAMEWORK_PATH="$(dirname "$LLAMA_FRAMEWORK")${DYLD_FRAMEWORK_PATH:+:$DYLD_FRAMEWORK_PATH}"
          # Materialize SwiftPM's product directories before staging the
          # binary llama framework required by the test loaders.
          swift build
          BIN_PATH="$(swift build --show-bin-path)"
          mkdir -p "$BIN_PATH/PackageFrameworks"
          cp -R "$LLAMA_FRAMEWORK" "$BIN_PATH/PackageFrameworks/"
          while IFS= read -r PRODUCTS_DIR; do
            mkdir -p "$PRODUCTS_DIR/PackageFrameworks"
            cp -R "$LLAMA_FRAMEWORK" "$PRODUCTS_DIR/PackageFrameworks/"
          done < <(find .build -type d -path '*/Products/Debug')
          find "$BIN_PATH/PackageFrameworks/llama.framework" -name '._*' -delete
          # Deadline tests intentionally outlive the caller briefly. Isolate
          # both JavaScript suites so loaded shared runners cannot make their
          # wall-clock assertions interfere with unrelated concurrent tests.
          swift test \
            --skip 'FloeExecutionTests.JavaScriptEngineTests' \
            --skip 'FloeExecutionTests.JavaScriptExecutionToolTests'
          swift test --filter 'FloeExecutionTests.JavaScriptEngineTests'
          swift test --filter 'FloeExecutionTests.JavaScriptExecutionToolTests'

      - name: Secret scan
        run: |
          brew install gitleaks
          scripts/secret_scan.sh

      - name: SBOM
        run: |
          brew install syft
          scripts/sbom.sh

      - name: License inventory
        run: scripts/license_inventory.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            FloeAgent/sbom.spdx.json
            FloeAgent/LICENSES-THIRD-PARTY.md
            FloeAgent/.gitleaks-report.json
            FloeAgent/FloeAgent-AppRegressionTests.xcresult
          if-no-files-found: ignore

  appstore-sdk-compatibility:
    permissions:
      contents: read
      actions: read
    if: ${{ !inputs.publish_skill_hub && !inputs.build_native_pandas }}
    # TestFlight upload currently rebuilds the exact release commit with the
    # App Store-accepted Xcode 26.6 toolchain. Keep this independent gate so
    # the explicit unsupported-Foundation-Models path and the rest of Floe's
    # non-iOS-27 source cannot silently stop compiling.
    runs-on: macos-26
    defaults:
      run:
        working-directory: FloeAgent
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Xcode Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Generate project and resolve dependencies
        run: |
          brew install xcodegen cmake
          scripts/bootstrap_python_runtime.sh
          scripts/gen_project.sh
          swift package resolve
          scripts/pin_check.sh

      - name: Build App Store SDK branch
        run: |
          xcodebuild \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -project FloeAgent.xcodeproj \
            -scheme FloeAgent \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/FloeXcode26DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

  spm-linux-build:
    if: ${{ !inputs.publish_skill_hub && !inputs.build_native_pandas }}
    runs-on: ubuntu-latest
    # mlx-swift 0.31.6 declares Swift tools 6.3 even though the targets built
    # below do not link MLX. Resolution must therefore use a 6.3 toolchain.
    container: swift:6.3
    defaults:
      run:
        working-directory: FloeAgent
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build cross-platform targets
        run: |
          for target in \
            FloeCore \
            FloeModels \
            FloeProviders \
            FloeAgentRuntime \
            FloeTools \
            FloePersistence \
            FloeSecurity \
            FloeSyncCore
          do
            swift build --target "$target"
          done
