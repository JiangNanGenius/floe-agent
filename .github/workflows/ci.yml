# Floe Agent CI.
# Three jobs:
#   build-test (macOS 26 arm64, Xcode 27): SPM build/test + xcodegen +
#     xcodebuild for the iOS app, secret scan, SBOM, license inventory.
#   appstore-sdk-compatibility (macOS 26, Xcode 26.6): keeps the explicit
#     unsupported-Foundation-Models fallback and non-iOS-27 code buildable.
#   spm-linux-build (ubuntu-latest, Swift 6.3): cross-platform compile only —
#     SSE parser, catastrophic gate, canonical JSON, audit chain, GRDB
#     schema remain portable. Tests run on the Apple job because Debian's
#     system SQLite omits GRDB's SQLITE_ENABLE_SNAPSHOT linker symbols.
# The manual ide_only input reruns ONLY the dual-device WorkspaceIDEUITests
# leg after a fresh build-for-testing, reusing this job's dependency prep,
# asset verification and the real App test host. It skips unrelated module
# qualification, Notes checks, other App regressions, the SPM suite and the
# two SDK/Linux jobs; it is targeted rerun evidence, never release
# acceptance, and never changes the default push/PR gates.
name: CI

# Superseded branch checks may stop; release uploads have a separate,
# non-cancelling concurrency group. ide_only dispatches get their own group
# so a targeted IDE rerun cannot cancel or be cancelled by a full run of
# the same ref; the default group string is unchanged when ide_only is off.
concurrency:
  group: floe-ci-${{ github.workflow }}-${{ github.ref }}${{ inputs.feedback_ui && '-ui' || '' }}${{ inputs.live_agent_demo && '-live-demo' || '' }}${{ inputs.local_inference && '-inference' || '' }}${{ inputs.native_wheels_package != '' && format('-wheels-{0}', inputs.native_wheels_package) || '' }}${{ inputs.ide_only && '-ide' || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

on:
  workflow_dispatch:
    inputs:
      live_agent_demo:
        description: 'Only record one explicitly authorized paid text Agent demo'
        type: boolean
        default: false
      demo_source_run:
        description: 'Completed CI source run for the immutable simulator App'
        type: string
        default: ''
      demo_source_sha:
        description: 'Exact source SHA matching the simulator artifact'
        type: string
        default: ''
      local_inference:
        description: 'Run only the pinned Qwen cold-load diagnostic on a macOS host (not iPad acceptance)'
        type: boolean
        default: false
      feedback_ui:
        description: 'Run only the iPad and iPhone feedback component UI checks and capture screenshots'
        type: boolean
        default: false
      palette_only:
        description: 'With feedback_ui, run only the Pencil palette component on both SDKs'
        type: boolean
        default: false
      palette_unit_only:
        description: 'With feedback_ui, rerun only native brush persistence and rendering unit tests'
        type: boolean
        default: false
      publish_skill_hub:
        description: 'Sign and commit official Skill Hub artifacts on the selected trusted branch'
        type: boolean
        default: false
      native_wheels_package:
        description: "Build native CPython 3.13 iOS wheel candidates: a package name from ios-wheelhouse/manifest.json, 'pandas', or 'all'"
        type: string
        default: ''
      build_test_only:
        description: 'Rerun only the build-test leg (skip SDK-compatibility and Linux jobs) after the rest of the matrix is green; rerun evidence, not release acceptance'
        type: boolean
        default: false
      ide_only:
        description: 'Rerun only the dual-device WorkspaceIDEUITests on a freshly built App test host (skips unrelated modules, Notes, other App regressions, SPM suite and SDK/Linux jobs); targeted rerun evidence, not release acceptance'
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

jobs:
  live-agent-demo:
    # ide_only conflicts are rejected by build-test's validation step; never
    # start a potentially paid demo leg from an ambiguous combination.
    if: github.event_name == 'workflow_dispatch' && inputs.live_agent_demo && !inputs.ide_only
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/live-agent-demo.yml
    with:
      source_run: ${{ inputs.demo_source_run }}
      source_sha: ${{ inputs.demo_source_sha }}
      authorize_text_calls: ${{ inputs.live_agent_demo }}
    secrets:
      FLOE_LIVE_DEMO_ARK_KEY: ${{ secrets.FLOE_LIVE_DEMO_ARK_KEY }}
  local-inference:
    if: ${{ !inputs.live_agent_demo && !inputs.ide_only && github.event_name == 'workflow_dispatch' && inputs.local_inference }}
    uses: ./.github/workflows/local-inference-qualification.yml
  feedback-ui:
    if: ${{ !inputs.live_agent_demo && !inputs.ide_only && github.event_name == 'workflow_dispatch' && inputs.feedback_ui }}
    uses: ./.github/workflows/feedback-ui.yml
    with:
      palette_only: ${{ inputs.palette_only }}
      palette_unit_only: ${{ inputs.palette_unit_only }}
  build-native-wheels:
    if: ${{ !inputs.live_agent_demo && !inputs.ide_only && github.event_name == 'workflow_dispatch' && inputs.native_wheels_package != '' }}
    # CPython's upstream testbed still uses UIApplicationDelegate rather than
    # UIScene. Build/test this dependency with the compatible stable SDK;
    # the shipping Floe app and its native smoke tests still use Xcode 27.
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install cibuildwheel==4.2.1
      - run: brew install ninja cmake
      - name: Build wheel candidates
        run: |
          if [ "${{ inputs.native_wheels_package }}" = "pandas" ]; then
            bash FloeAgent/scripts/build_pandas_ios.sh
            mkdir -p ios-wheelhouse/out/pandas
            cp pandas-wheelhouse/*.whl ios-wheelhouse/out/pandas/
          elif [ "${{ inputs.native_wheels_package }}" = "all" ]; then
            for pkg in $(python3 -c "import json; print(' '.join(json.load(open('ios-wheelhouse/manifest.json')['packages'])))"); do
              bash FloeAgent/scripts/build_ios_wheel.sh "$pkg"
            done
          else
            bash FloeAgent/scripts/build_ios_wheel.sh "${{ inputs.native_wheels_package }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: native-wheels-ios-${{ inputs.native_wheels_package }}
          path: ios-wheelhouse/out/
          if-no-files-found: error
  publish-skill-hub:
    if: ${{ !inputs.live_agent_demo && !inputs.ide_only && github.event_name == 'workflow_dispatch' && inputs.publish_skill_hub }}
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install cryptography==46.0.6
      - run: python -m unittest discover -s skill-hub -p 'test_*.py'
      - name: Build and commit immutable WASI artifact
        run: |
          python capability-hub/build.py --test-key --output /tmp/floe-capability-test
          mkdir -p capability-hub/packages
          cp -R /tmp/floe-capability-test/packages/. capability-hub/packages/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add capability-hub/packages
          if ! git diff --cached --quiet; then
            git commit -m 'build: stage immutable WASI command artifact'
            git push origin HEAD
          fi
          echo "FLOE_CAPABILITY_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Sign WASI catalog for the committed artifact
        env:
          FLOE_SKILL_HUB_SIGNING_KEY: ${{ secrets.FLOE_SKILL_HUB_SIGNING_KEY }}
        run: python capability-hub/build.py
      - name: Build and sign official ZIP catalog
        env:
          FLOE_SKILL_HUB_SIGNING_KEY: ${{ secrets.FLOE_SKILL_HUB_SIGNING_KEY }}
        run: python skill-hub/build.py
      - run: python skill-hub/build.py --check
      - name: Commit generated artifacts to the selected branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add capability-hub/catalog.json capability-hub/catalog.sig FloeAgent/FloeApp/Resources/Capabilities skill-hub/catalog.json skill-hub/catalog.sig skill-hub/packages FloeAgent/Sources/FloeSkills/OfficialBundledSkills.generated.swift FloeAgent/Sources/FloeSkills/OfficialSkillHubKeys.generated.swift
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish signed official skills / 发布官方签名技能包'
            git push origin HEAD
          fi
  build-test:
    permissions:
      contents: read
      actions: read
    # Normally excluded whenever another single-purpose mode is selected.
    # ide_only is allowed through even together with another selector so the
    # validation step below can fail the ambiguous combination explicitly
    # instead of silently ignoring ide_only.
    if: ${{ (!inputs.live_agent_demo && !inputs.local_inference && !inputs.feedback_ui && !inputs.publish_skill_hub && inputs.native_wheels_package == '') || inputs.ide_only }}
    # Foundation Models is guarded by Swift 6.4. Building on the generic
    # macOS 26 image (Xcode 26.6) silently selects the unsupported stub.
    runs-on: xcode-27
    defaults:
      run:
        working-directory: FloeAgent
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
    steps:
      # Fail fast, before checkout and dependency preparation: ide_only is a
      # standalone rerun mode and never combines with another selector.
      # This step runs before checkout, so it cannot rely on the job-level
      # working-directory (FloeAgent does not exist yet).
      - name: Reject ambiguous ide_only combinations
        if: ${{ inputs.ide_only && (inputs.live_agent_demo || inputs.local_inference || inputs.feedback_ui || inputs.publish_skill_hub || inputs.native_wheels_package != '' || inputs.build_test_only) }}
        working-directory: .
        run: |
          echo "ide_only must be dispatched alone: it cannot combine with live_agent_demo, local_inference, feedback_ui, publish_skill_hub, native_wheels_package or build_test_only." >&2
          exit 1

      - uses: actions/checkout@v5

      # Authenticate the signed catalog and stage the pinned lua.wasm fixture.
      # The repository-tracked artifact is the only source: there is no
      # download fallback and no network use.  The verifier imports
      # cryptography, which clean runners do not ship, so it is pinned in a
      # throwaway venv rather than relying on image-provided packages.
      - name: Install pinned catalog verification dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/floe-lua-venv"
          "$RUNNER_TEMP/floe-lua-venv/bin/pip" install cryptography==46.0.6

      # Assign the path before writing GITHUB_ENV: when preparation fails,
      # the assignment's non-zero status aborts this step and nothing is
      # exported, instead of masking the failure with an empty FLOE_LUA_WASI.
      # GITHUB_ENV exports FLOE_LUA_WASI to every later step in this job,
      # including the Qualification swift test runs.
      - name: Prepare the pinned Lua WASI fixture
        run: |
          "$RUNNER_TEMP/floe-lua-venv/bin/python" scripts/tests/test_prepare_lua_qualification.py
          floe_lua_wasi="$("$RUNNER_TEMP/floe-lua-venv/bin/python" scripts/prepare_lua_qualification.py)" || exit 1
          echo "FLOE_LUA_WASI=$floe_lua_wasi" >> "$GITHUB_ENV"

      # Unrelated module qualification: skipped by the ide_only rerun.
      - name: Qualify environment, package, media and job modules
        if: ${{ success() && !inputs.ide_only }}
        run: |
          set -o pipefail
          python3 scripts/run_test_with_diagnostics.py --output-dir "$RUNNER_TEMP/PlatformQualificationDiagnostics" --timeout 1200 -- swift test --package-path Qualification --scratch-path .build --force-resolved-versions --jobs 4 2>&1 | tee platform-qualification.log
      - name: Qualify durable Notes storage and editable archives
        if: ${{ success() && !inputs.ide_only }}
        run: python3 scripts/run_test_with_diagnostics.py --output-dir "$RUNNER_TEMP/NotesQualificationDiagnostics" --timeout 1200 -- swift test --package-path Qualification/Notes --scratch-path .build --force-resolved-versions --jobs 4
      - name: Upload platform qualification evidence
        if: ${{ always() && !inputs.ide_only }}
        uses: actions/upload-artifact@v4
        with:
          name: platform-qualification-${{ github.sha }}
          path: |
            FloeAgent/platform-qualification.log
            ${{ runner.temp }}/PlatformQualificationDiagnostics
            ${{ runner.temp }}/NotesQualificationDiagnostics


      - name: Install Xcode Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Verify test-runner recovery before compiling
        run: |
          python3 -m unittest discover -s scripts -p test_run_test_with_diagnostics.py
          python3 -m unittest discover -s scripts/tests -p test_ci_ide_only.py
          python3 -m unittest discover -s scripts/tests -p test_select_test_simulator.py
          python3 scripts/validate_localization_catalog.py FloeApp/Resources/Localizable.xcstrings
          python3 -m unittest discover -s scripts/tests -p test_localization_catalog.py
          python3 -m unittest discover -s scripts/tests -p test_release_preflight_versions.py

      - name: Generate Xcode project
        run: |
          brew install xcodegen automake cmake
          scripts/bootstrap_python_runtime.sh
          scripts/gen_project.sh

      - name: Verify persistent Node host and pinned tools
        run: |
          python3 scripts/check_ide_assets.py
          python3 scripts/check_engineering_viewer_assets.py
          node --test scripts/tests/node_host.test.cjs scripts/tests/pnpm_unicode.test.cjs scripts/tests/notes_bridge.test.cjs scripts/tests/ide_filesystem.test.cjs
          python3 scripts/tests/test_python_package_inspection.py
          python3 -m unittest discover -s scripts/tests -p test_cpython_output.py
          python3 -m unittest discover -s scripts/tests -p test_pdfium_linkage.py
          python3 scripts/test_http_workflow.py
          python3 scripts/test_local_package_payloads.py
          bash scripts/pin_node_tools.sh --check

      - name: Resolve and pin-check dependencies
        run: |
          swift package resolve
          scripts/pin_check.sh

      # Bundled fonts are gitignored build inputs staged by the fetch script.
      # A cache hit makes --check instant; a miss re-downloads every pinned
      # upstream and then re-verifies per-file SHA-256 provenance.
      - name: Restore bundled font cache
        uses: actions/cache@v4
        with:
          path: |
            FloeAgent/Vendor/Fonts/downloads
            FloeAgent/FloeApp/Resources/Fonts/Bundled
          key: floe-fonts-${{ hashFiles('FloeAgent/scripts/fonts/manifest.json') }}

      - name: Fetch and verify bundled fonts
        run: |
          python3 scripts/fonts/fetch_fonts.py --check || {
            python3 scripts/fonts/fetch_fonts.py
            python3 scripts/fonts/fetch_fonts.py --check
          }

      - name: Guardian real subprocess cancellation regressions
        run: python3 scripts/test_remote_task_cancel.py

      - name: Guardian real PTY lifecycle regressions
        run: python3 scripts/test_remote_shell.py

      - name: Office save and ink bridge contracts
        run: |
          python3 scripts/test_office_explicit_save.py
          python3 scripts/tests/test_office_ink_bridge.py

      - name: Build App regression host once
        id: app_regression_build
        timeout-minutes: 90
        run: |
          xcodebuild \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -scheme FloeAgent \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath FloeAgent-AppRegressionBuild \
            -parallel-testing-enabled NO \
            -only-testing:FloeAppTests/CanvasTouchInteractionTests \
            -only-testing:FloeAppTests/CanvasSavedImageBatchAtomicityTests \
            -only-testing:FloeAppTests/CanvasAgentToolContractTests \
            -only-testing:FloeAppTests/CrashAndFeedbackRegressionTests \
            -only-testing:FloeAppTests/ThreadTimelineTests \
            -only-testing:FloeAppTests/BrowserProtocolTests \
            -only-testing:FloeAppTests/HomeChatSeparationTests \
            -only-testing:FloeAppTests/HomeTaskCreationTests \
            -only-testing:FloeAppTests/MailConnectorTests \
            -only-testing:FloeAppTests/SkillLifecycleTests \
            -only-testing:FloeAppTests/LocalPythonRuntimeTests \
            -only-testing:FloeAppTests/LocalShellRuntimeTests \
            -only-testing:FloeAppTests/LocalServiceLifecycleTests \
            -only-testing:FloeAppTests/LuaShellInstallTests \
            -only-testing:FloeAppTests/IDEGitHubActionsTests \
            -only-testing:FloeAppTests/EnvironmentLanguagePackageTests \
            -only-testing:FloeAppTests/IDELanguageRunPolicyTests \
            -only-testing:FloeAppTests/IDERunSourceStagingTests \
            -only-testing:FloeAgentUITests/NotesWorkspaceImportUITests \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            build-for-testing

      - name: Retain the complete compiled test host before UI execution
        run: |
          products="FloeAgent-AppRegressionBuild/Build/Products"
          test -n "$(find "$products" -maxdepth 1 -name '*.xctestrun' -print -quit)"
          test -n "$(find "$products" -type d -name 'FloeAgentUITests-Runner.app' -print -quit)"
          archive="$RUNNER_TEMP/FloeCompiledTestHost"
          mkdir -p "$archive"
          tar -czf "$archive/Products.tar.gz" -C FloeAgent-AppRegressionBuild/Build Products
          (cd "$archive" && shasum -a 256 Products.tar.gz > Products.tar.gz.sha256)
          git rev-parse HEAD > "$archive/SOURCE-SHA.txt"
          xcodebuild -version > "$archive/TOOLCHAIN.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$archive/SOURCE-RUN.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$archive/SOURCE-ATTEMPT.txt"

      - name: Upload recoverable compiled test host
        uses: actions/upload-artifact@v4
        with:
          name: compiled-test-host-${{ github.sha }}
          path: ${{ runner.temp }}/FloeCompiledTestHost/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Run Canvas, PiP, timeline and execution regressions
        if: ${{ success() && !inputs.ide_only }}
        timeout-minutes: 20
        run: |
          xctestrun=$(find FloeAgent-AppRegressionBuild/Build/Products -maxdepth 1 -name '*.xctestrun' -print -quit)
          test -n "$xctestrun"
          test_device=$(xcrun simctl list devices available -j | python3 scripts/select_test_simulator.py --sdk-major 27 --name "iPad mini (A17 Pro)" --family iPad --create)
          # The first test phase of the job boots the simulator from scratch;
          # finish boot and services before XCTest starts its own clock.
          xcrun simctl boot "$test_device" || true
          xcrun simctl bootstatus "$test_device" -b
          attempt=1
          while true; do
            code=0
            # The retry must not reuse the first attempt's diagnostics
            # directory (the runner refuses an existing directory) nor its
            # partial result bundle (xcodebuild refuses an existing path).
            diag_dir="$RUNNER_TEMP/SwiftTestDiagnostics/app-regressions-attempt-$attempt"
            python3 scripts/run_test_with_diagnostics.py \
              --output-dir "$diag_dir" \
              --timeout 1020 --stall-timeout 420 --startup-stall-timeout 420 --simulator-id "$test_device" -- xcodebuild \
              -xctestrun "$xctestrun" \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              -destination "platform=iOS Simulator,id=$test_device" \
              -resultBundlePath FloeAgent-AppRegressionTests.xcresult \
              -collect-test-diagnostics never \
              -parallel-testing-enabled NO \
              -only-testing:FloeAppTests/CanvasTouchInteractionTests \
              -only-testing:FloeAppTests/CanvasSavedImageBatchAtomicityTests \
              -only-testing:FloeAppTests/CanvasAgentToolContractTests \
              -only-testing:FloeAppTests/CrashAndFeedbackRegressionTests \
              -only-testing:FloeAppTests/ThreadTimelineTests \
              -only-testing:FloeAppTests/BrowserProtocolTests \
              -only-testing:FloeAppTests/HomeChatSeparationTests \
              -only-testing:FloeAppTests/HomeTaskCreationTests \
              -only-testing:FloeAppTests/MailConnectorTests \
              -only-testing:FloeAppTests/SkillLifecycleTests \
              -only-testing:FloeAppTests/LocalPythonRuntimeTests \
              -only-testing:FloeAppTests/LocalShellRuntimeTests \
              -only-testing:FloeAppTests/LocalServiceLifecycleTests \
              -only-testing:FloeAppTests/LuaShellInstallTests \
              -only-testing:FloeAppTests/IDEGitHubActionsTests \
              -only-testing:FloeAppTests/EnvironmentLanguagePackageTests \
              -only-testing:FloeAppTests/IDELanguageRunPolicyTests \
              -only-testing:FloeAppTests/IDERunSourceStagingTests \
              -test-timeouts-enabled YES \
              -maximum-test-execution-time-allowance 300 \
              -retry-tests-on-failure -test-iterations 2 \
              CODE_SIGNING_ALLOWED=NO \
              test-without-building || code=$?
            # Retry exactly once when the runner stalled before any test ran;
            # a retry can never mask an executed test's real failure.
            if [ "$code" -eq 124 ] && [ "$attempt" -eq 1 ] && \
               python3 -c 'import json,sys; s=json.load(open(sys.argv[1])); sys.exit(0 if (s.get("reason")=="stalled" and not s.get("testsStarted")) else 1)' \
                 "$diag_dir/summary.json"; then
              if test -d FloeAgent-AppRegressionTests.xcresult; then
                mv FloeAgent-AppRegressionTests.xcresult FloeAgent-AppRegressionTests-attempt-1.xcresult
              fi
              attempt=2
              xcrun simctl shutdown "$test_device" || true
              xcrun simctl boot "$test_device" || true
              xcrun simctl bootstatus "$test_device" -b
              continue
            fi
            break
          done
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          python3 scripts/verify_app_regression_xcresult.py \
            --result-bundle FloeAgent-AppRegressionTests.xcresult

      - name: Verify Notes workspace import and retain full App screenshots
        # Skip when the shared test host was never built; a missing xctestrun
        # must not mask the real build failure with a secondary UI error.
        # Also skipped by the ide_only rerun, which targets the IDE legs only.
        if: ${{ !cancelled() && !inputs.ide_only && steps.app_regression_build.outcome == 'success' }}
        # Two devices each have three independently bounded 300-second tests.
        # The phase must also allow boot, runner teardown and evidence export.
        timeout-minutes: 25
        run: |
          set -o pipefail
          status=0
          xctestrun=$(find FloeAgent-AppRegressionBuild/Build/Products -maxdepth 1 -name '*.xctestrun' -print -quit)
          test -n "$xctestrun"
          for device in 'iPad mini (A17 Pro)' 'iPhone 17 Pro'; do
            case "$device" in iPad*) name=ipad ;; *) name=iphone ;; esac
            # Sequential UI runners must not compete with the previous simulator.
            # Preserve the prior xcresult; establish boot readiness before XCTest.
            xcrun simctl shutdown all || true
            # Runner device lists change between images (a model that existed
            # on iOS 27 can vanish), so after the exact name prefer any
            # available device of the same family on iOS 27, then create a
            # task-specific one; the selector never leaves the iOS 27 major.
            test_device=$(xcrun simctl list devices available -j | python3 scripts/select_test_simulator.py --sdk-major 27 --name "$device" --family "${device%% *}" --create)
            test -n "$test_device"
            xcrun simctl boot "$test_device"
            xcrun simctl bootstatus "$test_device" -b
            mkdir -p FloeAgent-Notes-Recordings
            xcrun simctl io "$test_device" recordVideo --codec=h264 --force "FloeAgent-Notes-Recordings/$name.mp4" > "FloeAgent-Notes-Recordings/$name.log" 2>&1 &
            recording_pid=$!
            trap 'kill -INT "$recording_pid" 2>/dev/null || true' EXIT
            leg_attempt=1
            while true; do
              leg_code=0
              # Per-attempt diagnostics, same rule as the IDE leg: the retry
              # must never overwrite first-attempt evidence. The startup quiet
              # phase is bounded at 420s while the post-test quiet deadline
              # stays 210s; the total 660s cap is unchanged.
              diag_dir="$RUNNER_TEMP/SwiftTestDiagnostics/notes-$name-attempt-$leg_attempt"
              python3 scripts/run_test_with_diagnostics.py \
                --output-dir "$diag_dir" \
                --timeout 660 --stall-timeout 210 --startup-stall-timeout 420 --simulator-id "$test_device" -- \
                xcodebuild -skipPackagePluginValidation -skipMacroValidation -xctestrun "$xctestrun" \
                -destination "platform=iOS Simulator,id=$test_device" \
                -resultBundlePath "FloeAgent-Notes-$name.xcresult" \
                -collect-test-diagnostics never \
                -only-testing:FloeAgentUITests/NotesWorkspaceImportUITests \
                -parallel-testing-enabled NO -test-timeouts-enabled YES \
                -maximum-test-execution-time-allowance 300 \
                -retry-tests-on-failure -test-iterations 2 \
                CODE_SIGNING_ALLOWED=NO test-without-building 2>&1 | tee "FloeAgent-Notes-$name-attempt-$leg_attempt.log" || leg_code=$?
              # One retry only when the runner stalled before any test started.
              if [ "$leg_code" -eq 124 ] && [ "$leg_attempt" -eq 1 ] && \
                 python3 -c 'import json,sys; s=json.load(open(sys.argv[1])); sys.exit(0 if (s.get("reason")=="stalled" and not s.get("testsStarted")) else 1)' \
                   "$diag_dir/summary.json"; then
                # Keep any partial first-attempt bundle; xcodebuild refuses an
                # existing -resultBundlePath, so the retry needs a clear path.
                if test -d "FloeAgent-Notes-$name.xcresult"; then
                  mv "FloeAgent-Notes-$name.xcresult" "FloeAgent-Notes-$name-attempt-1.xcresult"
                fi
                leg_attempt=2
                kill -INT "$recording_pid" 2>/dev/null || true
                wait "$recording_pid" || true
                xcrun simctl shutdown "$test_device" || true
                xcrun simctl boot "$test_device"
                xcrun simctl bootstatus "$test_device" -b
                xcrun simctl io "$test_device" recordVideo --codec=h264 --force "FloeAgent-Notes-Recordings/$name-attempt-$leg_attempt.mp4" >> "FloeAgent-Notes-Recordings/$name.log" 2>&1 &
                recording_pid=$!
                continue
              fi
              [ "$leg_code" -ne 0 ] && status=1
              break
            done
            kill -INT "$recording_pid" 2>/dev/null || true
            wait "$recording_pid" || true
            trap - EXIT
            if test -d "FloeAgent-Notes-$name.xcresult"; then
              python3 scripts/verify_notes_ui_xcresult.py --simulator-without-office --result-bundle "FloeAgent-Notes-$name.xcresult" \
                --summary-output "FloeAgent-Notes-$name-summary.json" || status=1
            else
              echo "FloeAgent-Notes-$name.xcresult was never produced; the leg has no verifiable result." >&2
              status=1
            fi
            if test -d "FloeAgent-Notes-$name.xcresult"; then
              mkdir -p "FloeAgent-Notes-Screenshots/$name"
              xcrun xcresulttool export attachments --path "FloeAgent-Notes-$name.xcresult" \
                --output-path "FloeAgent-Notes-Screenshots/$name" || true
            fi
          done
          exit "$status"

      - name: Verify IDE native saves and retain workbench screenshots
        # Same skip rule as the Notes phase: only run against a host that the
        # build-for-testing step actually produced; real UI failures after a
        # successful build are still reported and never retried into passes.
        if: ${{ !cancelled() && steps.app_regression_build.outcome == 'success' }}
        # Two device legs, each rebuilding the drawing engine; a slow snapshot
        # window once pushed the phase past fifteen minutes despite passing.
        timeout-minutes: 25
        run: |
          set -o pipefail
          status=0
          xctestrun=$(find FloeAgent-AppRegressionBuild/Build/Products -maxdepth 1 -name '*.xctestrun' -print -quit)
          test -n "$xctestrun"
          for device in 'iPad mini (A17 Pro)' 'iPhone 17 Pro'; do
            case "$device" in iPad*) name=ipad ;; *) name=iphone ;; esac
            xcrun simctl shutdown all || true
            # Same family fallback and task-specific creation as the Notes
            # leg: exact name first, then any available iOS 27 device of the
            # family, then a created one; never another SDK major.
            test_device=$(xcrun simctl list devices available -j | python3 scripts/select_test_simulator.py --sdk-major 27 --name "$device" --family "${device%% *}" --create)
            test -n "$test_device"
            xcrun simctl boot "$test_device"
            xcrun simctl bootstatus "$test_device" -b
            leg_attempt=1
            while true; do
              leg_code=0
              # Per-attempt diagnostics: the runner refuses an existing output
              # directory so first-attempt evidence can never be overwritten
              # by the retry (run 35216642942 retry died on FileExistsError).
              # A passing run also reached the startup sampling threshold.
              # Allow a separate bounded startup margin (420s), collecting
              # xcodebuild stacks rather than assuming a quiet launch is
              # healthy. Tests keep their 210s quiet limit and 900s total cap.
              diag_dir="$RUNNER_TEMP/SwiftTestDiagnostics/ide-$name-attempt-$leg_attempt"
              python3 scripts/run_test_with_diagnostics.py \
                --output-dir "$diag_dir" \
                --timeout 900 --stall-timeout 210 --startup-stall-timeout 420 --simulator-id "$test_device" -- \
                xcodebuild -skipPackagePluginValidation -skipMacroValidation -xctestrun "$xctestrun" \
                -destination "platform=iOS Simulator,id=$test_device" \
                -resultBundlePath "FloeAgent-IDE-$name.xcresult" \
                -collect-test-diagnostics never -only-testing:FloeAgentUITests/WorkspaceIDEUITests \
                -parallel-testing-enabled NO -test-timeouts-enabled YES \
                -maximum-test-execution-time-allowance 300 \
                -retry-tests-on-failure -test-iterations 2 \
                CODE_SIGNING_ALLOWED=NO test-without-building 2>&1 | tee "FloeAgent-IDE-$name-attempt-$leg_attempt.log" || leg_code=$?
              # One retry only when the runner stalled before any test started.
              if [ "$leg_code" -eq 124 ] && [ "$leg_attempt" -eq 1 ] && \
                 python3 -c 'import json,sys; s=json.load(open(sys.argv[1])); sys.exit(0 if (s.get("reason")=="stalled" and not s.get("testsStarted")) else 1)' \
                   "$diag_dir/summary.json"; then
                # Keep any partial first-attempt bundle; xcodebuild refuses an
                # existing -resultBundlePath, so the retry needs a clear path.
                if test -d "FloeAgent-IDE-$name.xcresult"; then
                  mv "FloeAgent-IDE-$name.xcresult" "FloeAgent-IDE-$name-attempt-1.xcresult"
                fi
                leg_attempt=2
                xcrun simctl shutdown "$test_device" || true
                xcrun simctl boot "$test_device"
                xcrun simctl bootstatus "$test_device" -b
                continue
              fi
              [ "$leg_code" -ne 0 ] && status=1
              break
            done
            # A missing bundle is a leg failure, not a verifier traceback.
            if test -d "FloeAgent-IDE-$name.xcresult"; then
              python3 scripts/verify_ide_ui_xcresult.py --result-bundle "FloeAgent-IDE-$name.xcresult" \
                --summary-output "FloeAgent-IDE-$name-summary.json" || status=1
            else
              echo "FloeAgent-IDE-$name.xcresult was never produced; the leg has no verifiable result." >&2
              status=1
            fi
            if test -d "FloeAgent-IDE-$name.xcresult"; then
              mkdir -p "FloeAgent-IDE-Screenshots/$name"
              xcrun xcresulttool export attachments --path "FloeAgent-IDE-$name.xcresult" \
                --output-path "FloeAgent-IDE-Screenshots/$name" || true
            fi
          done
          exit "$status"

      - name: Preserve simulator app for iPad and iPhone UI qualification
        if: always()
        run: |
          python3 - <<'PYAPP'
          import pathlib, plistlib, subprocess
          products = pathlib.Path('FloeAgent-AppRegressionBuild/Build/Products/Debug-iphonesimulator')
          for app in products.glob('*.app'):
              info = app / 'Info.plist'
              if not info.is_file():
                  continue
              with info.open('rb') as handle:
                  bundle = plistlib.load(handle)
              if bundle.get('CFBundleIdentifier') == 'org.floeagent.ios':
                  subprocess.run(['ditto', '-c', '-k', '--keepParent', str(app), 'FloeAgent-Simulator.zip'], check=True)
                  break
          PYAPP
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-app-${{ github.sha }}
          path: FloeAgent/FloeAgent-Simulator.zip
          if-no-files-found: ignore
          retention-days: 7

      - name: SPM test (cross-platform targets)
        if: ${{ success() && !inputs.ide_only }}
        run: |
          # SwiftPM links the universal llama binary into the local-model test
          # bundle but does not copy the macOS framework beside xctest. Put it
          # in the standard PackageFrameworks rpath before the test helper
          # loads bundles; no model inference is performed by these tests.
          # The upstream artifact also contains a __MACOSX metadata tree whose
          # fake framework only contains AppleDouble files. Never select it.
          LLAMA_FRAMEWORK="$(find .build/artifacts -path '*/macos-arm64_x86_64/llama.framework' ! -path '*/__MACOSX/*' -print -quit)"
          test -n "$LLAMA_FRAMEWORK"
          test -x "$LLAMA_FRAMEWORK/Versions/Current/llama"
          # SwiftPM may write test bundles under
          # .build/out/Products/Debug while --show-bin-path still reports the
          # target-triple directory. Make the binary artifact discoverable to
          # dyld and mirror it beside every products directory SwiftPM created.
          DYLD_FRAMEWORK_PATH="$(dirname "$LLAMA_FRAMEWORK")${DYLD_FRAMEWORK_PATH:+:$DYLD_FRAMEWORK_PATH}"
          export DYLD_FRAMEWORK_PATH
          # Materialize SwiftPM's product directories before staging the
          # binary llama framework required by the test loaders.
          swift build
          BIN_PATH="$(swift build --show-bin-path)"
          mkdir -p "$BIN_PATH/PackageFrameworks"
          cp -R "$LLAMA_FRAMEWORK" "$BIN_PATH/PackageFrameworks/"
          while IFS= read -r PRODUCTS_DIR; do
            mkdir -p "$PRODUCTS_DIR/PackageFrameworks"
            cp -R "$LLAMA_FRAMEWORK" "$PRODUCTS_DIR/PackageFrameworks/"
          done < <(find .build -type d -path '*/Products/Debug')
          find "$BIN_PATH/PackageFrameworks/llama.framework" -name '._*' -delete
          # Deadline tests intentionally outlive the caller briefly. Isolate
          # JavaScript and network suites so loaded shared runners cannot make their
          # wall-clock assertions interfere with unrelated concurrent tests.
          python3 scripts/run_test_with_diagnostics.py --output-dir "$RUNNER_TEMP/SwiftTestDiagnostics/full" -- swift test \
            --skip 'FloeExecutionTests.JavaScriptEngineTests' \
            --skip 'FloeExecutionTests.JavaScriptExecutionToolTests' \
            --skip 'FloeExecutionTests.NetworkDiagnosticToolsTests'
          python3 scripts/run_test_with_diagnostics.py --output-dir "$RUNNER_TEMP/SwiftTestDiagnostics/javascript-engine" -- swift test --filter 'FloeExecutionTests.JavaScriptEngineTests'
          python3 scripts/run_test_with_diagnostics.py --output-dir "$RUNNER_TEMP/SwiftTestDiagnostics/javascript-tool" -- swift test --filter 'FloeExecutionTests.JavaScriptExecutionToolTests'
          # Keep the eight-way blocking lookup race, but isolate its wall-clock
          # deadline from unrelated suites competing for the cooperative pool.
          python3 scripts/run_test_with_diagnostics.py --output-dir "$RUNNER_TEMP/SwiftTestDiagnostics/network-deadlines" -- swift test --filter 'FloeExecutionTests.NetworkDiagnosticToolsTests'

      - name: Secret scan
        run: |
          brew install gitleaks
          scripts/secret_scan.sh

      - name: SBOM
        run: |
          brew install syft
          scripts/sbom.sh

      - name: License inventory
        run: scripts/license_inventory.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            FloeAgent/sbom.spdx.json
            FloeAgent/LICENSES-THIRD-PARTY.md
            FloeAgent/.gitleaks-report.json
            FloeAgent/FloeAgent-AppRegressionTests.xcresult
            FloeAgent/FloeAgent-AppRegressionTests-attempt-*.xcresult
            FloeAgent/FloeAgent-Notes-*.xcresult
            FloeAgent/FloeAgent-Notes-*.log
            FloeAgent/FloeAgent-IDE-*.log
            FloeAgent/FloeAgent-IDE-*.json
            FloeAgent/FloeAgent-IDE-*.xcresult
            FloeAgent/FloeAgent-IDE-Screenshots
            FloeAgent/FloeAgent-Notes-*-summary.json
            FloeAgent/FloeAgent-Notes-Screenshots
            FloeAgent/FloeAgent-Notes-Recordings
            ${{ runner.temp }}/SwiftTestDiagnostics
          if-no-files-found: ignore

  appstore-sdk-compatibility:
    permissions:
      contents: read
      actions: read
    # build_test_only reruns the failed build-test leg of an otherwise-green
    # matrix without paying another ~33-minute SDK 26 compile that already
    # passed.  It is rerun evidence only, never release acceptance, and never
    # gates push/PR runs (inputs are empty there, so this condition is true).
    # The ide_only rerun also skips this job; it re-verifies the IDE UI legs
    # only and never substitutes for release qualification.
    if: ${{ !inputs.live_agent_demo && !inputs.local_inference && !inputs.feedback_ui && !inputs.publish_skill_hub && inputs.native_wheels_package == '' && !inputs.build_test_only && !inputs.ide_only }}
    # TestFlight upload currently rebuilds the exact release commit with the
    # App Store-accepted Xcode 26.6 toolchain. Keep this independent gate so
    # the explicit unsupported-Foundation-Models path and the rest of Floe's
    # non-iOS-27 source cannot silently stop compiling.
    runs-on: macos-26
    defaults:
      run:
        working-directory: FloeAgent
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Xcode Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Generate project and resolve dependencies
        run: |
          brew install xcodegen automake cmake
          scripts/bootstrap_python_runtime.sh
          scripts/gen_project.sh
          swift package resolve
          scripts/pin_check.sh

      # This job compiles the release-shaped app: it needs the same verified
      # bundled fonts as the release pipeline.
      - name: Restore bundled font cache
        uses: actions/cache@v4
        with:
          path: |
            FloeAgent/Vendor/Fonts/downloads
            FloeAgent/FloeApp/Resources/Fonts/Bundled
          key: floe-fonts-${{ hashFiles('FloeAgent/scripts/fonts/manifest.json') }}

      - name: Fetch and verify bundled fonts
        run: |
          python3 scripts/fonts/fetch_fonts.py --check || {
            python3 scripts/fonts/fetch_fonts.py
            python3 scripts/fonts/fetch_fonts.py --check
          }

      - name: Build App Store SDK branch
        run: |
          xcodebuild \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -project FloeAgent.xcodeproj \
            -scheme FloeAgent \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/FloeXcode26DerivedData" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
            build

  spm-linux-build:
    # Skipped together with appstore-sdk-compatibility by build_test_only;
    # that input only reruns the failed build-test leg and never gates
    # push/PR runs (inputs are empty there, so this condition is true).
    # Also skipped by the ide_only rerun.
    if: ${{ !inputs.live_agent_demo && !inputs.local_inference && !inputs.feedback_ui && !inputs.publish_skill_hub && inputs.native_wheels_package == '' && !inputs.build_test_only && !inputs.ide_only }}
    runs-on: ubuntu-latest
    # mlx-swift 0.31.6 declares Swift tools 6.3 even though the targets built
    # below do not link MLX. Resolution must therefore use a 6.3 toolchain.
    container: swift:6.3
    defaults:
      run:
        working-directory: FloeAgent
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build cross-platform targets
        run: |
          for target in \
            FloeCore \
            FloeModels \
            FloeProviders \
            FloeAgentRuntime \
            FloeTools \
            FloePersistence \
            FloeSecurity \
            FloeSyncCore
          do
            swift build --target "$target"
          done
