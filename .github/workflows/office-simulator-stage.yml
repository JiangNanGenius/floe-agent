name: Office PPT simulator stage diagnostics
# Cloud simulator evidence for the PPT/PPTX open chain. The pinned Collabora
# engine has no iphonesimulator slice, so this workflow can only prove the
# blocker honestly: it verifies the pinned framework is device-only, builds the
# real App for the simulator, drives the real Workspace/Notes/IDE entry paths
# with real PPTX/DOCX fixtures and retains the App's durable stage trace,
# screenshots and xcresult. It never claims a first frame, edit, save or
# device result; those remain the separate device gate.
on:
  workflow_dispatch:
  push:
    branches: ['codex/office-simulator-stage']
    paths:
      - '.github/workflows/office-simulator-stage.yml'
      - 'FloeAgent/scripts/check_office_simulator_blocker.py'
      - 'FloeAgent/scripts/verify_office_simulator_stage_trace.py'
      - 'FloeAgent/Tests/FloeAgentUITests/OfficeSimulatorStageUITests.swift'
permissions:
  contents: read
  actions: read
concurrency:
  group: office-simulator-stage
  cancel-in-progress: false
jobs:
  simulator-stage:
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: FloeAgent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove the pinned Office host has no simulator slice
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/pinned-host"
          gh run download 36000058922 -n office-native-host-unsigned -D "$RUNNER_TEMP/pinned-host"
          ditto -x -k "$RUNNER_TEMP/pinned-host/OfficeNativeHost.zip" "$RUNNER_TEMP/pinned-host/extracted"
          expected="$(python3 -c 'import json;print(json.load(open("ThirdParty/Collabora/engine.lock.json"))["qualifiedHostArtifact"]["executableSHA256"])')"
          python3 scripts/check_office_simulator_blocker.py \
            "$RUNNER_TEMP/pinned-host/extracted/OfficeNativeHost/FloeOfficeNative.framework" \
            --expected-executable-sha256 "$expected" \
            --output "$RUNNER_TEMP/simulator-blocker.json"

      - name: Focused Office harness checks
        run: |
          set -o pipefail
          FLOE_OFFICE_HOST_FRAMEWORK="$RUNNER_TEMP/pinned-host/extracted/OfficeNativeHost/FloeOfficeNative.framework" \
          FLOE_OFFICE_HOST_EXECUTABLE_SHA256="$(python3 -c 'import json;print(json.load(open("ThirdParty/Collabora/engine.lock.json"))["qualifiedHostArtifact"]["executableSHA256"])')" \
            python3 -m unittest discover -s scripts/tests -p 'test_office_simulator_*.py' 2>&1 | tee "$RUNNER_TEMP/office-simulator-harness.log"
          python3 -m unittest discover -s scripts/tests -p 'test_office_edit_entry_bounds.py'
          python3 scripts/office_simulator_guard.py > "$RUNNER_TEMP/office-simulator-guard.json"
          python3 scripts/office_render_readiness.py > "$RUNNER_TEMP/office-render-readiness.json"

      - name: Prepare pinned native components and generate the project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          brew install xcodegen
          python3 scripts/test_office_host_bootstrap.py
          python3 scripts/test_office_app_load_chain.py
          python3 scripts/bootstrap_pdfium.py
          python3 scripts/bootstrap_libarchive.py
          python3 scripts/bootstrap_office_host.py
          python3 scripts/audit_native_runtime_free.py --project
          xcodegen generate

      - name: Build the App simulator test host
        id: build
        run: |
          set -o pipefail
          xcodebuild -project FloeAgent.xcodeproj -scheme FloeAgent \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/OfficeSimulatorStageBuild" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
            -only-testing:FloeAgentUITests/OfficeSimulatorStageUITests \
            build-for-testing 2>&1 | tee "$RUNNER_TEMP/office-simulator-build.log"

      - name: Run the real PPTX/DOCX entry paths on the iPad simulator
        id: run_tests
        timeout-minutes: 35
        run: |
          set -o pipefail
          xctestrun=$(find "$RUNNER_TEMP/OfficeSimulatorStageBuild/Build/Products" -maxdepth 1 -name '*.xctestrun' -print -quit)
          test -n "$xctestrun"
          simulator=$(xcrun simctl list devices available -j | python3 scripts/select_test_simulator.py \
            --sdk-major 27 --name "iPad mini (A17 Pro)" --family iPad --create)
          echo "OFFICE_SIMULATOR_ID=$simulator" >> "$GITHUB_ENV"
          xcrun simctl shutdown "$simulator" || true
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b
          python3 scripts/run_test_with_diagnostics.py \
            --output-dir "$RUNNER_TEMP/office-simulator-diagnostics" \
            --timeout 1500 --stall-timeout 300 --startup-stall-timeout 480 \
            --simulator-id "$simulator" -- \
            xcodebuild -skipPackagePluginValidation -skipMacroValidation \
            -xctestrun "$xctestrun" \
            -destination "platform=iOS Simulator,id=$simulator" \
            -resultBundlePath office-simulator-stage-ipad.xcresult \
            -collect-test-diagnostics never \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 600 \
            -only-testing:FloeAgentUITests/OfficeSimulatorStageUITests \
            CODE_SIGNING_ALLOWED=NO test-without-building 2>&1 | tee office-simulator-stage-ipad.log

      - name: Pull the durable App stage trace from the simulator container
        if: always()
        run: |
          set -o pipefail
          test -n "${OFFICE_SIMULATOR_ID:-}" || exit 0
          container="$(xcrun simctl get_app_container "$OFFICE_SIMULATOR_ID" org.floeagent.ios data 2>/dev/null || true)"
          if test -n "$container"; then
            cp "$container/Library/Application Support/FloeAgent/OfficeDiagnostics/office-stage.jsonl" \
              "$RUNNER_TEMP/office-stage.jsonl" || true
            xcrun simctl spawn "$OFFICE_SIMULATOR_ID" log show --last 30m --style compact \
              --predicate 'eventMessage CONTAINS "[FloeOfficeStage]"' \
              > "$RUNNER_TEMP/office-stage-console.log" 2>&1 || true
          fi
          if test -f "$RUNNER_TEMP/office-stage.jsonl"; then
            python3 scripts/verify_office_simulator_stage_trace.py \
              --trace "$RUNNER_TEMP/office-stage.jsonl" \
              --blocker-receipt "$RUNNER_TEMP/simulator-blocker.json" \
              --result-bundle office-simulator-stage-ipad.xcresult \
              --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
              --output "$RUNNER_TEMP/office-simulator-receipt.json"
          else
            echo "No App stage trace was pulled; the run must not claim simulator Office evidence." >&2
            exit 1
          fi

      - name: Export original screenshots from the result bundle
        if: always()
        run: |
          if test -d office-simulator-stage-ipad.xcresult; then
            mkdir -p screenshots/ipad
            xcrun xcresulttool export attachments \
              --path office-simulator-stage-ipad.xcresult \
              --output-path screenshots/ipad || true
          fi

      - name: Retain the Office simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-simulator-stage-${{ github.sha }}
          path: |
            FloeAgent/office-simulator-stage-ipad.xcresult
            FloeAgent/office-simulator-stage-ipad.log
            FloeAgent/screenshots/ipad
            ${{ runner.temp }}/office-stage.jsonl
            ${{ runner.temp }}/office-stage-console.log
            ${{ runner.temp }}/simulator-blocker.json
            ${{ runner.temp }}/office-simulator-receipt.json
            ${{ runner.temp }}/office-simulator-harness.log
            ${{ runner.temp }}/office-simulator-guard.json
            ${{ runner.temp }}/office-render-readiness.json
            ${{ runner.temp }}/office-simulator-build.log
            ${{ runner.temp }}/office-simulator-diagnostics
          if-no-files-found: warn
          retention-days: 14
