name: Feedback component UI qualification
on:
  workflow_dispatch:
    inputs:
      palette_only:
        description: 'Only qualify the production Pencil palette presenter on both devices and SDKs'
        type: boolean
        default: false
      palette_unit_only:
        description: 'Only run native brush unit tests; do not claim UI qualification'
        type: boolean
        default: false
  workflow_call:
    inputs:
      palette_only:
        type: boolean
        default: false
      palette_unit_only:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: floe-feedback-ui-${{ github.ref }}
  cancel-in-progress: false
jobs:
  notes-content-search:
    if: ${{ !inputs.palette_only && !inputs.palette_unit_only }}
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    defaults:
      run:
        working-directory: FloeAgent/Qualification/NativeNotes
    steps:
      - uses: actions/checkout@v5
      - name: Build native Notes qualification host
        timeout-minutes: 25
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild -project FloeNotesNativeQualification.xcodeproj -scheme FloeNotesNativeQualification \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | tee build.log
      - name: Qualify real OCR and workspace content imports on iPad and iPhone
        timeout-minutes: 12
        run: |
          set -o pipefail
          status=0
          for device in 'iPad mini (A17 Pro)' 'iPhone 17 Pro'; do
            case "$device" in iPad*) name=ipad ;; *) name=iphone ;; esac
            xcodebuild -project FloeNotesNativeQualification.xcodeproj -scheme FloeNotesNativeQualification \
              -destination "platform=iOS Simulator,name=$device" -derivedDataPath build \
              -resultBundlePath "$name.xcresult" -parallel-testing-enabled NO \
              -test-timeouts-enabled YES -maximum-test-execution-time-allowance 120 \
              -only-testing:NativeNotesTests/NativeNotesTests/testScannedBilingualPageUsesRealVisionAndBecomesSearchable \
              -only-testing:NativeNotesTests/NativeNotesTests/testWorkspaceOfficeAndTextImportsIndexContents \
              CODE_SIGNING_ALLOWED=NO test-without-building 2>&1 | tee "$name.log" || status=1
          done
          exit "$status"
      - name: Retain original OCR samples and results
        if: always()
        run: |
          for device in ipad iphone; do
            if test -d "$device.xcresult"; then
              mkdir -p "screenshots/$device"
              xcrun xcresulttool export attachments --path "$device.xcresult" --output-path "screenshots/$device" || true
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedback-notes-search-${{ github.sha }}
          path: |
            FloeAgent/Qualification/NativeNotes/*.log
            FloeAgent/Qualification/NativeNotes/*.xcresult
            FloeAgent/Qualification/NativeNotes/screenshots
          retention-days: 14
  ipad-and-iphone:
    if: ${{ !inputs.palette_only && !inputs.palette_unit_only }}
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    defaults:
      run:
        working-directory: FloeAgent/Qualification/NativeManagement
    steps:
      - uses: actions/checkout@v5
      - name: Prepare component project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Test iPad interactions and retain screenshots
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild -project FloeManagementSmoke.xcodeproj -scheme FloeManagementSmoke \
            -destination 'platform=iOS Simulator,name=iPad mini (A17 Pro)' \
            -derivedDataPath build -resultBundlePath ipad.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 120 CODE_SIGNING_ALLOWED=NO test 2>&1 | tee ipad.log
      - name: Test iPhone interactions and retain screenshots
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          set -o pipefail
          xcodebuild -project FloeManagementSmoke.xcodeproj -scheme FloeManagementSmoke \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath build -resultBundlePath iphone.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 120 CODE_SIGNING_ALLOWED=NO test 2>&1 | tee iphone.log
      - name: Export original screenshots
        if: always()
        run: |
          for device in ipad iphone; do
            if test -d "$device.xcresult"; then
              mkdir -p "screenshots/$device"
              xcrun xcresulttool export attachments --path "$device.xcresult" --output-path "screenshots/$device" || true
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedback-component-ui-${{ github.sha }}
          path: |
            FloeAgent/Qualification/NativeManagement/*.log
            FloeAgent/Qualification/NativeManagement/*.xcresult
            FloeAgent/Qualification/NativeManagement/screenshots
          retention-days: 14
  pencil-palette:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            xcode: Xcode_27.0
            device: iPad mini (A17 Pro)
            device_key: ipad
          - runner: xcode-27
            xcode: Xcode_27.0
            device: iPhone 17 Pro
            device_key: iphone
          - runner: macos-26
            xcode: Xcode_26.6
            device: iPad mini (A17 Pro)
            device_key: ipad
          - runner: macos-26
            xcode: Xcode_26.6
            device: iPhone 17 Pro
            device_key: iphone
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/${{ matrix.xcode }}.app/Contents/Developer
      PALETTE_DEVICE: ${{ matrix.device }}
      PALETTE_DEVICE_KEY: ${{ matrix.device_key }}
      PALETTE_UNIT_ONLY: ${{ inputs.palette_unit_only }}
    defaults:
      run:
        working-directory: FloeAgent/Qualification/PencilPalette
    steps:
      - uses: actions/checkout@v5
      - name: Build the production palette and brush qualification host
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild -project FloePencilPaletteQualification.xcodeproj -scheme FloePencilPaletteQualification \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | tee build.log
      - name: Qualify arc positions, brush rendering and settings on this device
        timeout-minutes: 12
        run: |
          set -o pipefail
          test_scope=()
          if [[ "$PALETTE_UNIT_ONLY" == "true" ]]; then test_scope=(-only-testing:PencilPaletteUnitTests); fi
          xcodebuild -project FloePencilPaletteQualification.xcodeproj -scheme FloePencilPaletteQualification \
            "${test_scope[@]}" -destination "platform=iOS Simulator,name=$PALETTE_DEVICE" -derivedDataPath build \
            -resultBundlePath "$PALETTE_DEVICE_KEY.xcresult" -parallel-testing-enabled NO \
            -collect-test-diagnostics never -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 240 CODE_SIGNING_ALLOWED=NO test-without-building \
            2>&1 | tee "$PALETTE_DEVICE_KEY.log"
      - name: Retain original palette and brush screenshots
        if: always()
        run: |
          if test -d "$PALETTE_DEVICE_KEY.xcresult"; then
            mkdir -p "screenshots/$PALETTE_DEVICE_KEY"
            xcrun xcresulttool export attachments --path "$PALETTE_DEVICE_KEY.xcresult" --output-path "screenshots/$PALETTE_DEVICE_KEY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pencil-palette${{ inputs.palette_unit_only && '-unit' || '' }}-${{ matrix.xcode }}-${{ matrix.device_key }}-${{ github.sha }}
          path: |
            FloeAgent/Qualification/PencilPalette/*.log
            FloeAgent/Qualification/PencilPalette/*.xcresult
            FloeAgent/Qualification/PencilPalette/screenshots
          retention-days: 14
