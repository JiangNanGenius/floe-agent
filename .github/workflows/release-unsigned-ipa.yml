name: TestFlight and Unsigned IPA Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer tag to validate and build
        required: true
        type: string
      direct_testflight:
        description: Build the existing tag and upload directly without simulator qualification (explicit user request)
        required: false
        default: false
        type: boolean
      reuse_accepted_run:
        description: Reuse an existing exact-tag accepted-SDK artifact and upload without waiting for SDK 27 qualification
        required: false
        type: string
      recover_developer_build191:
        description: Package and publish the original Build191 unsigned recovery after internal delivery; no App build or TestFlight upload
        required: false
        default: false
        type: boolean
      build191_ui_waiver:
        description: Explicitly waive all three recorded Build191 UI failures and reuse its pinned device recovery (internal TestFlight only)
        required: false
        default: false
        type: boolean
      component_recovery_run:
        description: Supplement reuse_accepted_run with the reviewed passing component correction; requires both original SDK jobs and identical product source, without a waiver
        required: false
        type: string
      recover_build_156:
        description: Retry only distribution of qualified immutable build 156
        required: false
        default: false
        type: boolean
      publish:
        description: Publish the draft prerelease after validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: floe-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  developer-recovery:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_developer_build191 && inputs.tag == 'v1.7.0-beta.48' && inputs.publish && !inputs.direct_testflight && !inputs.recover_build_156 && !inputs.build191_ui_waiver && inputs.reuse_accepted_run == '' && inputs.component_recovery_run == '' }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/developer-ipa-from-recovery.yml

  direct-testflight:
    if: ${{ !inputs.recover_developer_build191 && !inputs.build191_ui_waiver && github.event_name == 'workflow_dispatch' && inputs.direct_testflight && inputs.reuse_accepted_run == '' && inputs.component_recovery_run == '' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/testflight-direct.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit

  expedited-testflight:
    if: ${{ !inputs.recover_developer_build191 && github.event_name == 'workflow_dispatch' && inputs.reuse_accepted_run != '' && inputs.component_recovery_run == '' && (!inputs.build191_ui_waiver || (inputs.tag == 'v1.7.0-beta.48' && inputs.reuse_accepted_run == '35337960392' && !inputs.publish && !inputs.direct_testflight)) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/testflight-from-artifact.yml
    with:
      source_run: ${{ inputs.reuse_accepted_run }}
      tag: ${{ inputs.tag }}
      build191_ui_waiver: ${{ inputs.build191_ui_waiver }}
    secrets: inherit

  recover-testflight:
    if: ${{ !inputs.recover_developer_build191 && !inputs.build191_ui_waiver && github.event_name == 'workflow_dispatch' && inputs.recover_build_156 && inputs.tag == 'v1.7.0-beta.13' && !inputs.publish && inputs.component_recovery_run == '' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/testflight-recovery.yml
    secrets: inherit

  component-recovery:
    if: ${{ !inputs.recover_developer_build191 && !inputs.build191_ui_waiver && github.event_name == 'workflow_dispatch' && inputs.component_recovery_run != '' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/component-only-release-recovery.yml
    with:
      source_run: ${{ inputs.reuse_accepted_run }}
      component_run: ${{ inputs.component_recovery_run }}
      tag: ${{ inputs.tag }}
    secrets: inherit

  prepare-release:
    if: ${{ !inputs.recover_developer_build191 && !inputs.build191_ui_waiver && !inputs.direct_testflight && !inputs.recover_build_156 && inputs.reuse_accepted_run == '' && inputs.component_recovery_run == '' }}
    runs-on: macos-26
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      build: ${{ steps.release.outputs.build }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Freeze and validate the release source before parallel qualification
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: FloeAgent/scripts/release_preflight.sh "$RELEASE_TAG"

  # Normal qualified release path only. The NativeNotes component is qualified
  # from the exact commit prepare-release froze, in parallel with the two SDK
  # jobs. A component failure or unexpected skip leaves this job failed/skipped,
  # and testflight needs all three gates, so no signing material is installed.
  notes-component:
    name: Qualify the NativeNotes development component in parallel
    needs: prepare-release
    if: ${{ !inputs.recover_developer_build191 && !inputs.build191_ui_waiver && !inputs.direct_testflight && !inputs.recover_build_156 && inputs.reuse_accepted_run == '' && inputs.component_recovery_run == '' }}
    permissions:
      contents: read
    # Branch-local reusable call at the caller's commit. sdk=development selects
    # only the development component job and never compatibility; source_ref is
    # the immutable SHA frozen by prepare-release, never a branch or tag. No
    # secrets are passed to this call.
    uses: ./.github/workflows/notes-native-qualification.yml
    with:
      sdk: development
      source_ref: ${{ needs.prepare-release.outputs.source_sha }}

  build-verify-release:
    needs: prepare-release
    if: ${{ !inputs.recover_developer_build191 && !inputs.build191_ui_waiver && !inputs.direct_testflight && !inputs.recover_build_156 && inputs.reuse_accepted_run == '' && inputs.component_recovery_run == '' }}
    # Verify the complete iOS 27 source path here. The upload job below
    # separately rebuilds this exact tag with the App Store accepted SDK.
    runs-on: xcode-27
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      REQUIRED_XCODE_VERSION: Xcode 27.0
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: FloeAgent
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      build: ${{ steps.release.outputs.build }}
      source_sha: ${{ steps.release.outputs.source_sha }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.source_sha }}

      - name: Require Xcode 27.0 release toolchain
        run: |
          XCODE_VERSION="$(xcodebuild -version)"
          printf '%s\n' "$XCODE_VERSION"
          printf '%s\n' "$XCODE_VERSION" | grep -F "$REQUIRED_XCODE_VERSION"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 27.0

      - name: Select the job-local package cache
        run: echo "FLOE_SPM_CACHE_ROOT=$RUNNER_TEMP/FloePackageCache" >> "$GITHUB_ENV"

      - name: Restore verified shell binary archives
        uses: actions/cache@v4
        with:
          path: ${{ env.FLOE_SPM_CACHE_ROOT }}/artifacts
          key: floe-shell-archives-v1-${{ hashFiles('FloeAgent/ThirdParty/FloeShellEngine/Package.swift') }}

      - name: Prime the pinned shell artifact cache through GitHub API
        run: python3 scripts/prime_shell_artifact_cache.py --cache-dir "$FLOE_SPM_CACHE_ROOT/artifacts"

      - name: Install release tooling
        run: |
          brew install xcodegen automake gitleaks syft cmake
          xcodebuild -downloadComponent MetalToolchain
          scripts/bootstrap_python_runtime.sh

      - name: Generate project and validate tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          scripts/gen_project.sh
          scripts/release_preflight.sh "$RELEASE_TAG"

      - name: Scan source history for credentials
        run: scripts/secret_scan.sh

      - name: Reuse successful trusted CI for this exact source commit
        id: verified_ci
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          # The newest successful dispatch may be only a palette, inference
          # or dependency check. Search all returned candidates for a complete
          # exact-source qualification; never replace required jobs with skips.
          CI_RUN_ID=""
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&status=success&per_page=100" \
            --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | .id' > "$RUNNER_TEMP/ci-candidates.txt"
          while IFS= read -r candidate; do
            test -n "$candidate" || continue
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/jobs?per_page=100" > "$RUNNER_TEMP/ci-jobs.json"
            if jq -e '
              [.jobs[] | select(.name == "build-test" or .name == "appstore-sdk-compatibility" or .name == "spm-linux-build")]
              | (map(.name) | sort) == ["appstore-sdk-compatibility", "build-test", "spm-linux-build"]
              and all(.[]; .conclusion == "success")
            ' "$RUNNER_TEMP/ci-jobs.json" >/dev/null; then
              CI_RUN_ID="$candidate"
              break
            fi
          done < "$RUNNER_TEMP/ci-candidates.txt"
          if [ -n "$CI_RUN_ID" ]; then
              gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --name ci-artifacts --dir "$RUNNER_TEMP/ReusedCI"
              # Artifact upload paths can retain the checkout's common ancestor.
              # Select exactly one result bundle and normalize its location.
              reused_result="$(find "$RUNNER_TEMP/ReusedCI" -type d -name 'FloeAgent-AppRegressionTests.xcresult' -prune -print)"
              test "$(printf '%s\n' "$reused_result" | grep -c .)" = 1
              test -d "$reused_result"
              if [ "$reused_result" != "$RUNNER_TEMP/ReusedCI/FloeAgent-AppRegressionTests.xcresult" ]; then
                ditto "$reused_result" "$RUNNER_TEMP/ReusedCI/FloeAgent-AppRegressionTests.xcresult"
              fi
              # Reuse both exact-source UI results too. A passing App unit
              # bundle alone cannot replace the iPad/iPhone interaction gate.
              mkdir -p "$RUNNER_TEMP/FloeSDK27-Notes"
              for name in ipad iphone; do
                notes_result="$(find "$RUNNER_TEMP/ReusedCI" -type d -name "FloeAgent-Notes-$name.xcresult" -prune -print)"
                test "$(printf '%s\n' "$notes_result" | grep -c .)" = 1
                test -d "$notes_result"
                ditto "$notes_result" "$RUNNER_TEMP/FloeSDK27-Notes/$name.xcresult"
                python3 scripts/verify_notes_ui_xcresult.py --simulator-without-office \
                  --result-bundle "$RUNNER_TEMP/FloeSDK27-Notes/$name.xcresult" \
                  --summary-output "$RUNNER_TEMP/FloeSDK27-Notes/$name-summary.json"
                mkdir -p "$RUNNER_TEMP/FloeSDK27-Notes/screenshots/$name"
                xcrun xcresulttool export attachments --path "$notes_result" \
                  --output-path "$RUNNER_TEMP/FloeSDK27-Notes/screenshots/$name"
              done
              printf '%s\n' "$CI_RUN_ID" > "$RUNNER_TEMP/FloeSDK27-Notes/SOURCE-CI-RUN.txt"
              echo "run_id=$CI_RUN_ID" >> "$GITHUB_OUTPUT"
              echo "Reusing exact-SHA CI $CI_RUN_ID; stable-SDK tests and binary checks still run."
          fi

      - name: Resolve and verify pinned dependencies
        run: |
          swift package resolve
          python3 scripts/tests/test_resolved_pins.py
          python3 scripts/tests/test_resolve_xcode_dependencies.py
          scripts/pin_check.sh
          scripts/license_inventory.sh

      # `swift package resolve` above uses SwiftPM's default cache, but
      # xcodebuild resolves the same graph again into $FLOE_SPM_CACHE_ROOT.
      # Build 182 (job 105296416221) hit a curl 56 clone timeout and a GitHub
      # DNS failure there and reported only the downstream binary-target
      # mapping error. Isolate that network phase, retry it only on explicit
      # network signatures (deterministic checksum/manifest/auth errors always
      # fail immediately), and keep every raw attempt. The tracked host lock
      # stays byte-identical; the actual Xcode lock is compared by normalized
      # pins so an originHash/schema/format rewrite passes while a revision
      # change is rejected with the drift bytes kept as evidence.
      # xcodebuild reads its own project.xcworkspace lock, not the tracked host
      # lock, so the committed HEAD lock is the read-only baseline for seeding
      # and verifying that actual Xcode lock (including app-only WhisperKit).
      - name: Resolve Xcode package dependencies with bounded network retry
        timeout-minutes: 30
        run: |
          git show HEAD:FloeAgent/Package.resolved > "$RUNNER_TEMP/FloeCanonicalPackage.resolved"
          scripts/resolve_xcode_dependencies.sh \
            --project FloeAgent.xcodeproj \
            --scheme FloeAgent \
            --configuration Debug \
            --destination 'generic/platform=iOS Simulator' \
            --package-cache-path "$FLOE_SPM_CACHE_ROOT" \
            --derived-data-path "$RUNNER_TEMP/FloeAppRegressionDerivedData" \
            --resolved-file Package.resolved \
            --canonical-lock "$RUNNER_TEMP/FloeCanonicalPackage.resolved" \
            --xcode-lock FloeAgent.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            --project-yml project.yml \
            --log-dir "$RUNNER_TEMP/FloeDependencyTransport/sdk27" \
            --max-attempts 3

      - name: Preserve SDK 27 dependency-resolution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk27-dependency-transport-${{ github.run_id }}
          path: ${{ runner.temp }}/FloeDependencyTransport/sdk27/
          if-no-files-found: ignore

      # Fonts are a release-blocking build input: the app must never ship
      # without the verified bundled CJK set.
      - name: Restore bundled font cache
        uses: actions/cache@v4
        with:
          path: |
            FloeAgent/Vendor/Fonts/downloads
            FloeAgent/FloeApp/Resources/Fonts/Bundled
          key: floe-fonts-${{ hashFiles('FloeAgent/scripts/fonts/manifest.json') }}

      - name: Fetch and verify bundled fonts
        run: |
          python3 scripts/fonts/fetch_fonts.py --check || {
            python3 scripts/fonts/fetch_fonts.py
            python3 scripts/fonts/fetch_fonts.py --check
          }

      # Authenticate the signed catalog and stage the pinned lua.wasm fixture.
      # The repository-tracked artifact is the only source: no download
      # fallback, no network.  cryptography is pinned in a throwaway venv
      # because clean runners ship no third-party packages.
      - name: Install pinned catalog verification dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/floe-lua-venv"
          "$RUNNER_TEMP/floe-lua-venv/bin/pip" install cryptography==46.0.6

      # Assign the path before writing GITHUB_ENV so a preparation failure
      # aborts the step instead of exporting an empty FLOE_LUA_WASI.
      - name: Prepare the pinned Lua WASI fixture
        run: |
          floe_lua_wasi="$("$RUNNER_TEMP/floe-lua-venv/bin/python" scripts/prepare_lua_qualification.py)" || exit 1
          echo "FLOE_LUA_WASI=$floe_lua_wasi" >> "$GITHUB_ENV"

      - name: Run Swift tests when exact-source CI cannot be reused
        if: steps.verified_ci.outputs.run_id == ''
        timeout-minutes: 20
        run: |
          swift build
          LLAMA_FRAMEWORK="$(find .build/artifacts -path '*/macos-arm64_x86_64/llama.framework' ! -path '*/__MACOSX/*' -print -quit)"
          test -n "$LLAMA_FRAMEWORK"
          test -x "$LLAMA_FRAMEWORK/Versions/Current/llama"
          DYLD_FRAMEWORK_PATH="$(dirname "$LLAMA_FRAMEWORK")${DYLD_FRAMEWORK_PATH:+:$DYLD_FRAMEWORK_PATH}"
          export DYLD_FRAMEWORK_PATH
          BIN_PATH="$(swift build --show-bin-path)"
          mkdir -p "$BIN_PATH/PackageFrameworks"
          cp -R "$LLAMA_FRAMEWORK" "$BIN_PATH/PackageFrameworks/"
          while IFS= read -r PRODUCTS_DIR; do
            mkdir -p "$PRODUCTS_DIR/PackageFrameworks"
            cp -R "$LLAMA_FRAMEWORK" "$PRODUCTS_DIR/PackageFrameworks/"
          done < <(find .build -type d -path '*/Products/Debug')
          find "$BIN_PATH/PackageFrameworks/llama.framework" -name '._*' -delete
          # Isolate wall-clock deadline suites from unrelated concurrent tests so
          # shared-runner load cannot distort their wall-clock assertions.
          python3 scripts/run_test_with_diagnostics.py --output-dir "$RUNNER_TEMP/SwiftTestDiagnostics/full" -- swift test \
            --skip 'FloeExecutionTests.JavaScriptEngineTests' \
            --skip 'FloeExecutionTests.JavaScriptExecutionToolTests' \
            --skip 'FloeExecutionTests.NetworkDiagnosticToolsTests'
          python3 scripts/run_test_with_diagnostics.py --output-dir "$RUNNER_TEMP/SwiftTestDiagnostics/javascript-engine" -- swift test --filter 'FloeExecutionTests.JavaScriptEngineTests'
          python3 scripts/run_test_with_diagnostics.py --output-dir "$RUNNER_TEMP/SwiftTestDiagnostics/javascript-tool" -- swift test --filter 'FloeExecutionTests.JavaScriptExecutionToolTests'
          # Keep the eight-way blocking lookup race, but isolate its wall-clock
          # deadline from unrelated suites competing for the cooperative pool.
          python3 scripts/run_test_with_diagnostics.py --output-dir "$RUNNER_TEMP/SwiftTestDiagnostics/network-deadlines" -- swift test --filter 'FloeExecutionTests.NetworkDiagnosticToolsTests'

      - name: Qualify environment, package, media and Node release modules
        run: |
          python3 scripts/run_test_with_diagnostics.py --output-dir "$RUNNER_TEMP/SwiftTestDiagnostics/platform" --timeout 1200 -- swift test --package-path Qualification --scratch-path .build --force-resolved-versions --jobs 4 2>&1 | tee platform-qualification.log
          python3 scripts/run_test_with_diagnostics.py --output-dir "$RUNNER_TEMP/SwiftTestDiagnostics/notes" --timeout 1200 -- swift test --package-path Qualification/Notes --scratch-path .build --force-resolved-versions --jobs 4
          grep -E 'Test run with [1-9][0-9]* tests? .*passed' platform-qualification.log
          node --test scripts/tests/node_host.test.cjs scripts/tests/notes_bridge.test.cjs
          # The Notes retry classifier gates the UI legs below; its fixtures
          # must pass before those legs can consume its verdict.
          python3 scripts/tests/test_notes_ui_startup_retry.py

      - name: Preserve Swift regression output and stall diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-regression-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/SwiftTestDiagnostics
          if-no-files-found: ignore

      - name: Build SDK 27 simulator test hosts once
        if: steps.verified_ci.outputs.run_id == ''
        timeout-minutes: 45
        run: |
          xcodebuild -packageCachePath "$FLOE_SPM_CACHE_ROOT" -project FloeAgent.xcodeproj -scheme FloeAgent \
            -skipPackagePluginValidation -skipMacroValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/FloeAppRegressionDerivedData" \
            -only-testing:FloeAppTests \
            -only-testing:FloeAgentUITests/NotesWorkspaceImportUITests \
            ENABLE_TESTABILITY=YES ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build-for-testing

      # Retain the complete compiled SDK 27 host before any UI test runs so a
      # later failed run can restore it instead of rebuilding. The prefix and
      # metadata are distinct from the accepted-SDK (26) host; the host archive
      # format matches the vetted ci.yml / recovery format.
      - name: Retain the complete SDK 27 simulator test host
        if: steps.verified_ci.outputs.run_id == ''
        run: |
          set -euo pipefail
          products="$RUNNER_TEMP/FloeAppRegressionDerivedData/Build/Products"
          test -n "$(find "$products" -maxdepth 1 -name '*.xctestrun' -print -quit)"
          test -n "$(find "$products" -type d -name 'FloeAgentUITests-Runner.app' -print -quit)"
          archive="$RUNNER_TEMP/FloeSDK27Host"
          mkdir -p "$archive"
          tar -czf "$archive/Products.tar.gz" \
            -C "$RUNNER_TEMP/FloeAppRegressionDerivedData/Build" Products
          (cd "$archive" && shasum -a 256 Products.tar.gz > Products.tar.gz.sha256)
          printf '%s\n' "${{ needs.prepare-release.outputs.source_sha }}" > "$archive/SOURCE-SHA.txt"
          xcodebuild -version > "$archive/TOOLCHAIN.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$archive/SOURCE-RUN.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$archive/SOURCE-ATTEMPT.txt"

      - name: Upload recoverable SDK 27 simulator test host
        if: steps.verified_ci.outputs.run_id == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk27-simulator-host-${{ needs.prepare-release.outputs.source_sha }}
          path: ${{ runner.temp }}/FloeSDK27Host/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Verify Canvas, PiP, and timeline app regression contracts
        id: app_regression
        timeout-minutes: 47
        run: |
          if [ -n "${{ steps.verified_ci.outputs.run_id }}" ]; then
            ditto "$RUNNER_TEMP/ReusedCI/FloeAgent-AppRegressionTests.xcresult" "$RUNNER_TEMP/FloeAgent-AppRegressionTests.xcresult"
          else
          floe_sdk_major="$(xcrun --sdk iphonesimulator --show-sdk-version | cut -d. -f1)"
          floe_test_device="$(xcrun simctl list devices available -j | python3 scripts/select_test_simulator.py --sdk-major "$floe_sdk_major" --name "iPad mini (A17 Pro)" --family iPad --create)"
          xctestrun=$(find "$RUNNER_TEMP/FloeAppRegressionDerivedData/Build/Products" -maxdepth 1 -name '*.xctestrun' -print -quit)
          test -n "$xctestrun"
          python3 scripts/run_test_with_diagnostics.py \
            --output-dir "$RUNNER_TEMP/Floe-AppRegressionDiagnostics" \
            --timeout 2700 --stall-timeout 420 --simulator-id "$floe_test_device" \
            --defer-stall-until-tests -- xcodebuild \
            -xctestrun "$xctestrun" \
            -destination "platform=iOS Simulator,id=$floe_test_device" \
            -resultBundlePath "$RUNNER_TEMP/FloeAgent-AppRegressionTests.xcresult" \
            -collect-test-diagnostics never \
            -parallel-testing-enabled NO \
            -only-testing:FloeAppTests/CanvasTouchInteractionTests \
            -only-testing:FloeAppTests/CanvasSavedImageBatchAtomicityTests \
            -only-testing:FloeAppTests/CanvasAgentToolContractTests \
            -only-testing:FloeAppTests/CrashAndFeedbackRegressionTests \
            -only-testing:FloeAppTests/ThreadTimelineTests \
            -only-testing:FloeAppTests/HomeChatSeparationTests \
            -only-testing:FloeAppTests/HomeTaskCreationTests \
            -only-testing:FloeAppTests/EnvironmentLanguagePackageTests \
            -only-testing:FloeAppTests/BrowserProtocolTests \
            -only-testing:FloeAppTests/MailConnectorTests \
            -only-testing:FloeAppTests/SkillLifecycleTests \
            -only-testing:FloeAppTests/LocalPythonRuntimeTests \
            -only-testing:FloeAppTests/LocalShellRuntimeTests \
            -only-testing:FloeAppTests/LocalServiceLifecycleTests \
            -only-testing:FloeAppTests/LuaShellInstallTests \
            -only-testing:FloeAppTests/IDEGitHubActionsTests \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building
          fi
          python3 scripts/verify_app_regression_xcresult.py \
            --result-bundle "$RUNNER_TEMP/FloeAgent-AppRegressionTests.xcresult" \
            --github-output "$GITHUB_OUTPUT" \
            --summary-output "$RUNNER_TEMP/FloeAgent-AppRegressionTests-SUMMARY.txt"

      - name: Preserve app regression evidence even if a later release step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-regression-SDK27-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/FloeAgent-AppRegressionTests.xcresult
            ${{ runner.temp }}/FloeAgent-AppRegressionTests-SUMMARY.txt
            ${{ runner.temp }}/Floe-AppRegressionDiagnostics/
            FloeAgent/Package.resolved
          if-no-files-found: ignore

      # Each device gets its own 25-minute step: a slow iPad leg can never
      # consume the iPhone leg's budget. The iPhone step still runs after an
      # iPad failure so evidence for both devices is collected, but the explicit
      # gate below fails the job unless both legs strictly passed, so the
      # unsigned IPA is never produced from a partial Notes qualification.
      - name: Require Notes import on the iPad simulator with the SDK 27
        id: notes_ipad
        if: steps.verified_ci.outputs.run_id == ''
        timeout-minutes: 25
        env:
          NOTES_DEVICE: iPad mini (A17 Pro)
          NOTES_NAME: ipad
          NOTES_DERIVED: FloeAppRegressionDerivedData
          NOTES_EVIDENCE: FloeSDK27-Notes
        run: |
          set -o pipefail
          qualification="$RUNNER_TEMP/$NOTES_EVIDENCE"
          mkdir -p "$qualification"
          xctestrun=$(find "$RUNNER_TEMP/$NOTES_DERIVED/Build/Products" -maxdepth 1 -name '*.xctestrun' -print -quit)
          test -n "$xctestrun"
          floe_sdk_major="$(xcrun --sdk iphonesimulator --show-sdk-version | cut -d. -f1)"
          test_device="$(xcrun simctl list devices available -j | python3 scripts/select_test_simulator.py --sdk-major "$floe_sdk_major" --name "$NOTES_DEVICE" --family "${NOTES_DEVICE%% *}" --create)"
          test -n "$test_device"
          # Finish simulator boot before XCTest starts its fixed App-launch
          # deadline. Do not warm-launch the App or retry executed failures.
          python3 scripts/prepare_ui_simulator.py --simulator-id "$test_device" \
            --output-dir "$RUNNER_TEMP/${NOTES_EVIDENCE}Diagnostics/$NOTES_NAME-boot" || exit 1
          leg_attempt=1
          status=0
          while true; do
            leg_code=0
            diag_dir="$RUNNER_TEMP/${NOTES_EVIDENCE}Diagnostics/$NOTES_NAME-attempt-$leg_attempt"
            python3 scripts/run_test_with_diagnostics.py \
              --output-dir "$diag_dir" --timeout 1320 --stall-timeout 210 \
              --startup-stall-timeout 420 --simulator-id "$test_device" -- xcodebuild \
              -xctestrun "$xctestrun" \
              -destination "platform=iOS Simulator,id=$test_device" \
              -resultBundlePath "$qualification/$NOTES_NAME-attempt-$leg_attempt.xcresult" \
              -collect-test-diagnostics never \
              -only-testing:FloeAgentUITests/NotesWorkspaceImportUITests \
              -parallel-testing-enabled NO -test-timeouts-enabled YES \
              -maximum-test-execution-time-allowance 360 \
              CODE_SIGNING_ALLOWED=NO test-without-building \
              2>&1 | tee "$qualification/$NOTES_NAME-attempt-$leg_attempt.log" || leg_code=$?
            # One retry only, and only the classifier decides it: it accepts
            # the pre-existing stalled shape or the narrowly known pre-test
            # bootstrap crash, requiring testsStarted=false, no test case/suite
            # execution and no App crash evidence. Executed failures and any
            # other nonzero exit are never retried into a pass; a missing or
            # unreadable helper, summary or attempt log fails closed too, as
            # there is deliberately no inline fallback.
            if [ "$leg_attempt" -eq 1 ] && \
               python3 scripts/notes_ui_startup_retry.py \
                 --summary "$diag_dir/summary.json" \
                 --log "$qualification/$NOTES_NAME-attempt-$leg_attempt.log" \
                 --attempt "$leg_attempt"; then
              leg_attempt=2
              continue
            fi
            [ "$leg_code" -ne 0 ] && status=1
            break
          done
          final="$qualification/$NOTES_NAME-attempt-$leg_attempt.xcresult"
          if test -d "$final"; then
            python3 scripts/verify_notes_ui_xcresult.py --simulator-without-office \
              --result-bundle "$final" \
              --summary-output "$qualification/$NOTES_NAME-summary.json" || status=1
            mkdir -p "$qualification/screenshots/$NOTES_NAME"
            xcrun xcresulttool export attachments --path "$final" \
              --output-path "$qualification/screenshots/$NOTES_NAME" || true
          else
            echo "$final was never produced; the leg has no verifiable result." >&2
            status=1
          fi
          exit "$status"

      - name: Require Notes import on the iPhone simulator with the SDK 27
        id: notes_iphone
        # Run after an iPad failure to collect iPhone evidence, but only when the
        # iPad leg actually executed (never on the reused-CI or cancelled path).
        if: ${{ !cancelled() && steps.notes_ipad.outcome != 'skipped' }}
        timeout-minutes: 25
        env:
          NOTES_DEVICE: iPhone 17 Pro
          NOTES_NAME: iphone
          NOTES_DERIVED: FloeAppRegressionDerivedData
          NOTES_EVIDENCE: FloeSDK27-Notes
        run: |
          set -o pipefail
          qualification="$RUNNER_TEMP/$NOTES_EVIDENCE"
          mkdir -p "$qualification"
          xctestrun=$(find "$RUNNER_TEMP/$NOTES_DERIVED/Build/Products" -maxdepth 1 -name '*.xctestrun' -print -quit)
          test -n "$xctestrun"
          floe_sdk_major="$(xcrun --sdk iphonesimulator --show-sdk-version | cut -d. -f1)"
          test_device="$(xcrun simctl list devices available -j | python3 scripts/select_test_simulator.py --sdk-major "$floe_sdk_major" --name "$NOTES_DEVICE" --family "${NOTES_DEVICE%% *}" --create)"
          test -n "$test_device"
          # Finish simulator boot before XCTest starts its fixed App-launch
          # deadline. Do not warm-launch the App or retry executed failures.
          python3 scripts/prepare_ui_simulator.py --simulator-id "$test_device" \
            --output-dir "$RUNNER_TEMP/${NOTES_EVIDENCE}Diagnostics/$NOTES_NAME-boot" || exit 1
          leg_attempt=1
          status=0
          while true; do
            leg_code=0
            diag_dir="$RUNNER_TEMP/${NOTES_EVIDENCE}Diagnostics/$NOTES_NAME-attempt-$leg_attempt"
            python3 scripts/run_test_with_diagnostics.py \
              --output-dir "$diag_dir" --timeout 1320 --stall-timeout 210 \
              --startup-stall-timeout 420 --simulator-id "$test_device" -- xcodebuild \
              -xctestrun "$xctestrun" \
              -destination "platform=iOS Simulator,id=$test_device" \
              -resultBundlePath "$qualification/$NOTES_NAME-attempt-$leg_attempt.xcresult" \
              -collect-test-diagnostics never \
              -only-testing:FloeAgentUITests/NotesWorkspaceImportUITests \
              -parallel-testing-enabled NO -test-timeouts-enabled YES \
              -maximum-test-execution-time-allowance 360 \
              CODE_SIGNING_ALLOWED=NO test-without-building \
              2>&1 | tee "$qualification/$NOTES_NAME-attempt-$leg_attempt.log" || leg_code=$?
            # One retry only, and only the classifier decides it: it accepts
            # the pre-existing stalled shape or the narrowly known pre-test
            # bootstrap crash, requiring testsStarted=false, no test case/suite
            # execution and no App crash evidence. Executed failures and any
            # other nonzero exit are never retried into a pass; a missing or
            # unreadable helper, summary or attempt log fails closed too, as
            # there is deliberately no inline fallback.
            if [ "$leg_attempt" -eq 1 ] && \
               python3 scripts/notes_ui_startup_retry.py \
                 --summary "$diag_dir/summary.json" \
                 --log "$qualification/$NOTES_NAME-attempt-$leg_attempt.log" \
                 --attempt "$leg_attempt"; then
              leg_attempt=2
              continue
            fi
            [ "$leg_code" -ne 0 ] && status=1
            break
          done
          final="$qualification/$NOTES_NAME-attempt-$leg_attempt.xcresult"
          if test -d "$final"; then
            python3 scripts/verify_notes_ui_xcresult.py --simulator-without-office \
              --result-bundle "$final" \
              --summary-output "$qualification/$NOTES_NAME-summary.json" || status=1
            mkdir -p "$qualification/screenshots/$NOTES_NAME"
            xcrun xcresulttool export attachments --path "$final" \
              --output-path "$qualification/screenshots/$NOTES_NAME" || true
          else
            echo "$final was never produced; the leg has no verifiable result." >&2
            status=1
          fi
          exit "$status"

      - name: Require both SDK 27 Notes device legs to pass
        if: ${{ !cancelled() && steps.notes_ipad.outcome != 'skipped' }}
        env:
          IPAD_NOTES_OUTCOME: ${{ steps.notes_ipad.outcome }}
          IPHONE_NOTES_OUTCOME: ${{ steps.notes_iphone.outcome }}
        run: |
          # Downstream packaging must never run when either device was not
          # strictly verified; there is deliberately no soft-fail bypass.
          test "$IPAD_NOTES_OUTCOME" = success
          test "$IPHONE_NOTES_OUTCOME" = success

      - name: Retain SDK 27 Notes UI evidence before distribution
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk27-notes-ui-${{ steps.release.outputs.version }}-build${{ steps.release.outputs.build }}
          path: |
            ${{ runner.temp }}/FloeSDK27-Notes/
            ${{ runner.temp }}/FloeSDK27-NotesDiagnostics/
          if-no-files-found: ignore

      - name: Generate dependency and license artifacts
        run: |
          scripts/pin_check.sh
          scripts/license_inventory.sh
          scripts/sbom.sh

      - name: Package the matching Floe remote agent
        run: |
          python3 scripts/test_remote_task_cancel.py
          python3 scripts/test_remote_shell.py
          scripts/package_remote_agent.sh release-assets 1.4.3

      - name: Build unsigned device application
        run: |
          xcodebuild -packageCachePath "$FLOE_SPM_CACHE_ROOT" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            -project FloeAgent.xcodeproj \
            -scheme FloeAgent \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/FloeDeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build

      - name: Package and verify unsigned IPA
        id: package
        env:
          ASSET_NAME: ${{ steps.release.outputs.asset_name }}
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/FloeDeviceDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          python3 scripts/prepare_app_store_bundle.py --app "$APP_PATH" --report release-assets/bundle-normalization.json
          scripts/package_unsigned_ipa.sh "$APP_PATH" release-assets "$ASSET_NAME"

      - name: Verify artifact metadata and scan built application
        run: |
          test "${{ steps.package.outputs.bundle_id }}" = "${{ steps.release.outputs.bundle_id }}"
          test "${{ steps.package.outputs.version }}" = "${{ steps.release.outputs.version }}"
          test "${{ steps.package.outputs.build }}" = "${{ steps.release.outputs.build }}"
          APP_PATH="$(find "$RUNNER_TEMP/FloeDeviceDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          # Packaging policy: the immutable tag's allowlist predates the app
          # scan; the vendored bundles embed public upstream SHAs, so the
          # release writes its own allowlist instead of editing the tag.
          printf '%s\n' \
            'title = "Floe release app scan allowlist"' \
            '[allowlist]' \
            'description = "Hash-pinned vendored bundles embedding upstream git SHAs"' \
            'paths = [' \
            "  '''codeblitz\\.global-with-react\\.min\\.js'''," \
            "  '''(^|/)mesh\\.js'''," \
            ']' > "$RUNNER_TEMP/app-gitleaks.toml"
          gitleaks dir "$APP_PATH" \
            --config "$RUNNER_TEMP/app-gitleaks.toml" \
            --redact \
            --report-path release-assets/app-gitleaks-report.json
          cp sbom.spdx.json release-assets/
          cp LICENSES-THIRD-PARTY.md release-assets/
          cp .gitleaks-report.json release-assets/source-gitleaks-report.json
          cp "$RUNNER_TEMP/FloeAgent-AppRegressionTests-SUMMARY.txt" release-assets/
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/FloeAgent-AppRegressionTests.xcresult" \
            release-assets/FloeAgent-AppRegressionTests.xcresult.zip
          unzip -t release-assets/FloeAgent-AppRegressionTests.xcresult.zip
          {
            echo "tag=${{ steps.release.outputs.tag }}"
            echo "version=${{ steps.release.outputs.version }}"
            echo "build=${{ steps.release.outputs.build }}"
            echo "commit=${{ steps.release.outputs.source_sha }}"
            echo "bundle=${{ steps.package.outputs.bundle_id }}"
            echo "minimum_iOS=${{ steps.package.outputs.minimum_os }}"
            echo "swift_tests=passed"
            echo "app_regression_tests=${{ steps.app_regression.outputs.passed }}/${{ steps.app_regression.outputs.total }} passed"
            echo "app_regression_failed=${{ steps.app_regression.outputs.failed }}"
            echo "app_regression_skipped=${{ steps.app_regression.outputs.skipped }}"
            echo "simulator_debug_test_host_build=passed"
            echo "unsigned_device_build=passed"
            echo "remote_agent_asset=packaged"
          } > release-assets/TEST-SUMMARY.txt

      - name: Attest unsigned IPA provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.package.outputs.ipa_path }}

      - name: Upload verified build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-ipa-${{ steps.release.outputs.version }}-build${{ steps.release.outputs.build }}
          path: FloeAgent/release-assets/
          if-no-files-found: error

  accepted-sdk-build:
    name: Qualify and build the accepted SDK in parallel
    needs: prepare-release
    permissions:
      contents: read
      actions: read
    # No signing material is used here. Distribution waits for both SDK jobs.
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      REQUIRED_XCODE_VERSION: Xcode 26.6
      REQUIRED_XCODE_BUILD: 17F113
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: FloeAgent
    outputs:
      total: ${{ steps.stable_app_regression.outputs.total }}
      passed: ${{ steps.stable_app_regression.outputs.passed }}
      failed: ${{ steps.stable_app_regression.outputs.failed }}
      skipped: ${{ steps.stable_app_regression.outputs.skipped }}
      input_sha256: ${{ steps.stage.outputs.sha256 }}
    steps:
      - name: Check out the exact verified release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.source_sha }}

      - name: Require the App Store accepted Xcode toolchain
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.prepare-release.outputs.source_sha }}"
          test "$(git rev-parse "refs/tags/${{ needs.prepare-release.outputs.tag }}^{commit}")" = "${{ needs.prepare-release.outputs.source_sha }}"
          XCODE_VERSION="$(xcodebuild -version)"
          printf '%s\n' "$XCODE_VERSION"
          printf '%s\n' "$XCODE_VERSION" | grep -F "$REQUIRED_XCODE_VERSION"
          printf '%s\n' "$XCODE_VERSION" | grep -F "Build version $REQUIRED_XCODE_BUILD"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          printf 'iPhoneOS SDK %s\n' "$SDK_VERSION"
          case "$SDK_VERSION" in
            26.*) ;;
            *) exit 1 ;;
          esac

      - name: Restore bundled font cache
        uses: actions/cache@v4
        with:
          path: |
            FloeAgent/Vendor/Fonts/downloads
            FloeAgent/FloeApp/Resources/Fonts/Bundled
          key: floe-fonts-${{ hashFiles('FloeAgent/scripts/fonts/manifest.json') }}

      - name: Fetch and verify bundled fonts
        run: |
          python3 scripts/fonts/fetch_fonts.py --check || {
            python3 scripts/fonts/fetch_fonts.py
            python3 scripts/fonts/fetch_fonts.py --check
          }

      - name: Select the job-local package cache
        run: echo "FLOE_SPM_CACHE_ROOT=$RUNNER_TEMP/FloePackageCache" >> "$GITHUB_ENV"

      - name: Restore verified shell binary archives
        uses: actions/cache@v4
        with:
          path: ${{ env.FLOE_SPM_CACHE_ROOT }}/artifacts
          key: floe-shell-archives-v1-${{ hashFiles('FloeAgent/ThirdParty/FloeShellEngine/Package.swift') }}

      - name: Prime the pinned shell artifact cache through GitHub API
        run: python3 scripts/prime_shell_artifact_cache.py --cache-dir "$FLOE_SPM_CACHE_ROOT/artifacts"

      - name: Install accepted-SDK release tooling and generate the project
        run: |
          brew install xcodegen automake cmake
          xcodebuild -downloadComponent MetalToolchain
          scripts/bootstrap_python_runtime.sh
          scripts/gen_project.sh
          scripts/pin_check.sh

      # Same bounded resolution as the SDK 27 job, using this job's cache,
      # derived data, configuration and destination, and the same committed
      # HEAD lock as the read-only baseline for the actual Xcode workspace
      # lock. The build below freezes package versions with
      # -onlyUsePackageVersionsFromResolvedFile; those flags do not make the build offline.
      # A missing checkout or binary artifact may still be downloaded.
      - name: Resolve Xcode package dependencies with bounded network retry
        timeout-minutes: 30
        run: |
          git show HEAD:FloeAgent/Package.resolved > "$RUNNER_TEMP/FloeCanonicalPackage.resolved"
          scripts/resolve_xcode_dependencies.sh \
            --project FloeAgent.xcodeproj \
            --scheme FloeAgent \
            --configuration Release \
            --destination 'generic/platform=iOS' \
            --package-cache-path "$FLOE_SPM_CACHE_ROOT" \
            --derived-data-path "$RUNNER_TEMP/FloeStableDeviceDerivedData" \
            --resolved-file Package.resolved \
            --canonical-lock "$RUNNER_TEMP/FloeCanonicalPackage.resolved" \
            --xcode-lock FloeAgent.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            --project-yml project.yml \
            --log-dir "$RUNNER_TEMP/FloeDependencyTransport/accepted-sdk" \
            --max-attempts 3

      - name: Preserve accepted-SDK dependency-resolution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accepted-sdk-dependency-transport-${{ github.run_id }}
          path: ${{ runner.temp }}/FloeDependencyTransport/accepted-sdk/
          if-no-files-found: ignore

      - name: Rebuild the exact tag with the accepted App Store SDK
        run: |
          xcodebuild -packageCachePath "$FLOE_SPM_CACHE_ROOT" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            -project FloeAgent.xcodeproj \
            -scheme FloeAgent \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/FloeStableDeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build
          STABLE_APP_PATH="$(find "$RUNNER_TEMP/FloeStableDeviceDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$STABLE_APP_PATH"
          python3 scripts/verify_pdfium_linkage.py "$STABLE_APP_PATH" --report "$RUNNER_TEMP/stable-pdfium-linkage.json"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$STABLE_APP_PATH/Info.plist")" = org.floeagent.ios
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$STABLE_APP_PATH/Info.plist")" = "${{ needs.prepare-release.outputs.version }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$STABLE_APP_PATH/Info.plist")" = "${{ needs.prepare-release.outputs.build }}"
          mkdir -p "$RUNNER_TEMP/FloeSignedPayload/Payload"
          ditto "$STABLE_APP_PATH" "$RUNNER_TEMP/FloeSignedPayload/Payload/$(basename "$STABLE_APP_PATH")"

      - name: Preserve the completed device build before simulator qualification
        run: |
          set -euo pipefail
          printf '%s\n' "${{ needs.prepare-release.outputs.source_sha }}" > "$RUNNER_TEMP/FloeSignedPayload/SOURCE-SHA.txt"
          printf '%s\n' 'stage=unsigned_device_build_before_normalization_and_tests' > "$RUNNER_TEMP/FloeSignedPayload/RECOVERY-STAGE.txt"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/FloeSignedPayload" "$RUNNER_TEMP/accepted-sdk-device-recovery.zip"
          shasum -a 256 "$RUNNER_TEMP/accepted-sdk-device-recovery.zip" > "$RUNNER_TEMP/accepted-sdk-device-recovery.zip.sha256"
      - name: Retain the device build even if later qualification fails
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accepted-sdk-device-recovery-${{ needs.prepare-release.outputs.version }}-build${{ needs.prepare-release.outputs.build }}
          path: |
            ${{ runner.temp }}/accepted-sdk-device-recovery.zip
            ${{ runner.temp }}/accepted-sdk-device-recovery.zip.sha256
          if-no-files-found: error

      - name: Build accepted-SDK simulator test hosts once
        timeout-minutes: 45
        run: |
          xcodebuild -packageCachePath "$FLOE_SPM_CACHE_ROOT" -project FloeAgent.xcodeproj -scheme FloeAgent \
            -skipPackagePluginValidation -skipMacroValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/FloeStableDeviceDerivedData" \
            -only-testing:FloeAppTests \
            -only-testing:FloeAgentUITests/NotesWorkspaceImportUITests \
            ENABLE_TESTABILITY=YES ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build-for-testing

      # Retain the complete compiled accepted-SDK (Xcode 26.6) host before any
      # UI test runs. The prefix, archive layout and metadata match the recovery
      # workflow's host archive, so a source-bound recovery run can verify and
      # reuse it without rebuilding and without ever confusing it with the
      # SDK 27 host.
      - name: Retain the compiled accepted-SDK simulator test host
        run: |
          set -euo pipefail
          products="$RUNNER_TEMP/FloeStableDeviceDerivedData/Build/Products"
          test -n "$(find "$products" -maxdepth 1 -name '*.xctestrun' -print -quit)"
          test -n "$(find "$products" -type d -name 'FloeAgentUITests-Runner.app' -print -quit)"
          archive="$RUNNER_TEMP/FloeStableHost"
          mkdir -p "$archive"
          tar -czf "$archive/Products.tar.gz" \
            -C "$RUNNER_TEMP/FloeStableDeviceDerivedData/Build" Products
          (cd "$archive" && shasum -a 256 Products.tar.gz > Products.tar.gz.sha256)
          printf '%s\n' "${{ needs.prepare-release.outputs.source_sha }}" > "$archive/SOURCE-SHA.txt"
          xcodebuild -version > "$archive/TOOLCHAIN.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$archive/SOURCE-RUN.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$archive/SOURCE-ATTEMPT.txt"

      - name: Upload recoverable accepted-SDK simulator host
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accepted-sdk26-simulator-host-${{ needs.prepare-release.outputs.source_sha }}
          path: ${{ runner.temp }}/FloeStableHost/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Verify focused app regressions with the accepted App Store SDK
        id: stable_app_regression
        timeout-minutes: 47
        run: |
          floe_sdk_major="$(xcrun --sdk iphonesimulator --show-sdk-version | cut -d. -f1)"
          floe_test_device="$(xcrun simctl list devices available -j | python3 scripts/select_test_simulator.py --sdk-major "$floe_sdk_major" --name "iPad mini (A17 Pro)" --family iPad --create)"
          xctestrun=$(find "$RUNNER_TEMP/FloeStableDeviceDerivedData/Build/Products" -maxdepth 1 -name '*.xctestrun' -print -quit)
          test -n "$xctestrun"
          python3 scripts/run_test_with_diagnostics.py \
            --output-dir "$RUNNER_TEMP/Floe-StableAppRegressionDiagnostics" \
            --timeout 2700 --stall-timeout 420 --simulator-id "$floe_test_device" \
            --defer-stall-until-tests -- xcodebuild \
            -xctestrun "$xctestrun" \
            -destination "platform=iOS Simulator,id=$floe_test_device" \
            -resultBundlePath "$RUNNER_TEMP/FloeStable-AppRegressionTests.xcresult" \
            -collect-test-diagnostics never \
            -parallel-testing-enabled NO \
            -only-testing:FloeAppTests/CanvasTouchInteractionTests \
            -only-testing:FloeAppTests/CanvasSavedImageBatchAtomicityTests \
            -only-testing:FloeAppTests/CanvasAgentToolContractTests \
            -only-testing:FloeAppTests/CrashAndFeedbackRegressionTests \
            -only-testing:FloeAppTests/ThreadTimelineTests \
            -only-testing:FloeAppTests/HomeChatSeparationTests \
            -only-testing:FloeAppTests/HomeTaskCreationTests \
            -only-testing:FloeAppTests/EnvironmentLanguagePackageTests \
            -only-testing:FloeAppTests/BrowserProtocolTests \
            -only-testing:FloeAppTests/MailConnectorTests \
            -only-testing:FloeAppTests/SkillLifecycleTests \
            -only-testing:FloeAppTests/LocalPythonRuntimeTests \
            -only-testing:FloeAppTests/LocalShellRuntimeTests \
            -only-testing:FloeAppTests/LocalServiceLifecycleTests \
            -only-testing:FloeAppTests/LuaShellInstallTests \
            -only-testing:FloeAppTests/IDEGitHubActionsTests \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building
          python3 scripts/verify_app_regression_xcresult.py \
            --result-bundle "$RUNNER_TEMP/FloeStable-AppRegressionTests.xcresult" \
            --github-output "$GITHUB_OUTPUT" \
            --summary-output "$RUNNER_TEMP/FloeStable-AppRegressionTests-SUMMARY.txt"

      - name: Preserve accepted-SDK App regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accepted-sdk-app-diagnostics-${{ needs.prepare-release.outputs.version }}-build${{ needs.prepare-release.outputs.build }}
          path: |
            ${{ runner.temp }}/FloeStable-AppRegressionTests.xcresult
            ${{ runner.temp }}/FloeStable-AppRegressionTests-SUMMARY.txt
            ${{ runner.temp }}/Floe-StableAppRegressionDiagnostics/
          if-no-files-found: ignore

      # Split per device so one simulator's hang cannot consume the other's
      # budget. Step names match the recovery workflow so the same source-run
      # provenance check accepts both the legacy single step and this split
      # shape. A failing iPad leg still lets the iPhone leg run for evidence,
      # but the gate below fails the job unless both strictly passed.
      - name: Require Notes import on the iPad simulator with the accepted SDK
        id: notes_ipad
        timeout-minutes: 25
        env:
          NOTES_DEVICE: iPad mini (A17 Pro)
          NOTES_NAME: ipad
          NOTES_DERIVED: FloeStableDeviceDerivedData
          NOTES_EVIDENCE: FloeStable-Notes
        run: |
          set -o pipefail
          qualification="$RUNNER_TEMP/$NOTES_EVIDENCE"
          mkdir -p "$qualification"
          xctestrun=$(find "$RUNNER_TEMP/$NOTES_DERIVED/Build/Products" -maxdepth 1 -name '*.xctestrun' -print -quit)
          test -n "$xctestrun"
          floe_sdk_major="$(xcrun --sdk iphonesimulator --show-sdk-version | cut -d. -f1)"
          test_device="$(xcrun simctl list devices available -j | python3 scripts/select_test_simulator.py --sdk-major "$floe_sdk_major" --name "$NOTES_DEVICE" --family "${NOTES_DEVICE%% *}" --create)"
          test -n "$test_device"
          # Finish simulator boot before XCTest starts its fixed App-launch
          # deadline. Do not warm-launch the App or retry executed failures.
          python3 scripts/prepare_ui_simulator.py --simulator-id "$test_device" \
            --output-dir "$RUNNER_TEMP/${NOTES_EVIDENCE}Diagnostics/$NOTES_NAME-boot" || exit 1
          leg_attempt=1
          status=0
          while true; do
            leg_code=0
            diag_dir="$RUNNER_TEMP/${NOTES_EVIDENCE}Diagnostics/$NOTES_NAME-attempt-$leg_attempt"
            python3 scripts/run_test_with_diagnostics.py \
              --output-dir "$diag_dir" --timeout 1320 --stall-timeout 210 \
              --startup-stall-timeout 420 --simulator-id "$test_device" -- xcodebuild \
              -xctestrun "$xctestrun" \
              -destination "platform=iOS Simulator,id=$test_device" \
              -resultBundlePath "$qualification/$NOTES_NAME-attempt-$leg_attempt.xcresult" \
              -collect-test-diagnostics never \
              -only-testing:FloeAgentUITests/NotesWorkspaceImportUITests \
              -parallel-testing-enabled NO -test-timeouts-enabled YES \
              -maximum-test-execution-time-allowance 360 \
              CODE_SIGNING_ALLOWED=NO test-without-building \
              2>&1 | tee "$qualification/$NOTES_NAME-attempt-$leg_attempt.log" || leg_code=$?
            # One retry only, and only the classifier decides it: it accepts
            # the pre-existing stalled shape or the narrowly known pre-test
            # bootstrap crash, requiring testsStarted=false, no test case/suite
            # execution and no App crash evidence. Executed failures and any
            # other nonzero exit are never retried into a pass; a missing or
            # unreadable helper, summary or attempt log fails closed too, as
            # there is deliberately no inline fallback.
            if [ "$leg_attempt" -eq 1 ] && \
               python3 scripts/notes_ui_startup_retry.py \
                 --summary "$diag_dir/summary.json" \
                 --log "$qualification/$NOTES_NAME-attempt-$leg_attempt.log" \
                 --attempt "$leg_attempt"; then
              leg_attempt=2
              continue
            fi
            [ "$leg_code" -ne 0 ] && status=1
            break
          done
          final="$qualification/$NOTES_NAME-attempt-$leg_attempt.xcresult"
          if test -d "$final"; then
            python3 scripts/verify_notes_ui_xcresult.py --simulator-without-office \
              --result-bundle "$final" \
              --summary-output "$qualification/$NOTES_NAME-summary.json" || status=1
            mkdir -p "$qualification/screenshots/$NOTES_NAME"
            xcrun xcresulttool export attachments --path "$final" \
              --output-path "$qualification/screenshots/$NOTES_NAME" || true
          else
            echo "$final was never produced; the leg has no verifiable result." >&2
            status=1
          fi
          exit "$status"

      - name: Require Notes import on the iPhone simulator with the accepted SDK
        id: notes_iphone
        # Run after an iPad failure to collect iPhone evidence, but only when the
        # iPad leg actually executed (never on the cancelled path).
        if: ${{ !cancelled() && steps.notes_ipad.outcome != 'skipped' }}
        timeout-minutes: 25
        env:
          NOTES_DEVICE: iPhone 17 Pro
          NOTES_NAME: iphone
          NOTES_DERIVED: FloeStableDeviceDerivedData
          NOTES_EVIDENCE: FloeStable-Notes
        run: |
          set -o pipefail
          qualification="$RUNNER_TEMP/$NOTES_EVIDENCE"
          mkdir -p "$qualification"
          xctestrun=$(find "$RUNNER_TEMP/$NOTES_DERIVED/Build/Products" -maxdepth 1 -name '*.xctestrun' -print -quit)
          test -n "$xctestrun"
          floe_sdk_major="$(xcrun --sdk iphonesimulator --show-sdk-version | cut -d. -f1)"
          test_device="$(xcrun simctl list devices available -j | python3 scripts/select_test_simulator.py --sdk-major "$floe_sdk_major" --name "$NOTES_DEVICE" --family "${NOTES_DEVICE%% *}" --create)"
          test -n "$test_device"
          # Finish simulator boot before XCTest starts its fixed App-launch
          # deadline. Do not warm-launch the App or retry executed failures.
          python3 scripts/prepare_ui_simulator.py --simulator-id "$test_device" \
            --output-dir "$RUNNER_TEMP/${NOTES_EVIDENCE}Diagnostics/$NOTES_NAME-boot" || exit 1
          leg_attempt=1
          status=0
          while true; do
            leg_code=0
            diag_dir="$RUNNER_TEMP/${NOTES_EVIDENCE}Diagnostics/$NOTES_NAME-attempt-$leg_attempt"
            python3 scripts/run_test_with_diagnostics.py \
              --output-dir "$diag_dir" --timeout 1320 --stall-timeout 210 \
              --startup-stall-timeout 420 --simulator-id "$test_device" -- xcodebuild \
              -xctestrun "$xctestrun" \
              -destination "platform=iOS Simulator,id=$test_device" \
              -resultBundlePath "$qualification/$NOTES_NAME-attempt-$leg_attempt.xcresult" \
              -collect-test-diagnostics never \
              -only-testing:FloeAgentUITests/NotesWorkspaceImportUITests \
              -parallel-testing-enabled NO -test-timeouts-enabled YES \
              -maximum-test-execution-time-allowance 360 \
              CODE_SIGNING_ALLOWED=NO test-without-building \
              2>&1 | tee "$qualification/$NOTES_NAME-attempt-$leg_attempt.log" || leg_code=$?
            # One retry only, and only the classifier decides it: it accepts
            # the pre-existing stalled shape or the narrowly known pre-test
            # bootstrap crash, requiring testsStarted=false, no test case/suite
            # execution and no App crash evidence. Executed failures and any
            # other nonzero exit are never retried into a pass; a missing or
            # unreadable helper, summary or attempt log fails closed too, as
            # there is deliberately no inline fallback.
            if [ "$leg_attempt" -eq 1 ] && \
               python3 scripts/notes_ui_startup_retry.py \
                 --summary "$diag_dir/summary.json" \
                 --log "$qualification/$NOTES_NAME-attempt-$leg_attempt.log" \
                 --attempt "$leg_attempt"; then
              leg_attempt=2
              continue
            fi
            [ "$leg_code" -ne 0 ] && status=1
            break
          done
          final="$qualification/$NOTES_NAME-attempt-$leg_attempt.xcresult"
          if test -d "$final"; then
            python3 scripts/verify_notes_ui_xcresult.py --simulator-without-office \
              --result-bundle "$final" \
              --summary-output "$qualification/$NOTES_NAME-summary.json" || status=1
            mkdir -p "$qualification/screenshots/$NOTES_NAME"
            xcrun xcresulttool export attachments --path "$final" \
              --output-path "$qualification/screenshots/$NOTES_NAME" || true
          else
            echo "$final was never produced; the leg has no verifiable result." >&2
            status=1
          fi
          exit "$status"

      - name: Require both accepted-SDK Notes device legs to pass
        if: ${{ !cancelled() && steps.notes_ipad.outcome != 'skipped' }}
        env:
          IPAD_NOTES_OUTCOME: ${{ steps.notes_ipad.outcome }}
          IPHONE_NOTES_OUTCOME: ${{ steps.notes_iphone.outcome }}
        run: |
          # The signing and upload path must never start when either device was
          # not strictly verified; there is deliberately no soft-fail bypass.
          test "$IPAD_NOTES_OUTCOME" = success
          test "$IPHONE_NOTES_OUTCOME" = success

      - name: Retain accepted-SDK Notes UI evidence before distribution
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accepted-sdk-notes-ui-${{ needs.prepare-release.outputs.version }}-build${{ needs.prepare-release.outputs.build }}
          path: |
            ${{ runner.temp }}/FloeStable-Notes/
            ${{ runner.temp }}/FloeStable-NotesDiagnostics/
          if-no-files-found: ignore

      - name: Normalize reviewed App Store bundle defects before signing
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/FloeSignedPayload/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          python3 scripts/prepare_app_store_bundle.py --app "$APP_PATH" --report "$RUNNER_TEMP/bundle-normalization.json"

      - name: Stage the qualified accepted-SDK application without rebuilding it
        id: stage
        run: |
          input="$RUNNER_TEMP/AcceptedDistributionInput"
          mkdir -p "$input"
          ditto "$RUNNER_TEMP/FloeSignedPayload" "$input/FloeSignedPayload"
          ditto "$RUNNER_TEMP/FloeStable-AppRegressionTests.xcresult" "$input/FloeStable-AppRegressionTests.xcresult"
          cp "$RUNNER_TEMP/FloeStable-AppRegressionTests-SUMMARY.txt" "$input/"
          cp "$RUNNER_TEMP/bundle-normalization.json" "$input/"
          printf '%s\n' "${{ needs.prepare-release.outputs.source_sha }}" > "$input/SOURCE-SHA.txt"
          ditto -c -k --sequesterRsrc --keepParent "$input" "$RUNNER_TEMP/accepted-sdk-input.zip"
          echo "sha256=$(shasum -a 256 "$RUNNER_TEMP/accepted-sdk-input.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Retain the accepted-SDK distribution input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accepted-sdk-input-${{ needs.prepare-release.outputs.version }}-build${{ needs.prepare-release.outputs.build }}
          path: ${{ runner.temp }}/accepted-sdk-input.zip
          if-no-files-found: error

  testflight:
    name: Archive and upload the same commit to TestFlight
    needs: [build-verify-release, accepted-sdk-build, notes-component]
    permissions:
      contents: read
      actions: read
    # Both SDK qualifications and the exact-source NativeNotes component gate
    # must succeed before any signing key is installed; a failed, cancelled or
    # unexpectedly skipped notes-component job skips this upload entirely.
    # Reuse the already-qualified accepted-SDK device application byte-for-byte.
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      REQUIRED_XCODE_VERSION: Xcode 26.6
      REQUIRED_XCODE_BUILD: 17F113
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: FloeAgent
    steps:
      - name: Check out the exact verified release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ needs.build-verify-release.outputs.source_sha }}

      - name: Require the App Store accepted Xcode toolchain
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.build-verify-release.outputs.source_sha }}"
          test "$(git rev-parse "refs/tags/${{ needs.build-verify-release.outputs.tag }}^{commit}")" = "${{ needs.build-verify-release.outputs.source_sha }}"
          XCODE_VERSION="$(xcodebuild -version)"
          printf '%s\n' "$XCODE_VERSION"
          printf '%s\n' "$XCODE_VERSION" | grep -F "$REQUIRED_XCODE_VERSION"
          printf '%s\n' "$XCODE_VERSION" | grep -F "Build version $REQUIRED_XCODE_BUILD"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          printf 'iPhoneOS SDK %s\n' "$SDK_VERSION"
          case "$SDK_VERSION" in
            26.*) ;;
            *) exit 1 ;;
          esac

      - name: Download the tested and attested unsigned application
        uses: actions/download-artifact@v5
        with:
          name: unsigned-ipa-${{ needs.build-verify-release.outputs.version }}-build${{ needs.build-verify-release.outputs.build }}
          path: ${{ runner.temp }}/UnsignedRelease

      - name: Validate the exact verified application
        run: |
          IPA_PATH="$(find "$RUNNER_TEMP/UnsignedRelease" -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          mkdir -p "$RUNNER_TEMP/FloeVerifiedPayload"
          unzip -q "$IPA_PATH" -d "$RUNNER_TEMP/FloeVerifiedPayload"
          APP_PATH="$(find "$RUNNER_TEMP/FloeVerifiedPayload/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = org.floeagent.ios
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "${{ needs.build-verify-release.outputs.version }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "${{ needs.build-verify-release.outputs.build }}"

      - name: Download the qualified accepted-SDK distribution input
        uses: actions/download-artifact@v5
        with:
          name: accepted-sdk-input-${{ needs.build-verify-release.outputs.version }}-build${{ needs.build-verify-release.outputs.build }}
          path: ${{ runner.temp }}/AcceptedInput
      - name: Verify and restore the exact qualified accepted-SDK application
        run: |
          echo "${{ needs.accepted-sdk-build.outputs.input_sha256 }}  $RUNNER_TEMP/AcceptedInput/accepted-sdk-input.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/AcceptedInput/accepted-sdk-input.zip" -d "$RUNNER_TEMP/AcceptedInput"
          input="$RUNNER_TEMP/AcceptedInput/AcceptedDistributionInput"
          test "$(cat "$input/SOURCE-SHA.txt")" = "${{ needs.build-verify-release.outputs.source_sha }}"
          ditto "$input/FloeSignedPayload" "$RUNNER_TEMP/FloeSignedPayload"
          ditto "$input/FloeStable-AppRegressionTests.xcresult" "$RUNNER_TEMP/FloeStable-AppRegressionTests.xcresult"
          cp "$input/FloeStable-AppRegressionTests-SUMMARY.txt" "$RUNNER_TEMP/"
          cp "$input/bundle-normalization.json" "$RUNNER_TEMP/"
          APP_PATH="$(find "$RUNNER_TEMP/FloeSignedPayload/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = org.floeagent.ios
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "${{ needs.build-verify-release.outputs.version }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "${{ needs.build-verify-release.outputs.build }}"
          python3 scripts/verify_app_regression_xcresult.py --result-bundle "$RUNNER_TEMP/FloeStable-AppRegressionTests.xcresult"

      - name: Install App Store Connect API key
        env:
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          test -n "$ASC_API_PRIVATE_KEY_BASE64"
          test -n "$ASC_KEY_ID"
          echo "$ASC_API_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Install distribution identity and existing App Store profiles
        env:
          DISTRIBUTION_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          HOST_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          SCREENSHARE_PROVISIONING_PROFILE: ${{ secrets.APPLE_SCREENSHARE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$DISTRIBUTION_CERTIFICATE"
          test -n "$HOST_PROVISIONING_PROFILE"
          test -n "$SCREENSHARE_PROVISIONING_PROFILE"
          KEYCHAIN="$RUNNER_TEMP/floe-release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          echo "$DISTRIBUTION_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "$HOST_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/Floe.mobileprovision"
          echo "$SCREENSHARE_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/FloeScreenShare.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -P "$DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Apple Distribution/{print $2; exit}')"
          test "${#SIGN_IDENTITY}" -eq 40
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          validate_profile() {
            PROFILE_PATH="$1"
            EXPECTED_APP_ID="$2"
            SOURCE_ENTITLEMENTS_PATH="$3"
            ENTITLEMENTS_PATH="$4"
            EXPECTED_HOMEKIT="${5:-false}"
            PROFILE_PLIST="$RUNNER_TEMP/$(basename "$PROFILE_PATH").plist"
            security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
            test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")" = "$EXPECTED_APP_ID"
            test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PROFILE_PLIST")" = false
            test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:beta-reports-active' "$PROFILE_PLIST")" = true
            test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups:0' "$PROFILE_PLIST")" = group.org.floeagent.ios
            if test "$EXPECTED_HOMEKIT" = true; then
              test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.homekit' "$PROFILE_PLIST")" = true
            fi
            # Sign with the app's declared capabilities, not the profile's raw
            # wildcard/development values. Xcode normally performs these exact
            # App Store substitutions while exporting an archive.
            cp "$SOURCE_ENTITLEMENTS_PATH" "$ENTITLEMENTS_PATH"
            /usr/libexec/PlistBuddy \
              -c "Add :application-identifier string $EXPECTED_APP_ID" \
              -c 'Add :com.apple.developer.team-identifier string QYL72C43K6' \
              -c 'Add :get-task-allow bool false' \
              -c 'Add :beta-reports-active bool true' \
              -c 'Add :keychain-access-groups array' \
              -c "Add :keychain-access-groups:0 string $EXPECTED_APP_ID" \
              "$ENTITLEMENTS_PATH"
            plutil -lint "$ENTITLEMENTS_PATH"
          }
          validate_profile \
            "$RUNNER_TEMP/Floe.mobileprovision" \
            QYL72C43K6.org.floeagent.ios \
            FloeApp/Entitlements/Floe.entitlements \
            "$RUNNER_TEMP/Floe.entitlements" \
            true
          /usr/libexec/PlistBuddy \
            -c 'Add :com.apple.developer.icloud-container-environment string Production' \
            -c 'Add :com.apple.developer.ubiquity-kvstore-identifier string QYL72C43K6.org.floeagent.ios' \
            "$RUNNER_TEMP/Floe.entitlements"
          validate_profile \
            "$RUNNER_TEMP/FloeScreenShare.mobileprovision" \
            QYL72C43K6.org.floeagent.ios.screenshare \
            FloeScreenShare/FloeScreenShare.entitlements \
            "$RUNNER_TEMP/FloeScreenShare.entitlements"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-container-environment' "$RUNNER_TEMP/Floe.entitlements")" = Production
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.ubiquity-kvstore-identifier' "$RUNNER_TEMP/Floe.entitlements")" = QYL72C43K6.org.floeagent.ios

      - name: Sign, verify, package, and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/TestFlightExport"
          cp "$RUNNER_TEMP/bundle-normalization.json" "$RUNNER_TEMP/TestFlightExport/"
          cp "$RUNNER_TEMP/FloeStable-AppRegressionTests-SUMMARY.txt" \
            "$RUNNER_TEMP/TestFlightExport/"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/FloeStable-AppRegressionTests.xcresult" \
            "$RUNNER_TEMP/TestFlightExport/FloeStable-AppRegressionTests.xcresult.zip"
          unzip -t "$RUNNER_TEMP/TestFlightExport/FloeStable-AppRegressionTests.xcresult.zip"
          APP_PATH="$(find "$RUNNER_TEMP/FloeSignedPayload/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          APPEX_PATH="$APP_PATH/PlugIns/Floe Screen Share.appex"
          test -d "$APPEX_PATH"

          cp "$RUNNER_TEMP/FloeScreenShare.mobileprovision" "$APPEX_PATH/embedded.mobileprovision"
          cp "$RUNNER_TEMP/Floe.mobileprovision" "$APP_PATH/embedded.mobileprovision"

          if test -d "$APP_PATH/Frameworks"; then
            find "$APP_PATH/Frameworks" -depth \( -name '*.framework' -o -name '*.dylib' \) -print0 \
              | while IFS= read -r -d '' CODE_PATH; do
                  codesign --force --sign "$SIGN_IDENTITY" --generate-entitlement-der "$CODE_PATH"
                done
          fi
          codesign --force --sign "$SIGN_IDENTITY" \
            --entitlements "$RUNNER_TEMP/FloeScreenShare.entitlements" \
            --generate-entitlement-der "$APPEX_PATH"
          codesign --force --sign "$SIGN_IDENTITY" \
            --entitlements "$RUNNER_TEMP/Floe.entitlements" \
            --generate-entitlement-der "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          mkdir -p "$RUNNER_TEMP/TestFlightPayload/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/TestFlightPayload/Payload/$(basename "$APP_PATH")"
          (
            cd "$RUNNER_TEMP/TestFlightPayload"
            ditto -c -k --sequesterRsrc --keepParent Payload "$RUNNER_TEMP/TestFlightExport/FloeAgent.ipa"
          )
          unzip -t "$RUNNER_TEMP/TestFlightExport/FloeAgent.ipa"
          xcrun altool --validate-app \
            --file "$RUNNER_TEMP/TestFlightExport/FloeAgent.ipa" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app \
            --file "$RUNNER_TEMP/TestFlightExport/FloeAgent.ipa" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            | tee "$RUNNER_TEMP/TestFlightExport/UPLOAD-RECEIPT.txt"
          {
            echo "tag=${{ needs.build-verify-release.outputs.tag }}"
            echo "version=${{ needs.build-verify-release.outputs.version }}"
            echo "build=${{ needs.build-verify-release.outputs.build }}"
            echo "commit=${{ needs.build-verify-release.outputs.source_sha }}"
            echo "accepted_sdk_toolchain=$REQUIRED_XCODE_VERSION ($REQUIRED_XCODE_BUILD)"
            echo "accepted_sdk_app_regression_tests=${{ needs.accepted-sdk-build.outputs.passed }}/${{ needs.accepted-sdk-build.outputs.total }} passed"
            echo "accepted_sdk_app_regression_failed=${{ needs.accepted-sdk-build.outputs.failed }}"
            echo "accepted_sdk_app_regression_skipped=${{ needs.accepted-sdk-build.outputs.skipped }}"
            echo "testflight_upload=accepted_by_transport"
            echo "apple_processing_state=not_verified"
            echo "floe_qa_visibility=not_verified"
          } > "$RUNNER_TEMP/TestFlightExport/TESTFLIGHT-SUMMARY.txt"

      - name: Upload TestFlight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testflight-${{ needs.build-verify-release.outputs.version }}-build${{ needs.build-verify-release.outputs.build }}
          path: ${{ runner.temp }}/TestFlightExport/
          if-no-files-found: error

      - name: Upload accepted-SDK focused-test evidence for the GitHub release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accepted-sdk-app-regression-${{ needs.build-verify-release.outputs.version }}-build${{ needs.build-verify-release.outputs.build }}
          path: |
            ${{ runner.temp }}/TestFlightExport/FloeStable-AppRegressionTests-SUMMARY.txt
            ${{ runner.temp }}/TestFlightExport/FloeStable-AppRegressionTests.xcresult.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub assets after TestFlight transport accepts the upload
    if: (github.event_name == 'push' && !contains(needs.build-verify-release.outputs.tag, '-beta.')) || inputs.publish
    needs: [build-verify-release, testflight]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build-verify-release.outputs.tag }}
      VERSION: ${{ needs.build-verify-release.outputs.version }}
      BUILD: ${{ needs.build-verify-release.outputs.build }}
      SOURCE_SHA: ${{ needs.build-verify-release.outputs.source_sha }}
    steps:
      - name: Check out the immutable release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ needs.build-verify-release.outputs.source_sha }}
      - name: Require the release tag to remain on the tested commit
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$SOURCE_SHA"
      - uses: actions/download-artifact@v5
        with:
          name: unsigned-ipa-${{ needs.build-verify-release.outputs.version }}-build${{ needs.build-verify-release.outputs.build }}
          path: release-assets
      - name: Download accepted-SDK focused-test evidence
        uses: actions/download-artifact@v5
        with:
          name: accepted-sdk-app-regression-${{ needs.build-verify-release.outputs.version }}-build${{ needs.build-verify-release.outputs.build }}
          path: release-assets
      - name: Publish the transport-accepted paired release
        run: |
          NOTES_PATH="docs/RELEASE_NOTES_${VERSION}_BUILD_${BUILD}.md"
          test -s "$NOTES_PATH"
          # Build 177's immutable candidate notes use h2 section headings;
          # later notes use h3. Accept either, but always require both languages.
          grep -qE '^##+ 简体中文' "$NOTES_PATH"
          grep -qE '^##+ English' "$NOTES_PATH"
          cp "$NOTES_PATH" release-notes.md
          cat <<'EOF' >> release-notes.md

          > [!IMPORTANT]
          > 发布工作流已完成签名上传；Apple `VALID` 和内部 Floe QA 可见性仍需单独核验。
          > The release workflow completed signed upload; Apple `VALID` processing and internal Floe QA visibility require separate verification.

          > [!WARNING]
          > GitHub IPA 未签名，不能直接安装，也不是 App Store 上传包。
          > The GitHub IPA is unsigned, cannot be installed directly, and is not the App Store upload package.

          发布资产包含测试证据、SPDX SBOM、第三方许可证、密钥扫描报告和构建来源证明。
          Assets include test evidence, an SPDX SBOM, third-party licenses, secret-scan reports and build provenance.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md --draft=false --prerelease
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag --prerelease \
              --title "Floe Agent $VERSION (build $BUILD)" \
              --notes-file release-notes.md
          fi
