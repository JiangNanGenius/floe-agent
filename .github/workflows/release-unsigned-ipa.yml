name: TestFlight and Unsigned IPA Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer tag to validate and build
        required: true
        type: string
      publish:
        description: Publish the draft prerelease after validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: floe-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verify-release:
    # The shipped binary is built and verified with Xcode 27 so the complete
    # iOS 27 Foundation Models implementation is present.
    runs-on: xcode-27
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      REQUIRED_XCODE_VERSION: Xcode 27.0
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: FloeAgent
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      build: ${{ steps.release.outputs.build }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Require Xcode 27.0 release toolchain
        run: |
          XCODE_VERSION="$(xcodebuild -version)"
          printf '%s\n' "$XCODE_VERSION"
          printf '%s\n' "$XCODE_VERSION" | grep -F "$REQUIRED_XCODE_VERSION"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 27.0

      - name: Install release tooling
        run: |
          brew install xcodegen gitleaks syft
          xcodebuild -downloadComponent MetalToolchain
          scripts/bootstrap_python_runtime.sh

      - name: Generate project and validate tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          scripts/gen_project.sh
          scripts/release_preflight.sh "$RELEASE_TAG"

      - name: Resolve dependencies and run Swift tests
        run: |
          swift package resolve
          scripts/pin_check.sh
          swift build
          LLAMA_FRAMEWORK="$(find .build/artifacts -path '*/macos-arm64_x86_64/llama.framework' ! -path '*/__MACOSX/*' -print -quit)"
          test -n "$LLAMA_FRAMEWORK"
          test -x "$LLAMA_FRAMEWORK/Versions/Current/llama"
          export DYLD_FRAMEWORK_PATH="$(dirname "$LLAMA_FRAMEWORK")${DYLD_FRAMEWORK_PATH:+:$DYLD_FRAMEWORK_PATH}"
          BIN_PATH="$(swift build --show-bin-path)"
          mkdir -p "$BIN_PATH/PackageFrameworks"
          cp -R "$LLAMA_FRAMEWORK" "$BIN_PATH/PackageFrameworks/"
          while IFS= read -r PRODUCTS_DIR; do
            mkdir -p "$PRODUCTS_DIR/PackageFrameworks"
            cp -R "$LLAMA_FRAMEWORK" "$PRODUCTS_DIR/PackageFrameworks/"
          done < <(find .build -type d -path '*/Products/Debug')
          find "$BIN_PATH/PackageFrameworks/llama.framework" -name '._*' -delete
          # Isolate JavaScriptCore deadline tests from the concurrent suite so
          # shared-runner load cannot distort their wall-clock assertions.
          swift test \
            --skip 'FloeExecutionTests.JavaScriptEngineTests' \
            --skip 'FloeExecutionTests.JavaScriptExecutionToolTests'
          swift test --filter 'FloeExecutionTests.JavaScriptEngineTests'
          swift test --filter 'FloeExecutionTests.JavaScriptExecutionToolTests'

      - name: Build iOS simulator release gate
        run: |
          xcodebuild \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -project FloeAgent.xcodeproj \
            -scheme FloeAgent \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/FloeSimulatorDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Scan source and generate compliance artifacts
        run: |
          scripts/secret_scan.sh
          scripts/sbom.sh
          scripts/license_inventory.sh

      - name: Package the matching Floe remote agent
        run: |
          scripts/package_remote_agent.sh release-assets 1.3.0

      - name: Build unsigned device application
        run: |
          xcodebuild \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -project FloeAgent.xcodeproj \
            -scheme FloeAgent \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/FloeDeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build

      - name: Package and verify unsigned IPA
        id: package
        env:
          ASSET_NAME: ${{ steps.release.outputs.asset_name }}
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/FloeDeviceDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          scripts/package_unsigned_ipa.sh "$APP_PATH" release-assets "$ASSET_NAME"

      - name: Verify artifact metadata and scan built application
        run: |
          test "${{ steps.package.outputs.bundle_id }}" = "${{ steps.release.outputs.bundle_id }}"
          test "${{ steps.package.outputs.version }}" = "${{ steps.release.outputs.version }}"
          test "${{ steps.package.outputs.build }}" = "${{ steps.release.outputs.build }}"
          APP_PATH="$(find "$RUNNER_TEMP/FloeDeviceDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          gitleaks dir "$APP_PATH" \
            --redact \
            --report-path release-assets/app-gitleaks-report.json
          cp sbom.spdx.json release-assets/
          cp LICENSES-THIRD-PARTY.md release-assets/
          cp .gitleaks-report.json release-assets/source-gitleaks-report.json
          {
            echo "tag=${{ steps.release.outputs.tag }}"
            echo "version=${{ steps.release.outputs.version }}"
            echo "build=${{ steps.release.outputs.build }}"
            echo "bundle=${{ steps.package.outputs.bundle_id }}"
            echo "minimum_iOS=${{ steps.package.outputs.minimum_os }}"
            echo "swift_tests=passed"
            echo "simulator_release_build=passed"
            echo "unsigned_device_build=passed"
            echo "remote_agent_asset=packaged"
          } > release-assets/TEST-SUMMARY.txt

      - name: Attest unsigned IPA provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.package.outputs.ipa_path }}

      - name: Upload verified build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-ipa-${{ steps.release.outputs.version }}-build${{ steps.release.outputs.build }}
          path: FloeAgent/release-assets/
          if-no-files-found: error

  testflight:
    name: Archive and upload the same commit to TestFlight
    needs: build-verify-release
    # Sign the exact Xcode 27 application that passed the preceding gates.
    # Never replace it with an Xcode 26 rebuild, which would silently remove
    # the iOS 27-only Foundation Models path.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      REQUIRED_XCODE_VERSION: Xcode 27.0
    defaults:
      run:
        working-directory: FloeAgent
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ needs.build-verify-release.outputs.tag }}

      - name: Require Xcode 27.0 release toolchain
        run: |
          XCODE_VERSION="$(xcodebuild -version)"
          printf '%s\n' "$XCODE_VERSION"
          printf '%s\n' "$XCODE_VERSION" | grep -F "$REQUIRED_XCODE_VERSION"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 27.0

      - name: Download the tested and attested unsigned application
        uses: actions/download-artifact@v5
        with:
          name: unsigned-ipa-${{ needs.build-verify-release.outputs.version }}-build${{ needs.build-verify-release.outputs.build }}
          path: ${{ runner.temp }}/UnsignedRelease

      - name: Validate the exact verified application
        run: |
          IPA_PATH="$(find "$RUNNER_TEMP/UnsignedRelease" -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          mkdir -p "$RUNNER_TEMP/FloeVerifiedPayload"
          unzip -q "$IPA_PATH" -d "$RUNNER_TEMP/FloeVerifiedPayload"
          APP_PATH="$(find "$RUNNER_TEMP/FloeVerifiedPayload/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = org.floeagent.ios
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "${{ needs.build-verify-release.outputs.version }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "${{ needs.build-verify-release.outputs.build }}"

      - name: Prepare the exact Xcode 27 verified application for signing
        run: |
          VERIFIED_APP_PATH="$(find "$RUNNER_TEMP/FloeVerifiedPayload/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$VERIFIED_APP_PATH"
          mkdir -p "$RUNNER_TEMP/FloeSignedPayload/Payload"
          ditto "$VERIFIED_APP_PATH" "$RUNNER_TEMP/FloeSignedPayload/Payload/$(basename "$VERIFIED_APP_PATH")"

      - name: Install App Store Connect API key
        env:
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          test -n "$ASC_API_PRIVATE_KEY_BASE64"
          test -n "$ASC_KEY_ID"
          echo "$ASC_API_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Install distribution identity and existing App Store profiles
        env:
          DISTRIBUTION_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          HOST_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          SCREENSHARE_PROVISIONING_PROFILE: ${{ secrets.APPLE_SCREENSHARE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$DISTRIBUTION_CERTIFICATE"
          test -n "$HOST_PROVISIONING_PROFILE"
          test -n "$SCREENSHARE_PROVISIONING_PROFILE"
          KEYCHAIN="$RUNNER_TEMP/floe-release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          echo "$DISTRIBUTION_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "$HOST_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/Floe.mobileprovision"
          echo "$SCREENSHARE_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/FloeScreenShare.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -P "$DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Apple Distribution/{print $2; exit}')"
          test "${#SIGN_IDENTITY}" -eq 40
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          validate_profile() {
            PROFILE_PATH="$1"
            EXPECTED_APP_ID="$2"
            SOURCE_ENTITLEMENTS_PATH="$3"
            ENTITLEMENTS_PATH="$4"
            EXPECTED_HOMEKIT="${5:-false}"
            PROFILE_PLIST="$RUNNER_TEMP/$(basename "$PROFILE_PATH").plist"
            security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
            test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")" = "$EXPECTED_APP_ID"
            test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PROFILE_PLIST")" = false
            test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:beta-reports-active' "$PROFILE_PLIST")" = true
            test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups:0' "$PROFILE_PLIST")" = group.org.floeagent.ios
            if test "$EXPECTED_HOMEKIT" = true; then
              test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.homekit' "$PROFILE_PLIST")" = true
            fi
            # Sign with the app's declared capabilities, not the profile's raw
            # wildcard/development values. Xcode normally performs these exact
            # App Store substitutions while exporting an archive.
            cp "$SOURCE_ENTITLEMENTS_PATH" "$ENTITLEMENTS_PATH"
            /usr/libexec/PlistBuddy \
              -c "Add :application-identifier string $EXPECTED_APP_ID" \
              -c 'Add :com.apple.developer.team-identifier string QYL72C43K6' \
              -c 'Add :get-task-allow bool false' \
              -c 'Add :beta-reports-active bool true' \
              -c 'Add :keychain-access-groups array' \
              -c "Add :keychain-access-groups:0 string $EXPECTED_APP_ID" \
              "$ENTITLEMENTS_PATH"
            plutil -lint "$ENTITLEMENTS_PATH"
          }
          validate_profile \
            "$RUNNER_TEMP/Floe.mobileprovision" \
            QYL72C43K6.org.floeagent.ios \
            FloeApp/Entitlements/Floe.entitlements \
            "$RUNNER_TEMP/Floe.entitlements" \
            true
          /usr/libexec/PlistBuddy \
            -c 'Add :com.apple.developer.icloud-container-environment string Production' \
            -c 'Add :com.apple.developer.ubiquity-kvstore-identifier string QYL72C43K6.org.floeagent.ios' \
            "$RUNNER_TEMP/Floe.entitlements"
          validate_profile \
            "$RUNNER_TEMP/FloeScreenShare.mobileprovision" \
            QYL72C43K6.org.floeagent.ios.screenshare \
            FloeScreenShare/FloeScreenShare.entitlements \
            "$RUNNER_TEMP/FloeScreenShare.entitlements"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-container-environment' "$RUNNER_TEMP/Floe.entitlements")" = Production
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.ubiquity-kvstore-identifier' "$RUNNER_TEMP/Floe.entitlements")" = QYL72C43K6.org.floeagent.ios

      - name: Sign, verify, package, and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/TestFlightExport"
          APP_PATH="$(find "$RUNNER_TEMP/FloeSignedPayload/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          APPEX_PATH="$APP_PATH/PlugIns/Floe Screen Share.appex"
          test -d "$APPEX_PATH"

          cp "$RUNNER_TEMP/FloeScreenShare.mobileprovision" "$APPEX_PATH/embedded.mobileprovision"
          cp "$RUNNER_TEMP/Floe.mobileprovision" "$APP_PATH/embedded.mobileprovision"

          if test -d "$APP_PATH/Frameworks"; then
            find "$APP_PATH/Frameworks" -depth \( -name '*.framework' -o -name '*.dylib' \) -print0 \
              | while IFS= read -r -d '' CODE_PATH; do
                  codesign --force --sign "$SIGN_IDENTITY" --generate-entitlement-der "$CODE_PATH"
                done
          fi
          codesign --force --sign "$SIGN_IDENTITY" \
            --entitlements "$RUNNER_TEMP/FloeScreenShare.entitlements" \
            --generate-entitlement-der "$APPEX_PATH"
          codesign --force --sign "$SIGN_IDENTITY" \
            --entitlements "$RUNNER_TEMP/Floe.entitlements" \
            --generate-entitlement-der "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          mkdir -p "$RUNNER_TEMP/TestFlightPayload/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/TestFlightPayload/Payload/$(basename "$APP_PATH")"
          (
            cd "$RUNNER_TEMP/TestFlightPayload"
            ditto -c -k --sequesterRsrc --keepParent Payload "$RUNNER_TEMP/TestFlightExport/FloeAgent.ipa"
          )
          unzip -t "$RUNNER_TEMP/TestFlightExport/FloeAgent.ipa"
          xcrun altool --validate-app \
            --file "$RUNNER_TEMP/TestFlightExport/FloeAgent.ipa" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app \
            --file "$RUNNER_TEMP/TestFlightExport/FloeAgent.ipa" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            | tee "$RUNNER_TEMP/TestFlightExport/UPLOAD-RECEIPT.txt"
          {
            echo "tag=${{ needs.build-verify-release.outputs.tag }}"
            echo "version=${{ needs.build-verify-release.outputs.version }}"
            echo "build=${{ needs.build-verify-release.outputs.build }}"
            echo "commit=$GITHUB_SHA"
            echo "testflight_upload=accepted_by_transport"
          } > "$RUNNER_TEMP/TestFlightExport/TESTFLIGHT-SUMMARY.txt"

      - name: Upload TestFlight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testflight-${{ needs.build-verify-release.outputs.version }}-build${{ needs.build-verify-release.outputs.build }}
          path: ${{ runner.temp }}/TestFlightExport/
          if-no-files-found: error

  publish-release:
    name: Publish GitHub assets only after TestFlight succeeds
    if: github.event_name == 'push' || inputs.publish
    needs: [build-verify-release, testflight]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build-verify-release.outputs.tag }}
      VERSION: ${{ needs.build-verify-release.outputs.version }}
      BUILD: ${{ needs.build-verify-release.outputs.build }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: unsigned-ipa-${{ needs.build-verify-release.outputs.version }}-build${{ needs.build-verify-release.outputs.build }}
          path: release-assets
      - name: Publish the complete paired release
        run: |
          cat > release-notes.md <<EOF
          ## Floe Agent $VERSION (build $BUILD)

          This commit passed the shared Swift and simulator release gates, was uploaded to TestFlight, and produced the accompanying unsigned IPA.

          > [!WARNING]
          > The GitHub IPA is unsigned and cannot be installed directly. Inspect it, verify its SHA-256, then sign it with your own certificate. It is not the App Store package.

          The release includes an SPDX SBOM, third-party licenses, secret-scan reports, a test summary, and GitHub build provenance.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md --draft=false --prerelease
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag --prerelease \
              --title "Floe Agent $VERSION (build $BUILD)" \
              --notes-file release-notes.md
          fi
