name: WASI Capability Hub
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Sign official WASI packages and commit the catalog (no app release)
        type: boolean
        default: false
      prepare:
        description: Sign the catalog and bundle as a CI artifact at this immutable source SHA (no commit)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Xcode 27
        run: |
          for app in /Applications/Xcode_27.0.app /Applications/Xcode_27_beta_6.app; do
            if [ -x "$app/Contents/Developer/usr/bin/xcodebuild" ] && DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version | head -1 | grep -q '^Xcode 27'; then
              echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo '::error::Xcode 27 is unavailable on this runner'
          exit 1
      - run: python3 -m venv /tmp/capability-signing
      - run: /tmp/capability-signing/bin/pip install cryptography==46.0.3
      - name: Verify the fixed manifest, pinned Lua artifact and signing contract
        run: /tmp/capability-signing/bin/python -m unittest discover -s capability-hub -p 'test_*.py'
      - name: Assemble and test-sign the packages with a temporary key
        run: /tmp/capability-signing/bin/python capability-hub/build.py --test-key --output /tmp/capability-test
  prepare:
    needs: verify
    if: inputs.prepare && !inputs.publish
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Xcode 27
        run: |
          for app in /Applications/Xcode_27.0.app /Applications/Xcode_27_beta_6.app; do
            if [ -x "$app/Contents/Developer/usr/bin/xcodebuild" ] && DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version | head -1 | grep -q '^Xcode 27'; then
              echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo '::error::Xcode 27 is unavailable on this runner'
          exit 1
      - run: python3 -m venv /tmp/capability-signing
      - run: /tmp/capability-signing/bin/pip install cryptography==46.0.3
      - name: Sign the catalog and app bundle at the immutable source SHA
        env:
          FLOE_SKILL_HUB_SIGNING_KEY: ${{ secrets.FLOE_SKILL_HUB_SIGNING_KEY }}
          FLOE_CAPABILITY_REVISION: ${{ github.sha }}
        run: /tmp/capability-signing/bin/python capability-hub/build.py
      - name: Verify the signed catalog against the fixed manifest
        run: /tmp/capability-signing/bin/python capability-hub/build.py --check
      - name: Upload the verified catalog, bundle and immutable packages
        uses: actions/upload-artifact@v4
        with:
          name: floe-wasi-capability-bundle-${{ github.sha }}
          path: |
            capability-hub/catalog.json
            capability-hub/catalog.sig
            capability-hub/packages
            FloeAgent/FloeApp/Resources/Capabilities
            skill-hub/public-key.json
          if-no-files-found: error
          retention-days: 90
  publish:
    needs: verify
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Select installed Xcode 27
        run: |
          for app in /Applications/Xcode_27.0.app /Applications/Xcode_27_beta_6.app; do
            if [ -x "$app/Contents/Developer/usr/bin/xcodebuild" ] && DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version | head -1 | grep -q '^Xcode 27'; then
              echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo '::error::Xcode 27 is unavailable on this runner'
          exit 1
      - run: python3 -m venv /tmp/capability-signing
      - run: /tmp/capability-signing/bin/pip install cryptography==46.0.3
      - name: Commit immutable WASI artifact
        run: |
          /tmp/capability-signing/bin/python capability-hub/build.py --test-key --output /tmp/capability-artifacts
          mkdir -p capability-hub/packages
          cp -R /tmp/capability-artifacts/packages/. capability-hub/packages/
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add capability-hub/packages
          if ! git diff --cached --quiet; then
            git commit -m "Stage immutable WASI command artifact"
            git push origin HEAD:main
          fi
          echo "FLOE_CAPABILITY_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Sign official catalog
        env:
          FLOE_SKILL_HUB_SIGNING_KEY: ${{ secrets.FLOE_SKILL_HUB_SIGNING_KEY }}
        run: /tmp/capability-signing/bin/python capability-hub/build.py
      - name: Verify the signed catalog against the fixed manifest
        run: /tmp/capability-signing/bin/python capability-hub/build.py --check
      - name: Commit immutable packages and app catalog
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add capability-hub/packages capability-hub/catalog.json capability-hub/catalog.sig FloeAgent/FloeApp/Resources/Capabilities
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish signed WASI capability catalog"
          git push origin HEAD:main
