name: Upload retained accepted-SDK build
on:
  workflow_call:
    inputs:
      source_run:
        required: true
        type: string
      tag:
        required: true
        type: string
      component_recovery_report:
        description: Same-run proof artifact from the strict component-only recovery controller
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: floe-retained-upload-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      REQUIRED_XCODE_VERSION: Xcode 26.6
      REQUIRED_XCODE_BUILD: 17F113
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run }}
      RELEASE_TAG: ${{ inputs.tag }}
    defaults:
      run:
        working-directory: FloeAgent
    steps:
      - name: Check out the immutable app source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - name: Verify source and accepted upload toolchain
        id: source
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[1-9][0-9]*$ ]]
          scripts/release_preflight.sh "$RELEASE_TAG"
          XCODE_VERSION="$(xcodebuild -version)"
          printf '%s\n' "$XCODE_VERSION" | grep -F "$REQUIRED_XCODE_VERSION"
          printf '%s\n' "$XCODE_VERSION" | grep -F "Build version $REQUIRED_XCODE_BUILD"
      - name: Read same-run component recovery proof when supplied
        if: inputs.component_recovery_report != ''
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.component_recovery_report }}
          path: ${{ runner.temp }}/ComponentRecoveryProof
      - name: Wait for the existing device artifact without rebuilding
        env:
          APP_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          EXPECTED_ARTIFACT: accepted-sdk-input-${{ steps.source.outputs.version }}-build${{ steps.source.outputs.build }}
          COMPONENT_RECOVERY_REPORT: ${{ inputs.component_recovery_report }}
        run: |
          set -euo pipefail
          for attempt in {1..50}; do
            printf 'Artifact check %s/50\n' "$attempt"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/reuse-run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > "$RUNNER_TEMP/reuse-jobs.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100" > "$RUNNER_TEMP/reuse-artifacts.json"
            state="$(python3 - <<'CHECK'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          run=json.loads((root/'reuse-run.json').read_text())
          jobs=json.loads((root/'reuse-jobs.json').read_text())['jobs']
          artifacts=json.loads((root/'reuse-artifacts.json').read_text())['artifacts']
          assert run['head_sha']==os.environ['APP_SOURCE_SHA'], 'Source SHA mismatch'
          assert run['head_repository']['full_name']==os.environ['GITHUB_REPOSITORY'], 'Foreign source repository'
          assert run['event']=='push' and run['head_branch']==os.environ['RELEASE_TAG'], 'Expected immutable tag push'
          assert run['path']=='.github/workflows/release-unsigned-ipa.yml', 'Unexpected source workflow'
          matches=[j for j in jobs if j['name']=='Qualify and build the accepted SDK in parallel']
          assert len(matches)==1, 'Missing or ambiguous accepted-SDK job'
          job=matches[0]
          if job['status']=='completed':
              assert job['conclusion']=='success', 'Accepted SDK job did not pass'
              assets=[a for a in artifacts if a['name']==os.environ['EXPECTED_ARTIFACT'] and not a['expired']]
              assert len(assets)==1, 'Missing or ambiguous retained artifact'
              report={'sourceRun':run['id'],'sourceCommit':run['head_sha'],'sourceTag':os.environ['RELEASE_TAG'],'acceptedSDKJob':job['id'],'artifactId':assets[0]['id'],'artifactDigest':assets[0].get('digest')}
              if os.environ.get('COMPONENT_RECOVERY_REPORT'):
                  assert os.environ['COMPONENT_RECOVERY_REPORT']=='component-recovery-proof', 'Unexpected qualification proof'
                  proof=json.loads((root/'ComponentRecoveryProof'/'qualification.json').read_text())
                  assert proof['qualificationMode']=='all_gates_with_test_only_component_repair', 'Unexpected qualification mode'
                  assert (proof['sourceRun'],proof['sourceCommit'],proof['sourceTag'])==(run['id'],run['head_sha'],os.environ['RELEASE_TAG']), 'Qualification proof source mismatch'
                  for expected_name in ('build-verify-release','Qualify and build the accepted SDK in parallel'):
                      passed=[j for j in jobs if j['name']==expected_name and j['status']=='completed' and j['conclusion']=='success']
                      assert len(passed)==1 and passed[0]['id'] in proof['sdkJobIDs'], 'Missing original SDK qualification'
                  report['qualification']=proof
                  report['policy']=proof['policy']
              else:
                  report['policy']='User requested expedited TestFlight without waiting for SDK 27. Accepted-SDK artifact is reused; no rebuilding.'
              (root/'REUSE-PROVENANCE.json').write_text(json.dumps(report,indent=2)+'\n')
              print('ready')
          else:
              print('waiting')
          CHECK
          )"
            if [[ "$state" == ready ]]; then exit 0; fi
            sleep 20
          done
          echo 'Timed out waiting for the existing device artifact; no signing attempted.' >&2
          exit 1
      - name: Download the original accepted-SDK input
        uses: actions/download-artifact@v5
        with:
          name: accepted-sdk-input-${{ steps.source.outputs.version }}-build${{ steps.source.outputs.build }}
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/AcceptedInput
      - name: Restore and check the exact retained application
        env:
          APP_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          APP_VERSION: ${{ steps.source.outputs.version }}
          APP_BUILD: ${{ steps.source.outputs.build }}
        run: |
          set -euo pipefail
          unzip -q "$RUNNER_TEMP/AcceptedInput/accepted-sdk-input.zip" -d "$RUNNER_TEMP/AcceptedInput"
          input="$RUNNER_TEMP/AcceptedInput/AcceptedDistributionInput"
          test "$(cat "$input/SOURCE-SHA.txt")" = "$APP_SOURCE_SHA"
          ditto "$input/FloeSignedPayload" "$RUNNER_TEMP/FloeSignedPayload"
          ditto "$input/FloeStable-AppRegressionTests.xcresult" "$RUNNER_TEMP/FloeStable-AppRegressionTests.xcresult"
          cp "$input/FloeStable-AppRegressionTests-SUMMARY.txt" "$RUNNER_TEMP/"
          cp "$input/bundle-normalization.json" "$RUNNER_TEMP/"
          APP_PATH="$(find "$RUNNER_TEMP/FloeSignedPayload/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = org.floeagent.ios
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "$APP_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "$APP_BUILD"
          python3 scripts/verify_app_regression_xcresult.py --result-bundle "$RUNNER_TEMP/FloeStable-AppRegressionTests.xcresult"
      - name: Install App Store Connect API key
        env:
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          test -n "$ASC_API_PRIVATE_KEY_BASE64"
          test -n "$ASC_KEY_ID"
          echo "$ASC_API_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Install distribution identity and existing App Store profiles
        env:
          DISTRIBUTION_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          HOST_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          SCREENSHARE_PROVISIONING_PROFILE: ${{ secrets.APPLE_SCREENSHARE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$DISTRIBUTION_CERTIFICATE"
          test -n "$HOST_PROVISIONING_PROFILE"
          test -n "$SCREENSHARE_PROVISIONING_PROFILE"
          KEYCHAIN="$RUNNER_TEMP/floe-release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          echo "$DISTRIBUTION_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "$HOST_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/Floe.mobileprovision"
          echo "$SCREENSHARE_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/FloeScreenShare.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -P "$DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Apple Distribution/{print $2; exit}')"
          test "${#SIGN_IDENTITY}" -eq 40
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          validate_profile() {
            PROFILE_PATH="$1"
            EXPECTED_APP_ID="$2"
            SOURCE_ENTITLEMENTS_PATH="$3"
            ENTITLEMENTS_PATH="$4"
            EXPECTED_HOMEKIT="${5:-false}"
            PROFILE_PLIST="$RUNNER_TEMP/$(basename "$PROFILE_PATH").plist"
            security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
            test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")" = "$EXPECTED_APP_ID"
            test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PROFILE_PLIST")" = false
            test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:beta-reports-active' "$PROFILE_PLIST")" = true
            test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups:0' "$PROFILE_PLIST")" = group.org.floeagent.ios
            if test "$EXPECTED_HOMEKIT" = true; then
              test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.homekit' "$PROFILE_PLIST")" = true
            fi
            # Sign with the app's declared capabilities, not the profile's raw
            # wildcard/development values. Xcode normally performs these exact
            # App Store substitutions while exporting an archive.
            cp "$SOURCE_ENTITLEMENTS_PATH" "$ENTITLEMENTS_PATH"
            /usr/libexec/PlistBuddy \
              -c "Add :application-identifier string $EXPECTED_APP_ID" \
              -c 'Add :com.apple.developer.team-identifier string QYL72C43K6' \
              -c 'Add :get-task-allow bool false' \
              -c 'Add :beta-reports-active bool true' \
              -c 'Add :keychain-access-groups array' \
              -c "Add :keychain-access-groups:0 string $EXPECTED_APP_ID" \
              "$ENTITLEMENTS_PATH"
            plutil -lint "$ENTITLEMENTS_PATH"
          }
          validate_profile \
            "$RUNNER_TEMP/Floe.mobileprovision" \
            QYL72C43K6.org.floeagent.ios \
            FloeApp/Entitlements/Floe.entitlements \
            "$RUNNER_TEMP/Floe.entitlements" \
            true
          /usr/libexec/PlistBuddy \
            -c 'Add :com.apple.developer.icloud-container-environment string Production' \
            -c 'Add :com.apple.developer.ubiquity-kvstore-identifier string QYL72C43K6.org.floeagent.ios' \
            "$RUNNER_TEMP/Floe.entitlements"
          validate_profile \
            "$RUNNER_TEMP/FloeScreenShare.mobileprovision" \
            QYL72C43K6.org.floeagent.ios.screenshare \
            FloeScreenShare/FloeScreenShare.entitlements \
            "$RUNNER_TEMP/FloeScreenShare.entitlements"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-container-environment' "$RUNNER_TEMP/Floe.entitlements")" = Production
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.ubiquity-kvstore-identifier' "$RUNNER_TEMP/Floe.entitlements")" = QYL72C43K6.org.floeagent.ios

      - name: Sign, verify, package, and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/TestFlightExport"
          cp "$RUNNER_TEMP/REUSE-PROVENANCE.json" "$RUNNER_TEMP/TestFlightExport/"
          cp "$RUNNER_TEMP/bundle-normalization.json" "$RUNNER_TEMP/TestFlightExport/"
          cp "$RUNNER_TEMP/FloeStable-AppRegressionTests-SUMMARY.txt" \
            "$RUNNER_TEMP/TestFlightExport/"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/FloeStable-AppRegressionTests.xcresult" \
            "$RUNNER_TEMP/TestFlightExport/FloeStable-AppRegressionTests.xcresult.zip"
          unzip -t "$RUNNER_TEMP/TestFlightExport/FloeStable-AppRegressionTests.xcresult.zip"
          APP_PATH="$(find "$RUNNER_TEMP/FloeSignedPayload/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          APPEX_PATH="$APP_PATH/PlugIns/Floe Screen Share.appex"
          test -d "$APPEX_PATH"

          cp "$RUNNER_TEMP/FloeScreenShare.mobileprovision" "$APPEX_PATH/embedded.mobileprovision"
          cp "$RUNNER_TEMP/Floe.mobileprovision" "$APP_PATH/embedded.mobileprovision"

          if test -d "$APP_PATH/Frameworks"; then
            find "$APP_PATH/Frameworks" -depth \( -name '*.framework' -o -name '*.dylib' \) -print0 \
              | while IFS= read -r -d '' CODE_PATH; do
                  codesign --force --sign "$SIGN_IDENTITY" --generate-entitlement-der "$CODE_PATH"
                done
          fi
          codesign --force --sign "$SIGN_IDENTITY" \
            --entitlements "$RUNNER_TEMP/FloeScreenShare.entitlements" \
            --generate-entitlement-der "$APPEX_PATH"
          codesign --force --sign "$SIGN_IDENTITY" \
            --entitlements "$RUNNER_TEMP/Floe.entitlements" \
            --generate-entitlement-der "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          mkdir -p "$RUNNER_TEMP/TestFlightPayload/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/TestFlightPayload/Payload/$(basename "$APP_PATH")"
          (
            cd "$RUNNER_TEMP/TestFlightPayload"
            ditto -c -k --sequesterRsrc --keepParent Payload "$RUNNER_TEMP/TestFlightExport/FloeAgent.ipa"
          )
          unzip -t "$RUNNER_TEMP/TestFlightExport/FloeAgent.ipa"
          xcrun altool --validate-app \
            --file "$RUNNER_TEMP/TestFlightExport/FloeAgent.ipa" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app \
            --file "$RUNNER_TEMP/TestFlightExport/FloeAgent.ipa" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            | tee "$RUNNER_TEMP/TestFlightExport/UPLOAD-RECEIPT.txt"
          {
            echo "tag=${{ steps.source.outputs.tag }}"
            echo "version=${{ steps.source.outputs.version }}"
            echo "build=${{ steps.source.outputs.build }}"
            echo "commit=${{ steps.source.outputs.source_sha }}"
            echo "accepted_sdk_toolchain=$REQUIRED_XCODE_VERSION ($REQUIRED_XCODE_BUILD)"
            echo "qualification_policy=user_requested_expedited_upload_without_SDK27_gate"
            echo "testflight_upload=accepted_by_transport"
            echo "apple_processing_state=not_verified"
            echo "floe_qa_visibility=not_verified"
          } > "$RUNNER_TEMP/TestFlightExport/TESTFLIGHT-SUMMARY.txt"

      - name: Upload TestFlight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testflight-${{ steps.source.outputs.version }}-build${{ steps.source.outputs.build }}
          path: ${{ runner.temp }}/TestFlightExport/
          if-no-files-found: error

      - name: Upload accepted-SDK focused-test evidence for the GitHub release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accepted-sdk-app-regression-${{ steps.source.outputs.version }}-build${{ steps.source.outputs.build }}
          path: |
            ${{ runner.temp }}/TestFlightExport/FloeStable-AppRegressionTests-SUMMARY.txt
            ${{ runner.temp }}/TestFlightExport/FloeStable-AppRegressionTests.xcresult.zip
          if-no-files-found: error
