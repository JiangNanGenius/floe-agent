name: Qualify Notes on iPad and iPhone
on:
  workflow_dispatch:
    inputs:
      sdk:
        description: 'Toolchain line to qualify: development (Xcode 27 beta), compatibility (Xcode 26), or both.'
        type: choice
        options:
          - both
          - development
          - compatibility
        default: both
  workflow_call:
    inputs:
      sdk:
        description: 'Toolchain line to qualify: development (Xcode 27 beta), compatibility (Xcode 26), or both. An unsupported value runs both jobs instead of silently skipping every leg.'
        required: false
        type: string
        default: both
      source_ref:
        description: 'Optional immutable 40-hex commit SHA to check out. Empty uses github.ref. A reusable caller must pass the exact source it already froze.'
        required: false
        type: string
  push:
    branches: ['codex/floe-1-7-integration-20260912']
    paths: ['.github/workflows/notes-native-qualification.yml', 'FloeAgent/Qualification/NativeNotes/**']
permissions:
  contents: read
concurrency:
  group: notes-native-${{ github.ref }}
  cancel-in-progress: false
# These are automated simulator/component-host regressions and Quick Look
# generator captures. They are not human UI acceptance, not full-App build
# evidence and not a physical-device qualification.
# Keep xcresult, console logs and explicit image attachments. Skip optional
# verbose sysdiagnose collection, which timed out for 600s after tests in
# run 35180990348; this does not skip assertions or change test timeouts.
#
# The same file is a reusable workflow for the release controller, which calls
# it with sdk=development and the immutable commit prepare-release froze. A
# called workflow inherits the caller's `github` context, so `event_name` is the
# caller's event and cannot be used to distinguish a call from a dispatch; job
# selection below reads only the declared `sdk` input.
jobs:
  development:
    # Push has no `inputs` context (`''`) and keeps covering both toolchains. A
    # dispatch or reusable call defaults to `both`; `development` starts exactly
    # this job. An unsupported value starts both jobs rather than skipping every
    # leg, so the component gate can never pass by doing nothing.
    if: ${{ inputs.sdk != 'compatibility' }}
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      # A pinned reusable call must resolve to exactly the frozen SHA; a branch,
      # tag or malformed value fails this job before any qualification runs.
      - name: Require the checked-out commit to be the caller-frozen SHA
        if: ${{ inputs.source_ref != '' }}
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          case "$SOURCE_REF" in
            *[!0-9a-f]*|'') echo "::error::source_ref must be a full 40-character lowercase commit SHA" >&2; exit 1 ;;
          esac
          if [ "${#SOURCE_REF}" -ne 40 ]; then
            echo "::error::source_ref must be a full 40-character lowercase commit SHA" >&2
            exit 1
          fi
          checked="$(git rev-parse HEAD)"
          if [ "$checked" != "$SOURCE_REF" ]; then
            echo "::error::checked-out commit $checked does not match caller-frozen source_ref $SOURCE_REF" >&2
            exit 1
          fi
          echo "source_ref=$SOURCE_REF verified at checkout"
      - name: Select the development Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/notes-cloud-gates"
          mkdir -p "$evidence_dir"
          evidence="$evidence_dir/toolchain-development.txt"
          : > "$evidence"
          expected_major=27
          selected=""
          for app in /Applications/Xcode_27.0.app /Applications/Xcode_27_beta_6.app; do
            if [ ! -d "$app/Contents/Developer" ]; then
              printf 'candidate=%s present=no\n' "$app" | tee -a "$evidence"
              continue
            fi
            version_output="$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version 2>/dev/null || true)"
            version_line="$(printf '%s\n' "$version_output" | sed -n '1p')"
            build_line="$(printf '%s\n' "$version_output" | sed -n '2p')"
            major="$(printf '%s' "$version_line" | sed -n 's/^Xcode \([0-9][0-9]*\).*/\1/p')"
            printf 'candidate=%s present=yes version="%s" build="%s" major=%s\n' \
              "$app" "$version_line" "$build_line" "$major" | tee -a "$evidence"
            if [ -z "$selected" ] && [ "$major" = "$expected_major" ]; then
              selected="$app"
            fi
          done
          if [ -z "$selected" ]; then
            printf '::error::No Xcode %s toolchain found among /Applications/Xcode_27.0.app and /Applications/Xcode_27_beta_6.app\n' "$expected_major" | tee -a "$evidence"
            exit 1
          fi
          printf 'selected=%s\n' "$selected" | tee -a "$evidence"
          echo "DEVELOPER_DIR=$selected/Contents/Developer" >> "$GITHUB_ENV"
          {
            echo "### Notes qualification toolchain (development)"
            echo '```'
            cat "$evidence"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check native Notes bridge contracts
        run: node --test FloeAgent/scripts/tests/notes_bridge.test.cjs
      - name: Generate native component project
        run: |
          brew install xcodegen
          xcodegen generate --spec FloeAgent/Qualification/NativeNotes/project.yml
      - name: Test iPad first, then iPhone
        shell: bash
        run: |
          set -o pipefail
          evidence_dir="$RUNNER_TEMP/notes-cloud-gates"
          mkdir -p "$evidence_dir"
          xcodebuild -version | tee "$evidence_dir/xcodebuild-version-development.txt"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" | tee -a "$evidence_dir/xcodebuild-version-development.txt"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/notes-devices.json"
          # Both device families are attempted even when the first family
          # fails; the first failure is preserved and becomes the step status
          # after the loop. `bash -e -o pipefail` stays in force: each
          # pipeline whose failure must not abort the step is captured in its
          # own `||` guard instead of a global `set +e`, and no leg is retried.
          first_failure=0
          for family in iPad iPhone; do
            result=0
            destination=""
            # A missing simulator fails this family explicitly instead of
            # aborting the loop before the other family is attempted.
            if destination=$(python3 - "$family" "$RUNNER_TEMP/notes-devices.json" <<'PY'
          import json, sys
          values = json.load(open(sys.argv[2]))['devices']
          candidates = [d for group in values.values() for d in group if d['name'].startswith(sys.argv[1])]
          preferred = sorted(candidates, key=lambda d: ('Air 13' not in d['name'], 'Pro' not in d['name'], d['name']))
          if not preferred: raise SystemExit('No simulator for ' + sys.argv[1])
          print(preferred[0]['udid'])
          PY
            ); then
              :
            else
              result=$?
              printf '::error::No %s simulator destination resolved (exit %s); the %s leg fails and the other family still runs.\n' "$family" "$result" "$family"
            fi
            if [ "$result" -eq 0 ]; then
              xcodebuild -project FloeAgent/Qualification/NativeNotes/FloeNotesNativeQualification.xcodeproj \
                -scheme FloeNotesNativeQualification -destination "platform=iOS Simulator,id=$destination" \
                -derivedDataPath "$RUNNER_TEMP/notes-build" -parallel-testing-enabled NO \
                -test-timeouts-enabled YES -default-test-execution-time-allowance 90 -maximum-test-execution-time-allowance 180 \
                -collect-test-diagnostics never \
                -skip-testing:NativeNotesTests/NotesOfficeThumbnailDiagnosticsTests \
                -resultBundlePath "notes-$family.xcresult" CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "notes-$family.log" || result=$?
            fi
            if [ "$result" -ne 0 ]; then
              printf '::error::%s leg failed with exit %s; its result bundle/log are preserved and the other device family still runs.\n' "$family" "$result"
              if [ "$first_failure" -eq 0 ]; then first_failure=$result; fi
            fi
          done
          if [ "$first_failure" -ne 0 ]; then
            printf '::error::Notes native qualification failed; first device-family failure exit %s.\n' "$first_failure"
            exit "$first_failure"
          fi
      - name: Run strict Quick Look diagnostics (diagnostic, non-gating)
        # The functional step above excludes NotesOfficeThumbnailDiagnosticsTests;
        # this step runs that strict Quick Look-only class on both device families
        # and records its own xcresult, log and original exit code. Only a
        # *fully executed* strict-content assertion failure is non-gating:
        # FloeAgent/scripts/verify_quicklook_diagnostics.py reads the real
        # xcresult summary/tests structures and requires exactly the 7 known
        # diagnostic methods, no skips, no runtime warning/crash state and only
        # fixed-marker Quick Look content/timeout/icon failures. A selector that
        # matched nothing, a missing result bundle, a throw, a wrong document,
        # a host crash or any incomplete run is a coverage failure and fails
        # this step instead of being masked as a non-gating diagnostic. No
        # `continue-on-error` is used anywhere; functional failures still fail
        # the job at the step above. The step runs even after a functional
        # failure (`if: always()`) so the diagnostic signal is kept.
        if: always()
        shell: bash
        run: |
          set -o pipefail
          evidence_dir="$RUNNER_TEMP/notes-cloud-gates"
          mkdir -p "$evidence_dir"
          incomplete=0
          # Reuse the functional step's device list; regenerate it only when the
          # functional step never reached that line, so diagnostics stay
          # independent of the functional step's status.
          if [ ! -f "$RUNNER_TEMP/notes-devices.json" ]; then
            xcrun simctl list devices available -j > "$RUNNER_TEMP/notes-devices.json"
          fi
          for family in iPad iPhone; do
            result=0
            destination=""
            if destination=$(python3 - "$family" "$RUNNER_TEMP/notes-devices.json" <<'PY'
          import json, sys
          values = json.load(open(sys.argv[2]))['devices']
          candidates = [d for group in values.values() for d in group if d['name'].startswith(sys.argv[1])]
          preferred = sorted(candidates, key=lambda d: ('Air 13' not in d['name'], 'Pro' not in d['name'], d['name']))
          if not preferred: raise SystemExit('No simulator for ' + sys.argv[1])
          print(preferred[0]['udid'])
          PY
            ); then
              :
            else
              result=$?
              printf '::warning::no %s simulator destination (exit %s); strict Quick Look diagnostics will fail coverage for this family.\n' "$family" "$result"
            fi
            if [ "$result" -eq 0 ]; then
              xcodebuild -project FloeAgent/Qualification/NativeNotes/FloeNotesNativeQualification.xcodeproj \
                -scheme FloeNotesNativeQualification -destination "platform=iOS Simulator,id=$destination" \
                -derivedDataPath "$RUNNER_TEMP/notes-build" -parallel-testing-enabled NO \
                -test-timeouts-enabled YES -default-test-execution-time-allowance 90 -maximum-test-execution-time-allowance 180 \
                -collect-test-diagnostics never \
                -only-testing:NativeNotesTests/NotesOfficeThumbnailDiagnosticsTests \
                -resultBundlePath "notes-diagnostic-$family.xcresult" CODE_SIGNING_ALLOWED=NO test-without-building 2>&1 | tee "notes-diagnostic-$family.log" || result=$?
            fi
            # Classification guard: the independent stdlib helper reads the real
            # xcresult summary/tests structures (never the log text) and only
            # accepts a non-gating diagnostic when all 7 known methods executed,
            # nothing was skipped, no runtime warning/crash state exists and
            # every structured failure is one of the fixed Quick Look
            # content/timeout/icon assertion markers. A missing bundle, 0/partial
            # cases, a throw, a wrong document or an unmarked assertion fail
            # closed and set `incomplete`. The raw log, status and original
            # failure text stay in the uploaded evidence.
            classification=$(python3 "$GITHUB_WORKSPACE/FloeAgent/scripts/verify_quicklook_diagnostics.py" \
              --result-bundle "notes-diagnostic-$family.xcresult" \
              --log "notes-diagnostic-$family.log" \
              --family "$family" \
              --original-exit "$result" \
              --status-output "$evidence_dir/notes-diagnostic-$family.status" \
              --failures-output "$evidence_dir/notes-diagnostic-$family.status.failures.txt" \
              ) || classification="NOT_EXECUTED"
            case "$classification" in
              PASS)
                printf 'diagnostic non-gating %s strict Quick Look diagnostics passed (7/7 executed).\n' "$family"
                ;;
              ASSERTION_FAILURE)
                printf '::warning::diagnostic non-gating %s strict Quick Look content assertion failed after a complete 7/7 run (original exit %s); recorded, not gating.\n' "$family" "$result"
                ;;
              *)
                printf '::error::strict Quick Look diagnostics did not fully execute for %s (classification=%s, original exit %s); this is a coverage failure, not a content assertion failure.\n' "$family" "$classification" "$result"
                incomplete=1
                ;;
            esac
          done
          exit "$incomplete"
      - name: Preserve results, logs and toolchain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-native-development-${{ inputs.source_ref || github.sha }}
          path: |
            notes-*.xcresult
            notes-*.log
            ${{ runner.temp }}/notes-devices.json
            ${{ runner.temp }}/notes-cloud-gates/
          if-no-files-found: warn
  compatibility:
    # Mirror of the development guard: push (''), dispatch/call `both` and
    # `compatibility` keep this job, `development` alone must skip it.
    if: ${{ inputs.sdk != 'development' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
