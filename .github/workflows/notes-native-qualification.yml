            printf 'candidate=%s present=yes version="%s" build="%s" major=%s\n' \
              "$app" "$version_line" "$build_line" "$major" | tee -a "$evidence"
            if [ -z "$selected" ] && [ "$major" = "$expected_major" ]; then
              selected="$app"
            fi
          done
          if [ -z "$selected" ]; then
