name: Xcode Cloud Control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect Xcode Cloud or start an explicitly selected workflow
        required: true
        default: discover
        type: choice
        options:
          - discover
          - monitor
          - inspect-issues
          - verify-testflight
          - prepare-testflight
          - crash-feedback
          - start
          - enable-tag-and-start
          - update-and-start
          - bridge-cert-probe
          - bridge-cert-fetch
          - bridge-notarize-app
          - bridge-notarize-dmg
          - bridge-notary-resume
          - bridge-notary-status
      workflow_id:
        description: ciWorkflows ID required for start
        required: false
        type: string
      git_reference_id:
        description: scmGitReferences ID required for start
        required: false
        type: string
      xcode_version_id:
        description: ciXcodeVersions ID required for update-and-start
        required: false
        type: string
      macos_version_id:
        description: ciMacOsVersions ID required for update-and-start
        required: false
        type: string
      build_run_id:
        description: ciBuildRuns ID required for monitor
        required: false
        type: string
      build_id:
        description: App Store Connect builds ID required for verify-testflight
        required: false
        type: string
      release_tag:
        description: Release tag to discover; omitted uses the version in FloeAgent/project.yml
        required: false
        type: string
      release_build:
        description: Build number to discover; omitted uses CURRENT_PROJECT_VERSION in FloeAgent/project.yml
        required: false
        default: ''
        type: string
      bridge_confirm:
        description: "Exact confirmation: notarize-source-bound-bridge; empty for read-only bridge operations"
        required: false
        default: ''
        type: string
      bridge_source_sha:
        description: "40-hex source commit bound into the signed bridge (notarize only)"
        required: false
        default: ''
        type: string
      bridge_release_tag:
        description: "Draft release tag bridge-notary-<source_sha> containing the signed artifact (notarize only)"
        required: false
        default: ''
        type: string
      bridge_artifact_name:
        description: "Exact Floe-Bridge*.zip or Floe-Bridge*.dmg asset name in that draft release (notarize only)"
        required: false
        default: ''
        type: string
      bridge_artifact_sha256:
        description: "Expected SHA-256 of the signed artifact (notarize only)"
        required: false
        default: ''
        type: string
      bridge_team_id:
        description: "Apple Team ID expected in the Developer ID signature (notarize only)"
        required: false
        default: ''
        type: string
      bridge_submission_id:
        description: "Existing notary submission UUID (bridge-notary-status or bridge-notary-resume)"
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  xcode-cloud:
    if: ${{ !startsWith(inputs.operation, 'bridge-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out control scripts
        uses: actions/checkout@v5

      - name: Install App Store Connect API key
        env:
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$ASC_API_PRIVATE_KEY_BASE64"
          test -n "$ASC_KEY_ID"
          echo "$ASC_API_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"

      - name: Generate short-lived API token
        id: auth
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
        run: |
          set -euo pipefail
          TOKEN="$(python3 FloeAgent/scripts/generate_asc_jwt.py)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Discover Xcode Cloud products, workflows, and release tag
        if: inputs.operation == 'discover'
        env:
          ASC_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          RELEASE_BUILD_INPUT: ${{ inputs.release_build }}
        run: |
          set -euo pipefail
          RELEASE_TAG="$RELEASE_TAG_INPUT"
          if test -z "$RELEASE_TAG"; then
            version="$(sed -n 's/^[[:space:]]*MARKETING_VERSION: *"\([^"]*\)".*/\1/p' FloeAgent/project.yml | head -n 1)"
            test -n "$version"
            RELEASE_TAG="v$version"
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9._-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 2
          fi
          if [[ -n "$RELEASE_BUILD_INPUT" && ! "$RELEASE_BUILD_INPUT" =~ ^[0-9]+$ ]]; then
            echo "Invalid release build: expected digits only" >&2
            exit 2
          fi
          echo "release-tag=$RELEASE_TAG"
          api_get() {
            local path="$1"
            shift
            curl --fail-with-body --silent --show-error --get \
              -H "Authorization: Bearer $ASC_TOKEN" \
              -H "Accept: application/json" \
              "https://api.appstoreconnect.apple.com$path" "$@"
          }

          api_get /v1/ciProducts \
            --data-urlencode 'limit=200' \
            --data-urlencode 'fields[ciProducts]=name,productType,bundleId,workflows,primaryRepositories' \
            --data-urlencode 'include=bundleId' > "$RUNNER_TEMP/products.json"

          product_count="$(jq '.data | length' "$RUNNER_TEMP/products.json")"
          echo "Xcode Cloud products: $product_count"
          jq -r '.data[] | "product id=\(.id) name=\(.attributes.name) type=\(.attributes.productType)"' \
            "$RUNNER_TEMP/products.json"
          jq -r '.included[]? | select(.type == "bundleIds") | "bundle id=\(.id) identifier=\(.attributes.identifier)"' \
            "$RUNNER_TEMP/products.json"

          api_get /v1/ciXcodeVersions \
            --data-urlencode 'limit=200' \
            --data-urlencode 'limit[macOsVersions]=50' \
            --data-urlencode 'fields[ciXcodeVersions]=version,name,macOsVersions' \
            --data-urlencode 'fields[ciMacOsVersions]=version,name' \
            --data-urlencode 'include=macOsVersions' > "$RUNNER_TEMP/xcode-versions.json"
          jq -r '.data[] | select((.attributes.name // "") | test("Xcode 27|Latest Beta"; "i")) | "available-xcode id=\(.id) version=\(.attributes.version) name=\(.attributes.name) macos_ids=\([.relationships.macOsVersions.data[]?.id] | join(","))"' \
            "$RUNNER_TEMP/xcode-versions.json"
          jq -r '.included[]? | select(.type == "ciMacOsVersions") | "available-macos id=\(.id) version=\(.attributes.version) name=\(.attributes.name)"' \
            "$RUNNER_TEMP/xcode-versions.json" | sort -u

          while IFS= read -r product_id; do
            api_get "/v1/ciProducts/$product_id/workflows" \
              --data-urlencode 'limit=200' \
              --data-urlencode 'fields[ciWorkflows]=name,description,isEnabled,isLockedForEditing,lastModifiedDate,xcodeVersion,macOsVersion,repository,manualTagStartCondition,actions' \
              --data-urlencode 'fields[ciXcodeVersions]=version,name' \
              --data-urlencode 'fields[ciMacOsVersions]=version,name' \
              --data-urlencode 'fields[scmRepositories]=ownerName,repositoryName,lastAccessedDate' \
              --data-urlencode 'include=xcodeVersion,macOsVersion,repository' \
              > "$RUNNER_TEMP/workflows-$product_id.json"
            jq -r '.data[] | "workflow id=\(.id) name=\(.attributes.name) enabled=\(.attributes.isEnabled) locked=\(.attributes.isLockedForEditing) manual_tag=\(.attributes.manualTagStartCondition != null) xcode_id=\(.relationships.xcodeVersion.data.id // "none") repository_id=\(.relationships.repository.data.id // "none")"' \
              "$RUNNER_TEMP/workflows-$product_id.json"
            jq -r '.included[]? | select(.type == "ciXcodeVersions") | "xcode id=\(.id) version=\(.attributes.version) name=\(.attributes.name)"' \
              "$RUNNER_TEMP/workflows-$product_id.json"
            jq -r '.included[]? | select(.type == "ciMacOsVersions") | "macos id=\(.id) version=\(.attributes.version) name=\(.attributes.name)"' \
              "$RUNNER_TEMP/workflows-$product_id.json"

            while IFS= read -r repository_id; do
              test -n "$repository_id" || continue
              api_get "/v1/scmRepositories/$repository_id/gitReferences" \
                --data-urlencode 'limit=200' \
                --data-urlencode 'fields[scmGitReferences]=name,canonicalName,isDeleted,kind' \
                > "$RUNNER_TEMP/references-$repository_id.json"
              jq -r --arg tag "$RELEASE_TAG" \
                '.data[] | select(.attributes.name == $tag or .attributes.canonicalName == ("refs/tags/" + $tag)) | "release-tag-reference id=\(.id) name=\(.attributes.name) canonical=\(.attributes.canonicalName) deleted=\(.attributes.isDeleted) kind=\(.attributes.kind)"' \
                "$RUNNER_TEMP/references-$repository_id.json"
            done < <(jq -r '[.included[]? | select(.type == "scmRepositories") | .id] | unique[]' "$RUNNER_TEMP/workflows-$product_id.json")
          done < <(jq -r '.data[].id' "$RUNNER_TEMP/products.json")

          bundle_id="$(awk '$1 == "PRODUCT_BUNDLE_IDENTIFIER:" { print $2; exit }' FloeAgent/project.yml | tr -d '"')"
          build_number="$RELEASE_BUILD_INPUT"
          if test -z "$build_number"; then
            build_number="$(awk '$1 == "CURRENT_PROJECT_VERSION:" { print $2; exit }' FloeAgent/project.yml | tr -d '"')"
          fi
          test -n "$bundle_id"
          test -n "$build_number"
          api_get /v1/apps \
            --data-urlencode "filter[bundleId]=$bundle_id" \
            --data-urlencode 'limit=10' \
            --data-urlencode 'fields[apps]=name,bundleId' \
            > "$RUNNER_TEMP/apps.json"
          app_id="$(jq -r '.data[0].id // empty' "$RUNNER_TEMP/apps.json")"
          test -n "$app_id"
          # A successful transport receipt can precede /v1/builds visibility.
          # Query Apple's upload-processing record without fetching asset URLs,
          # credentials or upload operations. This is read-only diagnostics.
          api_get "/v1/apps/$app_id/buildUploads" \
            --data-urlencode "filter[cfBundleVersion]=$build_number" \
            --data-urlencode 'limit=20' \
            --data-urlencode 'sort=-uploadedDate' \
            --data-urlencode 'fields[buildUploads]=cfBundleShortVersionString,cfBundleVersion,createdDate,uploadedDate,state,build' \
            > "$RUNNER_TEMP/build-uploads.json"
          jq -c '.data[] | {uploadID:.id,version:.attributes.cfBundleShortVersionString,build:.attributes.cfBundleVersion,created:.attributes.createdDate,uploaded:.attributes.uploadedDate,state:.attributes.state,buildID:.relationships.build.data.id}' \
            "$RUNNER_TEMP/build-uploads.json"
          # Read the actual latest uploads before choosing a new build number.
          api_get /v1/builds \
            --data-urlencode "filter[app]=$app_id" \
            --data-urlencode 'sort=-uploadedDate' \
            --data-urlencode 'limit=20' \
            --data-urlencode 'fields[builds]=version,uploadedDate,processingState,preReleaseVersion' \
            --data-urlencode 'fields[preReleaseVersions]=version,platform' \
            --data-urlencode 'include=preReleaseVersion' \
            > "$RUNNER_TEMP/latest-builds.json"
          jq -r '. as $root | .data[] as $build | ($root.included[]? | select(.id == $build.relationships.preReleaseVersion.data.id)) as $release | "latest-upload id=\($build.id) version=\($release.attributes.version) build=\($build.attributes.version) processing=\($build.attributes.processingState) uploaded=\($build.attributes.uploadedDate)"' \
            "$RUNNER_TEMP/latest-builds.json"
          api_get /v1/builds \
            --data-urlencode "filter[app]=$app_id" \
            --data-urlencode "filter[version]=$build_number" \
            --data-urlencode 'limit=20' \
            --data-urlencode 'fields[builds]=version,uploadedDate,processingState,buildAudienceType,preReleaseVersion' \
            --data-urlencode 'fields[preReleaseVersions]=version,platform' \
            --data-urlencode 'include=preReleaseVersion' \
            > "$RUNNER_TEMP/builds.json"
          jq -r '.data[] as $build | ($build.relationships.preReleaseVersion.data.id // "none") as $prerelease | "testflight-build id=\($build.id) build=\($build.attributes.version) processing=\($build.attributes.processingState) audience=\($build.attributes.buildAudienceType) uploaded=\($build.attributes.uploadedDate) prerelease_id=\($prerelease)"' \
            "$RUNNER_TEMP/builds.json"

      - name: Update the explicitly selected Xcode Cloud build environment
        if: inputs.operation == 'update-and-start'
        env:
          ASC_TOKEN: ${{ steps.auth.outputs.token }}
          WORKFLOW_ID: ${{ inputs.workflow_id }}
          XCODE_VERSION_ID: ${{ inputs.xcode_version_id }}
          MACOS_VERSION_ID: ${{ inputs.macos_version_id }}
        run: |
          set -euo pipefail
          test -n "$WORKFLOW_ID"
          test -n "$XCODE_VERSION_ID"
          test -n "$MACOS_VERSION_ID"
          case "$WORKFLOW_ID:$XCODE_VERSION_ID:$MACOS_VERSION_ID" in
            *[!A-Za-z0-9:._-]*) echo "Invalid Xcode Cloud resource ID" >&2; exit 2 ;;
          esac
          jq -n \
            --arg workflow "$WORKFLOW_ID" \
            --arg xcode "$XCODE_VERSION_ID" \
            --arg macos "$MACOS_VERSION_ID" \
            '{data:{type:"ciWorkflows",id:$workflow,relationships:{xcodeVersion:{data:{type:"ciXcodeVersions",id:$xcode}},macOsVersion:{data:{type:"ciMacOsVersions",id:$macos}}}}}' \
            > "$RUNNER_TEMP/update-workflow.json"
          http_status="$(curl --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $ASC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/update-workflow.json" \
            "https://api.appstoreconnect.apple.com/v1/ciWorkflows/$WORKFLOW_ID" \
            --output "$RUNNER_TEMP/updated-workflow.json" \
            --write-out '%{http_code}')"
          if test "$http_status" != 200; then
            jq -r '.errors[]? | "apple-api-error status=\(.status) code=\(.code) title=\(.title) detail=\(.detail)"' \
              "$RUNNER_TEMP/updated-workflow.json" >&2
            exit 1
          fi
          jq -r '.data | "updated-workflow id=\(.id) name=\(.attributes.name) xcode_id=\(.relationships.xcodeVersion.data.id) macos_id=\(.relationships.macOsVersion.data.id)"' \
            "$RUNNER_TEMP/updated-workflow.json"

      - name: Enable manual tag selection for the selected workflow
        if: inputs.operation == 'enable-tag-and-start'
        env:
          ASC_TOKEN: ${{ steps.auth.outputs.token }}
          WORKFLOW_ID: ${{ inputs.workflow_id }}
        run: |
          set -euo pipefail
          test -n "$WORKFLOW_ID"
          case "$WORKFLOW_ID" in
            *[!A-Za-z0-9:_-]*) echo "Invalid Xcode Cloud workflow ID" >&2; exit 2 ;;
          esac
          jq -n \
            --arg workflow "$WORKFLOW_ID" \
            '{data:{type:"ciWorkflows",id:$workflow,attributes:{manualTagStartCondition:{source:{isAllMatch:true}}}}}' \
            > "$RUNNER_TEMP/enable-manual-tag.json"
          http_status="$(curl --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $ASC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/enable-manual-tag.json" \
            "https://api.appstoreconnect.apple.com/v1/ciWorkflows/$WORKFLOW_ID" \
            --output "$RUNNER_TEMP/tag-enabled-workflow.json" \
            --write-out '%{http_code}')"
          if test "$http_status" != 200; then
            jq -r '.errors[]? | "apple-api-error status=\(.status) code=\(.code) title=\(.title) detail=\(.detail)"' \
              "$RUNNER_TEMP/tag-enabled-workflow.json" >&2
            exit 1
          fi
          jq -r '.data | "manual-tag-enabled workflow_id=\(.id) name=\(.attributes.name) enabled=\(.attributes.isEnabled)"' \
            "$RUNNER_TEMP/tag-enabled-workflow.json"

      - name: Start the explicitly selected Xcode Cloud workflow
        if: inputs.operation == 'start' || inputs.operation == 'enable-tag-and-start' || inputs.operation == 'update-and-start'
        env:
          ASC_TOKEN: ${{ steps.auth.outputs.token }}
          WORKFLOW_ID: ${{ inputs.workflow_id }}
          GIT_REFERENCE_ID: ${{ inputs.git_reference_id }}
        run: |
          set -euo pipefail
          test -n "$WORKFLOW_ID"
          test -n "$GIT_REFERENCE_ID"
          case "$WORKFLOW_ID:$GIT_REFERENCE_ID" in
            *[!A-Za-z0-9:_-]*) echo "Invalid Xcode Cloud resource ID" >&2; exit 2 ;;
          esac
          jq -n \
            --arg workflow "$WORKFLOW_ID" \
            --arg reference "$GIT_REFERENCE_ID" \
            '{data:{type:"ciBuildRuns",attributes:{},relationships:{workflow:{data:{type:"ciWorkflows",id:$workflow}},sourceBranchOrTag:{data:{type:"scmGitReferences",id:$reference}}}}}' \
            > "$RUNNER_TEMP/start-build.json"
          http_status="$(curl --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $ASC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/start-build.json" \
            https://api.appstoreconnect.apple.com/v1/ciBuildRuns \
            --output "$RUNNER_TEMP/build-run.json" \
            --write-out '%{http_code}')"
          if test "$http_status" != 201; then
            jq -r '.errors[]? | "apple-api-error status=\(.status) code=\(.code) title=\(.title) detail=\(.detail)"' \
              "$RUNNER_TEMP/build-run.json" >&2
            exit 1
          fi
          jq -r '.data | "xcode-cloud-build-run id=\(.id) number=\(.attributes.number) progress=\(.attributes.executionProgress) commit=\(.attributes.sourceCommit.commitSha // "pending")"' \
            "$RUNNER_TEMP/build-run.json"

      - name: Monitor the selected Xcode Cloud build run
        if: inputs.operation == 'monitor'
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
        run: |
          set -euo pipefail
          test -n "$BUILD_RUN_ID"
          case "$BUILD_RUN_ID" in
            *[!A-Za-z0-9:_-]*) echo "Invalid Xcode Cloud build run ID" >&2; exit 2 ;;
          esac

          previous_summary=""
          for attempt in $(seq 1 120); do
            ASC_TOKEN="$(python3 FloeAgent/scripts/generate_asc_jwt.py)"
            echo "::add-mask::$ASC_TOKEN"
            curl --fail-with-body --silent --show-error --get \
              -H "Authorization: Bearer $ASC_TOKEN" \
              -H "Accept: application/json" \
              --data-urlencode 'fields[ciBuildRuns]=number,createdDate,startedDate,finishedDate,sourceCommit,issueCounts,executionProgress,completionStatus,startReason,cancelReason,builds,workflow,product,sourceBranchOrTag' \
              --data-urlencode 'fields[builds]=version,uploadedDate,processingState,buildAudienceType' \
              --data-urlencode 'fields[ciWorkflows]=name' \
              --data-urlencode 'fields[ciProducts]=name' \
              --data-urlencode 'fields[scmGitReferences]=name,canonicalName,kind,isDeleted' \
              --data-urlencode 'include=builds,workflow,product,sourceBranchOrTag' \
              "https://api.appstoreconnect.apple.com/v1/ciBuildRuns/$BUILD_RUN_ID" \
              > "$RUNNER_TEMP/build-run-status.json"

            summary="$(jq -r '.data | "number=\(.attributes.number) progress=\(.attributes.executionProgress) completion=\(.attributes.completionStatus // "pending") commit=\(.attributes.sourceCommit.commitSha // "pending") started=\(.attributes.startedDate // "pending") finished=\(.attributes.finishedDate // "pending")"' "$RUNNER_TEMP/build-run-status.json")"
            if test "$summary" != "$previous_summary"; then
              echo "xcode-cloud-status $summary"
              jq -r '.included[]? | select(.type == "builds") | "xcode-cloud-app-build id=\(.id) version=\(.attributes.version) processing=\(.attributes.processingState) audience=\(.attributes.buildAudienceType) uploaded=\(.attributes.uploadedDate)"' \
                "$RUNNER_TEMP/build-run-status.json"
              previous_summary="$summary"
            fi

            progress="$(jq -r '.data.attributes.executionProgress' "$RUNNER_TEMP/build-run-status.json")"
            if test "$progress" = COMPLETE; then
              completion="$(jq -r '.data.attributes.completionStatus' "$RUNNER_TEMP/build-run-status.json")"
              test "$completion" = SUCCEEDED
              exit 0
            fi
            sleep 30
          done
          echo "Timed out waiting for Xcode Cloud build run $BUILD_RUN_ID" >&2
          exit 1

      - name: Inspect issues for the selected Xcode Cloud build run
        if: inputs.operation == 'inspect-issues'
        env:
          ASC_TOKEN: ${{ steps.auth.outputs.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          test -n "$BUILD_RUN_ID"
          case "$BUILD_RUN_ID" in
            *[!A-Za-z0-9:_-]*) echo "Invalid Xcode Cloud build run ID" >&2; exit 2 ;;
          esac
          api_get() {
            local path="$1"
            shift
            curl --fail-with-body --silent --show-error --get \
              -H "Authorization: Bearer $ASC_TOKEN" \
              -H "Accept: application/json" \
              "https://api.appstoreconnect.apple.com$path" "$@"
          }

          api_get "/v1/ciBuildRuns/$BUILD_RUN_ID/actions" \
            --data-urlencode 'limit=200' \
            --data-urlencode 'fields[ciBuildActions]=name,actionType,startedDate,finishedDate,issueCounts,executionProgress,completionStatus,isRequiredToPass' \
            > "$RUNNER_TEMP/build-actions.json"

          jq -r '.data[] | "xcode-cloud-action id=\(.id) name=\(.attributes.name) type=\(.attributes.actionType) progress=\(.attributes.executionProgress) completion=\(.attributes.completionStatus // "pending") required=\(.attributes.isRequiredToPass) issues=\(.attributes.issueCounts // {})"' \
            "$RUNNER_TEMP/build-actions.json"

          issue_count=0
          while IFS= read -r action_id; do
            api_get "/v1/ciBuildActions/$action_id/issues" \
              --data-urlencode 'limit=200' \
              --data-urlencode 'fields[ciIssues]=issueType,message,fileSource,category' \
              > "$RUNNER_TEMP/issues-$action_id.json"
            count="$(jq '.data | length' "$RUNNER_TEMP/issues-$action_id.json")"
            issue_count=$((issue_count + count))
            jq -r --arg action "$action_id" '.data[] | "xcode-cloud-issue action=\($action) type=\(.attributes.issueType) category=\(.attributes.category // "") message=\(.attributes.message) fileSource=\((.attributes.fileSource // {}) | @json)"' \
              "$RUNNER_TEMP/issues-$action_id.json"
          done < <(jq -r '.data[].id' "$RUNNER_TEMP/build-actions.json")
          echo "xcode-cloud-issue-count=$issue_count"
          test "$issue_count" -gt 0

      - name: Set beta notes and confirm existing internal group access
        if: inputs.operation == 'prepare-testflight'
        env:
          BUILD_ID: ${{ inputs.build_id }}
          ASC_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 FloeAgent/scripts/prepare_testflight.py

      - name: Verify TestFlight processing and group visibility
        if: inputs.operation == 'verify-testflight'
        env:
          BUILD_ID: ${{ inputs.build_id }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
        run: |
          set -euo pipefail
          test -n "$BUILD_ID"
          case "$BUILD_ID" in
            *[!A-Za-z0-9:_-]*) echo "Invalid App Store Connect build ID" >&2; exit 2 ;;
          esac

          for attempt in $(seq 1 60); do
            ASC_TOKEN="$(python3 FloeAgent/scripts/generate_asc_jwt.py)"
            echo "::add-mask::$ASC_TOKEN"
            curl --fail-with-body --silent --show-error --get \
              -H "Authorization: Bearer $ASC_TOKEN" \
              -H "Accept: application/json" \
              --data-urlencode 'fields[builds]=version,uploadedDate,processingState,expired,buildAudienceType,betaGroups,preReleaseVersion,app,buildBetaDetail' \
              --data-urlencode 'fields[betaGroups]=name,isInternalGroup,publicLinkEnabled,publicLinkLimitEnabled,feedbackEnabled' \
              --data-urlencode 'fields[buildBetaDetails]=internalBuildState,externalBuildState' \
              --data-urlencode 'fields[preReleaseVersions]=version,platform' \
              --data-urlencode 'fields[apps]=name,bundleId' \
              --data-urlencode 'include=betaGroups,preReleaseVersion,app,buildBetaDetail' \
              "https://api.appstoreconnect.apple.com/v1/builds/$BUILD_ID" \
              > "$RUNNER_TEMP/testflight-build.json"

            processing="$(jq -r '.data.attributes.processingState' "$RUNNER_TEMP/testflight-build.json")"
            echo "testflight-build id=$BUILD_ID version=$(jq -r '.data.attributes.version' "$RUNNER_TEMP/testflight-build.json") processing=$processing audience=$(jq -r '.data.attributes.buildAudienceType' "$RUNNER_TEMP/testflight-build.json") uploaded=$(jq -r '.data.attributes.uploadedDate' "$RUNNER_TEMP/testflight-build.json")"
            if test "$processing" = VALID; then
              group_count="$(jq '[.included[]? | select(.type == "betaGroups")] | length' "$RUNNER_TEMP/testflight-build.json")"
              floe_qa_count="$(jq '[.included[]? | select(.type == "betaGroups" and .attributes.name == "Floe QA" and .attributes.isInternalGroup == true and .attributes.publicLinkEnabled != true)] | length' "$RUNNER_TEMP/testflight-build.json")"
              unexpected_group_count="$(jq '[.included[]? | select(.type == "betaGroups" and (.attributes.name != "Floe QA" or .attributes.isInternalGroup != true or .attributes.publicLinkEnabled == true))] | length' "$RUNNER_TEMP/testflight-build.json")"
              echo "beta-group-count=$group_count"
              echo "floe-qa-internal-group-count=$floe_qa_count"
              echo "unexpected-beta-group-count=$unexpected_group_count"
              jq -r '.included[]? | select(.type == "betaGroups") | "beta-group id=\(.id) name=\(.attributes.name) internal=\(.attributes.isInternalGroup) public_link=\(.attributes.publicLinkEnabled) feedback=\(.attributes.feedbackEnabled)"' \
                "$RUNNER_TEMP/testflight-build.json"
              jq -r '.included[]? | select(.type == "preReleaseVersions") | "prerelease-version id=\(.id) version=\(.attributes.version) platform=\(.attributes.platform)"' \
                "$RUNNER_TEMP/testflight-build.json"
              test "$group_count" -eq 1
              test "$floe_qa_count" -eq 1
              test "$unexpected_group_count" -eq 0
              test "$(jq -r '.data.attributes.expired' "$RUNNER_TEMP/testflight-build.json")" = false
              internal_state="$(jq -r '[.included[]? | select(.type == "buildBetaDetails") | .attributes.internalBuildState] | if length == 1 then .[0] else "UNAVAILABLE" end' "$RUNNER_TEMP/testflight-build.json")"
              echo "internal-beta-state=$internal_state"
              case "$internal_state" in
                IN_BETA_TESTING) exit 0 ;;
                READY_FOR_BETA_TESTING|PROCESSING) ;; # Allow distribution state to settle.
                *) echo "Build is not available for internal testing: $internal_state" >&2; exit 1 ;;
              esac
            fi
            test "$processing" != FAILED
            sleep 30
          done
          echo "Timed out waiting for TestFlight processing of $BUILD_ID" >&2
          exit 1

      - name: Fetch TestFlight crash feedback for the selected build
        if: inputs.operation == 'crash-feedback'
        env:
          BUILD_ID: ${{ inputs.build_id }}
          ASC_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          test -n "$BUILD_ID"
          case "$BUILD_ID" in
            *[!A-Za-z0-9:_-]*) echo "Invalid App Store Connect build ID" >&2; exit 2 ;;
          esac
          api_get() {
            local path="$1"
            shift
            curl --fail-with-body --silent --show-error --get \
              -H "Authorization: Bearer $ASC_TOKEN" \
              -H "Accept: application/json" \
              "https://api.appstoreconnect.apple.com$path" "$@"
          }
          api_get "/v1/builds/$BUILD_ID/relationships/app" \
            > "$RUNNER_TEMP/crash-feedback-app.json"
          app_id="$(jq -r '.data.id // empty' "$RUNNER_TEMP/crash-feedback-app.json")"
          test -n "$app_id"
          # TestFlight crash-feedback submissions are separate from the
          # automatic crash metric. A tester who also belongs to a group with
          # feedback disabled may not see the in-app feedback affordance.
          api_get "/v1/apps/$app_id/betaGroups" \
            --data-urlencode 'limit=200' \
            --data-urlencode 'fields[betaGroups]=name,feedbackEnabled' \
            > "$RUNNER_TEMP/feedback-beta-groups.json"
          jq -r '"beta-group-count=\(.data | length) feedback-disabled-group-count=\([.data[] | select(.attributes.feedbackEnabled == false)] | length)"' \
            "$RUNNER_TEMP/feedback-beta-groups.json"
          api_get "/v1/apps/$app_id/betaFeedbackCrashSubmissions" \
            --data-urlencode "filter[build]=$BUILD_ID" \
            --data-urlencode 'limit=200' \
            --data-urlencode 'fields[betaFeedbackCrashSubmissions]=createdDate,build,deviceModel,deviceFamily,devicePlatform,osVersion' \
            --data-urlencode 'include=build' \
            > "$RUNNER_TEMP/crash-submissions.json"
          count="$(jq '.data | length' "$RUNNER_TEMP/crash-submissions.json")"
          echo "crash-submission-count=$count"
          echo "This counts tester crash-feedback submissions, not the automatic TestFlight crash metric."
          jq -r '.data[] | "crash-feedback date=\(.attributes.createdDate // "unknown") device=\(.attributes.deviceModel // "unknown") family=\(.attributes.deviceFamily // "unknown") platform=\(.attributes.devicePlatform // "unknown") os=\(.attributes.osVersion // "unknown")"' \
            "$RUNNER_TEMP/crash-submissions.json"
          while IFS= read -r submission_id; do
            if ! api_get "/v1/betaFeedbackCrashSubmissions/$submission_id/crashLog" \
              --data-urlencode 'fields[betaCrashLogs]=logText' \
              > "$RUNNER_TEMP/crash-log-$submission_id.json"; then
              echo "crash-log-unavailable id=$submission_id"
              continue
            fi
            echo "crash-log id=$submission_id begin"
            python3 FloeAgent/scripts/summarize_asc_crash.py "$RUNNER_TEMP/crash-log-$submission_id.json"
            echo
            echo "crash-log id=$submission_id end"
          done < <(jq -r '.data[].id' "$RUNNER_TEMP/crash-submissions.json")

  bridge-certificate:
    if: ${{ startsWith(inputs.operation, 'bridge-cert-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    concurrency:
      group: floe-bridge-certificate
      cancel-in-progress: false
    steps:
      - name: Check out the dispatched bridge ref
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate bridge certificate inputs
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRM: ${{ inputs.bridge_confirm }}
          SOURCE_SHA: ${{ inputs.bridge_source_sha }}
          RELEASE_TAG: ${{ inputs.bridge_release_tag }}
          ARTIFACT_NAME: ${{ inputs.bridge_artifact_name }}
          ARTIFACT_SHA: ${{ inputs.bridge_artifact_sha256 }}
          TEAM_ID: ${{ inputs.bridge_team_id }}
          SUBMISSION_ID: ${{ inputs.bridge_submission_id }}
        run: |
          set -euo pipefail
          test -z "$SOURCE_SHA$RELEASE_TAG$ARTIFACT_NAME$ARTIFACT_SHA$TEAM_ID$SUBMISSION_ID" || {
            echo "Certificate operations do not accept artifact or notary inputs." >&2
            exit 2
          }
          case "$OPERATION" in
            bridge-cert-probe|bridge-cert-fetch)
              test -z "$CONFIRM" || { echo "bridge_confirm must be empty for $OPERATION" >&2; exit 2; }
              ;;
            *)
              echo "Unsupported certificate operation" >&2
              exit 2
              ;;
          esac
          test -f FloeMacBridge/signing/FloeBridge-DeveloperID-20261029.certSigningRequest
          test -f FloeMacBridge/scripts/asc_certificate.py
          mkdir -p "$RUNNER_TEMP/bridge-out"

      - name: Install App Store Connect API key
        env:
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$ASC_API_PRIVATE_KEY_BASE64"
          test -n "$ASC_KEY_ID"
          printf '%s' "$ASC_API_PRIVATE_KEY_BASE64" | python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read()))' > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"

      - name: Probe, fetch or explicitly create the Developer ID certificate
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
          OPERATION: ${{ inputs.operation }}
          CONFIRM: ${{ inputs.bridge_confirm }}
        run: |
          set -euo pipefail
          command="${OPERATION#bridge-}"
          args=(--csr FloeMacBridge/signing/FloeBridge-DeveloperID-20261029.certSigningRequest --out-dir "$RUNNER_TEMP/bridge-out")
          case "$command" in
            cert-probe) args=(probe "${args[@]}") ;;
            cert-fetch) args=(fetch "${args[@]}") ;;
            *) echo "Unsupported certificate operation" >&2; exit 2 ;;
          esac
          set +e
          python3 FloeMacBridge/scripts/asc_certificate.py "${args[@]}" > "$RUNNER_TEMP/bridge-out/console.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/bridge-out/console.log"
          exit "$rc"

      - name: Upload the public certificate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floe-bridge-certificate-${{ inputs.operation }}
          path: ${{ runner.temp }}/bridge-out
          if-no-files-found: warn
          retention-days: 7

      - name: Remove the App Store Connect API key
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: rm -f "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"

  bridge-notarize:
    if: ${{ inputs.operation == 'bridge-notarize-app' || inputs.operation == 'bridge-notarize-dmg' || inputs.operation == 'bridge-notary-resume' || inputs.operation == 'bridge-notary-status' }}
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    concurrency:
      group: floe-bridge-notarize
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      - name: Check out the dispatched bridge ref
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate bridge notarization inputs
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRM: ${{ inputs.bridge_confirm }}
          SOURCE_SHA: ${{ inputs.bridge_source_sha }}
          RELEASE_TAG: ${{ inputs.bridge_release_tag }}
          ARTIFACT_NAME: ${{ inputs.bridge_artifact_name }}
          ARTIFACT_SHA: ${{ inputs.bridge_artifact_sha256 }}
          TEAM_ID: ${{ inputs.bridge_team_id }}
          SUBMISSION_ID: ${{ inputs.bridge_submission_id }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            bridge-notarize-app|bridge-notarize-dmg|bridge-notary-resume)
              test "$CONFIRM" = "notarize-source-bound-bridge" || {
                echo "bridge_confirm must be notarize-source-bound-bridge" >&2
                exit 2
              }
              [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "bridge_source_sha must be 40 lowercase hex" >&2; exit 2; }
              [[ "$RELEASE_TAG" =~ ^bridge-notary-[0-9a-f]{40}(-[0-9a-f]{8})?$ ]] || { echo "invalid bridge_release_tag" >&2; exit 2; }
              tag_sha="${RELEASE_TAG#bridge-notary-}"
              tag_sha="${tag_sha%%-*}"
              test "$tag_sha" = "$SOURCE_SHA" || { echo "bridge_release_tag does not bind the source SHA" >&2; exit 2; }
              [[ "$ARTIFACT_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "bridge_artifact_sha256 must be 64 lowercase hex" >&2; exit 2; }
              [[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "bridge_team_id must be 10 uppercase alphanumerics" >&2; exit 2; }
              if test "$OPERATION" = bridge-notary-resume; then
                [[ "$SUBMISSION_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || { echo "invalid bridge_submission_id" >&2; exit 2; }
              else
                test -z "$SUBMISSION_ID" || { echo "bridge_submission_id is only for resume or status" >&2; exit 2; }
              fi
              if test "$OPERATION" = bridge-notarize-app; then
                [[ "$ARTIFACT_NAME" =~ ^Floe-Bridge(-[A-Za-z0-9._-]{1,80})?\.zip$ ]] || { echo "app notarization requires a Floe-Bridge*.zip asset name" >&2; exit 2; }
              elif test "$OPERATION" = bridge-notarize-dmg; then
                [[ "$ARTIFACT_NAME" =~ ^Floe-Bridge(-[A-Za-z0-9._-]{1,80})?\.dmg$ ]] || { echo "DMG notarization requires a Floe-Bridge*.dmg asset name" >&2; exit 2; }
              elif [[ "$ARTIFACT_NAME" =~ ^Floe-Bridge(-[A-Za-z0-9._-]{1,80})?\.zip$ ]]; then
                :
              elif [[ "$ARTIFACT_NAME" =~ ^Floe-Bridge(-[A-Za-z0-9._-]{1,80})?\.dmg$ ]]; then
                :
              else
                echo "resume requires a Floe-Bridge*.zip or Floe-Bridge*.dmg asset name" >&2
                exit 2
              fi
              ;;
            bridge-notary-status)
              test -z "$CONFIRM$SOURCE_SHA$RELEASE_TAG$ARTIFACT_NAME$ARTIFACT_SHA$TEAM_ID" || {
                echo "bridge-notary-status accepts only bridge_submission_id" >&2
                exit 2
              }
              [[ "$SUBMISSION_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || { echo "invalid bridge_submission_id" >&2; exit 2; }
              ;;
            *)
              echo "Unsupported notary operation" >&2
              exit 2
              ;;
          esac
          test -f FloeMacBridge/scripts/notarize_bridge.py
          mkdir -p "$RUNNER_TEMP/bridge-in" "$RUNNER_TEMP/bridge-out"

      - name: Install App Store Connect API key
        env:
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$ASC_API_PRIVATE_KEY_BASE64"
          test -n "$ASC_KEY_ID"
          printf '%s' "$ASC_API_PRIVATE_KEY_BASE64" | python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read()))' > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"

      - name: Verify the private draft release and signed artifact
        if: inputs.operation == 'bridge-notarize-app' || inputs.operation == 'bridge-notarize-dmg' || inputs.operation == 'bridge-notary-resume'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.bridge_release_tag }}
          ARTIFACT_NAME: ${{ inputs.bridge_artifact_name }}
          ARTIFACT_SHA256: ${{ inputs.bridge_artifact_sha256 }}
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          test "$is_draft" = "true" || { echo "Refusing a non-draft transport release" >&2; exit 2; }
          asset_line="$(gh release view "$RELEASE_TAG" --json assets --jq ".assets[] | select(.name == \"$ARTIFACT_NAME\") | [.name, .size, (.digest // \"\")] | @tsv")"
          test "$(printf '%s\n' "$asset_line" | sed '/^$/d' | wc -l | tr -d ' ')" = "1" || {
            echo "Expected exactly one draft asset named $ARTIFACT_NAME" >&2
            exit 2
          }
          IFS=$'\t' read -r asset_name asset_size asset_digest <<< "$asset_line"
          test "$asset_name" = "$ARTIFACT_NAME" || { echo "Draft asset name mismatch" >&2; exit 2; }
          [[ "$asset_size" =~ ^[0-9]+$ ]] || { echo "Draft asset size is invalid" >&2; exit 2; }
          test "$asset_size" -ge 1 && test "$asset_size" -le 524288000 || { echo "Draft asset size is outside the accepted range" >&2; exit 2; }
          if test -n "$asset_digest"; then
            test "$asset_digest" = "sha256:$ARTIFACT_SHA256" || { echo "GitHub release asset digest does not match bridge_artifact_sha256" >&2; exit 2; }
          fi
          echo "draft-asset-ok name=$asset_name size=$asset_size digest=${asset_digest:-unavailable}"
          gh release download "$RELEASE_TAG" --pattern "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/bridge-in"
          test "$(find "$RUNNER_TEMP/bridge-in" -maxdepth 1 -type f | wc -l | tr -d ' ')" = "1" || { echo "Expected one downloaded artifact" >&2; exit 2; }
          actual_sha="$(shasum -a 256 "$RUNNER_TEMP/bridge-in/$ARTIFACT_NAME" | awk '{print $1}')"
          test "$actual_sha" = "$ARTIFACT_SHA256" || { echo "Artifact SHA-256 mismatch" >&2; exit 2; }
          echo "artifact-ok name=$ARTIFACT_NAME sha256=$actual_sha"

      - name: Preflight the source-bound signed artifact
        if: inputs.operation == 'bridge-notarize-app' || inputs.operation == 'bridge-notarize-dmg' || inputs.operation == 'bridge-notary-resume'
        env:
          OPERATION: ${{ inputs.operation }}
          ARTIFACT_NAME: ${{ inputs.bridge_artifact_name }}
          SOURCE_SHA: ${{ inputs.bridge_source_sha }}
          TEAM_ID: ${{ inputs.bridge_team_id }}
        run: |
          set -euo pipefail
          kind=app-zip
          if test "$OPERATION" = bridge-notarize-dmg || [[ "$ARTIFACT_NAME" == *.dmg ]]; then kind=dmg; fi
          set +e
          python3 FloeMacBridge/scripts/notarize_bridge.py preflight \
            --artifact "$RUNNER_TEMP/bridge-in/$ARTIFACT_NAME" \
            --kind "$kind" \
            --source-sha "$SOURCE_SHA" \
            --team-id "$TEAM_ID" \
            --out-dir "$RUNNER_TEMP/bridge-out" > "$RUNNER_TEMP/bridge-out/preflight-console.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/bridge-out/preflight-console.log"
          exit "$rc"

      - name: Submit for notarization and staple on acceptance
        if: inputs.operation == 'bridge-notarize-app' || inputs.operation == 'bridge-notarize-dmg'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
          OPERATION: ${{ inputs.operation }}
          ARTIFACT_NAME: ${{ inputs.bridge_artifact_name }}
          SOURCE_SHA: ${{ inputs.bridge_source_sha }}
          TEAM_ID: ${{ inputs.bridge_team_id }}
        run: |
          set -euo pipefail
          kind=app-zip
          if test "$OPERATION" = bridge-notarize-dmg; then kind=dmg; fi
          set +e
          python3 FloeMacBridge/scripts/notarize_bridge.py notarize \
            --artifact "$RUNNER_TEMP/bridge-in/$ARTIFACT_NAME" \
            --kind "$kind" \
            --source-sha "$SOURCE_SHA" \
            --team-id "$TEAM_ID" \
            --key "$ASC_PRIVATE_KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --timeout 30m \
            --out-dir "$RUNNER_TEMP/bridge-out" > "$RUNNER_TEMP/bridge-out/notarize-console.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/bridge-out/notarize-console.log"
          exit "$rc"

      - name: Resume an accepted submission and staple the same artifact
        if: inputs.operation == 'bridge-notary-resume'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
          SUBMISSION_ID: ${{ inputs.bridge_submission_id }}
          ARTIFACT_NAME: ${{ inputs.bridge_artifact_name }}
          SOURCE_SHA: ${{ inputs.bridge_source_sha }}
          TEAM_ID: ${{ inputs.bridge_team_id }}
        run: |
          set -euo pipefail
          kind=app-zip
          if [[ "$ARTIFACT_NAME" == *.dmg ]]; then kind=dmg; fi
          set +e
          python3 FloeMacBridge/scripts/notarize_bridge.py resume \
            --artifact "$RUNNER_TEMP/bridge-in/$ARTIFACT_NAME" \
            --kind "$kind" \
            --source-sha "$SOURCE_SHA" \
            --team-id "$TEAM_ID" \
            --submission-id "$SUBMISSION_ID" \
            --key "$ASC_PRIVATE_KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --out-dir "$RUNNER_TEMP/bridge-out" > "$RUNNER_TEMP/bridge-out/resume-console.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/bridge-out/resume-console.log"
          exit "$rc"

      - name: Read notary submission status
        if: inputs.operation == 'bridge-notary-status'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
          SUBMISSION_ID: ${{ inputs.bridge_submission_id }}
        run: |
          set -euo pipefail
          set +e
          python3 FloeMacBridge/scripts/notarize_bridge.py status \
            --submission-id "$SUBMISSION_ID" \
            --key "$ASC_PRIVATE_KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --out-dir "$RUNNER_TEMP/bridge-out" --log > "$RUNNER_TEMP/bridge-out/status-console.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/bridge-out/status-console.log"
          exit "$rc"

      - name: Upload notarization evidence and stapled artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floe-bridge-notary-${{ inputs.operation }}
          path: ${{ runner.temp }}/bridge-out
          if-no-files-found: warn
          retention-days: 7

      - name: Remove the App Store Connect API key
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: rm -f "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
