name: Xcode Cloud Control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect Xcode Cloud or start an explicitly selected workflow
        required: true
        default: discover
        type: choice
        options:
          - discover
          - monitor
          - verify-testflight
          - start
          - enable-tag-and-start
          - update-and-start
      workflow_id:
        description: ciWorkflows ID required for start
        required: false
        type: string
      git_reference_id:
        description: scmGitReferences ID required for start
        required: false
        type: string
      xcode_version_id:
        description: ciXcodeVersions ID required for update-and-start
        required: false
        type: string
      macos_version_id:
        description: ciMacOsVersions ID required for update-and-start
        required: false
        type: string
      build_run_id:
        description: ciBuildRuns ID required for monitor
        required: false
        type: string
      build_id:
        description: App Store Connect builds ID required for verify-testflight
        required: false
        type: string

permissions:
  contents: read

jobs:
  xcode-cloud:
    runs-on: ubuntu-latest
    steps:
      - name: Check out control scripts
        uses: actions/checkout@v5

      - name: Install App Store Connect API key
        env:
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$ASC_API_PRIVATE_KEY_BASE64"
          test -n "$ASC_KEY_ID"
          echo "$ASC_API_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"

      - name: Generate short-lived API token
        id: auth
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
        run: |
          set -euo pipefail
          TOKEN="$(python3 FloeAgent/scripts/generate_asc_jwt.py)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Discover Xcode Cloud products, workflows, and release tag
        if: inputs.operation == 'discover'
        env:
          ASC_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_TAG: v1.4.39
        run: |
          set -euo pipefail
          api_get() {
            local path="$1"
            shift
            curl --fail-with-body --silent --show-error --get \
              -H "Authorization: Bearer $ASC_TOKEN" \
              -H "Accept: application/json" \
              "https://api.appstoreconnect.apple.com$path" "$@"
          }

          api_get /v1/ciProducts \
            --data-urlencode 'limit=200' \
            --data-urlencode 'fields[ciProducts]=name,productType,bundleId,workflows,primaryRepositories' \
            --data-urlencode 'include=bundleId' > "$RUNNER_TEMP/products.json"

          product_count="$(jq '.data | length' "$RUNNER_TEMP/products.json")"
          echo "Xcode Cloud products: $product_count"
          jq -r '.data[] | "product id=\(.id) name=\(.attributes.name) type=\(.attributes.productType)"' \
            "$RUNNER_TEMP/products.json"
          jq -r '.included[]? | select(.type == "bundleIds") | "bundle id=\(.id) identifier=\(.attributes.identifier)"' \
            "$RUNNER_TEMP/products.json"

          api_get /v1/ciXcodeVersions \
            --data-urlencode 'limit=200' \
            --data-urlencode 'limit[macOsVersions]=50' \
            --data-urlencode 'fields[ciXcodeVersions]=version,name,macOsVersions' \
            --data-urlencode 'fields[ciMacOsVersions]=version,name' \
            --data-urlencode 'include=macOsVersions' > "$RUNNER_TEMP/xcode-versions.json"
          jq -r '.data[] | select((.attributes.name // "") | test("Xcode 27|Latest Beta"; "i")) | "available-xcode id=\(.id) version=\(.attributes.version) name=\(.attributes.name) macos_ids=\([.relationships.macOsVersions.data[]?.id] | join(","))"' \
            "$RUNNER_TEMP/xcode-versions.json"
          jq -r '.included[]? | select(.type == "ciMacOsVersions") | "available-macos id=\(.id) version=\(.attributes.version) name=\(.attributes.name)"' \
            "$RUNNER_TEMP/xcode-versions.json" | sort -u

          while IFS= read -r product_id; do
            api_get "/v1/ciProducts/$product_id/workflows" \
              --data-urlencode 'limit=200' \
              --data-urlencode 'fields[ciWorkflows]=name,description,isEnabled,isLockedForEditing,lastModifiedDate,xcodeVersion,macOsVersion,repository,manualTagStartCondition,actions' \
              --data-urlencode 'fields[ciXcodeVersions]=version,name' \
              --data-urlencode 'fields[ciMacOsVersions]=version,name' \
              --data-urlencode 'fields[scmRepositories]=ownerName,repositoryName,lastAccessedDate' \
              --data-urlencode 'include=xcodeVersion,macOsVersion,repository' \
              > "$RUNNER_TEMP/workflows-$product_id.json"
            jq -r '.data[] | "workflow id=\(.id) name=\(.attributes.name) enabled=\(.attributes.isEnabled) locked=\(.attributes.isLockedForEditing) manual_tag=\(.attributes.manualTagStartCondition != null) xcode_id=\(.relationships.xcodeVersion.data.id // "none") repository_id=\(.relationships.repository.data.id // "none")"' \
              "$RUNNER_TEMP/workflows-$product_id.json"
            jq -r '.included[]? | select(.type == "ciXcodeVersions") | "xcode id=\(.id) version=\(.attributes.version) name=\(.attributes.name)"' \
              "$RUNNER_TEMP/workflows-$product_id.json"
            jq -r '.included[]? | select(.type == "ciMacOsVersions") | "macos id=\(.id) version=\(.attributes.version) name=\(.attributes.name)"' \
              "$RUNNER_TEMP/workflows-$product_id.json"

            while IFS= read -r repository_id; do
              test -n "$repository_id" || continue
              api_get "/v1/scmRepositories/$repository_id/gitReferences" \
                --data-urlencode 'limit=200' \
                --data-urlencode 'fields[scmGitReferences]=name,canonicalName,isDeleted,kind' \
                > "$RUNNER_TEMP/references-$repository_id.json"
              jq -r --arg tag "$RELEASE_TAG" \
                '.data[] | select(.attributes.name == $tag or .attributes.canonicalName == ("refs/tags/" + $tag)) | "release-tag-reference id=\(.id) name=\(.attributes.name) canonical=\(.attributes.canonicalName) deleted=\(.attributes.isDeleted) kind=\(.attributes.kind)"' \
                "$RUNNER_TEMP/references-$repository_id.json"
            done < <(jq -r '[.included[]? | select(.type == "scmRepositories") | .id] | unique[]' "$RUNNER_TEMP/workflows-$product_id.json")
          done < <(jq -r '.data[].id' "$RUNNER_TEMP/products.json")

      - name: Update the explicitly selected Xcode Cloud build environment
        if: inputs.operation == 'update-and-start'
        env:
          ASC_TOKEN: ${{ steps.auth.outputs.token }}
          WORKFLOW_ID: ${{ inputs.workflow_id }}
          XCODE_VERSION_ID: ${{ inputs.xcode_version_id }}
          MACOS_VERSION_ID: ${{ inputs.macos_version_id }}
        run: |
          set -euo pipefail
          test -n "$WORKFLOW_ID"
          test -n "$XCODE_VERSION_ID"
          test -n "$MACOS_VERSION_ID"
          case "$WORKFLOW_ID:$XCODE_VERSION_ID:$MACOS_VERSION_ID" in
            *[!A-Za-z0-9:._-]*) echo "Invalid Xcode Cloud resource ID" >&2; exit 2 ;;
          esac
          jq -n \
            --arg workflow "$WORKFLOW_ID" \
            --arg xcode "$XCODE_VERSION_ID" \
            --arg macos "$MACOS_VERSION_ID" \
            '{data:{type:"ciWorkflows",id:$workflow,relationships:{xcodeVersion:{data:{type:"ciXcodeVersions",id:$xcode}},macOsVersion:{data:{type:"ciMacOsVersions",id:$macos}}}}}' \
            > "$RUNNER_TEMP/update-workflow.json"
          http_status="$(curl --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $ASC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/update-workflow.json" \
            "https://api.appstoreconnect.apple.com/v1/ciWorkflows/$WORKFLOW_ID" \
            --output "$RUNNER_TEMP/updated-workflow.json" \
            --write-out '%{http_code}')"
          if test "$http_status" != 200; then
            jq -r '.errors[]? | "apple-api-error status=\(.status) code=\(.code) title=\(.title) detail=\(.detail)"' \
              "$RUNNER_TEMP/updated-workflow.json" >&2
            exit 1
          fi
          jq -r '.data | "updated-workflow id=\(.id) name=\(.attributes.name) xcode_id=\(.relationships.xcodeVersion.data.id) macos_id=\(.relationships.macOsVersion.data.id)"' \
            "$RUNNER_TEMP/updated-workflow.json"

      - name: Enable manual tag selection for the selected workflow
        if: inputs.operation == 'enable-tag-and-start'
        env:
          ASC_TOKEN: ${{ steps.auth.outputs.token }}
          WORKFLOW_ID: ${{ inputs.workflow_id }}
        run: |
          set -euo pipefail
          test -n "$WORKFLOW_ID"
          case "$WORKFLOW_ID" in
            *[!A-Za-z0-9:_-]*) echo "Invalid Xcode Cloud workflow ID" >&2; exit 2 ;;
          esac
          jq -n \
            --arg workflow "$WORKFLOW_ID" \
            '{data:{type:"ciWorkflows",id:$workflow,attributes:{manualTagStartCondition:{source:{isAllMatch:true}}}}}' \
            > "$RUNNER_TEMP/enable-manual-tag.json"
          http_status="$(curl --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $ASC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/enable-manual-tag.json" \
            "https://api.appstoreconnect.apple.com/v1/ciWorkflows/$WORKFLOW_ID" \
            --output "$RUNNER_TEMP/tag-enabled-workflow.json" \
            --write-out '%{http_code}')"
          if test "$http_status" != 200; then
            jq -r '.errors[]? | "apple-api-error status=\(.status) code=\(.code) title=\(.title) detail=\(.detail)"' \
              "$RUNNER_TEMP/tag-enabled-workflow.json" >&2
            exit 1
          fi
          jq -r '.data | "manual-tag-enabled workflow_id=\(.id) name=\(.attributes.name) enabled=\(.attributes.isEnabled)"' \
            "$RUNNER_TEMP/tag-enabled-workflow.json"

      - name: Start the explicitly selected Xcode Cloud workflow
        if: inputs.operation == 'start' || inputs.operation == 'enable-tag-and-start' || inputs.operation == 'update-and-start'
        env:
          ASC_TOKEN: ${{ steps.auth.outputs.token }}
          WORKFLOW_ID: ${{ inputs.workflow_id }}
          GIT_REFERENCE_ID: ${{ inputs.git_reference_id }}
        run: |
          set -euo pipefail
          test -n "$WORKFLOW_ID"
          test -n "$GIT_REFERENCE_ID"
          case "$WORKFLOW_ID:$GIT_REFERENCE_ID" in
            *[!A-Za-z0-9:_-]*) echo "Invalid Xcode Cloud resource ID" >&2; exit 2 ;;
          esac
          jq -n \
            --arg workflow "$WORKFLOW_ID" \
            --arg reference "$GIT_REFERENCE_ID" \
            '{data:{type:"ciBuildRuns",attributes:{},relationships:{workflow:{data:{type:"ciWorkflows",id:$workflow}},sourceBranchOrTag:{data:{type:"scmGitReferences",id:$reference}}}}}' \
            > "$RUNNER_TEMP/start-build.json"
          http_status="$(curl --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $ASC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/start-build.json" \
            https://api.appstoreconnect.apple.com/v1/ciBuildRuns \
            --output "$RUNNER_TEMP/build-run.json" \
            --write-out '%{http_code}')"
          if test "$http_status" != 201; then
            jq -r '.errors[]? | "apple-api-error status=\(.status) code=\(.code) title=\(.title) detail=\(.detail)"' \
              "$RUNNER_TEMP/build-run.json" >&2
            exit 1
          fi
          jq -r '.data | "xcode-cloud-build-run id=\(.id) number=\(.attributes.number) progress=\(.attributes.executionProgress) commit=\(.attributes.sourceCommit.commitSha // "pending")"' \
            "$RUNNER_TEMP/build-run.json"

      - name: Monitor the selected Xcode Cloud build run
        if: inputs.operation == 'monitor'
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
        run: |
          set -euo pipefail
          test -n "$BUILD_RUN_ID"
          case "$BUILD_RUN_ID" in
            *[!A-Za-z0-9:_-]*) echo "Invalid Xcode Cloud build run ID" >&2; exit 2 ;;
          esac

          previous_summary=""
          for attempt in $(seq 1 120); do
            ASC_TOKEN="$(python3 FloeAgent/scripts/generate_asc_jwt.py)"
            echo "::add-mask::$ASC_TOKEN"
            curl --fail-with-body --silent --show-error --get \
              -H "Authorization: Bearer $ASC_TOKEN" \
              -H "Accept: application/json" \
              --data-urlencode 'fields[ciBuildRuns]=number,createdDate,startedDate,finishedDate,sourceCommit,issueCounts,executionProgress,completionStatus,startReason,cancelReason,builds,workflow,product,sourceBranchOrTag' \
              --data-urlencode 'fields[builds]=version,uploadedDate,processingState,buildAudienceType' \
              --data-urlencode 'fields[ciWorkflows]=name' \
              --data-urlencode 'fields[ciProducts]=name' \
              --data-urlencode 'fields[scmGitReferences]=name,canonicalName,kind,isDeleted' \
              --data-urlencode 'include=builds,workflow,product,sourceBranchOrTag' \
              "https://api.appstoreconnect.apple.com/v1/ciBuildRuns/$BUILD_RUN_ID" \
              > "$RUNNER_TEMP/build-run-status.json"

            summary="$(jq -r '.data | "number=\(.attributes.number) progress=\(.attributes.executionProgress) completion=\(.attributes.completionStatus // "pending") commit=\(.attributes.sourceCommit.commitSha // "pending") started=\(.attributes.startedDate // "pending") finished=\(.attributes.finishedDate // "pending")"' "$RUNNER_TEMP/build-run-status.json")"
            if test "$summary" != "$previous_summary"; then
              echo "xcode-cloud-status $summary"
              jq -r '.included[]? | select(.type == "builds") | "xcode-cloud-app-build id=\(.id) version=\(.attributes.version) processing=\(.attributes.processingState) audience=\(.attributes.buildAudienceType) uploaded=\(.attributes.uploadedDate)"' \
                "$RUNNER_TEMP/build-run-status.json"
              previous_summary="$summary"
            fi

            progress="$(jq -r '.data.attributes.executionProgress' "$RUNNER_TEMP/build-run-status.json")"
            if test "$progress" = COMPLETE; then
              completion="$(jq -r '.data.attributes.completionStatus' "$RUNNER_TEMP/build-run-status.json")"
              test "$completion" = SUCCEEDED
              exit 0
            fi
            sleep 30
          done
          echo "Timed out waiting for Xcode Cloud build run $BUILD_RUN_ID" >&2
          exit 1

      - name: Verify TestFlight processing and group visibility
        if: inputs.operation == 'verify-testflight'
        env:
          BUILD_ID: ${{ inputs.build_id }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
        run: |
          set -euo pipefail
          test -n "$BUILD_ID"
          case "$BUILD_ID" in
            *[!A-Za-z0-9:_-]*) echo "Invalid App Store Connect build ID" >&2; exit 2 ;;
          esac

          for attempt in $(seq 1 60); do
            ASC_TOKEN="$(python3 FloeAgent/scripts/generate_asc_jwt.py)"
            echo "::add-mask::$ASC_TOKEN"
            curl --fail-with-body --silent --show-error --get \
              -H "Authorization: Bearer $ASC_TOKEN" \
              -H "Accept: application/json" \
              --data-urlencode 'fields[builds]=version,uploadedDate,processingState,buildAudienceType,betaGroups,preReleaseVersion,app' \
              --data-urlencode 'fields[betaGroups]=name,isInternalGroup,publicLinkEnabled,publicLinkLimitEnabled,feedbackEnabled' \
              --data-urlencode 'fields[preReleaseVersions]=version,platform' \
              --data-urlencode 'fields[apps]=name,bundleId' \
              --data-urlencode 'include=betaGroups,preReleaseVersion,app' \
              "https://api.appstoreconnect.apple.com/v1/builds/$BUILD_ID" \
              > "$RUNNER_TEMP/testflight-build.json"

            processing="$(jq -r '.data.attributes.processingState' "$RUNNER_TEMP/testflight-build.json")"
            echo "testflight-build id=$BUILD_ID version=$(jq -r '.data.attributes.version' "$RUNNER_TEMP/testflight-build.json") processing=$processing audience=$(jq -r '.data.attributes.buildAudienceType' "$RUNNER_TEMP/testflight-build.json") uploaded=$(jq -r '.data.attributes.uploadedDate' "$RUNNER_TEMP/testflight-build.json")"
            if test "$processing" = VALID; then
              group_count="$(jq '[.included[]? | select(.type == "betaGroups")] | length' "$RUNNER_TEMP/testflight-build.json")"
              echo "beta-group-count=$group_count"
              jq -r '.included[]? | select(.type == "betaGroups") | "beta-group id=\(.id) name=\(.attributes.name) internal=\(.attributes.isInternalGroup) public_link=\(.attributes.publicLinkEnabled) feedback=\(.attributes.feedbackEnabled)"' \
                "$RUNNER_TEMP/testflight-build.json"
              jq -r '.included[]? | select(.type == "preReleaseVersions") | "prerelease-version id=\(.id) version=\(.attributes.version) platform=\(.attributes.platform)"' \
                "$RUNNER_TEMP/testflight-build.json"
              test "$group_count" -gt 0
              exit 0
            fi
            test "$processing" != FAILED
            sleep 30
          done
          echo "Timed out waiting for TestFlight processing of $BUILD_ID" >&2
          exit 1
