name: Publish Feather source

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published Floe app release tag
        required: true
        type: string

concurrency:
  group: floe-feather-source
  cancel-in-progress: false

permissions:
  contents: write
  attestations: read

jobs:
  publish-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Require a published immutable app release
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[1-9][0-9]*)?$ ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" > "$RUNNER_TEMP/feather-source-sha.txt"
          gh release view "$RELEASE_TAG" --json tagName,isDraft,publishedAt > "$RUNNER_TEMP/feather-release.json"
          jq -e --arg tag "$RELEASE_TAG" '.tagName == $tag and .isDraft == false and .publishedAt != null' "$RUNNER_TEMP/feather-release.json"
      - name: Download and verify the published developer IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/FeatherInput"
          gh release download "$RELEASE_TAG" --pattern '*-unsigned.ipa' --pattern '*-unsigned.ipa.sha256' --dir "$RUNNER_TEMP/FeatherInput"
          python3 - <<'PY'
          import hashlib, os, pathlib
          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'FeatherInput'
          ipas = list(folder.glob('*-unsigned.ipa'))
          assert len(ipas) == 1, 'Expected one published unsigned IPA'
          ipa = ipas[0]
          digest = hashlib.sha256()
          with ipa.open('rb') as stream:
              for block in iter(lambda: stream.read(1024 * 1024), b''):
                  digest.update(block)
          expected, filename = ipa.with_suffix(ipa.suffix + '.sha256').read_text().strip().split(maxsplit=1)
          assert filename.lstrip('*') == ipa.name, 'Checksum filename mismatch'
          assert expected == digest.hexdigest(), 'Published IPA checksum mismatch'
          (folder / 'ipa-path.txt').write_text(str(ipa))
          PY
          recovery=()
          trust=FloeAgent/scripts/feather_recovery_trust.json
          if jq -e --arg tag "$RELEASE_TAG" 'has($tag)' "$trust" >/dev/null; then
            gh release download "$RELEASE_TAG" --pattern BUILD191-RECOVERY-PROVENANCE.json --dir "$RUNNER_TEMP/FeatherInput"
            recovery=(--provenance "$RUNNER_TEMP/FeatherInput/BUILD191-RECOVERY-PROVENANCE.json")
          fi
          python3 FloeAgent/scripts/verify_feather_provenance.py \
            --ipa "$(cat "$RUNNER_TEMP/FeatherInput/ipa-path.txt")" \
            --tag "$RELEASE_TAG" --source-sha "$(cat "$RUNNER_TEMP/feather-source-sha.txt")" \
            --trust "$trust" "${recovery[@]}"
      - name: Generate source from verified binary metadata
        run: |
          set -euo pipefail
          previous=()
          if test -f feather.json; then previous=(--previous-source feather.json); fi
          python3 FloeAgent/scripts/generate_feather_source.py \
            --ipa "$(cat "$RUNNER_TEMP/FeatherInput/ipa-path.txt")" \
            --tag "$RELEASE_TAG" --source-sha "$(cat "$RUNNER_TEMP/feather-source-sha.txt")" \
            --released-at "$(jq -r .publishedAt "$RUNNER_TEMP/feather-release.json")" \
            --output feather.json "${previous[@]}"
          python3 -m unittest discover -s FloeAgent/scripts/tests -p test_feather_source.py
      - name: Publish the stable source URL
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feather.json
          if git diff --cached --quiet; then exit 0; fi
          # The feed was just validated above; this commit changes only its
          # JSON and must not cancel/restart the expensive App CI on main.
          git commit -m "Update Feather source for $RELEASE_TAG [skip ci]"
          git push origin HEAD:main
