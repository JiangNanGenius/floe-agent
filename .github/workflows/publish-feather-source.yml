name: Publish Feather source

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published Floe app release tag
        required: true
        type: string
  # The normal release workflow calls this same file synchronously so a feed
  # failure fails the release run instead of only a detached run. It keeps the
  # one generator, permissions, concurrency group and live readback; no parallel
  # feed writer is introduced.
  workflow_call:
    inputs:
      tag:
        description: Published Floe app release tag
        required: true
        type: string

concurrency:
  group: floe-feather-source
  cancel-in-progress: false

permissions:
  contents: write
  attestations: read
  actions: read

jobs:
  publish-source:
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Require a published immutable app release
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[1-9][0-9]*)?$ ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" > "$RUNNER_TEMP/feather-source-sha.txt"
          gh release view "$RELEASE_TAG" --json tagName,isDraft,publishedAt > "$RUNNER_TEMP/feather-release.json"
          jq -e --arg tag "$RELEASE_TAG" '.tagName == $tag and .isDraft == false and .publishedAt != null' "$RUNNER_TEMP/feather-release.json"
      - name: Require a public unsigned-only asset set
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/feather-assets.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          assets = [entry['name'] for entry in json.loads(
              (Path(os.environ['RUNNER_TEMP']) / 'feather-assets.json').read_text())['assets']]
          unsigned = [name for name in assets if re.fullmatch(r'.+-unsigned\.ipa', name)]
          sidecars = [name for name in assets if re.fullmatch(r'.+-unsigned\.ipa\.sha256', name)]
          assert len(unsigned) == 1, f'Expected one published unsigned IPA, found {assets}'
          assert len(sidecars) == 1, f'Expected one published checksum, found {assets}'
          forbidden = [name for name in assets
                       if name == 'FloeAgent.ipa'
                       or (name.endswith('.ipa') and name not in unsigned)
                       or name.endswith(('.mobileprovision', '.p12', '.dSYM'))]
          assert not forbidden, f'Published release exposes signing material: {forbidden}'
          print(f'Published unsigned-only assets verified: {unsigned[0]}')
          PY
      - name: Download and verify the published developer IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/FeatherInput"
          gh release download "$RELEASE_TAG" --pattern '*-unsigned.ipa' --pattern '*-unsigned.ipa.sha256' --dir "$RUNNER_TEMP/FeatherInput"
          python3 - <<'PY'
          import hashlib, os, pathlib
          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'FeatherInput'
          ipas = list(folder.glob('*-unsigned.ipa'))
          assert len(ipas) == 1, 'Expected one published unsigned IPA'
          ipa = ipas[0]
          digest = hashlib.sha256()
          with ipa.open('rb') as stream:
              for block in iter(lambda: stream.read(1024 * 1024), b''):
                  digest.update(block)
          expected, filename = ipa.with_suffix(ipa.suffix + '.sha256').read_text().strip().split(maxsplit=1)
          assert filename.lstrip('*') == ipa.name, 'Checksum filename mismatch'
          assert expected == digest.hexdigest(), 'Published IPA checksum mismatch'
          (folder / 'ipa-path.txt').write_text(str(ipa))
          PY
          recovery=()
          trust=FloeAgent/scripts/feather_recovery_trust.json
          if jq -e --arg tag "$RELEASE_TAG" '.[$tag].signerWorkflow == ".github/workflows/developer-ipa-from-recovery.yml"' "$trust" >/dev/null; then
            gh release download "$RELEASE_TAG" --pattern BUILD191-RECOVERY-PROVENANCE.json --dir "$RUNNER_TEMP/FeatherInput"
            recovery=(--provenance "$RUNNER_TEMP/FeatherInput/BUILD191-RECOVERY-PROVENANCE.json")
          fi
          python3 FloeAgent/scripts/verify_feather_provenance.py \
            --ipa "$(cat "$RUNNER_TEMP/FeatherInput/ipa-path.txt")" \
            --tag "$RELEASE_TAG" --source-sha "$(cat "$RUNNER_TEMP/feather-source-sha.txt")" \
            --trust "$trust" "${recovery[@]}"
      - name: Generate source from verified binary metadata
        run: |
          set -euo pipefail
          previous=()
          if test -f feather.json; then previous=(--previous-source feather.json); fi
          python3 FloeAgent/scripts/generate_feather_source.py \
            --ipa "$(cat "$RUNNER_TEMP/FeatherInput/ipa-path.txt")" \
            --tag "$RELEASE_TAG" --source-sha "$(cat "$RUNNER_TEMP/feather-source-sha.txt")" \
            --released-at "$(jq -r .publishedAt "$RUNNER_TEMP/feather-release.json")" \
            --output feather.json "${previous[@]}"
          python3 -m unittest discover -s FloeAgent/scripts/tests -p test_feather_source.py
      - name: Publish the stable source URL
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feather.json
          if git diff --cached --quiet; then exit 0; fi
          # The feed was just validated above; this commit changes only its
          # JSON and must not cancel/restart the expensive App CI on main.
          git commit -m "Update Feather source for $RELEASE_TAG [skip ci]"
          git push origin HEAD:main
      - name: Read back the live feed and the bound release asset
        run: |
          set -euo pipefail
          # The feed is what AltStore/Feather actually read. Verify the live
          # GitHub-hosted JSON, not just the file this run generated, and prove
          # the newest entry's downloadURL/sha256/size resolves to the published
          # release asset. A cached/stale response must be retried until it
          # matches the expected build; only then is the refresh considered done,
          # and a feed that never converges fails this step instead of silently
          # leaving users on an older build.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/feather-readback-release.json"
          cat > "$RUNNER_TEMP/check_feed.py" <<'PY'
          import json
          import sys
          from pathlib import Path

          live = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          published = json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          generated = json.loads(Path(sys.argv[3]).read_text(encoding='utf-8'))
          expected_tag = sys.argv[4]
          expected_source = sys.argv[5].strip()

          # Bind the readback to the intended release, tag commit and version;
          # a feed entry for another build/tag can never satisfy this check.
          assert published.get('tag_name') == expected_tag, (
              'release payload is not the requested tag',
              published.get('tag_name'), expected_tag)
          assert published.get('draft') is False, 'the requested release is still a draft'
          assert published.get('published_at'), 'the requested release has no published_at'

          want_app = generated['apps'][0]
          want = want_app['versions'][0]
          expected_version = expected_tag[1:].split('-beta.')[0]
          assert want.get('version') == expected_version, (
              'generated feed version does not match the tag',
              want.get('version'), expected_tag)
          assert want.get('sourceCommit') == expected_source, (
              'generated feed sourceCommit does not match the tag commit',
              want.get('sourceCommit'), expected_source)

          live_app = next((app for app in live.get('apps', [])
                           if app.get('bundleIdentifier') == want_app['bundleIdentifier']), None)
          assert live_app is not None, 'live feed lost the Floe app entry'
          entries = live_app.get('versions', [])
          assert entries, 'live feed has no versions'
          assert entries[0].get('buildVersion') == want['buildVersion'], (
              'live feed newest entry is not the freshly published build',
              entries[0].get('buildVersion'), want['buildVersion'])
          entry = entries[0]
          for key in ('version', 'buildVersion', 'downloadURL', 'size', 'sha256', 'sourceCommit'):
              assert entry.get(key) == want.get(key), (key, entry.get(key), want.get(key))
          name = entry['downloadURL'].rsplit('/', 1)[-1]
          assets = [a for a in published.get('assets', []) if a.get('name') == name]
          assert len(assets) == 1, ('feed downloadURL does not resolve to a published asset', name)
          asset = assets[0]
          # The feed must point at the exact published asset URL, not merely a
          # same-named file on some other host or path.
          assert asset.get('browser_download_url') == entry['downloadURL'], (
              'feed downloadURL is not the published asset browser_download_url',
              entry['downloadURL'], asset.get('browser_download_url'))
          assert asset.get('state') == 'uploaded', asset.get('state')
          assert asset.get('size') == entry['size'], (asset.get('size'), entry['size'])
          assert asset.get('digest') == 'sha256:' + entry['sha256'], (
              asset.get('digest'), entry['sha256'])
          print(f"Live feed readback OK: {want['version']} ({want['buildVersion']}) "
                f"{entry['downloadURL']} sha256={entry['sha256']}")
          PY
          matched=false
          for attempt in $(seq 1 10); do
            # raw.githubusercontent caches briefly; a bounded timeout plus a
            # cache-busting query keeps the retry honest without trusting a
            # stale HTTP 200.
            if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' \
                 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/feather.json?run=${GITHUB_RUN_ID}&attempt=${attempt}" \
                 -o "$RUNNER_TEMP/feather-live.json" \
               && test -s "$RUNNER_TEMP/feather-live.json" \
               && python3 "$RUNNER_TEMP/check_feed.py" "$RUNNER_TEMP/feather-live.json" \
                    "$RUNNER_TEMP/feather-readback-release.json" feather.json \
                    "$RELEASE_TAG" "$(cat "$RUNNER_TEMP/feather-source-sha.txt")"; then
              matched=true
              break
            fi
            echo "Live feed does not yet match the freshly published build (attempt $attempt); retrying" >&2
            sleep 15
          done
          test "$matched" = true
