[versions]
agp = "9.4.0"
kotlin = "2.2.10"
coroutines = "1.9.0"
# G09-R2 exact Media3 pin verified against Google Maven metadata 2026-10-26
# and GitHub tag 1.11.1. No dynamic version and no FFmpeg/local model.
media3 = "1.11.1"
# C03 real HEIF/HEIC still-image encoder. Exact stable release (AndroidX
# release page reviewed 2026-11-02); no dynamic version or Bitmap.compress fake.
heifwriter = "1.1.0"
compose-bom = "2026.09.00"
# Haze 1.7.3 requires Activity 1.12.2; keep the shared direct pin aligned.
activity = "1.12.2"
core = "1.17.0"
workmanager = "2.12.0"
cupertino = "3.3.1"
# Fixed Haze 1.7.3 tag/commit 671eda90f5b8e6e72ebc4fce7455353f581c77d9.
# Real Haze source/effect material; no dynamic version and no global toolchain bump.
haze = "1.7.3"
# Official fixed Sora pin; no dynamic version or Apple-restricted assets.
sora = "0.24.4"
# UI rendering infrastructure (Main-accepted Option A, verified 2026-10-19):
# org.commonmark 0.30.1 is the current latest release on Maven Central
# (maven-metadata.xml lastUpdated 2026-10-10), BSD 2-Clause "Simplified",
# Copyright (c) 2015 Robin Stocker. License retained under
# FloeAndroid/licenses/commonmark/ and listed in NOTICE.md. Pure JVM: the
# core artifact declares no Android/other runtime dependencies.
commonmark = "0.30.1"
junit = "4.13.2"
# C05 exact Android USB serial pin. Tag 3.11.0 commit
# 8e694372dee4531d140766df7af3189d3d9531c5, MIT; exact AAR/POM SHA-256 and
# licence text are recorded in FloeAndroid/licenses/devicecommunication/.
usb-serial = "3.11.0"
androidx-test = "1.3.0"
runner = "1.7.0"
# Explicit test-infra pin: Compose ui-test-junit4 resolves Espresso 3.5.0
# transitively, whose reflective InputManager.getInstance() fails on API 37.
# 3.7.0 uses getSystemService (androidx.test espresso 3.7.0 release note).
espresso = "3.7.0"

[libraries]
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "workmanager" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material = { module = "androidx.compose.material3:material3" }
# iOS-style chrome substrate (RobinPcrd compose-cupertino fork). Explicit components only:
# the cupertino-adaptive module (Material fallback) and cupertino-icons-extended
# (SF Symbols copyright risk) are deliberately NOT consumable coordinates here.
cupertino = { module = "io.github.robinpcrd:cupertino", version.ref = "cupertino" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
junit = { module = "junit:junit", version.ref = "junit" }
usb-serial = { module = "com.github.mik3y:usb-serial-for-android", version.ref = "usb-serial" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3" }
media3-effect = { module = "androidx.media3:media3-effect", version.ref = "media3" }
androidx-heifwriter = { module = "androidx.heifwriter:heifwriter", version.ref = "heifwriter" }
sora-editor = { module = "io.github.rosemoe:editor", version.ref = "sora" }
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-ext-gfm-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }
commonmark-ext-gfm-strikethrough = { module = "org.commonmark:commonmark-ext-gfm-strikethrough", version.ref = "commonmark" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "runner" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
