[versions]
agp = "9.4.0"
kotlin = "2.2.10"
compose-bom = "2026.09.00"
activity = "1.11.0"
core = "1.17.0"
cupertino = "3.3.1"
junit = "4.13.2"
androidx-test = "1.3.0"
runner = "1.7.0"

[libraries]
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material = { module = "androidx.compose.material3:material3" }
# iOS-style chrome substrate (RobinPcrd compose-cupertino fork). Explicit components only:
# the cupertino-adaptive module (Material fallback) and cupertino-icons-extended
# (SF Symbols copyright risk) are deliberately NOT consumable coordinates here.
cupertino = { module = "io.github.robinpcrd:cupertino", version.ref = "cupertino" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "runner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
