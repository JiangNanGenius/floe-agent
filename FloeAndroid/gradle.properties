org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.workers.max=6
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# --- Single release-version input ---------------------------------------------
# :app and :runtimeapp must never carry divergent version constants: the runtime
# identity check compares the core and component longVersionCode on device, and
# the stage-release checker binds one version/versionCode pair to one tag. Both
# modules read exactly these two values (a -P override replaces them for one
# invocation). Main selects one unused version/tag for a frozen candidate;
# both modules use that same version throughout qualification and packaging.
floe.version.code=14
floe.version.name=0.1.0-alpha.12
# --- Approved release signing interface (identity names only, never values) ---
# Main supplies these per candidate (Gradle -P flags or the Git-ignored
# local.properties), together with the referenced environment variables which
# hold only the keychain-retrieved passwords in the build process environment.
# All five must appear together or none; partial configuration fails the build,
# and release assembly without them is refused (no debug/unsigned fallback).
#   floe.release.keystore         absolute path to the approved keystore file
#   floe.release.keyAlias         alias of the approved signing key
#   floe.release.storePasswordEnv NAME of the env var holding the keystore password
#   floe.release.keyPasswordEnv   NAME of the env var holding the key password
#   floe.release.expectedCertSha256 PUBLIC lowercase SHA-256 of the approved certificate
# Defaults are intentionally absent so a fresh public checkout keeps AGP's
# documented debug behaviour and cannot silently produce a release candidate.
